          type: integer
        ppc_account_id:
          type: integer
        text_ad_id:
          type: integer
        landing_page_id:
          type: integer
        rotator_id:
          type: integer
        click_cpc:
          type: number
        click_cpa:
          type: number
        click_cloaking:
          type: integer
          enum: [-1, 0, 1]
          description: -1 the campaign's setting, 0 off for this link, 1 on for this link.
        tracker_id_public:
          type: integer
          description: >-
            The t202id in the tracking link. A free one is drawn when a
            create leaves it out; one sent (as p202 sync and import do, to
            keep a link working on another server) is kept unless another
            tracker, in any account, holds it, which is a 422: the click
            endpoints find a tracker by this id alone.
        tracker_time:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true

    TrackerCreate:
      type: object
      required: [aff_campaign_id]
      properties:
