        aff_campaign_url:
          type: string
          maxLength: 2048
        aff_campaign_url_2:
          type: string
          maxLength: 2048
        aff_campaign_url_3:
          type: string
          maxLength: 2048
        aff_campaign_url_4:
          type: string
          maxLength: 2048
        aff_campaign_url_5:
          type: string
