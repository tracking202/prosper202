                  description: Another name for `event`
                value:
                  type: number
                  nullable: true
                occurred_at:
                  type: integer
                customer_id:
                  type: integer
                customer_ref:
                  type: string
                customer_ref_type:
                  type: string
                  description: What customer_ref is (email, external id, …)
                customer_crm:
                  $ref: '#/components/schemas/LtvCustomerCrm'
              required:
              - event
              additionalProperties: false
      responses:
        '201':
          description: '`engagement_id` and `customer_id`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

