                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - LTV
      summary: Create an outbound webhook
      description: Needs the `ltv:write` scope. LTV writes do not honor `Idempotency-Key` (`POST /ltv/revenue` takes
        an `idempotency_key` field instead) and have no `dry_run` preview.
      operationId: ltvCreateWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: The https endpoint (alias `webhook_url`)
                events:
                  type: array
                  items:
                    type: string
                  description: The events to deliver, each one this install sends — `customer.updated`,
                    `revenue.recorded`, `subscription.changed`, `conversion.recorded`, `engagement.recorded` — or
                    `["*"]` alone, which also takes the events later versions add. Omitted, null or [] is every event
                    this version sends. Any other name is a 422 naming it by position (`events.0`) with the list (a
                    name checked only for its form, `revenue.recoded`, made a hook that received nothing), and
                    anything but a list of strings is a 422 (a lone string was read as no list, and subscribed the
                    hook to every event).
              required:
              - url
              additionalProperties: true
      responses:
        '201':
          description: The webhook
          content:
            application/json:
              schema:
                type: object
                properties:
