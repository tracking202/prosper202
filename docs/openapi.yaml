    # ── SKAN (SKAdNetwork) ─────────────────────────────────────────────

    AppRegistration:
      type: object
      properties:
        registration_id:
          type: integer
          description: The registration — the `{id}` in `/apps/{id}`, and the key every other app table links through
        platform:
          type: string
          enum: [ios, android]
        app_key:
          type: string
          description: >-
            Which app, on its platform: the App Store id as canonical decimal
            for iOS, the application id (package name, case-sensitive) for
            Android. Unique with `platform` across the install, and fixed
            once registered.
        app_name:
          type: string
        notes:
          type: string
          nullable: true
        accept_test_signals:
          type: integer
          enum: [0, 1]
          description: >-
            1 = test signals count as trusted for this app — AdAttributionKit
            postbacks signed with Apple's development keys (and, from the
            Android intake on, installs the SDK marks `test`); for
            integration-testing your own build. 0 (default) = they store
            flagged and count nowhere. SKAdNetwork has no development key, so
            this never affects SKAdNetwork rows. A live policy: changing it
            re-judges the stored rows.
        attribution_window_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 7
          description: >-
            Android: how many days after its click an install may begin (on
            Google's clock) and still be attributed to it; later is
            `outside_window`.
        trust_client_revenue:
          type: integer
          enum: [0, 1]
          default: 0
          description: >-
            Android: 1 = a revenue value the app reports with an event may be
            paid by a goal valued `from_property`. 0 (default) = it is stored
            and reported but never credited — the app token is public.
        integrity_mode:
          type: string
          enum: ["off", observe, require]
          default: "off"
          description: >-
            Android: Play Integrity. `off` keeps a token the SDK sends and
            decodes nothing; `observe` decodes every token and records the
            verdict, changing nothing; `require` holds an install that would
            be attributed (`pending_integrity`) until its verdict passes, and
            attributes, pays and notifies only then. `observe` and `require`
            need the credential first (`PUT /apps/{id}/integrity-credential`)
            and a Cloud project number, so a registration is created `off`.
            Each install keeps the mode it arrived under.
        integrity_cloud_project_number:
          type: integer
          format: int64
          nullable: true
          description: >-
            Android: the Google Cloud project NUMBER standard integrity tokens
            are requested for; published in the schema document for the SDK.
            Required for `observe` and `require`. Replaced, never cleared: an
            update sending `null` is `422`.
        app_token:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: >-
            What an app build sends as `X-P202-App-Token` to `GET /apps/schema`.
            An identifier, not a secret (it ships in every copy of the app);
            owner-only, and redacted from staged previews and apply results.
        user_id:
          type: integer
        created_at:
          type: integer
        updated_at:
          type: integer
        version:
          type: string
          description: Content hash of the record; also its ETag
        etag:
          type: string

    AppRegistrationCreate:
      type: object
      required: [app_name]
      description: >-
        Name the app with `store_link` or with `app_key` — exactly one of
        them (`422` otherwise).
      properties:
        store_link:
          type: string
          description: >-
            An App Store link (`https://apps.apple.com/…/id123`), a Google Play
            link (`https://play.google.com/store/apps/details?id=…`), a
            `market://details?id=…` link, a numeric App Store id or a package
            name. Read for the app it names; not stored.
          example: https://apps.apple.com/us/app/summit-run/id990077001
        platform:
          type: string
          enum: [ios, android]
          description: >-
            Optional: read from `app_key`'s shape (digits are an App Store id,
            dotted segments a package) or from the link. Compared
            case-insensitively; a value contradicting the link is `422`.
        app_key:
          type: string
          description: The App Store id (digits, no leading zero) or the package name
        app_name:
          type: string
          maxLength: 255
        notes:
          type: string
          maxLength: 500
        accept_test_signals:
          type: integer
          enum: [0, 1]
          default: 0
          description: Trust test signals for this app (see `AppRegistration`)
        attribution_window_days:
          type: integer
          minimum: 1
          maximum: 365
          description: Android only (see `AppRegistration`); read raw, so `7.0` or `"07"` is `422`, never rounded
        trust_client_revenue:
          type: integer
          enum: [0, 1]
          description: Android only (see `AppRegistration`)
        integrity_mode:
          type: string
          enum: ["off"]
          description: Android only; only `off` at create — set the credential, then switch the mode with an update (`422` otherwise)
        integrity_cloud_project_number:
          type: integer
          format: int64
          description: Android only (see `AppRegistration`)

    AppRegistrationUpdate:
      type: object
      description: >-
        `platform`, `app_key` and `store_link` may be sent only to name the
        app the registration already is; a different app is `422`.
      properties:
        app_name:
          type: string
          maxLength: 255
        notes:
          type: string
          maxLength: 500
        accept_test_signals:
          type: integer
          enum: [0, 1]
          description: Trust test signals for this app (see `AppRegistration`)
        attribution_window_days:
          type: integer
          minimum: 1
          maximum: 365
          description: Android only (see `AppRegistration`)
        trust_client_revenue:
          type: integer
          enum: [0, 1]
          description: Android only (see `AppRegistration`)
        integrity_mode:
          type: string
          enum: ["off", observe, require]
          description: >-
            Android only (see `AppRegistration`); `observe`/`require` is `422`
            without a stored credential, or without a Cloud project number
            sent in the same request or already stored
        integrity_cloud_project_number:
          type: integer
          format: int64
          description: >-
            Android only (see `AppRegistration`); digits, as a JSON integer or
            string. `null` is `422`: the number can be replaced, not cleared
            (set `integrity_mode` to `off` to stop Play Integrity)

    AppRegistrationResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AppRegistration"

    AppRegistrationListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AppRegistration"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AppSkanEncoding:
      type: object
      description: Exactly one of `fine_value` / `coarse_value` is non-null.
      properties:
        encoding_id:
          type: integer
        registration_id:
          type: integer
          description: The iOS registration this encoding applies to; `0` = account-wide
        fine_value:
          type: integer
          nullable: true
          minimum: 0
          maximum: 63
        coarse_value:
          type: string
          nullable: true
          enum: [low, medium, high, null]
        goal_id:
          type: integer
          description: The goal this value means (`GET /goals`)
        revenue_override:
          type: string
          nullable: true
          description: Decimal string (5 places), e.g. `"49.99000"`; null = the goal's own value
        effective_at:
          type: integer
          readOnly: true
          description: Unix time the current meaning started to apply (set by every create and update). After an update the report is exact again 48 days later.
        user_id:
          type: integer
        version:
          type: string
        etag:
          type: string

    AppSkanEncodingCreate:
      type: object
      required: [goal_id]
      description: Set `fine_value` (0–63) or `coarse_value` — one of them, not both and not neither (`422` otherwise).
      properties:
        registration_id:
          type: integer
          default: 0
          description: One of your iOS registrations (`GET /apps`), or `0` for the account-wide encodings
        fine_value:
          type: integer
          minimum: 0
          maximum: 63
        coarse_value:
          type: string
          enum: [low, medium, high]
        goal_id:
          type: integer
          description: A live goal of that registration, or of the account (`GET /goals`), that a device can reach — not one counting `within` from the click, nor one waiting in `after` for such a goal
        revenue_override:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999.99999
          description: Revenue per decoded postback instead of the goal's own value (at most 5 decimal places)

    AppSkanEncodingUpdate:
      type: object
      description: |
        An absent field is kept. An explicit `null` on `fine_value` or
        `coarse_value` clears it, and must arrive together with the
        replacement value of the other kind so the encoding still maps
        exactly one value. `revenue_override: null` goes back to the goal's
        own value; `goal_id` cannot be null.
      properties:
        registration_id:
          type: integer
        fine_value:
          type: integer
          nullable: true
          minimum: 0
          maximum: 63
        coarse_value:
          type: string
          nullable: true
          enum: [low, medium, high, null]
        goal_id:
          type: integer
        revenue_override:
          type: number
          nullable: true
          minimum: 0

    AppSkanEncodingResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AppSkanEncoding"

    AppSkanEncodingListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AppSkanEncoding"
        pagination:
          $ref: "#/components/schemas/Pagination"

    GoalDefinition:
      type: object
      description: |
        Data, never code. Strict at every level (an unknown key is an error)
        and typed (nothing is cast). Full format:
        `documentation/api/22-goals.md`.
      required: [name, trigger]
      properties:
        name: {type: string, maxLength: 100}
        trigger:
          type: object
          description: '`{"event": "<name>", "where": [predicates]}` or `{"install": true}`'
        threshold:
          type: object
          description: '`{"count": N}` or `{"sum": {"prop": "<prop>", "gte": <amount>}}`. A summed value outside ±999999.99999 does not count.'
        after:
          type: array
          items: {type: integer}
          maxItems: 5
        within:
          type: object
          nullable: true
          description: '`{"days": N, "from": "install" | "click"}`'
        repeat:
          type: object
          description: '`{"mode": "once"}` or `{"mode": "each", "max": N}` (N 1-10000). `max` is required with a `sum` threshold (`definition.repeat.max`): one event can cross many multiples of a sum; a `count` may repeat without it.'
        value:
          type: object
          description: '`{"type": "fixed", "amount": "4.00"}`, `{"type": "from_property", "prop": "$revenue"}` or `{"type": "none"}`'

    GoalCreate:
      type: object
      required: [scope, definition]
      properties:
        scope: {type: string, enum: [campaign, registration, account]}
        scope_id: {type: integer, description: "The campaign or registration; omitted (or 0) for the account"}
        definition: {$ref: "#/components/schemas/GoalDefinition"}
        payable: {type: boolean, description: "Campaign goals only; default true unless the value is none"}
        payout: {type: string, nullable: true, description: "Campaign goals only: overrides the goal's value on its campaign"}
        notify_traffic_source: {type: boolean, description: "Campaign goals only; default true"}

    Goal:
      type: object
      properties:
        goal_id: {type: integer}
        scope: {type: string, enum: [campaign, registration, account]}
        scope_id: {type: integer}
        name: {type: string}
        current_version: {type: integer}
        builtin:
          type: string
          nullable: true
          enum: [install, null]
          description: >-
            `install` for the built-in install goal every Android registration
            has (triggered by the install, reached once, no value of its own:
            a campaign pays its default payout for it unless it lists goals
            without it, or a payout of its own). It cannot be edited or
            archived. `null` for an operator's goal.
        definition: {$ref: "#/components/schemas/GoalDefinition"}
        definition_valid: {type: boolean}
        effective_at: {type: integer}
        archived_at: {type: integer, nullable: true}
        created_at: {type: integer}
        updated_at: {type: integer}
        campaigns: {type: array, items: {$ref: "#/components/schemas/GoalCampaignTerm"}}
        live_outcomes: {type: integer}
        version_created: {type: boolean, description: "PUT only"}

    GoalResponse:
      type: object
      properties:
        data: {$ref: "#/components/schemas/Goal"}

    GoalListResponse:
      type: object
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/Goal"}}
        pagination: {$ref: "#/components/schemas/Pagination"}

    GoalVersion:
      type: object
      properties:
        goal_id: {type: integer}
        version: {type: integer}
        definition: {$ref: "#/components/schemas/GoalDefinition"}
        effective_at: {type: integer, description: "Events received from then on are evaluated under it"}
        created_at: {type: integer}

    GoalCampaignTerm:
      type: object
      properties:
        campaign_id: {type: integer}
        goal_id: {type: integer}
        campaign_name: {type: string, nullable: true}
        payout_mode: {type: string, nullable: true, enum: [replace, accumulate, null]}
        payout: {type: string, nullable: true}
        notify_traffic_source: {type: boolean}
        created_at: {type: integer}
        updated_at: {type: integer}

    GoalEvaluatedOutcome:
      type: object
      properties:
        goal_id: {type: integer}
        version: {type: integer}
        n: {type: integer}
        event_id: {type: string}
        reached_at: {type: integer}
        value: {type: string, nullable: true}
        value_source: {type: string, enum: [fixed, property, none]}
        value_note: {type: string, nullable: true}
        ineligible_reason: {type: string, nullable: true, enum: [no_click, no_install, null]}

    GoalOutcome:
      type: object
      properties:
        outcome_id: {type: integer}
        subject_type: {type: string, enum: [click, install]}
        subject_id: {type: integer}
        goal_id: {type: integer}
        version: {type: integer}
        n: {type: integer}
        event_id: {type: string}
        reached_at: {type: integer}
        value: {type: string, nullable: true}
        value_source: {type: string, description: "fixed, property, none, or payout (the campaign's)"}
        value_note: {type: string, nullable: true, description: "missing, not_a_number, negative, out_of_range, untrusted_value, not_payable_on_campaign"}
        ineligible_reason: {type: string, nullable: true}
        payable: {type: boolean}
        campaign_id: {type: integer, nullable: true}
        app_registration_id: {type: integer, nullable: true, description: "An install subject's app registration"}
        conversion_id: {type: integer, nullable: true}

    GoalReevaluationResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            goal_id: {type: integer}
            version: {type: integer}
            subject_type: {type: string, enum: [click, install]}
            applied: {type: boolean}
            goals:
              type: array
              items: {type: integer}
              description: Every goal re-decided on at least one of these subjects (the goal and its dependents)
            subjects:
              type: array
              items:
                type: object
                properties:
                  subject_type: {type: string}
                  subject_id: {type: integer}
                  goals:
                    type: array
                    items: {type: integer}
                    description: The goal and its dependents in this click's goal set, ascending
                  retire:
                    type: array
                    items:
                      type: object
                      properties:
                        outcome_id: {type: integer}
                        goal_id: {type: integer}
                        version: {type: integer}
                        n: {type: integer}
                        event_id: {type: string}
                        conversion_id: {type: integer, nullable: true}
                        replaced_by:
                          nullable: true
                          description: The replacing outcome's id, `"new"` when it is written by this re-evaluation, or null
                        ledger: {type: string, nullable: true, enum: [supersede, delete, null]}
                  write: {type: array, items: {$ref: "#/components/schemas/GoalEvaluatedOutcome"}}
                  unchanged: {type: integer}
            totals: {type: object}
            next_after: {type: integer, nullable: true}

    EventsRequest:
      type: object
      required: [click_id, events]
      additionalProperties: false
      properties:
        click_id: {type: integer, minimum: 1, description: "The click (GET /clicks)"}
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/WebEvent"

    WebEvent:
      type: object
      required: [event_id, name]
      additionalProperties: false
      properties:
        event_id: {type: string, maxLength: 128, pattern: '^[\x21-\x3F\x41-\x7E][\x21-\x7E]{0,127}$', description: "Your id for the event, unique within the click; not starting with @ (the server's own ids)"}
        name: {type: string, pattern: '^[A-Za-z0-9_][A-Za-z0-9_.:\-]{0,63}$'}
        occurred_at: {type: integer, description: "Unix seconds; default now. Clamped to the time it arrived, so a clock cannot move an event into a window"}
        properties:
          type: object
          maxProperties: 32
          additionalProperties:
            oneOf: [{type: string, maxLength: 255}, {type: number}, {type: boolean}]
        revenue: {type: number, nullable: true, description: "What it was worth; a goal valued from_property pays it"}
        transaction_id: {type: string, maxLength: 255, nullable: true, description: "The network's id, kept on the conversion a goal writes"}

    EventsResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            click_id: {type: integer}
            campaign_id: {type: integer}
            accepted: {type: array, items: {type: string}}
            duplicates: {type: array, items: {type: string}}
            replayed: {type: boolean}
            goals_evaluated: {type: boolean, description: "Whether the click's campaign has a live goal"}
            outcomes_written: {type: integer}
            outcomes_retired: {type: integer}
            outcomes:
              type: array
              items:
                type: object
                properties:
                  goal_id: {type: integer}
                  version: {type: integer}
                  n: {type: integer}
                  event_id: {type: string}
                  outcome_id: {type: integer}
                  conversion_id: {type: integer, nullable: true}
                  payable: {type: boolean}
                  amount: {type: string, nullable: true}
                  notify: {type: string, enum: [reached, suppressed, "off", none], description: "reached: announced to the traffic source (its server postbacks queued in the notification outbox); suppressed: a replacement of an outcome already announced, never announced twice; off: the campaign does not notify for this goal; none: not payable"}
            notifications:
              type: array
              items:
                type: object
                properties:
                  goal_id: {type: integer}
                  n: {type: integer}
                  outcome_id: {type: integer}
                  kind: {type: string}
                  status: {type: string, enum: [queued, rendered, failed, not_sent, no_pixels, browser_only], description: "queued: the server-to-server postbacks are in the notification outbox, which the worker sends with retries; rendered: browser pixels were returned to the browser that asked"}
                  reason: {type: string, nullable: true}
                  queued: {type: integer, description: "Server-to-server postbacks waiting in the notification outbox"}
                  browser_pixels: {type: integer}
                  browser_skipped: {type: integer}
            note: {type: string, description: "Present when goals_evaluated is false"}
        idempotent_replay: {type: boolean}

    AppPostback:
      type: object
      description: |
        One stored postback. Every protocol's rows share this shape: the
        generic columns (`protocol`, identity, window, `did_win`,
        `conversion_type`, `ad_interaction_type`, signature verdict) are
        filled for all of them; the protocol-specific columns mirror that
        protocol's parameters with hyphens as underscores and are `null`
        for the others. Fields Apple withheld for privacy are `null`.
      properties:
        postback_id:
          type: integer
        user_id:
          type: integer
          description: Owning user (`0` rows are unclaimed and not visible through the API)
        registration_id:
          type: integer
          nullable: true
          description: The registration that claimed it; `null` once that registration was deleted
        received_at:
          type: integer
          description: Unix timestamp the receiver stored it
        protocol:
          type: string
          enum: [skadnetwork, adattributionkit]
          description: Which framework signed and delivered the postback
        version:
          type: string
          nullable: true
          description: SKAdNetwork postback version, e.g. `4.0`; `null` for AdAttributionKit (unversioned)
        ad_network_id:
          type: string
        transaction_id:
          type: string
        app_id:
          type: integer
        source_identifier:
          type: string
          nullable: true
          description: SKAN 4 hierarchical source identifier (1–4 digits)
        campaign_id:
          type: integer
          nullable: true
          description: SKAN ≤ 3 campaign id
        conversion_value:
          type: integer
          nullable: true
          minimum: 0
          maximum: 63
        coarse_conversion_value:
          type: string
          nullable: true
          enum: [low, medium, high, null]
        postback_sequence_index:
          type: integer
          nullable: true
          description: Conversion window, 0–2 (SKAdNetwork 4 and AdAttributionKit)
        conversion_type:
          type: string
          nullable: true
          enum: [download, redownload, re-engagement, null]
          description: >-
            Protocol-neutral conversion kind: SKAdNetwork's `redownload` flag
            read as `download`/`redownload`; AdAttributionKit's `conversion-type`
            as sent (`re-engagement` exists only there)
        redownload:
          type: integer
          nullable: true
          description: SKAdNetwork's raw flag — 1 = redownload, 0 = first install; `null` for AdAttributionKit
        did_win:
          type: integer
          nullable: true
          description: 1 = winning postback, 0 = losing; `null` for SKAN ≤ 2.2 (counted as wins)
        ad_interaction_type:
          type: string
          nullable: true
          enum: [view, click, null]
          description: >-
            Protocol-neutral interaction kind: SKAdNetwork's `fidelity-type`
            (1 = click, 0 = view); AdAttributionKit's `ad-interaction-type` as
            sent. `null` when the postback carried neither (SKAdNetwork 2.1)
        source_app_id:
          type: integer
          nullable: true
          description: Publisher app (SKAdNetwork `source-app-id`, AdAttributionKit `publisher-item-identifier`)
        source_domain:
          type: string
          nullable: true
          description: SKAN 4 web-ad source domain
        marketplace_id:
          type: string
          nullable: true
          description: AdAttributionKit `marketplace-identifier` (e.g. `com.apple.AppStore`); `null` for SKAdNetwork
        fidelity_type:
          type: integer
          nullable: true
          description: SKAdNetwork's raw value — 1 = StoreKit-rendered or web ad, 0 = view-through
        country_code:
          type: string
          nullable: true
        signature_state:
          type: string
          enum: [valid, invalid, unverifiable, development]
          description: >-
            What the verifier established: `valid` against Apple's production key,
            `invalid` (wrong or forged), `unverifiable` (unknown version or key,
            or no OpenSSL), `development` (verified against one of Apple's
            AdAttributionKit development keys)
        trusted:
          type: integer
          nullable: true
          description: >-
            The trust class reports key on, the same three for every signal
            source: 1 = trusted (verified against Apple's production key, or
            development-signed for a registration that accepts test signals),
            0 = refuted (wrong or forged), `null` = unvouched (unverifiable,
            or development-signed without the policy)
        key_id:
          type: string
          nullable: true
          description: The signing key the postback named (AdAttributionKit JWS `kid`); `null` for SKAdNetwork
        remote_ip:
          type: string
          description: Display value (proxy-header aware); not the rate-limit identity

    AppPostbackDetail:
      allOf:
        - $ref: "#/components/schemas/AppPostback"
        - type: object
          properties:
            attribution_signature:
              type: string
              description: Apple's base64 ECDSA signature as received (sanitized; up to 4096 chars), for forensics

    AppPostbackResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AppPostbackDetail"

    AppInstall:
      type: object
      description: One Android install as the SDK reported it and the intake classified it.
      properties:
        install_row_id:
          type: integer
        registration_id:
          type: integer
        install_uuid:
          type: string
          format: uuid
        store:
          type: string
          enum: [google_play]
        click_id:
          type: integer
          nullable: true
          description: The click the verified token named (attributed installs; null otherwise)
        conversion_id:
          type: integer
          nullable: true
          description: The install conversion on the click — set for every attributed, trusted install
        match_state:
          type: string
          enum: [attributed, organic, third_party, unavailable, pending_click, bad_token, foreign_click, implausible, outside_window, duplicate_click, pending_integrity, integrity_failed, integrity_unverified]
        match_reason:
          type: string
          description: Why, as one sentence
        trusted:
          type: integer
          nullable: true
          enum: [0, 1, null]
          description: 1 trusted, 0 refuted, null unvouched
        is_test:
          type: boolean
        referrer_status:
          type: string
          enum: [ok, feature_not_supported, service_unavailable, developer_error, service_disconnected, permission_error]
        referrer_raw:
          type: string
          nullable: true
          description: Play's install referrer, kept to 2048 bytes
        referrer_truncated:
          type: boolean
        utm_source:
          type: string
          nullable: true
        utm_medium:
          type: string
          nullable: true
        utm_campaign:
          type: string
          nullable: true
        utm_term:
          type: string
          nullable: true
        utm_content:
          type: string
          nullable: true
        gclid:
          type: string
          nullable: true
        referrer_click_at:
          type: integer
          nullable: true
          description: The device's clock
        install_begin_at:
          type: integer
          nullable: true
          description: The device's clock
        referrer_click_server_at:
          type: integer
          nullable: true
          description: Google's clock
        install_begin_server_at:
          type: integer
          nullable: true
          description: Google's clock — the install conversion's time
        install_version:
          type: string
          nullable: true
        google_play_instant:
          type: boolean
          nullable: true
        app_version:
          type: string
          nullable: true
        sdk_version:
          type: string
          nullable: true
        os_version:
          type: string
          nullable: true
        integrity_mode:
          type: string
          enum: ["off", observe, require]
          description: The registration's Play Integrity mode when the install arrived; it governs the install for good
        integrity_state:
          type: string
          enum: [not_requested, received, missing, pending, valid, invalid, error, skipped]
          description: >-
            Where the Play Integrity verdict stands: `not_requested` /
            `received` (mode off, no token / a token kept undecoded),
            `missing` (observe/require, no token), `pending` (queued for the
            worker), `valid`, `invalid` (fails the policy, undecodable, or a
            token another install already verified), `error` (no verdict
            within 24 hours), `skipped` (refuted on its referrer; not decoded)
        integrity_reason:
          type: string
          nullable: true
          description: Why, as a sentence; while pending, the last attempt's error
        integrity_attempts:
          type: integer
        integrity_next_at:
          type: integer
          nullable: true
          description: When the worker next tries, while pending
        integrity_checked_at:
          type: integer
          nullable: true
          description: When Google last answered with a verdict
        integrity_verdict:
          type: object
          nullable: true
          description: >-
            What the policy read from Google's verdict — `code` (`valid` or
            the first failed check: `wrong_package`, `request_hash`, `stale`,
            `future`, `app_not_recognized`, `device_integrity`, `unlicensed`,
            `malformed`, `undecodable`, `replayed_token`), `package`,
            `app_recognition`, `device`, `licensing`, `issued_at`,
            `version_code`. Never the token.
        first_open_at:
          type: integer
          nullable: true
        received_at:
          type: integer
        settled_at:
          type: integer
          nullable: true
          description: When the state became final; null while pending
        remote_ip:
          type: string

    AppInstallResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AppInstall"

    AppInstallListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AppInstall"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AppIntegrityStatusResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            registration_id: {type: integer}
            app_key: {type: string}
            integrity_mode: {type: string, enum: ["off", observe, require]}
            integrity_cloud_project_number: {type: string, nullable: true}
            credential:
              type: object
              nullable: true
              description: Never the key
              properties:
                client_email: {type: string}
                private_key_id: {type: string}
                project_id: {type: string, nullable: true}
                created_at: {type: integer}
                updated_at: {type: integer}
            installs:
              type: object
              properties:
                by_integrity_state:
                  type: object
                  additionalProperties: {type: integer}
                  description: "Every integrity_state, with its count"
                by_match_state:
                  type: object
                  properties:
                    pending_integrity: {type: integer}
                    integrity_failed: {type: integer}
                    integrity_unverified: {type: integer}
            usage:
              type: object
              properties:
                decoded_since_utc_midnight: {type: integer}
                default_daily_quota: {type: integer, example: 10000}
            policy:
              type: object
              description: The verdict policy's constants (documentation/api/24-android-installs.md §9)

    AppInstallTokenResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            registration_id: {type: integer}
            click_id: {type: integer}
            click_time: {type: integer}
            install_token: {type: string, pattern: "^[1-9][0-9]*\\.[A-Za-z0-9_-]{16}$"}
            referrer: {type: string, example: p202=1042.3MVffxqa2WX3CV49}
            store_url: {type: string}

    AppInstallRequest:
      type: object
      required: [install_uuid, app_key, store, referrer]
      additionalProperties: false
      description: >-
        Vectors: tests/fixtures/app-sdk-contract/android/install-requests.json.
        Every timestamp is a JSON integer (unix seconds); a string or a float is 400.
      properties:
        install_uuid:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: The SDK's per-install id, lower-case; minted once and persisted with the body
        app_key:
          type: string
        store:
          type: string
          enum: [google_play]
        referrer:
          type: object
          additionalProperties: false
          required: [status]
          properties:
            status:
              type: string
              enum: [ok, feature_not_supported, service_unavailable, developer_error, service_disconnected, permission_error]
            install_referrer: {type: string, description: "Required when status is ok (\"\" for none)"}
            referrer_click_timestamp_seconds: {type: integer}
            install_begin_timestamp_seconds: {type: integer}
            referrer_click_timestamp_server_seconds: {type: integer}
            install_begin_timestamp_server_seconds: {type: integer}
            install_version: {type: string, nullable: true}
            google_play_instant: {type: boolean, nullable: true}
        first_open_at: {type: integer, nullable: true}
        app_version: {type: string, nullable: true, maxLength: 64}
        sdk_version: {type: string, nullable: true, maxLength: 32}
        os_version: {type: string, nullable: true, maxLength: 32}
        test: {type: boolean, default: false}
        integrity_token: {type: string, nullable: true, maxLength: 8192, description: "A STANDARD Play Integrity token requested with requestHash = the lower-case hex SHA-256 of this body's canonical form (integrity_token excluded); decoded off the request path when the registration's integrity_mode is observe or require"}
        customer:
          $ref: "#/components/schemas/AppCustomerClaim"

    AppCustomerClaim:
      type: object
      nullable: true
      additionalProperties: false
      required: [id, signature]
      description: >-
        A customer id the operator's own server signed (the SDKs'
        setCustomerId; documentation/features/visitor-identity.md). After the
        request commits it links the install's click to the customer — only
        for an attributed, trusted install, and only when the signature
        verifies under the account's linking key. Vectors:
        tests/fixtures/app-sdk-contract/customer-id.json.
      properties:
        id: {type: string, maxLength: 255, description: "Trimmed; an email digest folds to lower case and must be hex of its length"}
        type: {type: string, nullable: true, enum: [custom, email_md5, email_sha256, esp_id, merchant_id, subid], description: "Absent or null means custom"}
        signature: {type: string, pattern: "^[0-9a-fA-F]{64}$", description: "cust_sig: hex(HMAC-SHA256(linking key, \"<type>:<id>\"))"}

    AppCustomerLinkStatus:
      type: string
      enum: [linked, unverified, no_click, not_linked]
      description: >-
        Present when the request carried a customer: linked; unverified (the
        signature is not the operator's); no_click (the install proved no
        click to link — organic, pending, refuted or untrusted); not_linked
        (the campaign's identity capture is off, or linking failed and was
        logged).

    AppInstallReceiptResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            install_uuid: {type: string}
            match: {type: string, enum: [attributed, organic, third_party, unavailable, pending_click, bad_token, foreign_click, implausible, outside_window, duplicate_click, pending_integrity, integrity_failed, integrity_unverified]}
            reason: {type: string}
            trusted: {type: integer, nullable: true, enum: [0, 1, null]}
            test: {type: boolean}
            integrity: {type: string, enum: [not_requested, received, missing, pending, valid, invalid, error, skipped]}
            duplicate: {type: boolean}
            customer:
              $ref: "#/components/schemas/AppCustomerLinkStatus"

    AppInstallEventsRequest:
      type: object
      additionalProperties: false
      description: >-
        Vectors: tests/fixtures/app-sdk-contract/android/events-requests.json.
        `events` may be left out only when `customer` is present (a customer
        id on its own); when present it holds 1-100 events.
      properties:
        customer:
          $ref: "#/components/schemas/AppCustomerClaim"
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [event_id, name, occurred_at]
            properties:
              event_id: {type: string, maxLength: 128, description: "Unique within the install; not starting with @"}
              name: {type: string, maxLength: 64}
              occurred_at: {type: integer, description: "The device's clock; an event is ordered by min(occurred_at, received_at)"}
              properties: {type: object, maxProperties: 32, additionalProperties: {oneOf: [{type: string, maxLength: 255}, {type: number}, {type: boolean}]}}
              revenue: {type: number, nullable: true}
              transaction_id: {type: string, nullable: true, maxLength: 255}

    AppInstallEventsReceiptResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            install_uuid: {type: string}
            accepted: {type: array, items: {type: string}}
            duplicates: {type: array, items: {type: string}}
            customer:
              $ref: "#/components/schemas/AppCustomerLinkStatus"

    AppPostbackListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AppPostback"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AppReportGroup:
      type: object
      description: |
        One report group. Which dimension fields are present depends on
        `group_by`: `date` (day), `registration_id` + `app_name` +
        `app_key` (registration), `platform` (always),
        `ad_network_id` (ad-network), `source_identifier` + `campaign_id`
        (source), `country_code` (country), `version` (version),
        `protocol` (protocol), `conversion_type` (conversion-type) for iOS;
        `aff_campaign_id` + `aff_campaign_name` (campaign), `match_state`
        (match-state), `integrity_state` (integrity-state), `goal_id` +
        `goal_name` + `goal_scope` + `goal_scope_id` + `builtin` + `after` +
        `archived` (goal) for Android. The postback metrics (`postbacks`
        through `decoded_revenue`) are iOS rows'; `received`, `organic`,
        `pending`, `match_states` and `integrity_states` Android rows'.
      properties:
        date:
          type: string
          format: date
          description: UTC day (day mode)
        registration_id:
          type: integer
          nullable: true
          description: registration mode; `null` for rows whose registration was deleted
        app_name:
          type: string
          nullable: true
          description: From the registry (registration mode); `null` when the registration is gone
        platform:
          type: string
          nullable: true
        app_key:
          type: string
          nullable: true
        ad_network_id:
          type: string
        source_identifier:
          type: string
          nullable: true
        campaign_id:
          type: integer
          nullable: true
        country_code:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        protocol:
          type: string
          enum: [skadnetwork, adattributionkit]
        conversion_type:
          type: string
          nullable: true
          enum: [download, redownload, re-engagement, null]
        postbacks:
          type: integer
          description: Unique postbacks in the group, regardless of signature state
        losses:
          type: integer
          description: Unique losing postbacks (`did_win = 0`, trusted rows only)
        installs:
          type: integer
          description: Unique winning first-window `download` postbacks (trusted rows only)
        redownloads:
          type: integer
          description: Unique winning first-window `redownload` postbacks (trusted rows only)
        reengagements:
          type: integer
          description: Unique winning first-window `re-engagement` postbacks — AdAttributionKit only (trusted rows only)
        trusted_count:
          type: integer
          description: Unique postbacks with `trusted = 1`
        refuted_count:
          type: integer
          description: Unique postbacks with `trusted = 0`
        unvouched_count:
          type: integer
          description: Unique postbacks with `trusted = null`, including development-signed ones of registrations that do not accept test signals
        test_count:
          type: integer
          description: Unique postbacks verified against an AdAttributionKit development key, whatever their trust — they also count in the trusted or unvouched column
        measurable:
          type: integer
          description: Unique winning postbacks carrying a conversion value, across all three conversion windows (so it can exceed installs, which counts first-window postbacks only); a replayed postback decodes once, through its first-received copy
        decoded:
          type: integer
        undecoded:
          type: integer
          description: Value present but no matching encoding
        ambiguous_encoding:
          type: integer
          description: Value whose encoding changed within the 48 days before the postback arrived, with meanings that disagree (another goal or revenue override); credited to no goal
        null_conversion_values:
          type: integer
          description: Value withheld by Apple's privacy tier
        decoded_revenue:
          type: number
        goals_reached:
          type: integer
          description: Both platforms — iOS the decoded postbacks (each decodes to one goal), Android the goal outcomes of trusted installs
        revenue:
          type: number
          description: Both platforms — iOS `decoded_revenue`, Android the value of trusted installs' payable outcomes
        received:
          type: integer
          description: Android — every install in the group, whatever its state
        organic:
          type: integer
          description: Android — installs Play's referrer called organic (unvouched)
        pending:
          type: integer
          description: Android — installs waiting for their click or their Play Integrity verdict
        match_states:
          type: object
          description: Android — installs per match state (always an object)
          additionalProperties:
            type: integer
        integrity_states:
          type: object
          description: Android — installs per Play Integrity state (always an object)
          additionalProperties:
            type: integer
        aff_campaign_id:
          type: integer
          nullable: true
          description: Android campaign mode; `null` for installs with no click of the caller's (organic, refuted)
        aff_campaign_name:
          type: string
          nullable: true
        match_state:
          type: string
        integrity_state:
          type: string
        goal_id:
          type: integer
        goal_name:
          type: string
        goal_scope:
          type: string
          nullable: true
          enum: [campaign, registration, account, null]
        goal_scope_id:
          type: integer
          nullable: true
        builtin:
          type: string
          nullable: true
          description: "`install` for a registration's built-in install goal"
        after:
          type: array
          description: The goals this one waits for (its funnel predecessors)
          items:
            type: integer
        archived:
          type: boolean
        events:
          type: object
          description: Per-goal counts and revenue, keyed by goal name (always an object, `{}` when empty)
          additionalProperties:
            type: object
            properties:
              count:
                type: integer
              revenue:
                type: number

    AppReportTotals:
      type: object
      description: |
        The same metrics as a group, over the whole window and ungrouped.

        Read the headline numbers from here rather than summing `groups`.
        A sum gives a different answer for two reasons: every metric counts
        *unique* postbacks per group, so one postback stored twice (a replay
        whose unsigned fields differ) counts once in each day it landed in;
        and a truncated report is missing whole groups besides. These come
        from one ungrouped query over the same filters, so neither applies.

        For iOS the decode over the whole window (`measurable`, `decoded`,
        `undecoded`, `ambiguous_encoding`, `null_conversion_values`,
        `decoded_revenue`, `events`) is here too, with `revenue` and
        `goals_reached` as their shared names. Android totals carry the
        Android group metrics (see AppReportGroup).
      properties:
        platform:
          type: string
          enum: [ios, android]
        goals_reached:
          type: integer
        revenue:
          type: number
        measurable:
          type: integer
        decoded:
          type: integer
        undecoded:
          type: integer
        ambiguous_encoding:
          type: integer
        null_conversion_values:
          type: integer
        decoded_revenue:
          type: number
        events:
          type: object
          additionalProperties:
            type: object
            properties:
              count:
                type: integer
              revenue:
                type: number
        received:
          type: integer
        organic:
          type: integer
        pending:
          type: integer
        match_states:
          type: object
          additionalProperties:
            type: integer
        integrity_states:
          type: object
          additionalProperties:
            type: integer
        postbacks:
          type: integer
        losses:
          type: integer
        installs:
          type: integer
        redownloads:
          type: integer
        reengagements:
          type: integer
        trusted_count:
          type: integer
        refuted_count:
          type: integer
        unvouched_count:
          type: integer
        test_count:
          type: integer

    AppReportTotalsByPlatform:
      type: object
      properties:
        ios:
          $ref: "#/components/schemas/AppReportTotals"
        android:
          $ref: "#/components/schemas/AppReportTotals"
        combined:
          type: object
          description: The metrics that mean the same on both platforms, added up
          properties:
            installs:
              type: integer
            trusted_count:
              type: integer
            refuted_count:
              type: integer
            unvouched_count:
              type: integer
            test_count:
              type: integer
            goals_reached:
              type: integer
            revenue:
              type: number

    AppNotification:
      type: object
      description: One traffic-source postback an app install's goal queued (the notification outbox).
      properties:
        notification_id:
          type: integer
        conv_id:
          type: integer
          description: The conversion (ledger row) it announces
        pixel_id:
          type: integer
          description: The traffic source's server-to-server pixel
        destination:
          type: integer
          description: >-
            Which URL of the pixel's code this row is, by position from 0: a
            pixel with several space-separated URLs has a row for each, sent,
            retried and failed on its own
        kind:
          type: string
          enum: [reached, correction, retraction]
        status:
          type: string
          enum: [pending, sent, failed, cancelled, suppressed]
        url:
          type: string
          description: The URL as filled when queued (empty for a suppressed correction)
        attempts:
          type: integer
        next_attempt_at:
          type: integer
        last_error:
          type: string
          nullable: true
        created_at:
          type: integer
        sent_at:
          type: integer
          nullable: true
        registration_id:
          type: integer
          nullable: true
        app_name:
          type: string
          nullable: true
        goal_id:
          type: integer
        goal_name:
          type: string
          nullable: true
        install_row_id:
          type: integer
        campaign_id:
          type: integer
          nullable: true

    AppStoreLink:
      type: object
      properties:
        registration_id:
          type: integer
        platform:
          type: string
          enum: [ios, android]
        app_key:
          type: string
        app_name:
          type: string
        store_link:
          type: string
          description: Android — the Play link with `[[p202_install_token]]` in its referrer; iOS — the App Store link
        android:
          type: object
          properties:
            token:
              type: string
            note:
              type: string
        ios:
          type: object
          properties:
            info_plist:
              type: object
              additionalProperties: true
            receiver_paths:
              type: object
              additionalProperties:
                type: string
            note:
              type: string
        campaign:
          type: object
          description: With `campaign_id` — whether that campaign sends its clicks to the store link
          properties:
            aff_campaign_id:
              type: integer
            aff_campaign_name:
              type: string
            aff_campaign_url:
              type: string
            app_registration_id:
              type: integer
              nullable: true
            aff_campaign_rotate:
              type: integer
              enum: [0, 1]
              description: Whether URL rotation is on (clicks go to each offer URL in turn)
            rotation:
              type: array
              description: With rotation on, the alternate offer URLs in rotation and whether each is this app's link; `[]` with rotation off
              items:
                type: object
                properties:
                  field:
                    type: string
                    enum: [aff_campaign_url_2, aff_campaign_url_3, aff_campaign_url_4, aff_campaign_url_5]
                  url:
                    type: string
                  ready:
                    type: boolean
            ready:
              type: boolean
              description: The offer URL — and with rotation on, every URL in rotation — is this app's link (Android — carrying the token), and for Android the campaign is linked to the registration
            needs:
              type: array
              items:
                type: string
            apply:
              type: object
              description: What PUT /campaigns/{id} needs to make it ready (`aff_campaign_url`; for Android `app_registration_id`; `aff_campaign_rotate` 0 when an alternate in rotation is not this app's link); `{}` when ready
              additionalProperties: true

    AppReportResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            group_by:
              type: string
              enum: [day, registration, platform, ad-network, source, country, version, protocol, conversion-type, campaign, match-state, integrity-state, goal]
            platform:
              type: string
              enum: [ios, android, all]
            groups:
              type: array
              items:
                $ref: "#/components/schemas/AppReportGroup"
            totals:
              description: One platform's totals, or with both `{ios, android, combined}`
              oneOf:
                - $ref: "#/components/schemas/AppReportTotals"
                - $ref: "#/components/schemas/AppReportTotalsByPlatform"
        meta:
          type: object
          properties:
            timezone:
              type: string
              example: UTC
            trusted:
              type: string
              enum: [trusted-only, as-filtered]
              description: Which rows the headline metrics counted
            groups_truncated:
              type: boolean
              description: More groups matched than `limit` allowed
            notes:
              type: string

    SkadnetworkPostback:
      type: object
      description: |
        A SKAdNetwork postback as Apple's devices send it (hyphenated
        keys). Versions 2.1–4.0 verify; which fields are present depends on
        the version and Apple's privacy tier. The conversion values are not
        covered by Apple's signature in any version.
      required: [version, ad-network-id, transaction-id, app-id, attribution-signature]
      properties:
        version:
          type: string
          example: "4.0"
        ad-network-id:
          type: string
          maxLength: 100
        transaction-id:
          type: string
          maxLength: 64
        app-id:
          type: integer
        source-identifier:
          type: string
          description: SKAN 4; 1–4 digits
        campaign-id:
          type: integer
          description: SKAN ≤ 3
        conversion-value:
          type: integer
          minimum: 0
          maximum: 63
        coarse-conversion-value:
          type: string
          enum: [low, medium, high]
        postback-sequence-index:
          type: integer
          enum: [0, 1, 2]
        redownload:
          type: boolean
        did-win:
          type: boolean
        source-app-id:
          type: integer
        source-domain:
          type: string
        fidelity-type:
          type: integer
          enum: [0, 1]
        country-code:
          type: string
        attribution-signature:
          type: string
          description: Base64 ECDSA (P-256/SHA-256) signature over the version-specific field composition

    AppVerifyResponse:
      type: object
      description: |
        The protocol is detected from the body: a `jws-string` key means
        AdAttributionKit (the JWS alone is enough), anything else is
        verified as SKAdNetwork. The SKAdNetwork fields
        (`signed_message_base64`, `verifiable_versions`) and the
        AdAttributionKit fields (`key_id`, `header`, `payload`,
        `known_key_ids`, `development_key_ids`) are present for their own
        protocol only.
      properties:
        data:
          type: object
          properties:
            protocol:
              type: string
              enum: [skadnetwork, adattributionkit]
            signature:
              type: string
              enum: [valid, invalid, unverifiable, development]
            signed_message_base64:
              type: string
              nullable: true
              description: SKAdNetwork — base64 of the exact byte string Apple signs for this version (fields joined with U+2063); `null` when the version is unverifiable
            verifiable_versions:
              type: array
              items:
                type: string
              example: ["2.1", "2.2", "3.0", "4.0"]
            key_id:
              type: string
              description: AdAttributionKit — the JWS header's `kid`
              example: apple-development-identifier/1
            header:
              type: object
              description: AdAttributionKit — the decoded JWS header
            payload:
              type: object
              description: AdAttributionKit — the decoded JWS payload (the signed attribution fields)
            known_key_ids:
              type: array
              items:
                type: string
              example: ["apple-cas-identifier/0", "apple-development-identifier/0", "apple-development-identifier/1"]
            development_key_ids:
              type: array
              items:
                type: string
              example: ["apple-development-identifier/0", "apple-development-identifier/1"]

    AppSchemaResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            platform:
              type: string
              enum: [ios, android]
            app_key:
              type: string
            app_id:
              type: integer
              description: iOS only — the App Store id as a number
            integrity_mode:
              type: string
              enum: ["off", observe, require]
              description: Android only — the registration's Play Integrity mode
            integrity:
              type: object
              description: Android only — what the SDK requests
              properties:
                request_token: {type: boolean, description: "true under observe and require (never without cloud_project_number): request a token and send it as integrity_token"}
                token_type: {type: string, enum: [standard]}
                cloud_project_number: {type: string, nullable: true, description: "The Google Cloud project number to request for (a string: it can exceed 2^53)"}
                request_hash: {type: string, enum: [sha256_hex_of_canonical_install_body]}
            sdk:
              type: object
              description: Android only — how the SDK talks to the intake
              properties:
                installs_path: {type: string, example: /api/v3/apps/installs}
                events_path: {type: string, example: "/api/v3/apps/installs/{install_uuid}/events"}
                max_events_per_request: {type: integer, example: 100}
            schema_version:
              type: string
              description: Content hash of the document; also the ETag (unquoted)
            goals:
              type: array
              description: iOS only — every goal an encoding names and every goal those wait for in `after`, as an evaluation-only view (definitions without `value`); ordered by goal id
              items:
                type: object
                properties:
                  goal_id:
                    type: integer
                  starts_at:
                    type: integer
                    description: Events received before this are not evaluated under the goal
                  ends_at:
                    type: integer
                    nullable: true
                    description: Events received at or after this are not (the goal was archived then)
                  versions:
                    type: array
                    items:
                      type: object
                      properties:
                        version:
                          type: integer
                        effective_at:
                          type: integer
                          description: An event is evaluated under the newest version effective when it was received
                        definition:
                          type: object
                          description: The stored goal definition without `value` (see GoalDefinition)
            encodings:
              type: array
              description: iOS only — per goal, the values to set when a device reaches it; ordered by goal id
              items:
                type: object
                properties:
                  goal_id:
                    type: integer
                  fine_value:
                    type: integer
                    nullable: true
                    minimum: 0
                    maximum: 63
                  coarse_value:
                    type: string
                    nullable: true
                    enum: [low, medium, high, null]
            generated_at:
              type: integer

    AppPostbackReceiptResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accepted:
              type: boolean
            duplicate:
              type: boolean
              description: A byte-identical retry of a postback already stored; nothing new was written
            signature:
              type: string
              enum: [valid, invalid, unverifiable, development]

    AdAttributionKitPostback:
      type: object
      description: |
        The JSON envelope an Apple device POSTs to the `AttributionCopyEndpoint`
        (Apple's "Identifying the parameters in a postback", AdAttributionKit).
        `jws-string` is signed by Apple; the other four fields are not, exactly
        as SKAdNetwork never signed conversion values. The JWS payload carries
        `postback-identifier`, `ad-network-identifier`, `advertised-item-identifier`,
        `impression-type`, `did-win`, `postback-sequence-index`, `conversion-type`
        (`download`, `redownload`, `re-engagement`) and `source-identifier`, plus
        the optional `publisher-item-identifier` and `marketplace-identifier`;
        its header carries `alg` (`ES256`) and `kid`.
      required: [jws-string, ad-interaction-type]
      properties:
        jws-string:
          type: string
          description: Compact JWS — header, payload and signature as unpadded base64url segments
          example: eyJraWQiOiJhcHBsZS1kZXZlbG9wbWVudC1pZGVudGlmaWVyXC8xIiwiYWxnIjoiRVMyNTYifQ..bAdNwKd6OfHK9tofvjjua4X_JPcFTxXPQSspD9gZkinw97pY7R1aI-LSjl-oxZZF3_K2H5JK5TSEBee4_1U4oQ
        conversion-value:
          type: integer
          minimum: 0
          maximum: 63
          description: Unsigned; withheld by Apple's postback data tier when absent
        coarse-conversion-value:
          type: string
          enum: [low, medium, high]
          description: Unsigned; withheld by the data tier when absent
        ad-interaction-type:
          type: string
          enum: [view, click]
          description: Unsigned
        country-code:
          type: string
          description: Unsigned ISO 3166 identifier; withheld by the data tier when absent
          example: US

    SkadnetworkVerifyRequest:
      type: object
      minProperties: 1
      additionalProperties: true
      description: |
        A SKAdNetwork postback submitted to `POST /apps/verify`. The
        fields and their meanings are `SkadnetworkPostback`'s; what differs
        is that none of them is required here, so this schema deliberately
        does not repeat the list (repeating it is how the two drift apart).

        Verification reports what the body supports rather than refusing to
        look at it, so a partial or mistyped postback gets a verdict, not a
        validation error. Executed against the endpoint:
        `{"version": "4.0", "attribution-signature": "AA=="}` answers
        `invalid`, `{"attribution-signature": "AA=="}` answers
        `unverifiable`, and a full 4.0 body answers `invalid` — all 200.
        Only an empty object is a 422, which is what `minProperties` says.

        `SkadnetworkPostback` keeps its five required fields because the
        RECEIVER really does require them. Pointing this request body at
        that schema made the spec reject bodies the endpoint answers, and
        contradict this operation's own description.
    AdAttributionKitVerifyRequest:
      type: object
      description: |
        An AdAttributionKit postback submitted to `POST /apps/verify`.
        Only `jws-string` is required here: the signature covers the JWS and
        nothing else, so the unsigned envelope fields of
        `AdAttributionKitPostback` (`conversion-value`,
        `coarse-conversion-value`, `ad-interaction-type`, `country-code`) may
        be left on a copied receiver body but do not affect the verdict. The
        receiver itself requires `ad-interaction-type`; this endpoint does not.
      required: [jws-string]
      properties:
        jws-string:
          type: string
          description: Compact JWS — header, payload and signature as unpadded base64url segments (see `AdAttributionKitPostback` for an example)

    SkadnetworkReceiverProbeResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              example: ready
            protocol:
              type: string
              example: skadnetwork
            endpoint:
              type: string
              example: skadnetwork-report-attribution
            accepts:
              type: string
    AdAttributionKitReceiverProbeResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              example: ready
            protocol:
              type: string
              example: adattributionkit
            endpoint:
              type: string
              example: appattribution-report-attribution
            accepts:
              type: string

