  # ─── Setup ──────────────────────────────────────────────────────────
  # The UI's Setup section's code and per-source settings. Every route asks
  # for the role permission `access_to_setup_section` (as every Setup page
  # does) and the path's scope area; the variables routes ask for
  # `remove_traffic_source` first (as the Traffic Sources page does before
  # it shows the variables dialog).

  /landing-pages/{id}/code:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Setup]
      summary: Get a landing page's tracking code
      description: |
        What Setup > Get LP Code hands out for the landing page, built by the
        class the page builds its code with (`Prosper202\Setup\LandingPageCode`),
        byte for byte: the loader script for the page itself, and the ways out
        to the offer. The snippets start from `base_url`, the tracker link's base
        (user 1's tracking domain, or the host this request arrived at when none
        is set, plus the install directory) written scheme-relative (`//host/...`)
        as the page writes it, so they work on an http or an https landing page.

        A simple page (`landing_page_type` 0) links out to its own campaign:
        `outbound_link` (go.php?lpip=), `outbound_php` (a PHP redirect page) and
        `outbound_javascript` (a JavaScript redirect page). Its campaign must be
        live; `offers` is refused.

        An advanced page (`landing_page_type` 1) links out to the offers named
        in `offers`, in order: each gets `outbound_link` (go.php?acip= for a
        campaign, go.php?rpi= for a redirector) and `outbound_php` (off.php or
        offrtr.php). Without `offers` the request is refused with the page's
        sentence ("Please select an affiliate campaign or rotator"); an offer
        that is not the caller's, or was removed, is refused by position.

        The landing page must be the caller's and not removed (404 otherwise).
        A landing page or campaign without a public id is given one first, as
        a read of the landing page through the API does. Any other query
        parameter is refused with 422.
      operationId: getLandingPageCode
      parameters:
        - name: offers
          in: query
          required: false
          description: >-
            An advanced page's offers, comma separated, in the order they
            appear on the page: `campaign:<aff_campaign_id>` or
            `rotator:<rotator id>`, at most 100. No spaces.
          schema:
            type: string
            pattern: "^(campaign|rotator):[1-9][0-9]{0,9}(,(campaign|rotator):[1-9][0-9]{0,9})*$"
            example: "campaign:12,rotator:3"
      responses:
        "200":
          description: The landing page's code
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/LandingPageCode"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /conversions/postback-code:
    get:
      tags: [Setup]
      summary: Get the conversion pixels and postback URLs
      description: |
        What Setup > Postback / Pixel shows, for the values given (all empty
        by default, as the page renders them), built by the class the page
        uses (`Prosper202\Setup\PostbackCode`); the page's script writes the
        same strings, which a test holds equal. The base is the tracker
        link's (`base_url` ends in `tracking202/static/`).

        - `simple`: the image pixel (gpx.php) and the server-to-server
          postback URL (gpb.php), each with `amount` and `subid`;
        - `advanced`: the same with `cid` (`campaign_id`), the campaign a
          conversion is recorded under when a visitor clicked several;
        - `universal`: the smart pixel (upx.php), which also fires the
          account's traffic-source pixels, as a JavaScript tag (with a
          `<noscript>` fallback) and as an iframe.

        `amount` and `subid` are written in as given — a number or the
        network's macro such as `{payout}`, `{aff_sub}`, `#s2#` or `[=SID=]` —
        so what would break a URL, an HTML attribute or a JavaScript string is
        refused: whitespace, quotes, `<`, `>`, `\`, `&` and control characters.
        `campaign_id` must be one of the caller's live campaigns in a live
        category (the page's list). Any other query parameter is refused.
      operationId: getPostbackCode
      parameters:
        - name: amount
          in: query
          required: false
          description: A number, or the network's payout macro. Empty pays the campaign's payout.
          schema:
            type: string
            maxLength: 255
            example: "{payout}"
        - name: subid
          in: query
          required: false
          description: The network's sub id macro. Empty leaves `subid=` for you to fill.
          schema:
            type: string
            maxLength: 255
            example: "{aff_sub}"
        - name: campaign_id
          in: query
          required: false
          description: The advanced pixel's `cid`.
          schema:
            type: string
            pattern: "^[1-9][0-9]{0,9}$"
        - name: scheme
          in: query
          required: false
          description: The URLs' scheme; by default the one the tracking domain is reached on.
          schema:
            type: string
            enum: [http, https]
      responses:
        "200":
          description: The pixels and postback URLs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PostbackCode"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /ppc-networks/{id}/variables:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Setup]
      summary: List a traffic source's custom variables
      description: |
        The live custom variables of the traffic source (the PPC network):
        the extra `parameter=placeholder` pairs its tracking links carry
        (`GET /trackers/{id}/url` writes them after `t202id`). A variable whose
        parameter is a built-in token (c1-c4, utm_*, t202ref, t202b, t202kw)
        sets that token's default instead. The traffic source must be the
        caller's and not removed.

        Every variables route needs the role permissions
        `remove_traffic_source` and `access_to_setup_section` (Super user and
        Admin have both): Setup > Traffic Sources shows the variables dialog,
        and the variables it edits, only to a role with both. A role without
        them is answered `403` naming `remove_traffic_source` first.
      operationId: listPpcNetworkVariables
      responses:
        "200":
          description: The variables, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PpcNetworkVariable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Setup]
      summary: Add a custom variable to a traffic source
      description: |
        Every field is required and not blank, as the Setup dialog requires.
        Beyond the dialog, what would break every link of the source is
        refused, because the link builder writes the parameter and the
        placeholder into the link as given: more than 255 characters, spaces,
        `&`, `#`, `?` or control characters, an `=` in the parameter, and the
        parameter `t202id` (the link's own id). Unknown fields are refused.
        Takes an `Idempotency-Key`; stageable with `?staged=1`.
      operationId: createPpcNetworkVariable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PpcNetworkVariableWrite"
      responses:
        "201":
          description: Variable created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PpcNetworkVariable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /ppc-networks/{id}/variables/{variableId}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
      - name: variableId
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [Setup]
      summary: Change a traffic source's custom variable
      description: >-
        Changes the fields it sends (at least one), held to the create's
        rules. The variable must be a live one of this traffic source. PATCH
        is accepted as the same operation; stageable with `?staged=1`.
      operationId: updatePpcNetworkVariable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PpcNetworkVariableWrite"
      responses:
        "200":
          description: Variable updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PpcNetworkVariable"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Setup]
      summary: Remove a traffic source's custom variable
      description: >-
        Retires the variable (soft delete), as the Setup dialog retires a row
        it no longer lists: new links stop carrying it, and clicks already
        recorded with it keep their values. Stageable with `?staged=1`.
      operationId: deletePpcNetworkVariable
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Variable removed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /ppc-accounts/{id}/pixels:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Setup]
      summary: List a traffic source account's pixels
      description: |
        The pixels the account fires when one of its clicks converts, with
        their type's name and, for a Postback pixel, its correction URL. The
        account must be the caller's, not removed, and filed under one of the
        caller's traffic sources.
      operationId: listPpcAccountPixels
      responses:
        "200":
          description: The pixels, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PpcAccountPixel"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Setup]
      summary: Add a pixel to a traffic source account
      description: |
        As the account form saves one: a type and a code are required (the
        code is trimmed). The type must be one of `202_pixel_types` (1 Image,
        2 Iframe, 3 Javascript, 4 Postback — server to server, 5 Raw,
        6 Bot202 Facebook Pixel Assistant). For every type except Raw the code
        is the URL from the pixel's src, several separated by spaces; a
        Postback's must be http(s), the only URLs the postback sender calls.
        `correction_url` goes on a Postback pixel only, one URL per code URL in
        the same order (the form's check). Unknown fields are refused. Takes
        an `Idempotency-Key`; stageable with `?staged=1`.
      operationId: createPpcAccountPixel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PpcAccountPixelWrite"
      responses:
        "201":
          description: Pixel created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PpcAccountPixel"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /ppc-accounts/{id}/pixels/{pixelId}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
      - name: pixelId
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [Setup]
      summary: Change a traffic source account's pixel
      description: >-
        Changes the fields it sends (at least one); the pixel that results is
        held to the create's rules. A pixel that stops being a Postback keeps
        no correction URL; `correction_url: ""` removes one. PATCH is accepted
        as the same operation; stageable with `?staged=1`.
      operationId: updatePpcAccountPixel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PpcAccountPixelWrite"
      responses:
        "200":
          description: Pixel updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PpcAccountPixel"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Setup]
      summary: Remove a pixel from a traffic source account
      description: >-
        Hard delete, with the pixel's correction URL, as the account form
        erases a pixel it no longer lists. Stageable with `?staged=1`.
      operationId: deletePpcAccountPixel
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Pixel removed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key from /users/{id}/api-keys

  # ─── Shared parameters ──────────────────────────────────────────────

  parameters:
    changeId:
      name: changeId
      in: path
      required: true
      description: A staged-change id (chg_ + 24 hex chars), issued by staging a write
      schema:
        type: string
        pattern: "^chg_[0-9a-f]{24}$"
    dryRun:
      name: dry_run
      in: query
      required: false
      description: |
        Preview the delete without performing it. With `dry_run=1` the
        response is `200` with `{data: {dry_run, action, resource, mode,
        record, cascade}}` instead of `204`. Fail-closed: an endpoint
        without preview support rejects the parameter with `422`, and an
        unrecognized value is a `422` — never a delete. Supported
        when the capabilities report `features.delete_dry_run`.
      schema:
        type: string
        enum: ["1", "true", "yes", "0", "false", "no"]
    writeDryRun:
      name: dry_run
      in: query
      required: false
      description: |
        Preview the write without performing it: `dry_run=1` answers what
        the write would do (`dry_run: true` in `data`) and writes nothing,
        after the same permission and scope checks as the write. An
        unrecognized value is a `422`, never the write. It goes in the query
        string; in the body it is refused.
      schema:
        type: string
        enum: ["1", "true", "yes", "0", "false", "no"]
    resourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    attributionPeriod:
      name: period
      in: query
      description: A named range, as the reports' `period` (calendar ones at the account's midnight; alltime from the first click); exclusive with time_from/time_to. Without either, the last 30 days.
      schema:
        type: string
        enum: [today, yesterday, last7, last14, last30, last90, thismonth, lastmonth, thisyear, lastyear, alltime]
    attributionTimeFrom:
      name: time_from
      in: query
      description: "Range start, inclusive: unix seconds; a date (YYYY-MM-DD), from its first second in the account's timezone; or a time with its offset (2026-10-01T09:30:00Z). Anything else is a 422 naming the field. 0 is all time (without time_from the range starts 30 days ago)."
      schema:
        type: string
    attributionTimeTo:
      name: time_to
      in: query
      description: "Range end, inclusive: unix seconds; a date (YYYY-MM-DD), through its last second in the account's timezone; or a time with its offset. A range whose start is after its end is a 422."
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: Maximum results (default 50, max 500)
      schema:
        type: integer
        default: 50
        maximum: 500
    offset:
      name: offset
      in: query
      description: Pagination offset
      schema:
        type: integer
        default: 0
    period:
      name: period
      in: query
      description: >-
        A named window. The calendar ones (today, yesterday, thismonth,
        lastmonth, thisyear, lastyear) start at a midnight in the account's
        timezone; lastN is today so far and the N whole days before it, from
        that day's midnight (the report pages' Last N Days); alltime has no
        bound.
        Sent with time_from/time_to, both bounds apply. Anything else is a 422.
      schema:
        type: string
        enum: [today, yesterday, last7, last14, last30, last90, thismonth, lastmonth, thisyear, lastyear, alltime]
    windowFrom:
      name: time_from
      in: query
      description: "Range start, inclusive: unix seconds; a date (YYYY-MM-DD), from its first second in the account's timezone; or a time with its offset (2026-10-01T09:30:00Z). Anything else is a 422 naming the field."
      schema:
        type: string
        example: "2026-10-01"
    windowTo:
      name: time_to
      in: query
      description: "Range end, inclusive: unix seconds; a date (YYYY-MM-DD), through its last second in the account's timezone; or a time with its offset. A range whose start is after its end is a 422."
      schema:
        type: string
        example: "2026-10-07"
    timeFrom:
      name: time_from
      in: query
      description: Start timestamp (unix)
      schema:
        type: integer
    timeTo:
      name: time_to
      in: query
      description: End timestamp (unix)
      schema:
        type: integer
    filterCampaign:
      name: aff_campaign_id
      in: query
      schema:
        type: integer
    filterAffNetwork:
      name: aff_network_id
      in: query
      schema:
        type: integer
    filterPpcAccount:
      name: ppc_account_id
      in: query
      schema:
        type: integer
    filterPpcNetwork:
      name: ppc_network_id
      in: query
      description: >-
        A traffic source's id, or `none` for the clicks with no traffic
        source (the Analyze pages' "No traffic source", which they send as
        16777215; that is accepted too).
      schema:
        oneOf:
          - type: integer
          - type: string
            enum: [none]
    filterLandingPage:
      name: landing_page_id
      in: query
      schema:
        type: integer
    filterCountry:
      name: country_id
      in: query
      schema:
        type: integer
    filterTextAd:
      name: text_ad_id
      in: query
      description: Filter by text ad. 0 or empty is no filter; anything but a whole number is a 422.
      schema:
        type: integer
    filterRegion:
      name: region_id
      in: query
      description: Filter by region (the id of a `breakdown=region` row)
      schema:
        type: integer
    filterIsp:
      name: isp_id
      in: query
      description: Filter by ISP/carrier (the id of a `breakdown=isp` row)
      schema:
        type: integer
    filterBrowser:
      name: browser_id
      in: query
      description: Filter by browser (the id of a `breakdown=browser` row)
      schema:
        type: integer
    filterPlatform:
      name: platform_id
      in: query
      description: Filter by platform/OS (the id of a `breakdown=platform` row)
      schema:
        type: integer
    filterDeviceType:
      name: device_type
      in: query
      description: "Filter by device type: 1 Desktop, 2 Mobile, 3 Tablet, 4 Bot (the ids of `breakdown=device_type` rows); every device model of that type."
      schema:
        type: integer
    filterMethodOfPromotion:
      name: method_of_promotion
      in: query
      description: Only direct-link clicks (no landing page) or only landing-page clicks
      schema:
        type: string
        enum: [directlink, landingpage]
    filterShow:
      name: show
      in: query
      description: "Which clicks count, as the Analyze pages' show menu: all (default), real (not filtered), filtered, filtered_bot (filtered as bots), leads (converted)."
      schema:
        type: string
        enum: [all, real, filtered, filtered_bot, leads]
    filterKeyword:
      name: keyword
      in: query
      description: Clicks whose keyword contains this text, case-insensitive; % and _ are literal. At most 255 characters.
      schema:
        type: string
        maxLength: 255
    filterIp:
      name: ip
      in: query
      description: Clicks from this one address, IPv4 or IPv6 (any spelling of an IPv6 address). Not an address is a 422.
      schema:
        type: string
        example: 2001:db8::1
    filterReferer:
      name: referer
      in: query
      description: Clicks whose referring URL contains this text, case-insensitive; % and _ are literal. At most 255 characters.
      schema:
        type: string
        maxLength: 255

    # App postback filters (list + report)
    postbackRegistrationId:
      name: registration_id
      in: query
      description: The registration that claimed the postback (`registration_id` from `GET /apps`)
      schema:
        type: integer
    postbackRegistrationIds:
      name: registration_ids
      in: query
      description: >
        Several registrations at once, as a comma-separated list
        (`registration_ids=3,7`). Narrows to that SET of apps, which
        `registration_id` cannot do; combine them and both apply. At most 500
        ids, each a whole number — a value an integer cast would change is
        rejected rather than silently selecting a different app. Duplicates
        collapse; a blank element is an error, not a skip.
      schema:
        type: string
      example: "3,7"
    postbackAppId:
      name: app_id
      in: query
      description: >-
        The App Store id the postback itself named — the forensic record,
        kept whether or not a registration claimed the row. Prefer
        `registration_id` to select an app.
      schema:
        type: integer
    postbackAdNetworkId:
      name: ad_network_id
      in: query
      schema:
        type: string
    postbackVersion:
      name: version
      in: query
      description: SKAN postback version (e.g. `4.0`)
      schema:
        type: string
    postbackTransactionId:
      name: transaction_id
      in: query
      schema:
        type: string
    postbackCountryCode:
      name: country_code
      in: query
      schema:
        type: string
    postbackSourceIdentifier:
      name: source_identifier
      in: query
      description: SKAN 4 source identifier (1–4 digits)
      schema:
        type: string
    postbackCampaignId:
      name: campaign_id
      in: query
      description: SKAN 2/3 campaign id
      schema:
        type: integer
    postbackFidelityType:
      name: fidelity_type
      in: query
      description: >-
        SKAdNetwork's spelling of `ad_interaction_type`: 1 = StoreKit-rendered
        or web ad (click), 0 = view-through. Matched on the protocol-neutral
        `ad_interaction_type` column, so it selects AdAttributionKit rows too
        (they leave the raw `fidelity_type` column `NULL`); prefer
        `ad_interaction_type=click|view`, which says the same thing.
      schema:
        type: integer
        enum: [0, 1]
    postbackPostbackSequenceIndex:
      name: postback_sequence_index
      in: query
      description: SKAN 4 conversion window (0, 1, or 2)
      schema:
        type: integer
        enum: [0, 1, 2]
    postbackDidWin:
      name: did_win
      in: query
      description: Winning (1/true) or losing (0/false) postbacks; anything else is a 422
      schema:
        type: string
        enum: ["1", "0", "true", "false"]
    postbackRedownload:
      name: redownload
      in: query
      description: >-
        SKAdNetwork's spelling of `conversion_type`: redownloads (1/true) or
        first installs (0/false). Matched on the protocol-neutral
        `conversion_type` column (`redownload` / `download`), so it selects
        AdAttributionKit rows too (they leave the raw `redownload` column
        `NULL`); prefer `conversion_type=redownload|download`, which says the
        same thing and can also select `re-engagement` — a kind this flag
        cannot name, and which `redownload=0` therefore excludes.
      schema:
        type: string
        enum: ["1", "0", "true", "false"]
    postbackCoarseConversionValue:
      name: coarse_conversion_value
      in: query
      schema:
        type: string
        enum: [low, medium, high]
    installMatchState:
      name: match_state
      in: query
      description: Only installs in this state
      schema:
        type: string
        enum: [attributed, organic, third_party, unavailable, pending_click, bad_token, foreign_click, implausible, outside_window, duplicate_click, pending_integrity, integrity_failed, integrity_unverified]
    postbackSignature:
      name: signature
      in: query
      description: >-
        Signature class. `valid`, `invalid` and `unverifiable` select on the
        trust bit the report keys on (`trusted` 1 / 0 / null);
        `development` selects rows verified against one of Apple's
        AdAttributionKit development keys whatever their trust bit. On the
        report, an explicit value switches `meta.trusted` to `as-filtered`.
      schema:
        type: string
        enum: [valid, invalid, unverifiable, development]
    postbackProtocol:
      name: protocol
      in: query
      description: Which framework delivered the postback; the shorthands `skan` and `aak` are accepted
      schema:
        type: string
        enum: [skadnetwork, adattributionkit, skan, aak]
    postbackConversionType:
      name: conversion_type
      in: query
      description: Protocol-neutral conversion kind (`re-engagement` exists only in AdAttributionKit)
      schema:
        type: string
        enum: [download, redownload, re-engagement]
    postbackAdInteractionType:
      name: ad_interaction_type
      in: query
      description: View-through or click-through
      schema:
        type: string
        enum: [view, click]

  # ─── Shared responses ───────────────────────────────────────────────

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: |
        Validation failed; nothing was written. `field_errors` names each
        field. Every key of a body is written or refused, never ignored: a key
        that is not a field of the endpoint (the message lists the accepted
        ones), a read-only field (an id, a public id, `user_id`) other than
        the record's own value on an update and any on a create, a `null` for
        a field that cannot hold NULL, a whole number that is not one (`"1.5"`,
        `"1e3"`, 20 digits) or is outside the column's range, a non-finite or
        out-of-range decimal, and a string longer than its column are each a
        422; a refused number's message names the field's range. A `null`
        clears a field that can hold NULL.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"

    AppRateLimited:
      description: Per-source rate limit exceeded; retry after the indicated seconds
      headers:
        Retry-After:
          description: Seconds until the window resets
          schema:
            type: integer
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  retry_after_seconds:
                    type: integer

