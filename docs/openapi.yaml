    # ── Conversions ────────────────────────────────────────────────────

    Conversion:
      type: object
      properties:
        conv_id:
          type: integer
        click_id:
          type: integer
        transaction_id:
          type: string
        campaign_id:
          type: integer
        click_payout:
          type: number
        user_id:
          type: integer
        click_time:
          type: integer
        conv_time:
          type: integer
        deleted:
          type: integer
        aff_campaign_name:
          type: string
        source:
          $ref: "#/components/schemas/ConversionSource"
        source_ref:
          type: string
          nullable: true
          description: |
            What produced the row, as a reference: `goal:<goal id>:<version>`,
            `batch:<upload id>`, `conv:<the conversion a reversal reverses>`,
            or `apikey:<digest>` (a truncated SHA-256 of the key that wrote
            it through this API). `GET /clicks/{id}/conversions` resolves it.
        event_name:
          type: string
          nullable: true
          description: The event that reached the goal, or a postback's `event=`.
        payable:
          type: boolean
          description: False for a tracked outcome that is not paid.
        reverses_conv_id:
          type: integer
          nullable: true
        superseded_by:
          type: integer
          nullable: true
        superseded_reason:
          type: string
          nullable: true
          enum: [replace, batch, pre_ledger, replay, reevaluation, null]
        goal_id:
          type: integer
          nullable: true
          description: The goal of a goal row (from `source_ref`), else null.
        goal_version:
          type: integer
          nullable: true

    ConversionSource:
      type: string
      description: What produced a ledger row.
      enum: [pixel, postback, universal_pixel, api, subid_upload, revenue_upload, legacy_pixel, clickbank, app_install, goal, legacy_baseline]

    ClickConversion:
      type: object
      description: One conversion row of a click, and whether it counts toward the click's value.
      properties:
        conv_id:
          type: integer
        click_id:
          type: integer
        amount:
          type: string
          description: The row's amount, exact to five decimals (negative for a reversal).
          example: "5.00000"
        payable:
          type: boolean
        deleted:
          type: boolean
        counted:
          type: boolean
          description: Whether the amount is part of the click's value.
        not_counted_reason:
          type: string
          nullable: true
          enum: [deleted, unpaid, superseded, not_netted, null]
        superseded_reason:
          type: string
          nullable: true
          enum: [replace, batch, pre_ledger, replay, reevaluation, null]
        superseded_by:
          type: integer
          nullable: true
          description: The row that replaced this one, when there is one.
        explanation:
          type: string
          nullable: true
          description: The reason as a sentence; null when the row counts.
        source:
          $ref: "#/components/schemas/ConversionSource"
        source_label:
          type: string
        source_ref:
          type: string
          nullable: true
        linked_to:
          type: object
          nullable: true
          description: |
            `source_ref` resolved within the click's account. `type` is
            `goal` (`goal_id`, `goal_version`, `name`, `archived`),
            `upload_batch` (`batch_id`, `file_name`, `uploaded_at`),
            `conversion` (`conv_id`), `api_key` (`key_digest`,
            `key_created_at`, `revoked`) or `unknown`; `label` names it in
            words.
          properties:
            type:
              type: string
              enum: [goal, upload_batch, conversion, api_key, unknown]
            label:
              type: string
          additionalProperties: true
        event_name:
          type: string
          nullable: true
        transaction_id:
          type: string
          nullable: true
        reverses_conv_id:
          type: integer
          nullable: true
        conv_time:
          type: integer

    ClickConversionsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ClickConversion"
        click:
          type: object
          properties:
            click_id:
              type: integer
            campaign_id:
              type: integer
            campaign_name:
              type: string
              nullable: true
            payout_mode:
              type: string
              enum: [replace, accumulate]
            lead:
              type: boolean
              description: The lead flag the reports show.
            click_payout:
              type: string
              description: The value the reports show.
            ledger_state:
              type: string
              enum: [ledger, pre_ledger]
            ledger_value:
              type: string
              nullable: true
              description: What the counted rows add up to; null when none counts.
            matches_click:
              type: boolean
              description: Whether the reports' value is what the counted rows add up to.
            rows:
              type: integer
            counted_rows:
              type: integer

    ConversionCreate:
      type: object
      required: [click_id]
      properties:
        click_id:
          type: integer
          description: Click ID to attribute the conversion to
        payout:
          type: number
          description: |
            Payout amount. Must be a number (a string that is not one is a
            422). When omitted: the click's current value in a `replace`
            campaign, the campaign payout in an `accumulate` campaign. For a
            reversal, the amount reversed (default: all of the sale).
        transaction_id:
          type: string
          description: |
            The network's or merchant's id for this conversion: kept on the
            row for reconciliation, and a repeat on the same click is the
            same conversion. For a reversal, the id of the sale it reverses.
        conv_time:
          type: integer
          description: Conversion timestamp (defaults to current time)
        status:
          type: string
          enum: [reversed]
          description: Record a reversal of the conversion named by `transaction_id`.
        reversal_id:
          type: string
          description: The network's id for the reversal. Without one, a sale can be reversed once.

    ConversionResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Conversion"

    ConversionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Conversion"
        pagination:
          $ref: "#/components/schemas/Pagination"

