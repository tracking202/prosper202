          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - LTV
      summary: Create or update a product
      description: Needs the `ltv:write` scope. LTV writes do not honor `Idempotency-Key` (`POST /ltv/revenue` takes
        an `idempotency_key` field instead) and have no `dry_run` preview.
      operationId: ltvUpsertProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: >-
                A product as a line item names one (`LtvLineItem`'s product fields, by the same rules):
                external_product_id or sku is required, a price is a number from 0 to 999999999.99999 (a price of
                "abc" was stored as 0), and a name or sku longer than its column is a 422, not cut.
              properties:
                external_product_id:
                  type: string
                  maxLength: 191
                sku:
                  type: string
                  maxLength: 191
                name:
                  type: string
                  maxLength: 255
                price:
                  type: number
                  nullable: true
                  minimum: 0
                  maximum: 999999999.99999
              additionalProperties: false
      responses:
        '201':
          description: '`product_id`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /ltv/products/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
      description: Product id
    patch:
      tags:
      - LTV
      summary: Edit a product
      description: Needs the `ltv:write` scope. The LTV Products tab's Edit. Changes only the fields sent; `name`
        cannot be blank (at most 255 characters), `sku` (at most 191) and `price` (a number from 0) are cleared by
        null or "". Past order line items keep the name they were sold under; `external_product_id` is the key and
        does not change. Unknown fields are refused. Not stageable.
      operationId: ltvUpdateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                sku:
                  type: string
                  nullable: true
                price:
                  type: number
                  nullable: true
                  minimum: 0
      responses:
        '200':
          description: The product
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
      - LTV
      summary: Delete a product
      description: Needs the `ltv:write` scope. Allowed only while no order line item names the product, as on the
        Products tab; otherwise a `409` naming how many do (`details.line_items`). The check and the delete are one
        statement. `dry_run=1` returns the product and, as `refused`, the message the delete would answer (null when
        it would go ahead). Not stageable.
      operationId: ltvDeleteProduct
      parameters:
      - $ref: '#/components/parameters/dryRun'
      responses:
        '200':
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Order line items name the product; nothing was deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

