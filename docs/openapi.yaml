                dry_run:
                  type: boolean
                skip_errors:
                  type: boolean
                force_update:
                  type: boolean
                max_attempts:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 3
              required:
              - source
              - target
              additionalProperties: true
      responses:
        '200':
          description: What a sync would create, update and collide on
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /sync/status:
    get:
      tags:
      - Sync
      summary: Latest sync between two profiles
      description: Admin only, with the `sync:read` scope.
      operationId: syncStatus
      parameters:
      - name: source
        in: query
        schema:
          type: string
        description: Source profile or URL
      - name: target
        in: query
        schema:
          type: string
        description: Target profile or URL
      responses:
        '200':
          description: '`source`, `target` and the `latest` audit record'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /sync/history:
    get:
      tags:
      - Sync
      summary: Sync history between two profiles
      description: Admin only, with the `sync:read` scope.
      operationId: syncHistory
      parameters:
      - name: source
        in: query
        schema:
          type: string
        description: Source profile or URL
      - name: target
        in: query
        schema:
          type: string
        description: Target profile or URL
      responses:
        '200':
          description: Audit records, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /sync/jobs:
    post:
      tags:
      - Sync
      summary: Queue a sync job
      description: Admin only, with the `sync:write` scope. Honors `Idempotency-Key`.
      operationId: syncCreateJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: object
                  properties:
                    url:
                      type: string
                    api_key:
                      type: string
                  required:
                  - url
                target:
                  type: object
                  properties:
                    url:
                      type: string
                    api_key:
                      type: string
                  required:
                  - url
                entity:
                  type: string
                  default: all
                  enum:
                  - all
                  - aff-networks
                  - ppc-networks
                  - ppc-accounts
                  - campaigns
                  - landing-pages
                  - text-ads
                  - rotators
                  - trackers
                collision_mode:
                  type: string
                  enum:
                  - warn
                  - manual
                  default: warn
                prune:
                  type: boolean
                prune_preview:
                  type: boolean
                dry_run:
                  type: boolean
                skip_errors:
                  type: boolean
                force_update:
                  type: boolean
                max_attempts:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 3
              required:
              - source
              - target
              additionalProperties: true
      responses:
        '202':
          description: The job (credentials never echoed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /sync/jobs/{id}:
    get:
      tags:
      - Sync
      summary: Get a sync job
      description: Admin only, with the `sync:read` scope.
      operationId: syncGetJob
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Job id
      responses:
        '200':
          description: The job (credentials never echoed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sync/jobs/{id}/events:
    get:
      tags:
      - Sync
      summary: A sync job's events
      description: Admin only, with the `sync:read` scope.
      operationId: syncJobEvents
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Job id
      - name: limit
        in: query
        schema:
          type: integer
          default: 100
          minimum: 1
          maximum: 500
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sync/jobs/{id}/run:
    post:
      tags:
      - Sync
      summary: Run a sync job now
      description: Admin only, with the `sync:write` scope.
      operationId: syncRunJob
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Job id
      responses:
        '200':
          description: The job (credentials never echoed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /sync/jobs/{id}/cancel:
    post:
      tags:
      - Sync
      summary: Cancel a sync job
      description: Admin only, with the `sync:write` scope.
      operationId: syncCancelJob
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Job id
      responses:
        '200':
          description: The job (credentials never echoed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /sync/worker/run:
    post:
      tags:
      - Sync
      summary: Run the sync worker
      description: Admin only, with the `sync:write` scope. Processes up to `limit` queued jobs.
      operationId: syncRunWorker
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 10
      responses:
        '200':
          description: The jobs processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'

  /sync/re-sync:
    post:
      tags:
      - Sync
      summary: Queue an incremental re-sync
      description: 'Admin only, with the `sync:write` scope. `POST /sync/jobs` with `incremental: true`.'
      operationId: syncReSync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  type: object
                  properties:
                    url:
                      type: string
                    api_key:
                      type: string
                  required:
                  - url
                target:
                  type: object
                  properties:
                    url:
                      type: string
                    api_key:
                      type: string
                  required:
                  - url
                entity:
                  type: string
                  default: all
                  enum:
                  - all
                  - aff-networks
                  - ppc-networks
                  - ppc-accounts
                  - campaigns
                  - landing-pages
                  - text-ads
                  - rotators
                  - trackers
                collision_mode:
                  type: string
                  enum:
                  - warn
                  - manual
                  default: warn
                prune:
                  type: boolean
                prune_preview:
                  type: boolean
                dry_run:
                  type: boolean
                skip_errors:
                  type: boolean
                force_update:
                  type: boolean
                max_attempts:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 3
              required:
              - source
              - target
              additionalProperties: true
      responses:
        '202':
          description: The job (credentials never echoed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /changes/{entity}:
    get:
      tags:
      - Sync
      summary: Incremental changes to an entity
      description: Admin only, with the `sync:read` scope.
      operationId: syncListChanges
      parameters:
      - name: entity
        in: path
        required: true
        schema:
          type: string
        description: An entity sync supports (see `/capabilities`)
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          default: 200
          minimum: 1
          maximum: 1000
      - name: cursor_ttl
        in: query
        schema:
          type: integer
          default: 3600
        description: Seconds the cursor stays valid (60-86400)
      - name: updated_since
        in: query
        schema:
          type: integer
      - name: deleted_since
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Changed and deleted rows with a `cursor` for the next page
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /audit/sync-jobs:
    get:
      tags:
      - Sync
      summary: Sync audit records
      description: Admin only, with the `sync:read` scope.
      operationId: syncAuditList
      parameters:
      - name: actor
        in: query
        schema:
          type: string
      - name: source
        in: query
        schema:
          type: string
      - name: target
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
      - name: from_epoch
        in: query
        schema:
          type: integer
      - name: to_epoch
        in: query
        schema:
          type: integer
      - name: format
        in: query
        schema:
          type: string
          default: json
          enum:
          - json
          - csv
      responses:
        '200':
          description: Audit records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /audit/sync-jobs/{id}:
    get:
      tags:
      - Sync
      summary: One sync job's audit record
      description: Admin only, with the `sync:read` scope.
      operationId: syncAuditGet
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Job id
      - name: format
        in: query
        schema:
          type: string
          default: json
          enum:
          - json
          - csv
      responses:
        '200':
          description: The record
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key from /users/{id}/api-keys

  # ─── Shared parameters ──────────────────────────────────────────────

  parameters:
    changeId:
      name: changeId
      in: path
      required: true
      description: A staged-change id (chg_ + 24 hex chars), issued by staging a write
      schema:
        type: string
        pattern: "^chg_[0-9a-f]{24}$"
    dryRun:
      name: dry_run
      in: query
      required: false
      description: |
        Preview the delete without performing it. With `dry_run=1` the
        response is `200` with `{data: {dry_run, action, resource, mode,
        record, cascade}}` instead of `204`. Fail-closed: endpoints without
        preview support (the LTV deletes) reject the parameter with `422`,
        and an unrecognized value is a `422` — never a delete. Supported
        when the capabilities report `features.delete_dry_run`.
      schema:
        type: string
        enum: ["1", "true", "yes", "0", "false", "no"]
    resourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    attributionPeriod:
      name: period
      in: query
      description: A named range; exclusive with time_from/time_to. Without either, the last 30 days.
      schema:
        type: string
        enum: [today, yesterday, last7, last30, last90]
    attributionTimeFrom:
      name: time_from
      in: query
      description: Range start, unix seconds.
      schema:
        type: integer
    attributionTimeTo:
      name: time_to
      in: query
      description: Range end, unix seconds.
      schema:
        type: integer
    limit:
      name: limit
      in: query
      description: Maximum results (default 50, max 500)
      schema:
        type: integer
        default: 50
        maximum: 500
    offset:
      name: offset
      in: query
      description: Pagination offset
      schema:
        type: integer
        default: 0
    period:
      name: period
      in: query
      description: Predefined time period
      schema:
        type: string
        enum: [today, yesterday, last7, last30, last90]
    timeFrom:
      name: time_from
      in: query
      description: Start timestamp (unix)
      schema:
        type: integer
    timeTo:
      name: time_to
      in: query
      description: End timestamp (unix)
      schema:
        type: integer
    filterCampaign:
      name: aff_campaign_id
      in: query
      schema:
        type: integer
    filterAffNetwork:
      name: aff_network_id
      in: query
      schema:
        type: integer
    filterPpcAccount:
      name: ppc_account_id
      in: query
      schema:
        type: integer
    filterPpcNetwork:
      name: ppc_network_id
      in: query
      schema:
        type: integer
    filterLandingPage:
      name: landing_page_id
      in: query
      schema:
        type: integer
    filterCountry:
      name: country_id
      in: query
      schema:
        type: integer

    # App postback filters (list + report)
    postbackRegistrationId:
      name: registration_id
      in: query
      description: The registration that claimed the postback (`registration_id` from `GET /apps`)
      schema:
        type: integer
    postbackRegistrationIds:
      name: registration_ids
      in: query
      description: >
        Several registrations at once, as a comma-separated list
        (`registration_ids=3,7`). Narrows to that SET of apps, which
        `registration_id` cannot do; combine them and both apply. At most 500
        ids, each a whole number — a value an integer cast would change is
        rejected rather than silently selecting a different app. Duplicates
        collapse; a blank element is an error, not a skip.
      schema:
        type: string
      example: "3,7"
    postbackAppId:
      name: app_id
      in: query
      description: >-
        The App Store id the postback itself named — the forensic record,
        kept whether or not a registration claimed the row. Prefer
        `registration_id` to select an app.
      schema:
        type: integer
    postbackAdNetworkId:
      name: ad_network_id
      in: query
      schema:
        type: string
    postbackVersion:
      name: version
      in: query
      description: SKAN postback version (e.g. `4.0`)
      schema:
        type: string
    postbackTransactionId:
      name: transaction_id
      in: query
      schema:
        type: string
    postbackCountryCode:
      name: country_code
      in: query
      schema:
        type: string
    postbackSourceIdentifier:
      name: source_identifier
      in: query
      description: SKAN 4 source identifier (1–4 digits)
      schema:
        type: string
    postbackCampaignId:
      name: campaign_id
      in: query
      description: SKAN 2/3 campaign id
      schema:
        type: integer
    postbackFidelityType:
      name: fidelity_type
      in: query
      description: >-
        SKAdNetwork's spelling of `ad_interaction_type`: 1 = StoreKit-rendered
        or web ad (click), 0 = view-through. Matched on the protocol-neutral
        `ad_interaction_type` column, so it selects AdAttributionKit rows too
        (they leave the raw `fidelity_type` column `NULL`); prefer
        `ad_interaction_type=click|view`, which says the same thing.
      schema:
        type: integer
        enum: [0, 1]
    postbackPostbackSequenceIndex:
      name: postback_sequence_index
      in: query
      description: SKAN 4 conversion window (0, 1, or 2)
      schema:
        type: integer
        enum: [0, 1, 2]
    postbackDidWin:
      name: did_win
      in: query
      description: Winning (1/true) or losing (0/false) postbacks; anything else is a 422
      schema:
        type: string
        enum: ["1", "0", "true", "false"]
    postbackRedownload:
      name: redownload
      in: query
      description: >-
        SKAdNetwork's spelling of `conversion_type`: redownloads (1/true) or
        first installs (0/false). Matched on the protocol-neutral
        `conversion_type` column (`redownload` / `download`), so it selects
        AdAttributionKit rows too (they leave the raw `redownload` column
        `NULL`); prefer `conversion_type=redownload|download`, which says the
        same thing and can also select `re-engagement` — a kind this flag
        cannot name, and which `redownload=0` therefore excludes.
      schema:
        type: string
        enum: ["1", "0", "true", "false"]
    postbackCoarseConversionValue:
      name: coarse_conversion_value
      in: query
      schema:
        type: string
        enum: [low, medium, high]
    installMatchState:
      name: match_state
      in: query
      description: Only installs in this state
      schema:
        type: string
        enum: [attributed, organic, third_party, unavailable, pending_click, bad_token, foreign_click, implausible, outside_window, duplicate_click, pending_integrity, integrity_failed, integrity_unverified]
    postbackSignature:
      name: signature
      in: query
      description: >-
        Signature class. `valid`, `invalid` and `unverifiable` select on the
        trust bit the report keys on (`trusted` 1 / 0 / null);
        `development` selects rows verified against one of Apple's
        AdAttributionKit development keys whatever their trust bit. On the
        report, an explicit value switches `meta.trusted` to `as-filtered`.
      schema:
        type: string
        enum: [valid, invalid, unverifiable, development]
    postbackProtocol:
      name: protocol
      in: query
      description: Which framework delivered the postback; the shorthands `skan` and `aak` are accepted
      schema:
        type: string
        enum: [skadnetwork, adattributionkit, skan, aak]
    postbackConversionType:
      name: conversion_type
      in: query
      description: Protocol-neutral conversion kind (`re-engagement` exists only in AdAttributionKit)
      schema:
        type: string
        enum: [download, redownload, re-engagement]
    postbackAdInteractionType:
      name: ad_interaction_type
      in: query
      description: View-through or click-through
      schema:
        type: string
        enum: [view, click]

  # ─── Shared responses ───────────────────────────────────────────────

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"

    AppRateLimited:
      description: Per-source rate limit exceeded; retry after the indicated seconds
      headers:
        Retry-After:
          description: Seconds until the window resets
          schema:
            type: integer
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  retry_after_seconds:
                    type: integer

  # ─── Schemas ─────────────────────────────────────────────────────────

  schemas:
    # ── Common ─────────────────────────────────────────────────────────

    Error:
      type: object
      properties:
        error:
          type: string
        status:
          type: integer

    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: Validation failed
        status:
          type: integer
          example: 422
        field_errors:
          type: object
          additionalProperties:
            type: string
          example:
            aff_campaign_name: required

    Pagination:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    # ── Campaigns ──────────────────────────────────────────────────────

    Campaign:
      type: object
      properties:
        aff_campaign_id:
          type: integer
          readOnly: true
        aff_campaign_name:
          type: string
          maxLength: 255
        aff_campaign_url:
          type: string
          maxLength: 2048
        aff_campaign_url_2:
          type: string
          maxLength: 2048
        aff_campaign_url_3:
          type: string
          maxLength: 2048
        aff_campaign_url_4:
          type: string
          maxLength: 2048
        aff_campaign_url_5:
          type: string
          maxLength: 2048
        aff_campaign_payout:
          type: number
        aff_campaign_currency:
          type: string
          maxLength: 5
        aff_campaign_foreign_payout:
          type: number
        aff_network_id:
          type: integer
        aff_campaign_cloaking:
          type: integer
        aff_campaign_rotate:
          type: integer
        payout_mode:
          type: string
          enum: [replace, accumulate]
          description: >-
            How a click's conversions set its value. `replace` (default): the
            latest conversion's payout. `accumulate`: the sum of every
            conversion's payout (repeat purchases, subscriptions).
        identity_signals:
          type: string
          enum: ["0", "1"]
          description: >-
            "1" (default): this campaign's clicks carry first-party identity
            signals — the tracking domain's p202vid cookie, the landing page's
            p202lpid, and customer ids signed with the account's linking key —
            so multi-touch attribution can join them into one journey. "0":
            none are read or set, and every click is its own journey.
        app_registration_id:
          type: integer
          nullable: true
          description: >-
            The Android app registration this campaign's store links install
            (`GET /apps`; null or 0 unlinks). An install of another app on one
            of its clicks is `foreign_click`. Read raw: `"1e0"` or `1.5` is
            `422`, never cast, and an iOS registration is refused.
        aff_campaign_time:
          type: integer
          readOnly: true
          description: Unix timestamp, auto-set on create
        aff_campaign_id_public:
          type: integer
          readOnly: true
          description: Random public ID, auto-generated on create
        aff_campaign_deleted:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true

    IdentityKey:
      type: object
      properties:
        linking_key:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 32 bytes, hex. A signing secret; keep it on your server.
        algorithm:
          type: string
          example: HMAC-SHA256
        signs:
          type: string
          description: What the signature covers.
        parameter:
          type: string
          description: Where the signature goes.

    CampaignCreate:
      type: object
      required: [aff_campaign_name, aff_campaign_url]
      properties:
        aff_campaign_name:
          type: string
          maxLength: 255
        aff_campaign_url:
          type: string
