          example: "//track.example.com/"
        loader:
          type: string
          description: The script to put right above </body> of only the page visitors first arrive on
        aff_campaign_id:
          type: integer
          description: Simple page only — the campaign it links out to
        outbound_link:
          type: string
          description: Simple page only — Option 1, the outbound link (go.php?lpip=)
          example: "//track.example.com/tracking202/redirect/go.php?lpip=6122"
        outbound_php:
          type: string
          description: Simple page only — Option 2, a PHP redirect page (lp.php?lpip=, or the tracking202outbound cookie)
        outbound_javascript:
          type: string
          description: Simple page only — Option 3, a JavaScript redirect page
        offers:
          type: array
          description: Advanced page only — one per offer asked for, in order
          items:
            type: object
            properties:
              position:
                type: integer
              type:
                type: string
                enum: [campaign, rotator]
              id:
                type: integer
              public_id:
                type: integer
              name:
                type: string
              outbound_link:
                type: string
                example: "//track.example.com/tracking202/redirect/go.php?acip=3121"
              outbound_php:
                type: string
                description: A PHP redirect page to off.php (campaign) or offrtr.php (redirector)
        segments:
          type: object
          description: The elements the loader fills on the page (Dynamic Content Segments), name => what it shows
          additionalProperties:
            type: string

    PostbackCode:
      type: object
      properties:
        scheme:
          type: string
          enum: [http, https]
        base_url:
          type: string
          example: "https://track.example.com/tracking202/static/"
        amount:
          type: string
        subid:
          type: string
        campaign_id:
          type: integer
          nullable: true
        simple:
          type: object
          properties:
            pixel:
              type: string
              example: '<img height="1" width="1" border="0" style="display: none;" src="https://track.example.com/tracking202/static/gpx.php?amount=&subid={aff_sub}" />'
            postback_url:
              type: string
              example: "https://track.example.com/tracking202/static/gpb.php?amount={payout}&subid={aff_sub}"
        advanced:
          type: object
          properties:
            pixel:
              type: string
            postback_url:
              type: string
              example: "https://track.example.com/tracking202/static/gpb.php?amount={payout}&cid=12&subid={aff_sub}"
        universal:
          type: object
          properties:
            javascript:
              type: string
              description: The JavaScript smart pixel, with a <noscript> iframe fallback
            iframe:
              type: string

    PpcNetworkVariable:
      type: object
      properties:
        ppc_variable_id:
          type: integer
        ppc_network_id:
          type: integer
        name:
          type: string
          description: Shown in reports
        parameter:
          type: string
          description: The link's parameter
          example: adid
        placeholder:
          type: string
          description: What the traffic source fills in
          example: "{ad_id}"

    PpcNetworkVariableWrite:
      type: object
      description: All three on create; any of them on update.
      properties:
        name:
          type: string
          maxLength: 255
        parameter:
          type: string
          maxLength: 255
          description: No whitespace, &, #, ?, = or control characters; not t202id
        placeholder:
          type: string
          maxLength: 255
          description: No whitespace, &, #, ? or control characters
      required: [name, parameter, placeholder]

    PpcAccountPixel:
      type: object
      properties:
        pixel_id:
          type: integer
        ppc_account_id:
          type: integer
        pixel_type_id:
          type: integer
          enum: [1, 2, 3, 4, 5, 6]
        pixel_type:
          type: string
          nullable: true
          example: Postback
        pixel_code:
          type: string
          example: "https://network.example/pb?click=[[subid]]&payout=[[payout]]"
        correction_url:
          type: string
          description: Postback pixels only; empty when there is none

    PpcAccountPixelWrite:
      type: object
      description: pixel_type_id and pixel_code on create; any field on update.
      properties:
        pixel_type_id:
          description: 1 Image, 2 Iframe, 3 Javascript, 4 Postback (server to server), 5 Raw, 6 Bot202 Facebook Pixel Assistant
          oneOf:
            - type: integer
            - type: string
              pattern: "^[1-9][0-9]{0,2}$"
        pixel_code:
          type: string
          maxLength: 65535
        correction_url:
          type: string
          maxLength: 2048
          description: Postback pixels only; "" removes it
