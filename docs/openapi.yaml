openapi: 3.0.3
info:
  title: Prosper202 API
  version: "3.0"
  description: |
    REST API for the Prosper202 affiliate tracking platform.

    ## Authentication
    All endpoints require a Bearer token except `GET /system/health`, the
    token-gated public `GET /attribution/schema`, and the SKAdNetwork postback
    receiver (see the SKAN tag):
    ```
    Authorization: Bearer <api_key>
    ```
    API keys are managed via the `/users/{id}/api-keys` endpoints.

    ## Pagination
    List endpoints return paginated results:
    ```json
    {
      "data": [...],
      "pagination": { "total": 100, "limit": 50, "offset": 0 }
    }
    ```

    ## API Key Scopes
    A key may carry a scope that attenuates it independently of the owning
    user's roles: `*` (full, the default), `read`, `write`, `stage`, or
    granular `<area>:read` / `<area>:write` / `<area>:stage` tokens
    (`write` implies `read` and `stage`). GET/HEAD
    requires `<area>:read`, everything else `<area>:write`; `/capabilities`
    and `/versions` stay readable by any valid key. A scoped key cannot
    create a key broader than itself. Denials are `403` naming the required
    scope. Advertised via `features.api_key_scopes`.

    ## Idempotent Creates
    Single POST creates across the operator surface (CRUD entities,
    conversions, rotators and rules, attribution models and exports, users)
    honor an optional `Idempotency-Key` header: a retry of the same request
    replays the recorded response (`idempotent_replay: true`) instead of
    creating a duplicate. A key is scoped to the caller and identifies one
    request, so reusing it for anything else — a changed body, or a
    different endpoint — is a `422`, not a second create. Not honored on
    API-key creation or the LTV write endpoints. Advertised via
    `features.create_idempotency`. Bulk-upsert endpoints continue to REQUIRE
    the header, and refuse a reused key the same way.

    ## Delete Dry-Run
    Every operator-surface DELETE accepts `dry_run=1` and returns a preview
    (record, soft/hard mode, cascade counts) without deleting. Fail-closed
    on unsupported endpoints. Advertised via `features.delete_dry_run`.

    ## Staged Writes
    `staged=1` on an operator-surface write records it as a proposal with a
    server-issued change id (202) instead of executing it. `/staged-changes`
    lists, shows, applies, and discards proposals; applying re-dispatches
    the recorded write so validation and authorization re-run against
    current state under the applier's credentials. The `stage` scope action
    mints propose-only keys. Fail-closed on unsupported endpoints;
    `staged` and `dry_run` are mutually exclusive. Advertised via
    `features.staged_writes`.

    ## SKAdNetwork (SKAN)
    The server is the developer-side SKAdNetwork endpoint: devices POST
    signed install-validation postbacks to
    `/.well-known/skadnetwork/report-attribution/` (site root, outside this
    base path), and `/attribution/*` serves the stored postbacks, an aggregate
    report with conversion-value decoding, the advertised-app registry, and
    the decoding rules. `GET /attribution/schema` is public and gated by an app's
    schema token instead of an API key, so an iOS build can fetch its
    conversion-value mapping at runtime. Advertised via `features.attribution_postbacks`;
    all `/attribution` routes live in the `attribution` scope area.

    ## Errors
    Error responses use a consistent format:
    ```json
    {
      "error": "Error message",
      "status": 422,
      "field_errors": { "field_name": "Reason" }
    }
    ```
    `field_errors` is only present on validation errors (422).
  contact:
    name: Prosper202
  license:
    name: Proprietary

servers:
  - url: /api/v3
    description: API v3 base path

security:
  - BearerAuth: []

tags:
  - name: System
    description: Health checks and diagnostics
  - name: Campaigns
    description: Affiliate campaign management
  - name: Affiliate Networks
    description: Affiliate network management
  - name: PPC Networks
    description: PPC network management
  - name: PPC Accounts
    description: PPC account management
  - name: Trackers
    description: Tracker management
  - name: Landing Pages
    description: Landing page management
  - name: Text Ads
    description: Text ad management
  - name: Clicks
    description: Click data (read-only)
  - name: Conversions
    description: Conversion tracking
  - name: Reports
    description: Performance reports
  - name: Rotators
    description: Traffic rotator and rule management
  - name: Attribution
    description: Multi-touch attribution — models, credit reports over visitor journeys, and the worker's queue
  - name: Users
    description: User, role, API key, and preference management
  - name: Attribution postbacks
    description: Apple SKAdNetwork install attribution — postback receiver, app registry, conversion-value rules, report, and the runtime schema

paths:
  # ─── System ──────────────────────────────────────────────────────────

  /system/health:
    get:
      tags: [System]
      summary: Health check
      description: Liveness probe. Does not require authentication.
      security: []
      operationId: systemHealth
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: healthy
                      timestamp:
                        type: integer
                        example: 1700000000
                      api_version:
                        type: string
                        example: v3

  /system/version:
    get:
      tags: [System]
      summary: System version info
      description: Returns Prosper202, PHP, and MySQL versions. Admin only.
      operationId: systemVersion
      responses:
        "200":
          description: Version information
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      prosper202_version:
                        type: string
                      php_version:
                        type: string
                      mysql_version:
                        type: string
                      api_version:
                        type: string
                        example: v3
        "403":
          $ref: "#/components/responses/Forbidden"

  /system/db-stats:
    get:
      tags: [System]
      summary: Database statistics
      description: Table row counts and total database size. Admin only.
      operationId: systemDbStats
      responses:
        "200":
          description: Database statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tables:
                        type: array
                        items:
                          type: object
                          properties:
                            table:
                              type: string
                            label:
                              type: string
                            rows_estimate:
                              type: integer
                      database_size_bytes:
                        type: integer
                      database_size_mb:
                        type: number
        "403":
          $ref: "#/components/responses/Forbidden"

  /system/cron:
    get:
      tags: [System]
      summary: Cron job status
      description: Current cron jobs and recent execution logs. Admin only.
      operationId: systemCron
      responses:
        "200":
          description: Cron status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      jobs:
                        type: array
                        items:
                          type: object
                          properties:
                            cronjob_type:
                              type: string
                            cronjob_time:
                              type: integer
                            last_run_human:
                              type: string
                      recent_logs:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            cronjob_type:
                              type: string
                            last_execution_time:
                              type: integer
                            duration:
                              type: integer
                            time_human:
                              type: string
        "403":
          $ref: "#/components/responses/Forbidden"

  /system/errors:
    get:
      tags: [System]
      summary: Recent system errors
      description: Recent MySQL error log entries. Admin only.
      operationId: systemErrors
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Error list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        mysql_error_id:
                          type: integer
                        mysql_error_time:
                          type: integer
                        mysql_error_message:
                          type: string
                        time_human:
                          type: string
        "403":
          $ref: "#/components/responses/Forbidden"

  /system/dataengine:
    get:
      tags: [System]
      summary: Data engine status
      description: Recent data engine jobs and pending dirty hours. Admin only.
      operationId: systemDataengine
      responses:
        "200":
          description: Data engine status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      recent_jobs:
                        type: array
                        items:
                          type: object
                          properties:
                            time_from:
                              type: integer
                            time_to:
                              type: integer
                            processing:
                              type: integer
                              description: "1 if currently processing, 0 otherwise"
                            processed:
                              type: integer
                              description: "1 if completed, 0 otherwise"
                            status:
                              type: string
                              enum: [pending, processing, completed]
                              description: Computed from processing/processed flags
                            time_from_human:
                              type: string
                            time_to_human:
                              type: string
                      pending_dirty_hours:
                        type: integer
        "403":
          $ref: "#/components/responses/Forbidden"

  # ─── Campaigns ───────────────────────────────────────────────────────

  /campaigns:
    get:
      tags: [Campaigns]
      summary: List campaigns
      operationId: listCampaigns
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: filter[aff_network_id]
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Paginated campaign list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Campaigns]
      summary: Create a campaign
      operationId: createCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignCreate"
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /campaigns/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Campaigns]
      summary: Get a campaign
      operationId: getCampaign
      responses:
        "200":
          description: Campaign details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Campaigns]
      summary: Update a campaign
      operationId: updateCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpdate"
      responses:
        "200":
          description: Campaign updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Campaigns]
      summary: Delete a campaign
      description: Soft delete (sets aff_campaign_deleted = 1).
      operationId: deleteCampaign
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Campaign deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Affiliate Networks ──────────────────────────────────────────────

  /aff-networks:
    get:
      tags: [Affiliate Networks]
      summary: List affiliate networks
      operationId: listAffNetworks
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated affiliate network list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffNetworkListResponse"
    post:
      tags: [Affiliate Networks]
      summary: Create an affiliate network
      operationId: createAffNetwork
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AffNetworkCreate"
      responses:
        "201":
          description: Network created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffNetworkResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /aff-networks/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Affiliate Networks]
      summary: Get an affiliate network
      operationId: getAffNetwork
      responses:
        "200":
          description: Network details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffNetworkResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Affiliate Networks]
      summary: Update an affiliate network
      operationId: updateAffNetwork
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AffNetworkUpdate"
      responses:
        "200":
          description: Network updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AffNetworkResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Affiliate Networks]
      summary: Delete an affiliate network
      description: Soft delete.
      operationId: deleteAffNetwork
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Network deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── PPC Networks ───────────────────────────────────────────────────

  /ppc-networks:
    get:
      tags: [PPC Networks]
      summary: List PPC networks
      operationId: listPpcNetworks
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated PPC network list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PpcNetworkListResponse"
    post:
      tags: [PPC Networks]
      summary: Create a PPC network
      operationId: createPpcNetwork
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PpcNetworkCreate"
      responses:
        "201":
          description: Network created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PpcNetworkResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /ppc-networks/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [PPC Networks]
      summary: Get a PPC network
      operationId: getPpcNetwork
      responses:
        "200":
          description: Network details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PpcNetworkResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [PPC Networks]
      summary: Update a PPC network
      operationId: updatePpcNetwork
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PpcNetworkUpdate"
      responses:
        "200":
          description: Network updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PpcNetworkResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [PPC Networks]
      summary: Delete a PPC network
      description: Soft delete.
      operationId: deletePpcNetwork
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Network deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── PPC Accounts ───────────────────────────────────────────────────

  /ppc-accounts:
    get:
      tags: [PPC Accounts]
      summary: List PPC accounts
      operationId: listPpcAccounts
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated PPC account list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PpcAccountListResponse"
    post:
      tags: [PPC Accounts]
      summary: Create a PPC account
      operationId: createPpcAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PpcAccountCreate"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PpcAccountResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /ppc-accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [PPC Accounts]
      summary: Get a PPC account
      operationId: getPpcAccount
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PpcAccountResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [PPC Accounts]
      summary: Update a PPC account
      operationId: updatePpcAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PpcAccountUpdate"
      responses:
        "200":
          description: Account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PpcAccountResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [PPC Accounts]
      summary: Delete a PPC account
      description: Soft delete.
      operationId: deletePpcAccount
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Account deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Trackers ────────────────────────────────────────────────────────

  /trackers:
    get:
      tags: [Trackers]
      summary: List trackers
      operationId: listTrackers
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated tracker list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackerListResponse"
    post:
      tags: [Trackers]
      summary: Create a tracker
      operationId: createTracker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackerCreate"
      responses:
        "201":
          description: Tracker created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackerResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /trackers/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Trackers]
      summary: Get a tracker
      operationId: getTracker
      responses:
        "200":
          description: Tracker details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackerResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Trackers]
      summary: Update a tracker
      operationId: updateTracker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackerUpdate"
      responses:
        "200":
          description: Tracker updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackerResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Trackers]
      summary: Delete a tracker
      description: Hard delete (trackers do not use soft delete).
      operationId: deleteTracker
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Tracker deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /trackers/{id}/url:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Trackers]
      summary: Get tracking URL
      description: Returns the tracking URL and parameter template for this tracker.
      operationId: getTrackerUrl
      responses:
        "200":
          description: Tracking URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tracker_id:
                        type: integer
                      tracker_id_public:
                        type: integer
                      direct_url:
                        type: string
                        description: Full tracking URL with t202id parameter
                      tracking_params:
                        type: string
                        description: Query parameter template
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Landing Pages ──────────────────────────────────────────────────

  /landing-pages:
    get:
      tags: [Landing Pages]
      summary: List landing pages
      operationId: listLandingPages
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated landing page list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandingPageListResponse"
    post:
      tags: [Landing Pages]
      summary: Create a landing page
      operationId: createLandingPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LandingPageCreate"
      responses:
        "201":
          description: Landing page created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandingPageResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /landing-pages/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Landing Pages]
      summary: Get a landing page
      operationId: getLandingPage
      responses:
        "200":
          description: Landing page details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandingPageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Landing Pages]
      summary: Update a landing page
      operationId: updateLandingPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LandingPageUpdate"
      responses:
        "200":
          description: Landing page updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandingPageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Landing Pages]
      summary: Delete a landing page
      description: Soft delete.
      operationId: deleteLandingPage
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
