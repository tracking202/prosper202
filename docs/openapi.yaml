          $ref: '#/components/responses/ValidationError'

  /ltv/revenue:
    post:
      tags:
      - LTV
      summary: Record a revenue event
      description: Needs the `ltv:write` scope. LTV writes do not honor `Idempotency-Key` (`POST /ltv/revenue` takes
        an `idempotency_key` field instead) and have no `dry_run` preview. A clickless revenue event (an ESP order,
        a membership charge). Refunds and chargebacks are stored negative; renewals go through `/ltv/subscriptions`.
      operationId: ltvRecordRevenue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_type:
                  type: string
                  enum:
                  - purchase
                  - one_time
                  - refund
                  - chargeback
                  - adjustment
                  default: purchase
                amount:
                  type: number
                currency:
                  type: string
                  description: Defaults to the account currency
                occurred_at:
                  type: integer
                items:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                idempotency_key:
                  type: string
                external_ref:
                  type: string
                transaction_id:
                  type: string
                customer_id:
                  type: integer
                customer_ref:
                  type: string
                customer_ref_type:
                  type: string
                  description: What customer_ref is (email, external id, …)
              required:
              - amount
              additionalProperties: true
      responses:
        '201':
          description: 'Recorded (`duplicate: false`)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '200':
          description: 'A replay of the same `idempotency_key` (`duplicate: true`)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

