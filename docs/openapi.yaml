  # ─── Clicks ──────────────────────────────────────────────────────────

  /clicks:
    get:
      tags: [Clicks]
      summary: List clicks
      description: Read-only access to click data with filtering.
      operationId: listClicks
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/period"
        - $ref: "#/components/parameters/windowFrom"
        - $ref: "#/components/parameters/windowTo"
        - $ref: "#/components/parameters/filterCampaign"
        - $ref: "#/components/parameters/filterAffNetwork"
        - $ref: "#/components/parameters/filterPpcAccount"
        - $ref: "#/components/parameters/filterPpcNetwork"
        - $ref: "#/components/parameters/filterLandingPage"
        - $ref: "#/components/parameters/filterCountry"
        - $ref: "#/components/parameters/filterTextAd"
        - $ref: "#/components/parameters/filterRegion"
        - $ref: "#/components/parameters/filterIsp"
        - $ref: "#/components/parameters/filterBrowser"
        - $ref: "#/components/parameters/filterPlatform"
        - $ref: "#/components/parameters/filterDeviceType"
        - $ref: "#/components/parameters/filterMethodOfPromotion"
        - $ref: "#/components/parameters/filterShow"
        - $ref: "#/components/parameters/filterKeyword"
        - $ref: "#/components/parameters/filterIp"
        - $ref: "#/components/parameters/filterReferer"
        - name: click_lead
          in: query
          description: "0 = clicks only, 1 = conversions only"
          schema:
            type: integer
            enum: [0, 1]
        - name: click_bot
          in: query
          description: "0 = human, 1 = bot"
          schema:
            type: integer
            enum: [0, 1]
      responses:
        "200":
          description: Paginated click list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClickListResponse"

  /clicks/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Clicks]
      summary: Get a click
      description: Full click details including geo, device, and custom variable lookups.
      operationId: getClick
      responses:
        "200":
          description: Click details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClickResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /clicks/{id}/conversions:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Clicks]
      summary: Explain a click's value, conversion by conversion
      description: |
        Every conversion row of the click, oldest first — counted, unpaid,
        superseded, deleted and reversals alike — with its amount, what
        produced it (`source`) and what that is (`linked_to`: a goal and
        version, a revenue upload, the conversion a reversal nets, or the
        API key that wrote it, named by when it was created and never by its
        value), its transaction id and time, and whether it counts toward the
        click's value (`counted`), with the reason when it does not
        (`not_counted_reason`: `deleted`, `unpaid`, `superseded` with its
        `superseded_reason`, or `not_netted` for a reversal whose sale does
        not count) and a sentence saying so (`explanation`). No stored row
        is a duplicate: a repeat of a conversion is answered as one and never
        stored.

        `click` holds the value the reports show (`click_payout`, `lead`)
        beside the value the counted rows add up to (`ledger_value`), and
        `matches_click` says whether they agree. A click that converted
        before the conversion ledger and has had no conversion since is
        `ledger_state: pre_ledger`: its value is its own figure until its
        next conversion carries it in as a `legacy_baseline` row, and it
        matches by definition.

        Needs read scope on both `clicks` and `conversions`. Not paged: a
        click's rows are all returned.
      operationId: getClickConversions
      responses:
        "200":
          description: The click's conversions and its value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClickConversionsResponse"
        "403":
          description: The key lacks `clicks:read` or `conversions:read`.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: |
            A row of the click cannot be read by the ledger (an unknown
            source, an amount that is not a number); the message names it.

  # ─── Conversions ─────────────────────────────────────────────────────

  /conversions:
    get:
      tags: [Conversions]
      summary: List conversions
      operationId: listConversions
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: campaign_id
          in: query
          description: Only this campaign's conversions. Anything but a positive id (0 included) is a 422 naming campaign_id.
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/windowFrom"
        - $ref: "#/components/parameters/windowTo"
        - name: click_id
          in: query
          description: |
            Only this click's conversions. `GET /clicks/{id}/conversions`
            also says which of them count toward the click and why not.
          schema:
            type: integer
            minimum: 1
        - name: source
          in: query
          description: Only conversions this source produced.
          schema:
            $ref: "#/components/schemas/ConversionSource"
        - name: goal
          in: query
          description: Only this goal's outcomes, under every version of it.
          schema:
            type: integer
            minimum: 1
      description: |
        Live (not deleted) conversions, newest first, with their provenance.
        A filter value that cannot be read (`click_id=7x`, an unknown
        `source`) is a 422 naming the field, never ignored.
      responses:
        "200":
          description: Paginated conversion list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionListResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Conversions]
      summary: Create a conversion
      description: |
        Records a conversion for an existing click. The click must exist and
        belong to the authenticated user. The conversion is a row in the
        click's conversion ledger; the click's lead flag and value are then
        derived from all of its rows under the campaign's payout mode
        (`replace`: the latest conversion is the value; `accumulate`: the
        conversions add up).

        A repeated `transaction_id` on the same click is the same conversion:
        nothing is written, and the existing one is returned with
        `duplicate: true` beside `data` (absent when the conversion is new;
        the status stays `201`, as for an `idempotent_replay`). With no
        `transaction_id`, an `accumulate` campaign records one plain
        conversion per click (a repeat is a duplicate), and a `replace`
        campaign records a row each time.

        A deleted conversion keeps its place in the click's ledger, so a
        conversion that repeats one — the same `transaction_id`, the same
        reversal, or an `accumulate` click's plain conversion — is not
        recorded again: it is a `409` naming the deleted conversion
        (`details.conv_id`, `details.deleted: true`), nothing is written, and
        an `Idempotency-Key` sent with it is not spent.

        `status: "reversed"` with the `transaction_id` of an earlier
        conversion records a reversal that nets against it (a $3 sale
        reversed is $0). A sale can be reversed once: a second reversal with a
        different `reversal_id` is a 422 naming the first, and a reversal of a
        transaction id the click does not have is a 404.
      operationId: createConversion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversionCreate"
      responses:
        "201":
          description: Conversion created, or the existing one it repeats (`duplicate`)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ConversionResponse"
                  - type: object
                    properties:
                      duplicate:
                        type: boolean
                        description: |
                          Present (`true`) only when the click already had this
                          conversion: `data` is that conversion and nothing was
                          written.
                      idempotent_replay:
                        type: boolean
                        description: Present (`true`) when the response is an `Idempotency-Key` replay.
        "409":
          description: |
            Either the conversion repeats one that was deleted (its ledger key
            stays on the click), so it is not recorded again and nothing was
            written; only this case carries `details.deleted: true`. Or the
            `Idempotency-Key` is held by a request still in flight (retry once
            it completes), or by one that did not finish (whether it wrote is
            unknown: check, then retry with a new key). Those carry no
            `details`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      details:
                        type: object
                        properties:
                          conv_id:
                            type: integer
                            description: The deleted conversion.
                          click_id:
                            type: integer
                          deleted:
                            type: boolean
                            enum: [true]
        "422":
          $ref: "#/components/responses/ValidationError"

  /conversions/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Conversions]
      summary: Get a conversion
      operationId: getConversion
      responses:
        "200":
          description: Conversion details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Conversions]
      summary: Delete a conversion
      description: Soft delete (sets deleted = 1).
      operationId: deleteConversion
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Conversion deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Update (the UI's Update section) ────────────────────────────────

  /clicks/cpc:
    post:
      tags: [Update]
      summary: Set what a set of past clicks cost (Update CPC)
      description: |
        The Update CPC page as one call in two steps. The clicks are the
        account's clicks made between `from` 00:00:00 and `to` 23:59:59 in
        the account's time zone (`user_timezone`; answered as `timezone`),
        narrowed by any of the id filters (0 or absent: every one) and by
        `method_of_promotion`. Every filter id must be the account's: another
        account's id is a 422, never widened to "every".

        **Check** with `?dry_run=1`: nothing is written, and the answer counts
        the clicks (`matching`) and names the highest click id among them
        (`through_click_id`). **Update** by sending the same body with
        `expect_clicks` (the check's `matching`) and `through_click_id`: in
        one transaction the clicks up to that id are counted again under a
        lock, and only if they still number `expect_clicks` is every one of
        them set to `cpc`, with the data engine's dirty hours and the
        attribution rollup marked. A click recorded after the check (a higher
        id) is never changed. When the count moved, nothing is written and the
        answer is a `409` whose `details` carry the new `matching` and
        `through_click_id` to confirm. A write without `expect_clicks` and
        `through_click_id` is a `422`.

        Needs the role permission `access_to_update_section` (as the page
        does) and `clicks:write` scope, for the check too. Not stageable
        (`?staged=1` is a `422`). Unknown fields are refused, so a misspelled
        filter cannot widen the update.
      operationId: updateClickCpc
      parameters:
        - $ref: "#/components/parameters/writeDryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClickCpcUpdate"
      responses:
        "200":
          description: "The check (`dry_run: true`), or the update made"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClickCpcUpdateResponse"
        "403":
          description: The role lacks `access_to_update_section`, or the key lacks `clicks:write`.
        "409":
          description: |
            The selection no longer counts `expect_clicks`; nothing was
            written. `details`: `expect_clicks` (what was confirmed),
            `matching` and `through_click_id` (the check again, to confirm).
            Also the account's stored time zone is not one the server knows.
        "422":
          $ref: "#/components/responses/ValidationError"

  /conversions/subids:
    post:
      tags: [Update]
      summary: Mark subids converted (Update Subids)
      description: |
        Each subid's click is recorded as converted at its campaign's
        payout, through the conversion ledger (`source: subid_upload`), once
        per click: a click that is already a lead is answered
        `already_converted` and nothing is added, so sending the same list
        twice is safe. A converting click is no longer filtered.

        Every item is reported in `lines` with its 1-based position in the
        list (blank items skipped, but counted in positions): `marked`
        (`would_mark` in a dry run), `already_converted`, `not_found` (no
        click of this account), `not_a_subid` (not a click id: digits, no
        leading zero) or `duplicate_in_list` (`first_line` names the earlier
        item). The counts name every status, 0 included.

        A dry run reads each click's lead flag; the ledger can still answer
        `already_converted` for a click it calls `would_mark` — one in an
        accumulate-mode campaign whose conversion was deleted, since a deleted
        conversion keeps its place.

        Needs `access_to_update_section` and `conversions:write`. At most
        5,000 subids per request. Not stageable. Each click is its own
        transaction: if one fails, the clicks before it stay marked and the
        answer is a `500` saying how many and that sending the list again is
        safe.
      operationId: markSubidsConverted
      parameters:
        - $ref: "#/components/parameters/writeDryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubidList"
      responses:
        "200":
          description: Every subid's outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubidMarkResponse"
        "403":
          description: The role lacks `access_to_update_section`, or the key lacks `conversions:write`.
        "422":
          $ref: "#/components/responses/ValidationError"

  /conversions/subids/delete:
    post:
      tags: [Update]
      summary: Delete subids (Delete Subids)
      description: |
        The reverse of marking: every live conversion of each subid's click is
        cleared through the ledger (soft-deleted, its revenue voided, the
        click's value recomputed, so it is no longer a lead), and the click is
        no longer filtered. The click itself stays. A subid of another
        account is left alone (`not_found`). Statuses as for
        `POST /conversions/subids`, with `cleared` (`would_clear` in a dry
        run, where each line also carries `conversions`, its live
        conversions, and the answer their total).

        Needs `access_to_update_section` **and** `delete_individual_subids`
        (the page's two permissions; a Campaign manager has the first only),
        and `conversions:write`. At most 5,000 subids per request. Not
        stageable. Sending the same list twice is safe.
      operationId: deleteSubids
      parameters:
        - $ref: "#/components/parameters/writeDryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubidList"
      responses:
        "200":
          description: Every subid's outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubidDeleteResponse"
        "403":
          description: The role lacks `access_to_update_section` or `delete_individual_subids`, or the key lacks `conversions:write`.
        "422":
          $ref: "#/components/responses/ValidationError"

  /conversions/subids/reset:
    post:
      tags: [Update]
      summary: Reset a category's or a campaign's subids (Reset Campaign Subids)
      description: |
        Clears every conversion of the category (`aff_network_id`, required),
        or of one campaign in it (`aff_campaign_id`), so a report uploaded by
        mistake can be uploaded again: each converted click (a lead, or one
        holding a live conversion) is cleared through the ledger, and the
        data engine is told to rebuild the hours from the earliest of them
        to now. Clicks stay. Both ids must be the account's, and the campaign
        in the category. A dry run counts the clicks (`matching`).

        Needs `access_to_update_section` and `conversions:write`. Not
        stageable. Sending it again is safe: it clears what is left.
      operationId: resetSubids
      parameters:
        - $ref: "#/components/parameters/writeDryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubidReset"
      responses:
        "200":
          description: How many clicks were (or would be) cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubidResetResponse"
        "403":
          description: The role lacks `access_to_update_section`, or the key lacks `conversions:write`.
        "422":
          $ref: "#/components/responses/ValidationError"

  /conversions/uploads:
    post:
      tags: [Update]
      summary: Upload a network's revenue report (Upload Revenue Reports)
      description: |
        Every line of the CSV is recorded as a conversion of a new upload
        batch on its subid's click (`source: revenue_upload`), at the line's
        commission: a click's lines in one report are summed, and the newest
        report replaces what earlier reports and conversions set for that
        click, so uploading a corrected report fixes the old one. The lines
        write no LTV purchase and emit no conversion event.

        The columns are named by 0-based index or by header (case is
        ignored); either may be left out when the header names it plainly
        (subid: `sub id`, `click id`, `t202…`, `aff_sub`, `sid`; commission:
        `commission`, `payout`, `revenue`, `amount`, `earning`, `sale`,
        `income`), and `columns.guessed` says which were. The first line is
        read as the header when its subid cell is not a click id. Every line
        is accounted for, as the page accounts for it: `recorded`
        (`would_record`) counts the recorded lines and `totals` sums them per
        click, and `lines` lists each line that was not recorded — `skipped`
        with the reason, or the `header`.

        Needs `access_to_update_section` and `conversions:write`. The body
        may be up to 8 MB (every other route takes 1 MB). Not stageable.
        Each line is its own transaction: if one fails, the lines before it
        stand as rows of the batch and the answer is a `500` naming the batch
        and saying that uploading the report again is safe.
      operationId: uploadRevenueReport
      parameters:
        - $ref: "#/components/parameters/writeDryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevenueUpload"
      responses:
        "200":
          description: The batch and every line's outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueUploadResponse"
        "403":
          description: The role lacks `access_to_update_section`, or the key lacks `conversions:write`.
        "413":
          description: The body is over 8 MB.
        "422":
          $ref: "#/components/responses/ValidationError"

  # ─── Reports ─────────────────────────────────────────────────────────

  /reports/summary:
    get:
      tags: [Reports]
      summary: Performance summary
      description: >-
        Aggregate metrics for the selected time period and filters. Every
        report endpoint takes the Analyze pages' filters, which combine; a
        parameter the endpoint does not take, a list where one value goes, or
        a value outside a filter's form is a 422 whose `field_errors` names
        the parameter (they used to be ignored, and the answer covered
        everything).
      operationId: reportSummary
      parameters:
        - $ref: "#/components/parameters/period"
        - $ref: "#/components/parameters/windowFrom"
        - $ref: "#/components/parameters/windowTo"
        - $ref: "#/components/parameters/filterCampaign"
        - $ref: "#/components/parameters/filterAffNetwork"
        - $ref: "#/components/parameters/filterPpcAccount"
        - $ref: "#/components/parameters/filterPpcNetwork"
        - $ref: "#/components/parameters/filterLandingPage"
        - $ref: "#/components/parameters/filterCountry"
        - $ref: "#/components/parameters/filterTextAd"
        - $ref: "#/components/parameters/filterRegion"
        - $ref: "#/components/parameters/filterIsp"
        - $ref: "#/components/parameters/filterBrowser"
        - $ref: "#/components/parameters/filterPlatform"
        - $ref: "#/components/parameters/filterDeviceType"
        - $ref: "#/components/parameters/filterMethodOfPromotion"
        - $ref: "#/components/parameters/filterShow"
        - $ref: "#/components/parameters/filterKeyword"
        - $ref: "#/components/parameters/filterIp"
        - $ref: "#/components/parameters/filterReferer"
      responses:
        "200":
          description: Summary metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReportMetrics"
        "422":
          $ref: "#/components/responses/ValidationError"

  /reports/groups:
    get:
      tags: [Reports]
      summary: Group Overview
      description: Traffic grouped by up to four breakdown dimensions, nested, every group with
        its totals. A group is the sum of its children; the clicks a level has no value for are
        its child with `id` and `name` null, listed last. More than 5,000 innermost groups is a 422.
      operationId: reportGroups
      parameters:
        - name: by
          in: query
          required: true
          description: One to four breakdown dimensions, comma separated, outermost first, each once
          schema:
            type: string
            example: ppc_network,campaign,keyword
        - name: sort
          in: query
          description: "`name` (default) or a metric"
          schema:
            type: string
        - name: sort_dir
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
        - $ref: "#/components/parameters/period"
        - $ref: "#/components/parameters/windowFrom"
        - $ref: "#/components/parameters/windowTo"
        - $ref: "#/components/parameters/filterCampaign"
        - $ref: "#/components/parameters/filterAffNetwork"
        - $ref: "#/components/parameters/filterPpcAccount"
        - $ref: "#/components/parameters/filterPpcNetwork"
        - $ref: "#/components/parameters/filterLandingPage"
        - $ref: "#/components/parameters/filterCountry"
        - $ref: "#/components/parameters/filterTextAd"
        - $ref: "#/components/parameters/filterRegion"
        - $ref: "#/components/parameters/filterIsp"
        - $ref: "#/components/parameters/filterBrowser"
        - $ref: "#/components/parameters/filterPlatform"
        - $ref: "#/components/parameters/filterDeviceType"
        - $ref: "#/components/parameters/filterMethodOfPromotion"
        - $ref: "#/components/parameters/filterShow"
        - $ref: "#/components/parameters/filterKeyword"
        - $ref: "#/components/parameters/filterIp"
        - $ref: "#/components/parameters/filterReferer"
      responses:
        "200":
          description: The groups as a tree (`data`, each with `children` but the innermost), `totals`, and `by`
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  totals:
                    type: object
                    additionalProperties: true
                  by:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /reports/breakdown:
    get:
      tags: [Reports]
      summary: Performance breakdown
      description: >-
        Performance metrics grouped by a dimension. Rows are ordered by `sort`,
        then by `id` ascending, so rows tied on the sort column (many with 0
        clicks) keep one order across requests. Over unchanged data, paging
        with `offset` neither skips nor repeats a row; a rolling `period`
        moves with the clock and new traffic changes the sort values, so page
        a fixed `time_from`/`time_to` window for a consistent read.

        Each row is one stored value of the dimension; clicks with no value
        for it (no referer, no c1, not matched by a rotator rule) are in the
        summary and in no row. `ip` is the visitor's address (IPv6 decoded),
        `referer` the referring domain, `referer_url` the whole URL,
        `device_type` Desktop/Mobile/Tablet/Bot, `rotator_rule` the rule that
        matched (its rows also carry `rotator_id`). Names of visitor-authored
        dimensions (keyword, city, region, isp, browser, platform, device,
        ip, referer, referer_url, c1-c4, utm_*) are sanitized on the way out.
      operationId: reportBreakdown
      parameters:
        - name: breakdown
          in: query
          required: true
          description: Dimension to group by
          schema:
            type: string
            enum:
              - campaign
              - aff_network
              - ppc_account
              - ppc_network
              - landing_page
              - keyword
              - country
              - city
              - region
              - browser
              - platform
              - device
              - isp
              - text_ad
              - ip
              - referer
              - referer_url
              - device_type
              - c1
              - c2
              - c3
              - c4
              - utm_source
              - utm_medium
              - utm_campaign
              - utm_term
              - utm_content
              - rotator
              - rotator_rule
        - name: sort
          in: query
          description: Any metric a row carries; anything else is a 422 naming them.
          schema:
            type: string
            default: total_clicks
            enum:
              - total_clicks
              - total_click_throughs
              - total_leads
              - total_income
              - total_cost
              - total_net
              - epc
              - avg_cpc
              - conv_rate
              - roi
              - cpa
        - name: sort_dir
          in: query
          description: Either case; anything else is a 422.
          schema:
            type: string
            default: DESC
            enum: [ASC, DESC]
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/period"
        - $ref: "#/components/parameters/windowFrom"
        - $ref: "#/components/parameters/windowTo"
        - $ref: "#/components/parameters/filterCampaign"
        - $ref: "#/components/parameters/filterAffNetwork"
        - $ref: "#/components/parameters/filterPpcAccount"
        - $ref: "#/components/parameters/filterPpcNetwork"
        - $ref: "#/components/parameters/filterLandingPage"
        - $ref: "#/components/parameters/filterCountry"
        - $ref: "#/components/parameters/filterTextAd"
        - $ref: "#/components/parameters/filterRegion"
        - $ref: "#/components/parameters/filterIsp"
        - $ref: "#/components/parameters/filterBrowser"
        - $ref: "#/components/parameters/filterPlatform"
        - $ref: "#/components/parameters/filterDeviceType"
        - $ref: "#/components/parameters/filterMethodOfPromotion"
        - $ref: "#/components/parameters/filterShow"
        - $ref: "#/components/parameters/filterKeyword"
        - $ref: "#/components/parameters/filterIp"
        - $ref: "#/components/parameters/filterReferer"
      responses:
        "200":
          description: Breakdown results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                              nullable: true
                              description: Null only for an `ip` whose IPv6 row is gone.
                            rotator_id:
                              type: integer
                              description: "`rotator_rule` rows only: the rule's rotator."
                        - $ref: "#/components/schemas/ReportMetrics"
                  breakdown:
                    type: string
                  available_breakdowns:
                    type: array
                    items:
                      type: string
        "422":
          $ref: "#/components/responses/ValidationError"

  /reports/timeseries:
    get:
      tags: [Reports]
      summary: Performance timeseries
      description: >-
        Performance metrics aggregated by time interval, oldest bucket first,
        at most `limit` (2000) buckets per response. When the window holds
        more, `truncated` is true and the newest buckets are the ones left
        out: narrow `time_from`/`time_to`, or use a coarser `interval`.
        Buckets are the account's hours, days, ISO weeks and months, in the
        zone `timezone` names.
      operationId: reportTimeseries
      parameters:
        - name: interval
          in: query
          schema:
            type: string
            default: day
            enum: [hour, day, week, month]
        - $ref: "#/components/parameters/period"
        - $ref: "#/components/parameters/windowFrom"
        - $ref: "#/components/parameters/windowTo"
        - $ref: "#/components/parameters/filterCampaign"
        - $ref: "#/components/parameters/filterAffNetwork"
        - $ref: "#/components/parameters/filterPpcAccount"
        - $ref: "#/components/parameters/filterPpcNetwork"
        - $ref: "#/components/parameters/filterLandingPage"
        - $ref: "#/components/parameters/filterCountry"
        - $ref: "#/components/parameters/filterTextAd"
        - $ref: "#/components/parameters/filterRegion"
        - $ref: "#/components/parameters/filterIsp"
        - $ref: "#/components/parameters/filterBrowser"
        - $ref: "#/components/parameters/filterPlatform"
        - $ref: "#/components/parameters/filterDeviceType"
        - $ref: "#/components/parameters/filterMethodOfPromotion"
        - $ref: "#/components/parameters/filterShow"
        - $ref: "#/components/parameters/filterKeyword"
        - $ref: "#/components/parameters/filterIp"
        - $ref: "#/components/parameters/filterReferer"
      responses:
        "200":
          description: Timeseries data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        period:
                          type: string
                          description: Time bucket label (YYYY-MM-DD, YYYY-MM-DD HH:00, etc.)
                        total_clicks:
                          type: integer
                        total_click_throughs:
                          type: integer
                        total_leads:
                          type: integer
                        total_income:
                          type: number
                        total_cost:
                          type: number
                        total_net:
                          type: number
                        epc:
                          type: number
                        avg_cpc:
                          type: number
                        conv_rate:
                          type: number
                        roi:
                          type: number
                        cpa:
                          type: number
                  interval:
                    type: string
                  timezone:
                    type: string
                    description: >-
                      The zone the buckets are in: the account's
                      (202_users.user_timezone), or UTC when it has none.
                    example: America/New_York
                  truncated:
                    type: boolean
                    description: >-
                      True when more buckets matched than `limit`; `data` then
                      holds the oldest `limit` of them. Absent from servers
                      that predate it, which cut at 2000 without saying so.
                  limit:
                    type: integer
                    description: The most buckets one response carries (2000).
                    example: 2000
        "422":
          $ref: "#/components/responses/ValidationError"

  /reports/daypart:
    get:
      tags: [Reports]
      summary: Performance day-parting
      description: Performance metrics aggregated by hour-of-day (0-23).
      operationId: reportDaypart
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            default: hour_of_day
            enum:
              - hour_of_day
              - total_clicks
              - total_click_throughs
              - total_leads
              - total_income
              - total_cost
              - total_net
              - epc
              - avg_cpc
              - conv_rate
              - roi
              - cpa
        - name: sort_dir
          in: query
          schema:
            type: string
            default: ASC
            enum: [ASC, DESC]
        - $ref: "#/components/parameters/period"
        - $ref: "#/components/parameters/windowFrom"
        - $ref: "#/components/parameters/windowTo"
        - $ref: "#/components/parameters/filterCampaign"
        - $ref: "#/components/parameters/filterAffNetwork"
        - $ref: "#/components/parameters/filterPpcAccount"
        - $ref: "#/components/parameters/filterPpcNetwork"
        - $ref: "#/components/parameters/filterLandingPage"
        - $ref: "#/components/parameters/filterCountry"
        - $ref: "#/components/parameters/filterTextAd"
        - $ref: "#/components/parameters/filterRegion"
        - $ref: "#/components/parameters/filterIsp"
        - $ref: "#/components/parameters/filterBrowser"
        - $ref: "#/components/parameters/filterPlatform"
        - $ref: "#/components/parameters/filterDeviceType"
        - $ref: "#/components/parameters/filterMethodOfPromotion"
        - $ref: "#/components/parameters/filterShow"
        - $ref: "#/components/parameters/filterKeyword"
        - $ref: "#/components/parameters/filterIp"
        - $ref: "#/components/parameters/filterReferer"
      responses:
        "200":
          description: Day-parting rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        hour_of_day:
                          type: integer
                        total_clicks:
                          type: integer
                        total_click_throughs:
                          type: integer
                        total_leads:
                          type: integer
                        total_income:
                          type: number
                        total_cost:
                          type: number
                        total_net:
                          type: number
                        epc:
                          type: number
                        avg_cpc:
                          type: number
                        conv_rate:
                          type: number
                        roi:
                          type: number
                        cpa:
                          type: number
                  timezone:
                    type: string
        "422":
          $ref: "#/components/responses/ValidationError"

  # ─── Rotators ────────────────────────────────────────────────────────

  /rotators:
    get:
      tags: [Rotators]
      summary: List rotators
      operationId: listRotators
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated rotator list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotatorListResponse"
    post:
      tags: [Rotators]
      summary: Create a rotator
      operationId: createRotator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotatorCreate"
      responses:
        "201":
          description: Rotator created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotatorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /rotators/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Rotators]
      summary: Get a rotator
      description: Returns the rotator with all rules, criteria, and redirects.
      operationId: getRotator
      responses:
        "200":
          description: Rotator with rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotatorDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Rotators]
      summary: Update a rotator
      operationId: updateRotator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotatorUpdate"
      responses:
        "200":
          description: Rotator updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotatorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Rotators]
      summary: Delete a rotator
      description: Hard delete. Cascades to all rules, criteria, and redirects.
      operationId: deleteRotator
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Rotator deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /rotators/{id}/stats:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Rotators, Reports]
      summary: A rotator's report
      description: >-
        The Overview's Rotator Breakdown for one rotator: its totals, each of
        its rules (the rule a click matched, from 202_clicks_rotator) and its
        default (the clicks no rule matched), over the report window and
        filters. Every rule is listed, one without clicks at zero; a rule
        since deleted that still has clicks in the window follows with
        `rule_name: null, deleted: true`, so the rules and the default add up
        to the totals. Needs read scope on `rotators` and on `reports`.
      operationId: rotatorStats
      parameters:
        - $ref: "#/components/parameters/period"
        - $ref: "#/components/parameters/windowFrom"
        - $ref: "#/components/parameters/windowTo"
        - $ref: "#/components/parameters/filterCampaign"
        - $ref: "#/components/parameters/filterAffNetwork"
        - $ref: "#/components/parameters/filterPpcAccount"
        - $ref: "#/components/parameters/filterPpcNetwork"
        - $ref: "#/components/parameters/filterLandingPage"
        - $ref: "#/components/parameters/filterCountry"
        - $ref: "#/components/parameters/filterTextAd"
        - $ref: "#/components/parameters/filterRegion"
        - $ref: "#/components/parameters/filterIsp"
        - $ref: "#/components/parameters/filterBrowser"
        - $ref: "#/components/parameters/filterPlatform"
        - $ref: "#/components/parameters/filterDeviceType"
        - $ref: "#/components/parameters/filterMethodOfPromotion"
        - $ref: "#/components/parameters/filterShow"
        - $ref: "#/components/parameters/filterKeyword"
        - $ref: "#/components/parameters/filterIp"
        - $ref: "#/components/parameters/filterReferer"
      responses:
        "200":
          description: The rotator's figures
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      rotator:
                        type: object
                        properties:
                          id: {type: integer}
                          name: {type: string}
                      totals:
                        $ref: "#/components/schemas/ReportMetrics"
                      rules:
                        type: array
                        items:
                          allOf:
                            - type: object
                              properties:
                                rule_id: {type: integer}
                                rule_name: {type: string, nullable: true}
                                status: {type: integer, nullable: true}
                                deleted:
                                  type: boolean
                                  description: True for a rule since deleted that has clicks in the window
                            - $ref: "#/components/schemas/ReportMetrics"
                      default:
                        $ref: "#/components/schemas/ReportMetrics"
        "403":
          description: The key lacks `rotators:read` or `reports:read`.
        "404":
          description: The account has no rotator with this id.
        "422":
          $ref: "#/components/responses/ValidationError"

  /rotators/{id}/rules:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Rotators]
      summary: List rules for a rotator
      operationId: listRotatorRules
      responses:
        "200":
          description: Rules with criteria and redirects
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RotatorRule"
    post:
      tags: [Rotators]
      summary: Create a rule
      description: Creates a rule with optional criteria and redirects. Wrapped in a transaction.
      operationId: createRotatorRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotatorRuleCreate"
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/RotatorRule"
        "422":
          $ref: "#/components/responses/ValidationError"

  /rotators/{id}/rules/{ruleId}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
      - name: ruleId
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: [Rotators]
      summary: Update a rule
      description: >-
        Replaces the fields it sends among rule_name, splittest, status,
        criteria and redirects (any other field is a 422, and so is any key
        inside a criterion or redirect the endpoint does not take, named
        like `redirects.0.weigth`). A rule read with GET can be sent back
        whole: its id and rotator_id, and each entry's id, rotator_id,
        rule_id and auto_monetizer, are accepted with the rule's own values
        and refused with any other (an entry id must be one of this rule's;
        the entries are written afresh, so a body read before an earlier
        update names ids that are gone). A create refuses them. A redirect
        that carries the auto_monetizer it holds, and no destination, stays
        the auto-monetizer. PATCH is accepted as the same operation.
      operationId: updateRotatorRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotatorRuleCreate"
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/RotatorRule"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Rotators]
      summary: Delete a rule
      description: Hard delete. Cascades to criteria and redirects.
      operationId: deleteRotatorRule
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Rule deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Attribution ─────────────────────────────────────────────────────
  # Multi-touch attribution. Reads need the view_attribution_reports role
  # permission and model writes manage_attribution_models, on top of the
  # attribution:read / attribution:write key scope.

  /attribution/models:
    get:
      tags: [Attribution]
      summary: List attribution models
      description: Every account has exactly one default model (a last-touch model is created with the account). Credits are computed for every active model.
      operationId: listAttributionModels
      parameters:
        - name: type
          in: query
          description: Filter by model type
          schema:
            $ref: "#/components/schemas/AttributionModelType"
      responses:
        "200":
          description: The account's models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionModelListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Attribution]
      summary: Create an attribution model
      description: >-
        The attribution worker computes the new model's credits for existing
        conversions from their stored journeys (`recompute_pending` is true
        until it has). A lookback wider than a stored journey rebuilds that
        journey from the identity graph first. Honors `Idempotency-Key`.
      operationId: createAttributionModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributionModelCreate"
      responses:
        "201":
          description: Model created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionModelResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A model with the same name (slug) exists; the details name it.
        "422":
          $ref: "#/components/responses/ValidationError"

  /attribution/models/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Attribution]
      summary: Get an attribution model
      operationId: getAttributionModel
      responses:
        "200":
          description: Model details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionModelResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Attribution]
      summary: Update an attribution model
      description: >-
        Partial update. Changing model_type without sending weighting_config
        resets the config to the new type's defaults. A model cannot stop
        being the default (make another one the default instead), and the
        default cannot be deactivated. A change to what the model computes
        queues its recompute; deactivating it removes its credits.
      operationId: updateAttributionModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributionModelUpdate"
      responses:
        "200":
          description: Model updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionModelResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The new name collides with another model's.
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Attribution]
      summary: Delete an attribution model
      description: >-
        Hard delete of the model, its credits and its export jobs; campaigns
        that named it fall back to the account default. The default model
        cannot be deleted (409), nor a model one of whose export jobs is
        running (409, naming the jobs in `details.running_exports`; retry once they
        finish).
      operationId: deleteAttributionModel
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Model deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The model is the account default.

  /attribution/reports/breakdown:
    get:
      tags: [Attribution]
      summary: Attributed conversions, revenue, cost and ROI by a click dimension
      description: >-
        Credits for conversions whose conv_time is in range, grouped by a
        dimension of the credited clicks; clicks and cost from the
        dimension's own clicks whose click_time is in range; assisted
        conversions (journeys where the dimension had a touch before the
        converting click). With cohort=click, credits and assists are read
        by the click_time of the click they land on instead. Money values are exact decimal strings. Without
        model_id the report is "effective": each conversion under its
        campaign's model override when that model is active, otherwise the
        account default. With group_by=day a row's key is a date
        (YYYY-MM-DD) in the account's time zone, which meta.timezone names.
        Unknown parameters are refused.
      operationId: attributionBreakdown
      parameters:
        - name: group_by
          in: query
          schema:
            $ref: "#/components/schemas/AttributionDimension"
        - name: model_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: compare_model_id
          in: query
          description: A second model, returned side by side as compare_* columns.
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/attributionPeriod"
        - $ref: "#/components/parameters/attributionTimeFrom"
        - $ref: "#/components/parameters/attributionTimeTo"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          description: >-
            Rows to skip in the report's order (attributed revenue, then key), to read past
            the first `limit` rows. A whole number written without leading zeros; an offset
            past the end returns `data: []`. Page while offset + rows < meta.groups.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: cohort
          in: query
          description: >-
            conversion (default): credits and assists of the conversions made in the range,
            credited to clicks of any age (the Attribution page's view). click: credits and
            assists that land on clicks made in the range, for conversions at any time, so each
            row is what its own clicks in range earned against their cost. That is the
            population the classic reports count: last-touch credit in the click cohort is the
            classic row's revenue. A click cohort report is always computed in full (the
            rollup is kept by conversion hour). With group_by=day, credits and assists fall on
            the click's day.
          schema:
            type: string
            enum: [conversion, click]
            default: conversion
        - name: keys
          in: query
          description: >-
            Only these rows: 1 to 1000 row keys as data[].key returns them (a dimension id, 0 for
            none, a date under group_by=day), comma-separated, no spaces. Rows keep the report's
            order, meta.groups counts the matches, and totals still cover the whole report. The
            report is computed in full for every request (offset only slices it), so a reader
            that needs a few rows asks for them here instead of paging.
          schema:
            type: string
      responses:
        "200":
          description: One row per dimension value, sorted by attributed revenue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionBreakdownResponse"
        "409":
          description: The model named is inactive or invalid and has no credits; the message gives the reason.
        "422":
          $ref: "#/components/responses/ValidationError"

  /attribution/reports/journeys:
    get:
      tags: [Attribution]
      summary: Journey metrics
      description: Length distribution, time to convert, truncated and unidentified journeys, and the one-touch share by the converting click's browser, for conversions in range.
      operationId: attributionJourneyMetrics
      parameters:
        - $ref: "#/components/parameters/attributionPeriod"
        - $ref: "#/components/parameters/attributionTimeFrom"
        - $ref: "#/components/parameters/attributionTimeTo"
      responses:
        "200":
          description: Journey metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttributionJourneyMetrics"
                  meta:
                    type: object

  /attribution/conversions/{id}/journey:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Attribution]
      summary: One conversion's journey explained
      description: The touches (oldest first, converting click last), the identity signals each click carried, every model's credit per touch, and the conversion's place in the worker's queue if it is waiting.
      operationId: attributionConversionJourney
      responses:
        "200":
          description: The journey
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttributionConversionJourney"
        "404":
          $ref: "#/components/responses/NotFound"

  /attribution/queue:
    get:
      tags: [Attribution]
      summary: The attribution worker's backlog
      description: Conversions waiting to be attributed, failing ones with their last error and retry time, and identity merges and model changes not yet fanned out.
      operationId: attributionQueue
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: The backlog
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttributionQueue"

  /attribution/exports:
    get:
      tags: [Attribution]
      summary: List attribution exports
      description: The account's export jobs, newest first. Needs view_attribution_reports.
      operationId: listAttributionExports
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Export jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AttributionExport"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Attribution]
      summary: Queue an attribution export
      description: >-
        Queues a breakdown to be written as CSV by the export runner (the
        minutely cron), now or at run_at, with every group (no row limit; more
        than 50,000 groups fails the job with the reason). With webhook_url,
        the runner also POSTs the file there, signed: X-P202-Signature is
        sha256=<hex HMAC-SHA256 of "<X-P202-Timestamp>.<body>"> under the
        export's secret, which this response carries once. Webhook URLs must
        be https and every address the host resolves to must be public
        (private, loopback, link-local, metadata, documentation, multicast and
        reserved ranges are refused, IPv4 carried in IPv6 included); the
        check runs here and again at send time, the connection is pinned to
        the checked address, and redirects are not followed. Ids and times
        are JSON numbers; a string is refused, not cast. Needs
        view_attribution_reports. Honors `Idempotency-Key`.
      operationId: createAttributionExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributionExportInput"
      responses:
        "201":
          description: Queued. data.webhook_secret is present only here, only when the export has a webhook.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttributionExport"
        "409":
          description: The model named is inactive or invalid, or the account has no default model.
        "422":
          $ref: "#/components/responses/ValidationError"

  /attribution/exports/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Attribution]
      summary: Get an attribution export
      operationId: getAttributionExport
      responses:
        "200":
          description: The export job
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttributionExport"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Attribution]
      summary: Delete an attribution export and its file
      description: Refused (409) while the export is running.
      operationId: deleteAttributionExport
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Export and file deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The export is running.

  /attribution/exports/{id}/download:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Attribution]
      summary: Download an export's CSV
      description: >-
        The file the runner wrote: key, name, clicks, cost,
        attributed_conversions, attributed_revenue, roi, assisted_conversions,
        and compare_attributed_conversions, compare_attributed_revenue,
        compare_roi with a comparison model. Money and credit are exact
        decimals; a text cell starting with =, +, - or @ is prefixed with an
        apostrophe so a spreadsheet does not run it.
      operationId: downloadAttributionExport
      responses:
        "200":
          description: The CSV
          content:
            text/csv:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No file yet (the export has not run), or the file is no longer on disk.

  /attribution/exports/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    post:
      tags: [Attribution]
      summary: Queue a failed export again
      description: Resets its attempts; only a failed export can be retried (409 otherwise).
      operationId: retryAttributionExport
      responses:
        "200":
          description: Queued again
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttributionExport"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The export is not failed.

  # ─── Goals ───────────────────────────────────────────────────────────

  /goals:
    get:
      tags: [Goals]
      summary: List goals
      description: Live goals by default. Filter by owner with `campaign_id`, `registration_id` or `scope=account`.
      operationId: listGoals
      parameters:
        - {name: campaign_id, in: query, schema: {type: integer}, description: "Only this campaign's own goals"}
        - {name: registration_id, in: query, schema: {type: integer}, description: "Only this app registration's goals"}
        - {name: scope, in: query, schema: {type: string, enum: [campaign, registration, account]}}
        - {name: scope_id, in: query, schema: {type: integer}}
        - {name: include_archived, in: query, schema: {type: string, enum: ["0", "1"]}}
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated goals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalListResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Goals]
      summary: Create a goal (version 1)
      description: |
        The body is strict: an unknown field is a `422` naming it, and ids
        and amounts are read raw (`"1e3"` or `1.5` for an id is refused, not
        cast). The definition's format is in
        `documentation/api/22-goals.md`; every error names its path
        (`definition.threshold.count`). A campaign goal is payable on its
        campaign by default when its value is not `none` (`payable: false`
        tracks it only; `payout` overrides the value there). Goal names are
        unique per owner (`409`). `after` names live goals of the same owner
        only. Honors `Idempotency-Key`.
      operationId: createGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalCreate"
      responses:
        "201":
          description: Goal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalResponse"
        "409":
          description: A goal of this name already exists for this owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /goals/validate:
    post:
      tags: [Goals]
      summary: Validate a definition without saving it
      description: A read (`goals:read` suffices; never staged). Answers the canonical form, or `422` with every error by path.
      operationId: validateGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              properties:
                definition:
                  $ref: "#/components/schemas/GoalDefinition"
                goal_id:
                  type: integer
                  description: The goal's own id, so `after` may not name it
      responses:
        "200":
          description: The definition is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      valid: {type: boolean}
                      definition: {$ref: "#/components/schemas/GoalDefinition"}
                      plain_event: {type: boolean, description: "One event, no conditions, count 1, no after, no window, repeat once: the goal Setup › Mobile Apps makes from an event name"}
        "422":
          $ref: "#/components/responses/ValidationError"

  /goals/evaluate:
    post:
      tags: [Goals]
      summary: Evaluate definitions against events, writing nothing
      description: |
        The evaluator vectors' format (`tests/fixtures/app-sdk-contract/goals/README.md`):
        `{goals, subject, events}` in, `{outcomes, disabled, progress}` out. A
        goal may be `{goal_id, definition}` (one version effective from 0) or
        `{goal_id, versions, starts_at?, ends_at?}`. At most 50 goals and
        1000 events, and an answer of at most 10,000 outcomes: an evaluation
        that reaches more is refused (`422`, field `events`) as soon as it
        passes the budget. An event's `revenue` is at most ±999999.99999
        (`422` naming `events.<i>.revenue`, the event by its position). A read (`goals:read` suffices;
        never staged).
      operationId: evaluateGoals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goals, subject, events]
              properties:
                goals: {type: array, items: {type: object}}
                subject: {type: object}
                events: {type: array, items: {type: object}}
      responses:
        "200":
          description: The evaluation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      outcomes: {type: array, items: {$ref: "#/components/schemas/GoalEvaluatedOutcome"}}
                      disabled: {type: array, items: {type: object}}
                      progress: {type: array, items: {type: object}}
        "422":
          $ref: "#/components/responses/ValidationError"

  /goals/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Goals]
      summary: Get a goal
      description: The current definition, the campaigns paying for it and its live outcome count.
      operationId: getGoal
      responses:
        "200":
          description: The goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Goals]
      summary: Edit a goal (a new version)
      description: |
        `{"definition": …}` — the whole new definition. A definition whose
        canonical form differs from the current one is a new version
        (`version_created: true`), effective from now: events received from
        now on are evaluated under it, and conversions already recorded keep
        the version that produced them until a re-evaluation. An archived
        goal is a `409`. A goal an SKAN encoding names, or one an encoded
        goal waits for in `after`, cannot be made to count `within` from the
        click (`422`): the iOS SDK evaluates encoded goals on the device,
        which has no click.
      operationId: updateGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              properties:
                definition:
                  $ref: "#/components/schemas/GoalDefinition"
      responses:
        "200":
          description: The goal, with `version_created`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The goal is archived, or its name is taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Goals]
      summary: Archive a goal
      description: |
        Archives: the goal evaluates nothing received from now on and keeps
        its versions, outcomes and conversions. `409` (with
        `details.skan_encodings` / `details.dependents`) while an SKAN
        encoding or another live goal's `after` names it. Archiving an
        archived goal is a no-op.
      operationId: deleteGoal
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`)
        "204":
          description: Archived
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Something still names the goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /goals/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Goals]
      summary: List a goal's versions
      operationId: listGoalVersions
      responses:
        "200":
          description: Every version, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/GoalVersion"}}
        "404":
          $ref: "#/components/responses/NotFound"

  /goals/{id}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
      - {name: version, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Goals]
      summary: Get one version of a goal
      operationId: getGoalVersion
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/GoalVersion"}
        "404":
          $ref: "#/components/responses/NotFound"

  /goals/{id}/outcomes:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Goals]
      summary: List a goal's live outcomes
      description: Every time a click (or install) reached the goal. Outcomes retired by a replay or a re-evaluation are never listed.
      operationId: listGoalOutcomes
      parameters:
        - {name: subject_type, in: query, schema: {type: string, enum: [click, install]}}
        - {name: subject_id, in: query, schema: {type: integer}}
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated outcomes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/GoalOutcome"}}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        "404":
          $ref: "#/components/responses/NotFound"

  /goals/{id}/campaigns:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Goals]
      summary: List the campaigns paying for a goal
      operationId: listGoalCampaigns
      responses:
        "200":
          description: The campaign terms
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/GoalCampaignTerm"}}
        "404":
          $ref: "#/components/responses/NotFound"

  /goals/{id}/campaigns/{campaignId}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
      - {name: campaignId, in: path, required: true, schema: {type: integer}}
    put:
      tags: [Goals]
      summary: Make a campaign pay for a goal, or change its terms
      description: |
        `payout` (null = the goal's own value) and `notify_traffic_source`
        (default true). A campaign's own goal attaches only to that campaign;
        registration and account goals attach to any of the caller's
        campaigns, and are evaluated for its clicks from the moment they are
        attached. Stageable.
      operationId: setGoalCampaign
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payout: {type: string, nullable: true, description: "Decimal amount, at most 5 places"}
                notify_traffic_source: {type: boolean}
      responses:
        "200":
          description: The campaign term
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/GoalCampaignTerm"}
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The goal is archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Goals]
      summary: Stop a campaign paying for a goal
      description: Its outcomes on that campaign are tracked, not paid, from now on; conversions already recorded are kept.
      operationId: removeGoalCampaign
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`)
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"

  /goals/{id}/reevaluation:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Goals]
      summary: Preview a re-evaluation
      description: |
        Per subject of one `subject_type` — a click that has events on the
        campaigns the goal applies to, or (`install`) an Android install of
        the goal's registration, of the account, or on those campaigns —
        the outcome rows that would be retired and written under `version`
        (default the current one), and what happens to each retired row's
        conversion (`supersede` by the new row, or `delete` where the new
        version no longer reaches the goal). The goal is re-decided with its
        dependents — every goal of the subject's set whose `after` names it,
        directly or through another dependent — because their outcomes were
        evaluated against the goal's: `goals` lists them, and their retired
        and written rows are in the same lists and totals, each naming its
        `goal_id`. Dependents never add subjects: the selection and its cap
        are the goal's own. A dependent's version that cannot be evaluated
        (invalid definition, missing prerequisite) is left as it is.
        Changes nothing. At most `limit` (default 100, max 1000) subjects
        after `after`; `next_after` continues. `subject_type` defaults to
        `click` for a campaign goal and `install` for a registration or
        account goal. The built-in install goal is never re-evaluated
        (`422`).
      operationId: previewGoalReevaluation
      parameters:
        - {name: version, in: query, schema: {type: integer}}
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 1000}}
        - {name: after, in: query, schema: {type: integer}}
        - {name: subject_type, in: query, schema: {type: string, enum: [click, install]}}
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalReevaluationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Goals]
      summary: Apply a re-evaluation
      description: |
        The same selection as the preview, applied one click per
        transaction: each click is rebased onto the version (later events
        and replays keep evaluating the goal under it), outcomes of older
        versions — and dependents' outcomes the new evaluation no longer
        reaches — are retired (`superseded_reason: reevaluation`), their
        conversions superseded or deleted (recomputing the click's value),
        newly reached ones written, and the stored progress of exactly those
        goals replaced. An outcome — the goal's or a dependent's — that the
        old version never reached is announced to the campaign's traffic
        source like any newly reached one; one written in place of a retired
        outcome is announced only if the retired one never went out
        (`notifications` per subject). Stageable.
      operationId: applyGoalReevaluation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version: {type: integer}
                limit: {type: integer, maximum: 1000}
                after: {type: integer}
                subject_type: {type: string, enum: [click, install]}
      responses:
        "200":
          description: What was done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalReevaluationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /events:
    post:
      tags: [Events]
      summary: Report a click's events (evaluated by its campaign's goals)
      description: |
        Stores the events on the click and evaluates the click's campaign
        goals in one transaction (plan §2.2). A goal an event reaches writes
        an outcome and, through the conversion ledger, a conversion
        (`source: goal`); for a payable goal the campaign notifies for, the
        click's traffic source's server-to-server postback, with
        `[[p202_goal]]`, `[[p202_goal_id]]` and `[[p202_goal_value]]` filled,
        is queued in the notification outbox in the same transaction and
        sent by the worker with retries (`notifications`). An event on its own records nothing: on a
        campaign with no live goals the events are stored (`goals_evaluated:
        false`, with a `note`), and a goal added later applies to them
        through `POST /goals/{id}/reevaluation`.

        Every event names its own `event_id`: an id already stored with the
        same content is a duplicate (listed in `duplicates`, nothing
        written), and with different content the whole request is a `409`.
        An event without `occurred_at` is timed by the server, so a retry
        later is still a duplicate. An event that sorts before a stored one
        replays the click (`replayed: true`); an outcome that moves to it is
        written as a replacement and is never announced to the traffic
        source again (`notify: suppressed`).

        `revenue` is trusted here (an API key is the operator's own
        statement), so a goal valued from the event's amount pays it.
        `received_at` and `revenue_trusted` are the server's and are refused
        in the body. The body is strict (an unknown field is a `422` naming
        it) and `click_id` is read raw (`"1e3"` or `1.5` is refused, never
        cast). `201` when an event was stored, `200` when every event was a
        duplicate. Honors `Idempotency-Key`; stageable (`staged=1`). Scope
        area `events`.
      operationId: sendEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventsRequest"
      responses:
        "200":
          description: Every event was a duplicate; nothing was written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
        "201":
          description: Events stored and evaluated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An event id already names a different event on this click
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ─── Users ───────────────────────────────────────────────────────────

  /users:
    get:
      tags: [Users]
      summary: List users
      description: Admin only.
      operationId: listUsers
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Users]
      summary: Create a user
      description: Admin only. Password is hashed with bcrypt.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /users/roles:
    get:
      tags: [Users]
      summary: List available roles
      operationId: listRoles
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Users]
      summary: Get a user
      description: Returns user details with roles. Accessible by self or admin.
      operationId: getUser
      responses:
        "200":
          description: User details with roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetailResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Users]
      summary: Update a user
      description: >-
        Your own account, or another user's under the user-management rules:
        Admin, never user 1 unless you are user 1, and an Admin or Super user
        account only with the Super user role (403 otherwise). A new
        `user_pass` (8-72 characters) is re-hashed; changing your own needs
        `current_password` too (422 naming it when missing or wrong).
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Users]
      summary: Delete a user
      description: >-
        Super user only (the add_edit_delete_admin permission); user 1 and the
        caller are never removed (403). Soft-deletes the user (sets user_deleted = 1) and, in the
        same transaction, revokes their API keys, deletes their app
        registrations, SKAN encodings, identity-graph rows and MTA state, and
        releases their app postbacks to unclaimed. Clicks and conversions are
        kept. A failure part-way changes nothing and answers 500.
      operationId: deleteUser
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: User deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/roles:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    post:
      tags: [Users]
      summary: Assign a role to a user
      description: >-
        Admin, under the user-management rules: never user 1, an Admin or
        Super user account only with the Super user role, role 2 (Admin) only
        by a Super user, and role 1 (Super user) never (403). `role_id` must
        be a positive whole number (422 otherwise). Idempotent (INSERT IGNORE).
      operationId: assignRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id:
                  type: integer
                  description: Role ID to assign
      responses:
        "201":
          description: Role assigned
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}/roles/{roleId}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
      - name: roleId
        in: path
        required: true
        schema:
          type: integer
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Users]
      summary: Remove a role from a user
      description: >-
        Admin, under the user-management rules: never user 1's roles, and an
        Admin or Super user account only with the Super user role (403).
      operationId: removeRole
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Role removed
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}/api-keys:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Users]
      summary: List API keys for a user
      description: Self or admin. Keys are masked (first 8 chars visible).
      operationId: listApiKeys
      responses:
        "200":
          description: API key list (masked)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: integer
                        api_key:
                          type: string
                          description: Masked key (first 8 chars + asterisks)
                        scope:
                          type: string
                          description: The key's scope; `*` for full-access keys
                        created_at:
                          type: integer
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Users]
      summary: Create an API key
      description: |
        Self or admin. Returns the full 64-character hex key. This is the only
        time the full key is visible -- store it securely.

        An optional `scope` attenuates the key (see "API Key Scopes" above).
        Unknown tokens are rejected with 422; a scoped caller must name an
        explicit scope no broader than its own (422/403); on a pre-1.9.75
        schema without the scope column, requesting a scope returns 409.
      operationId: createApiKey
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  description: |
                    Comma-separated string or array of scope tokens: `*`,
                    `read`, `write`, or `<area>:read` / `<area>:write`.
                    Omit for a full-access key.
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                      api_key:
                        type: string
                        description: Full 64-character hex API key (shown once)
                      scope:
                        type: string
                        description: The stored scope; `*` for full access
                      created_at:
                        type: integer
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}/api-keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
      - name: keyId
        in: path
        required: true
        description: The full API key string
        schema:
          type: string
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Users]
      summary: Delete an API key
      description: Self or admin.
      operationId: deleteApiKey
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: API key deleted
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}/identity-key:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Users]
      summary: Get the identity linking key
      description: >-
        Self or admin, with a key that can write users (`*`, `write` or
        `users:write`): holding the key is the power to link identities, so
        a read-only or propose-only key is refused with 403. The key the
        account's own server signs customer ids
        with, so a `cust` on a public pixel, postback or tracking link joins
        a person's journeys only when it carries `cust_sig`:
        `cust_sig = hex(HMAC-SHA256(linking_key, "<cust_type>:<cust>"))`.
        `cust_type` is the LTV alias vocabulary and defaults to `custom`;
        `email_md5` and `email_sha256` digests are signed in lower case. An
        unsigned or wrongly signed `cust` keeps its LTV role and links
        nothing. Minted on first read.
      operationId: getIdentityKey
      responses:
        "200":
          description: The linking key
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/IdentityKey"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{id}/identity-key/rotate:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    post:
      tags: [Users]
      summary: Rotate the identity linking key
      description: >-
        Self or admin. Replaces the linking key and returns the new one.
        Every `cust_sig` computed with the old key stops linking at once;
        clicks already linked stay linked. Can be staged (`?staged=1`).
      operationId: rotateIdentityKey
      responses:
        "200":
          description: The new linking key
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/IdentityKey"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{id}/preferences:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Users]
      summary: Get user preferences
      description: Self or admin.
      operationId: getPreferences
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserPreferences"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Users]
      summary: Update user preferences
      description: >-
        Self, or a user you may manage. Any subset of the fields below, each
        checked against the settings page that owns it; an unknown key is a
        422 naming it.
      operationId: updatePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesUpdate"
      responses:
        "200":
          description: Preferences updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserPreferences"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

# ═══════════════════════════════════════════════════════════════════════
# Components
# ═══════════════════════════════════════════════════════════════════════

  /staged-changes:
    get:
      tags: [StagedChanges]
      summary: List staged changes
      description: |
        Your staged writes, newest first. `status` filters; `all=1` returns
        every user's changes (admin only). Requires `staged-changes:read`.
      operationId: listStagedChanges
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [staged, applying, applied, discarded]
        - name: all
          in: query
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Staged changes
        "403":
          $ref: "#/components/responses/Forbidden"

  /staged-changes/{changeId}:
    parameters:
      - $ref: "#/components/parameters/changeId"
    get:
      tags: [StagedChanges]
      summary: Get one staged change
      description: Payload and (for deletes) the embedded dry-run preview. Own changes, or any as admin.
      operationId: getStagedChange
      responses:
        "200":
          description: The staged change
        "404":
          description: Not found

  /staged-changes/{changeId}/apply:
    parameters:
      - $ref: "#/components/parameters/changeId"
    post:
      tags: [StagedChanges]
      summary: Apply a staged change
      description: |
        Performs the recorded write by re-dispatching it through the real
        route: validation, route authorization, and scope checks re-run
        against current state under the applier's credentials. Requires
        the write scope of the change's area (for example `campaigns:write`).
        The staged→applied transition is atomic; a concurrent second apply
        gets 409. A failed apply returns the change to staged with the
        error recorded.
      operationId: applyStagedChange
      responses:
        "200":
          description: The applied change and the write's result
        "409":
          description: Not staged, expired, or applied concurrently

  /staged-changes/{changeId}/discard:
    parameters:
      - $ref: "#/components/parameters/changeId"
    post:
      tags: [StagedChanges]
      summary: Discard a staged change
      description: Ends the proposal without performing it. Requires `staged-changes:stage`.
      operationId: discardStagedChange
      responses:
        "200":
          description: The discarded change
        "409":
          description: Not in the staged state

  # ─── App measurement ─────────────────────────────────────────────────

  /apps:
    get:
      tags: [Apps]
      summary: List registered apps
      description: |
        The caller's registrations, both platforms. Each row carries the app's
        `app_token` — the value an app build presents in `X-P202-App-Token` to
        `GET /apps/schema`. The token is an identifier, not a secret (it ships
        inside every copy of the app), but it is still served only to the
        owner, and staged-change previews and apply results redact it.
        `filter[platform]=ios|android` narrows the list.
      operationId: listApps
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated registrations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppRegistrationListResponse"
    post:
      tags: [Apps]
      summary: Register an app
      description: |
        Name the app with `store_link` (an App Store or Google Play link, a
        `market://details?id=…` link, a numeric App Store id or a package
        name) or with `app_key` (the App Store id for iOS, the package name
        for Android; `platform` is read from the key's shape when omitted) —
        one of them, not both. The server reads the link, so every client
        resolves it the same way; `store_link` is not stored.

        `(platform, app_key)` is unique across the install: a second
        registration of the same app is `409`. Registering an iOS app claims
        its postbacks — rows that arrived before registration (stored
        unclaimed) are adopted. The response mints and returns the app's
        `app_token`.

        `Idempotency-Key` is deliberately not honored on this create — the
        token must not persist as a replayable record. Retries are safe
        anyway: the unique `(platform, app_key)` answers `409`.
      operationId: createApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppRegistrationCreate"
      responses:
        "201":
          description: App registered; the response carries its app token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppRegistrationResponse"
        "409":
          description: This app is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /apps/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Apps]
      summary: Get an app registration
      description: Addressed by `registration_id`, not the App Store id or package name.
      operationId: getApp
      responses:
        "200":
          description: The registration, including its app token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppRegistrationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Apps]
      summary: Update an app registration
      description: |
        Changes the name, the notes or the test-signal policy, and re-runs
        the postback claim, so unclaimed history for the app is adopted on
        update. The app a registration names is fixed: sending `platform`,
        `app_key` or `store_link` naming the same app is accepted and changes
        nothing; naming a different app is `422` — register it separately.
        Toggling `accept_test_signals` re-judges the stored test signals
        too: the policy is live, not a receipt-time snapshot. For an Android
        app that includes the stored test installs: one that becomes trusted
        gains its conversions (written, or restored when an earlier change
        retired them) and notifies its traffic source; one that stops being
        trusted has its conversions retired (an unsent notification
        cancelled, a sent one retracted) and stays in the funnel.
      operationId: updateApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppRegistrationUpdate"
      responses:
        "200":
          description: Registration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppRegistrationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Apps]
      summary: Delete an app registration
      description: |
        Deletes the registration and its SKAN encodings, in one transaction
        with the rest: postbacks it had claimed keep their owner but are
        unlinked (`registration_id` becomes `null`), and the test-signal
        trust it granted is withdrawn. Registering the app again re-links
        the owner's unlinked rows. Android installs are kept, and those still
        waiting for a Play Integrity verdict are settled in the same
        transaction — `integrity_state` `error`, and a held
        `pending_integrity` install `integrity_unverified` (never paid) —
        since the credential is deleted with the registration. The dry-run
        preview lists the cascade and omits the app token.
      operationId: deleteApp
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Registration deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /apps/{id}/app-token/rotate:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    post:
      tags: [Apps]
      summary: Rotate the app token
      description: |
        Mints a replacement token and invalidates the old one immediately.
        Builds configured with the old token can no longer fetch the schema
        until updated. Stageable; an applied rotation's result is served with
        the token redacted (the owner reads it via `GET /apps/{id}`).
      operationId: rotateAppToken
      responses:
        "200":
          description: The registration with its new app token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppRegistrationResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /apps/{id}/installs:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Apps]
      summary: List an Android registration's installs
      description: |
        Installs the SDK reported for this registration, newest first, each
        with its `match_state`, the `match_reason` sentence and its trust
        (`1` trusted, `0` refuted, `null` unvouched). Written only by the
        public intake (`POST /apps/installs`). Referrer fields and versions
        come from an open endpoint, so strings are sanitized at
        serialization; the raw body is never served. Unknown filters and
        malformed values are `422`.
      operationId: listAppInstalls
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/installMatchState"
        - {name: integrity_state, in: query, description: "Only installs whose Play Integrity verdict stands here", schema: {type: string, enum: [not_requested, received, missing, pending, valid, invalid, error, skipped]}}
        - {name: trusted, in: query, schema: {type: string, enum: [trusted, refuted, unvouched, "1", "0"]}}
        - {name: test, in: query, schema: {type: string, enum: ["0", "1"]}}
        - {name: ctit_flag, in: query, description: "Only installs whose click-to-install time is in this tail; unmeasured = no click of yours to measure from", schema: {type: string, enum: [short, ok, long, unmeasured]}}
        - {name: click_id, in: query, schema: {type: integer}}
        - $ref: "#/components/parameters/timeFrom"
        - $ref: "#/components/parameters/timeTo"
      responses:
        "200":
          description: Paginated installs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstallListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /apps/{id}/installs/{install_uuid}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
      - {name: install_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Apps]
      summary: Get one install
      operationId: getAppInstall
      responses:
        "200":
          description: The install
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstallResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /apps/{id}/install-token:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Apps]
      summary: The install token and store link for one click
      description: |
        `[[p202_install_token]]` for one of the caller's clicks — exactly
        what the redirect writes into a store link — and the Google Play link
        that carries it (`…&referrer=p202%3D<token>`). A read: nothing is
        stored. The click must be the caller's, and its campaign must not be
        linked to another registration (`422`). `503` when the installation
        has no install-token key (run the upgrade, which mints it).
      operationId: getAppInstallToken
      parameters:
        - {name: click_id, in: query, required: true, schema: {type: integer}}
      responses:
        "200":
          description: The token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstallTokenResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: No install-token key

  /apps/{id}/store-link:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Apps]
      summary: The store link a campaign should send this app's clicks to (the link builder)
      description: |
        Android: the Play link with `[[p202_install_token]]` in its
        `referrer` (the redirect fills it per click; the SDK reads it back
        from the Install Referrer). iOS: the App Store link, the Info.plist
        keys and the receiver paths Apple appends to the origin — a campaign
        is not linked to an iOS app, since Apple's postback names the app,
        not the click. With `campaign_id`, whether that campaign is ready:
        its offer URL names this app (and, for Android, carries the token
        in the referrer) and, for Android, it is linked to this
        registration; `apply` is the PUT /campaigns/{id} body that makes it
        so. With URL rotation on (`aff_campaign_rotate`), every offer URL in
        rotation (`aff_campaign_url_2` … `_5`, the non-empty ones) must be
        this app's link too, since a click can land on any of them; when one
        is not, `apply` turns rotation off (`aff_campaign_rotate: 0`) and
        leaves the alternates stored. Nothing is written.
      operationId: getAppStoreLink
      parameters:
        - {name: campaign_id, in: query, schema: {type: integer}}
      responses:
        "200":
          description: The store link
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AppStoreLink"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /apps/{id}/integrity:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Apps]
      summary: Play Integrity status for an Android registration
      description: |
        The registration's `integrity_mode` and cloud project number, its
        service-account credential (the account's email, key id and project
        only — never the key), where its installs' verdicts stand
        (`by_integrity_state`, and the installs held or refused by `require`
        in `by_match_state`), the tokens Google decoded since UTC midnight
        against its default quota of 10,000 a day, and the verdict policy's
        constants. An iOS registration is `422`.
      operationId: getAppIntegrity
      responses:
        "200":
          description: The status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppIntegrityStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /apps/{id}/integrity-credential:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    put:
      tags: [Apps]
      summary: Set or rotate the Play Integrity service account
      description: |
        `{"credential": <the service-account key file's JSON object>}` —
        the JSON Google Cloud downloads for a key of a service account that
        can call the Play Integrity API for this app (the Cloud project
        linked to the app in Play Console). Validated strictly: `type`
        `service_account`, `client_email`, `private_key_id`, an RSA
        `private_key` of at least 2048 bits, and a `token_uri`, when present,
        of exactly `https://oauth2.googleapis.com/token` (the only endpoint
        the server sends its signed assertion to). Only the email, key id,
        project and the AES-256-GCM-encrypted key are stored; nothing in any
        response carries the key. A second PUT replaces the first (rotation):
        the next decode signs with the new key. Not stageable (`?staged=1`
        is refused): a staged change would store the key and show it to
        reviewers. Answers the `GET /apps/{id}/integrity` document.
      operationId: setAppIntegrityCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              additionalProperties: false
              properties:
                credential:
                  type: object
                  description: The service-account key file, as a JSON object (not a string)
      responses:
        "200":
          description: Stored; the status document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppIntegrityStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Apps]
      summary: Clear the Play Integrity service account
      description: |
        Deletes the credential. Refused (`409`) while `integrity_mode` is
        `observe` or `require` (switch the mode to `off` first), and while
        any install of the registration is still waiting for a verdict
        (`installs.by_integrity_state.pending` in `GET /apps/{id}/integrity`):
        each install keeps the mode it arrived under, so installs held under
        `require` would otherwise end `integrity_unverified`. The message
        says how many are waiting; each is settled within 24 hours of
        arriving. PUT a new credential to rotate at any time. Answers a body
        saying whether there was one to delete. Not stageable.
      operationId: clearAppIntegrityCredential
      responses:
        "200":
          description: Cleared (or there was none)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      registration_id: {type: integer}
                      credential: {type: object, nullable: true, enum: [null]}
                      cleared: {type: boolean}
                      message: {type: string}
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The mode is observe or require (switch it to off first), or installs are still waiting for a verdict (wait for the worker to settle them)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /apps/skan-encodings:
    get:
      tags: [Apps]
      summary: List SKAN encodings
      description: "`filter[registration_id]=N` narrows to one registration's encodings (`0` = the account-wide ones)."
      operationId: listAppSkanEncodings
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated encodings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSkanEncodingListResponse"
    post:
      tags: [Apps]
      summary: Create a SKAN encoding
      description: |
        An encoding maps exactly one fine value (0–63) **or** one coarse
        value (`low`/`medium`/`high`) to a goal (`goal_id`), with an
        optional `revenue_override` for tiered decoding; without one a
        decoded postback is worth the goal's fixed value. `registration_id`
        names one of the caller's own iOS registrations, or is `0` for the
        account-wide set that a registration's own encodings override. Any
        other value is `422`: an encoding for an app nobody registered would
        decode nothing. The goal must be live, the caller's, owned by that
        registration or by the account (an account-wide encoding names an
        account goal), and one a device can reach: the iOS SDK evaluates
        the goal on the device, which never learns its click, so a goal that
        counts `within` from the click — or waits in `after` for one that
        does — is `422`. The old fields `event_name` and `revenue` are
        refused by name. The same rows drive the report's decode (by the
        goal's name) and the schema served to devices (the goal and the
        values). Every update and delete keeps the meaning it replaces: a
        device may apply the schema it fetched before the edit for as long
        as a postback takes to arrive, so for 48 days (35 of conversion
        windows, up to 6 of Apple's delivery delay, and the SDK's 7-day
        limit on the age of the document it encodes with) the report counts
        a value whose meanings disagree as `ambiguous_encoding`.
        `effective_at` says since when the current meaning applies. Honors
        `Idempotency-Key`.
      operationId: createAppSkanEncoding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSkanEncodingCreate"
      responses:
        "201":
          description: Encoding created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSkanEncodingResponse"
        "409":
          description: An encoding for this conversion value already exists for this registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /apps/skan-encodings/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Apps]
      summary: Get a SKAN encoding
      operationId: getAppSkanEncoding
      responses:
        "200":
          description: The encoding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSkanEncodingResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Apps]
      summary: Update a SKAN encoding
      description: |
        The row is validated as it will exist after the update. To switch an
        encoding between kinds, send the clear and the replacement together
        — an explicit `null` empties the old kind while the new value arrives
        (`{"fine_value": null, "coarse_value": "high"}`). An absent field
        means keep; clearing without a replacement is `422`.
      operationId: updateAppSkanEncoding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSkanEncodingUpdate"
      responses:
        "200":
          description: Encoding updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSkanEncodingResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An encoding for this conversion value already exists for this registration, or the body's version (or an If-Match) is not the encoding's current one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Apps]
      summary: Delete a SKAN encoding
      operationId: deleteAppSkanEncoding
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Encoding deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /apps/notifications:
    get:
      tags: [Apps]
      summary: Traffic-source postbacks app installs' goals queued, and where each stands
      description: |
        The notification outbox for app installs, newest first: every
        server-to-server postback an install's goal outcome queued, with
        its kind and status — `pending` (waiting, or backing off after a
        failed attempt), `sent`, `failed` (attempts ran out; `last_error`
        says why), `cancelled` (replaced before it went out) or
        `suppressed` (a correction or retraction for a pixel with no
        correction URL). `meta.summary` counts every status under the same
        filters except `status`. Web clicks' postbacks go through the same
        outbox and are not listed here.
      operationId: listAppNotifications
      parameters:
        - {name: registration_id, in: query, schema: {type: integer}}
        - {name: status, in: query, schema: {type: string, enum: [pending, sent, failed, cancelled, suppressed]}}
        - {name: kind, in: query, schema: {type: string, enum: [reached, correction, retraction]}}
        - $ref: "#/components/parameters/timeFrom"
        - $ref: "#/components/parameters/timeTo"
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 500}}
        - {name: offset, in: query, schema: {type: integer, default: 0}}
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppNotification"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
                  meta:
                    type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          pending: {type: integer}
                          sent: {type: integer}
                          failed: {type: integer}
                          cancelled: {type: integer}
                          suppressed: {type: integer}
        "422":
          $ref: "#/components/responses/ValidationError"

  /apps/postbacks:
    get:
      tags: [Apps]
      summary: List received postbacks
      description: |
        Postbacks stored by the public receivers and claimed by the caller's
        registrations, newest first. Every string column is authored by
        whoever POSTed to the open receiver, so values are sanitized at
        serialization. Rows never carry the attribution signature (see
        `GET /apps/postbacks/{id}`) or the raw body. Malformed filter values
        are rejected with `422` rather than ignored.
      operationId: listAppPostbacks
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/timeFrom"
        - $ref: "#/components/parameters/timeTo"
        - $ref: "#/components/parameters/postbackRegistrationId"
        - $ref: "#/components/parameters/postbackRegistrationIds"
        - $ref: "#/components/parameters/postbackAppId"
        - $ref: "#/components/parameters/postbackAdNetworkId"
        - $ref: "#/components/parameters/postbackVersion"
        - $ref: "#/components/parameters/postbackTransactionId"
        - $ref: "#/components/parameters/postbackCountryCode"
        - $ref: "#/components/parameters/postbackSourceIdentifier"
        - $ref: "#/components/parameters/postbackCampaignId"
        - $ref: "#/components/parameters/postbackFidelityType"
        - $ref: "#/components/parameters/postbackPostbackSequenceIndex"
        - $ref: "#/components/parameters/postbackDidWin"
        - $ref: "#/components/parameters/postbackRedownload"
        - $ref: "#/components/parameters/postbackCoarseConversionValue"
        - $ref: "#/components/parameters/postbackSignature"
        - $ref: "#/components/parameters/postbackProtocol"
        - $ref: "#/components/parameters/postbackConversionType"
        - $ref: "#/components/parameters/postbackAdInteractionType"
      responses:
