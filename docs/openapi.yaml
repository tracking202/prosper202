        time_to:
          type: integer
        run_at:
          type: integer
          description: Unix seconds, at most a year ahead; a past time means as soon as possible. Default now.
        webhook_url:
          type: string
          maxLength: 500
          description: https://host[:port][/path], spelled plainly (no user info, fragment or backslash); the host a DNS name or a canonical IP address that is public.
        webhook_secret:
          type: string
          minLength: 16
          maxLength: 255
          description: Printable ASCII, no spaces. Generated (64 hex characters) when a webhook is given without one.

    AttributionExport:
      type: object
      properties:
        export_id:
          type: integer
        model_id:
          type: integer
        compare_model_id:
          type: integer
          nullable: true
        group_by:
          type: string
        time_from:
          type: integer
        time_to:
          type: integer
        status:
          type: string
