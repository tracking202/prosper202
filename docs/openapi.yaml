openapi: 3.0.3
info:
  title: Prosper202 API
  version: "3.0"
  description: |
    REST API for the Prosper202 affiliate tracking platform.

    ## Authentication
    All endpoints require a Bearer token except `GET /system/health`, the
    public `GET /apps/schema` (selected by the app token), and the Apple
    postback receivers (see the Apps tag):
    ```
    Authorization: Bearer <api_key>
    ```
    API keys are managed via the `/users/{id}/api-keys` endpoints.

    ## Pagination
    List endpoints return paginated results:
    ```json
    {
      "data": [...],
      "pagination": { "total": 100, "limit": 50, "offset": 0 }
    }
    ```

    ## API Key Scopes
    A key may carry a scope that attenuates it independently of the owning
    user's roles: `*` (full, the default), `read`, `write`, `stage`, or
    granular `<area>:read` / `<area>:write` / `<area>:stage` tokens
    (`write` implies `read` and `stage`). GET/HEAD
    requires `<area>:read`, everything else `<area>:write`; `/capabilities`
    and `/versions` stay readable by any valid key. A scoped key cannot
    create a key broader than itself. Denials are `403` naming the required
    scope. Advertised via `features.api_key_scopes`.

    ## Role Permissions
    A key also acts within its user's role, as the web pages limit that
    user. Reading, creating or changing a Setup entity (campaigns,
    aff-networks, ppc-networks, ppc-accounts, trackers and their links,
    landing-pages, text-ads, rotators and their rules, Mobile Apps, and each
    `bulk-upsert`) needs `access_to_setup_section`; deleting one needs that
    and the entity's own `remove_*` permission (`remove_campaign`,
    `remove_tracker`, `remove_rotator_rule`, …). Recording a conversion needs
    `access_to_update_section`, removing one `delete_individual_subids` as
    well; the Account › Settings reads under `/system` need Admin and
    `access_to_settings`. The check runs before the handler, so `?dry_run=1`
    and `?staged=1` are refused as the write is. Denials are `403` naming the
    permission.

    The reports, clicks and conversions are open to every role, but a role
    without `access_to_campaign_data` reads them as the pages show them: the
    absolute clicks, click-throughs, leads, income, cost and net (and a
    click's or conversion's cost and payout) are `null`, ratios are kept,
    and the answer carries `"masked": true`.

    ## Linked Records
    A Setup record links only to the caller's own live records, as the Setup
    pages require: a campaign's `aff_network_id`, a traffic source account's
    `ppc_network_id`, a landing page's and text ad's `aff_campaign_id` (and
    a text ad's `landing_page_id`), and a tracker's `aff_campaign_id`,
    `ppc_account_id`, `landing_page_id`, `text_ad_id` and `rotator_id`.
    Another account's id, or a removed record's, is a `422` naming the field
    in `field_errors`; `0` is "none" where the link is optional. An update
    re-sending the value the record already holds is not checked again.

    ## Idempotent Creates
    Single POST creates across the operator surface (CRUD entities,
    conversions, rotators and rules, attribution models and exports, users)
    honor an optional `Idempotency-Key` header: a retry of the same request
    replays the recorded response (`idempotent_replay: true`) instead of
    creating a duplicate. A key is scoped to the caller and identifies one
    request, so reusing it for anything else — a changed body, or a
    different endpoint — is a `422`, not a second create. Not honored on
    API-key creation or the LTV write endpoints. Advertised via
    `features.create_idempotency`. Bulk-upsert endpoints continue to REQUIRE
    the header, and refuse a reused key the same way.

    ## Delete Dry-Run
    Every operator-surface DELETE accepts `dry_run=1` and returns a preview
    (record, soft/hard mode, cascade counts) without deleting. Fail-closed
    on unsupported endpoints. Advertised via `features.delete_dry_run`.

    ## Staged Writes
    `staged=1` on an operator-surface write records it as a proposal with a
    server-issued change id (202) instead of executing it. `/staged-changes`
    lists, shows, applies, and discards proposals; applying re-dispatches
    the recorded write so validation and authorization re-run against
    current state under the applier's credentials. The `stage` scope action
    mints propose-only keys. Fail-closed on unsupported endpoints;
    `staged` and `dry_run` are mutually exclusive. Advertised via
    `features.staged_writes`.

    ## App measurement
    `/apps` is the registry of the apps you advertise, both platforms: one
    registration per app, `(platform, app_key)` — the App Store id for iOS,
    the package name for Android. Apple devices POST signed SKAdNetwork and
    AdAttributionKit postbacks to `/.well-known/skadnetwork/report-attribution/`
    and `/.well-known/appattribution/report-attribution/` (site root, outside
    this base path); `/apps/postbacks` and `/apps/report` serve them, and
    `/apps/skan-encodings` decodes their conversion values.
    `GET /apps/schema` is public and selected by an app's `app_token` (sent
    in `X-P202-App-Token`) instead of an API key, so a build can fetch its
    configuration at runtime. Advertised via `features.app_platforms` and
    `features.app_postbacks`; every `/apps` route lives in the `apps` scope
    area, separate from `attribution` (multi-touch attribution models).

    ## Errors
    Error responses use a consistent format:
    ```json
    {
      "error": "Error message",
      "status": 422,
      "field_errors": { "field_name": "Reason" }
    }
    ```
    `field_errors` is only present on validation errors (422).
  contact:
    name: Prosper202
  license:
    name: Proprietary

servers:
  - url: /api/v3
    description: API v3 base path

security:
  - BearerAuth: []

tags:
  - name: System
    description: Health checks and diagnostics
  - name: Campaigns
    description: Affiliate campaign management
  - name: Affiliate Networks
    description: Affiliate network management
  - name: PPC Networks
    description: PPC network management
  - name: PPC Accounts
    description: PPC account management
  - name: Trackers
    description: Tracker management
  - name: Landing Pages
    description: Landing page management
  - name: Text Ads
    description: Text ad management
  - name: Clicks
    description: Click data (read-only)
  - name: Conversions
    description: Conversion tracking
  - name: Setup
    description: The UI's Setup section's code and per-source settings — a landing page's tracking code (Get LP Code), the conversion pixels and postback URLs (Postback / Pixel), a traffic source's custom variables and an account's pixels (Traffic Sources). Role permission `access_to_setup_section` on every route, and `remove_traffic_source` as well on a traffic source's variables (Setup > Traffic Sources shows its variables dialog only to a role with it)
  - name: Update
    description: The UI's Update section — set past clicks' CPC, mark subids converted, delete subids, reset a campaign's subids, upload a revenue report. Role permission `access_to_update_section` (and `delete_individual_subids` to delete subids); every write has a `?dry_run=1` preview
  - name: Reports
    description: Performance reports
  - name: Rotators
    description: Traffic rotator and rule management
  - name: Attribution
    description: Multi-touch attribution — models, credit reports over visitor journeys, and the worker's queue
  - name: Users
    description: User, role, API key, and preference management
  - name: Apps
    description: App measurement — the app registry (iOS and Android), Apple's SKAdNetwork and AdAttributionKit postback receivers, SKAN encodings, the report, and the runtime schema
  - name: Goals
    description: Goals — versioned, data-only definitions of what counts as a conversion, owned by a campaign, an app registration or the account; the campaigns that pay for them; their outcomes; validation, evaluation and re-evaluation
  - name: Forecast Events
    description: Calendar events (holidays, promotions) that event-aware forecasting shifts predictions around
  - name: LTV
    description: Customer lifetime value — customers, companies, revenue, subscriptions, products, custom fields, webhooks and integrations (scopes `ltv:read` / `ltv:write`)
  - name: Sync
    description: Server-side sync between Prosper202 instances — plans, jobs, the change feed and the audit trail (admin, scopes `sync:read` / `sync:write`)
  - name: Events
    description: Web events — what a click went on to do, reported by click id and evaluated by its campaign's goals (also `event=` on pixels and postbacks, and `p202.track()` on landing pages)

paths:
  # ─── System ──────────────────────────────────────────────────────────

  /system/health:
    get:
      tags: [System]
      summary: Health check
      description: Liveness probe. Does not require authentication.
      security: []
      operationId: systemHealth
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: healthy
                      timestamp:
                        type: integer
                        example: 1700000000
                      api_version:
                        type: string
                        example: v3

  /system/version:
    get:
      tags: [System]
      summary: System version info
      description: Returns Prosper202, PHP, and MySQL versions. Admin only.
      operationId: systemVersion
      responses:
        "200":
          description: Version information
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      prosper202_version:
                        type: string
                      php_version:
                        type: string
                      mysql_version:
                        type: string
                      api_version:
                        type: string
                        example: v3
        "403":
          $ref: "#/components/responses/Forbidden"

  /system/db-stats:
    get:
      tags: [System]
      summary: Database statistics
      description: Table row counts and total database size. Admin only.
      operationId: systemDbStats
      responses:
        "200":
          description: Database statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      tables:
                        type: array
                        items:
                          type: object
                          properties:
                            table:
                              type: string
                            label:
                              type: string
                            rows_estimate:
                              type: integer
                      database_size_bytes:
                        type: integer
                      database_size_mb:
                        type: number
        "403":
          $ref: "#/components/responses/Forbidden"

  /system/cron:
    get:
      tags: [System]
      summary: Cron job status
      description: Current cron jobs and recent execution logs. Admin only.
      operationId: systemCron
      responses:
        "200":
          description: Cron status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      jobs:
                        type: array
                        items:
                          type: object
                          properties:
                            cronjob_type:
                              type: string
                            cronjob_time:
                              type: integer
                            last_run_human:
                              type: string
                      recent_logs:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            cronjob_type:
                              type: string
                            last_execution_time:
                              type: integer
                            duration:
                              type: integer
                            time_human:
                              type: string
        "403":
          $ref: "#/components/responses/Forbidden"

  /system/errors:
    get:
      tags: [System]
      summary: Recent system errors
      description: Recent MySQL error log entries. Admin only.
      operationId: systemErrors
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Error list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        mysql_error_id:
                          type: integer
                        mysql_error_time:
                          type: integer
                        mysql_error_message:
                          type: string
                        time_human:
                          type: string
        "403":
          $ref: "#/components/responses/Forbidden"

  /system/info:
    get:
      tags: [System]
      summary: What Account › Settings shows for this install
      description: |
        The Administration page's tiles and its System and PHP limits panels:
        the code version and the database's (`database_upgrade_needed` when
        they differ — `202-config/upgrade.php` runs then), PHP and MySQL
        versions, memcache (installed, and whether its server answers), the
        PHP limits, clicks recorded to date, database size, when the cron job
        last ran, the DataEngine's progress, and the caller's keyword
        preference. Whether a newer release exists is not reported: the page
        asks a remote service for that, and this endpoint makes no network
        request.

        Admin (or Super user) with the role permission `access_to_settings`,
        as the page asks, and `system:read`.
      operationId: systemInfo
      responses:
        "200":
          description: Install details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      version:
                        type: string
                        description: The code's version (202-config/version.php)
                      schema_version:
                        type: string
                        nullable: true
                        description: The database's (202_version)
                      database_upgrade_needed:
                        type: boolean
                      php_version:
                        type: string
                      mysql_version:
                        type: string
                      php_safe_mode:
                        type: boolean
                      memcache:
                        type: object
                        properties:
                          installed:
                            type: boolean
                          running:
                            type: boolean
                      php_limits:
                        type: object
                        properties:
                          post_max_size:
                            type: string
                          upload_max_filesize:
                            type: string
                          max_input_time:
                            type: string
                          max_execution_time:
                            type: string
                      clicks_recorded:
                        type: integer
                        nullable: true
                      database_size_bytes:
                        type: integer
                      cron_last_ran_at:
                        type: integer
                        nullable: true
                        description: Unix seconds; null when the cron job never ran
                      cron_last_ran_seconds_ago:
                        type: integer
                        nullable: true
                      dataengine:
                        type: object
                        properties:
                          tasks_total:
                            type: integer
                          tasks_done:
                            type: integer
                          percent_done:
                            type: number
                          minutes_left:
                            type: integer
                            description: One task a minute
                      keyword_preference:
                        type: string
                        nullable: true
                        enum: [searched, bidded]
        "403":
          $ref: "#/components/responses/Forbidden"

  /system/login-log:
    get:
      tags: [System]
      summary: Sign-in attempts to this install
      description: |
        The attempts Account › Settings lists, newest first: the user name
        typed, the time, the IP address and whether it passed. Only those
        columns — the table also holds each attempt's request snapshot and,
        on installs from before the password was filtered, the password typed;
        neither is ever served. Throttled and token-refused attempts are not
        recorded. Unknown parameters are refused.

        Admin (or Super user) with `access_to_settings`, and `system:read`.
      operationId: systemLoginLog
      parameters:
        - name: limit
          in: query
          description: How many attempts (1-500); the page shows 50. Anything else is a `422`.
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Attempts, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        login_id:
                          type: integer
                        user_name:
                          type: string
                        ip_address:
                          type: string
                        login_time:
                          type: integer
                        login_success:
                          type: boolean
                  meta:
                    type: object
                    properties:
                      limit:
                        type: integer
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /system/retention:
    get:
      tags: [System]
      summary: Click-data retention
      description: |
        For the whole install (every account's clicks), as the cron job reads
        it from user 1's preferences: `auto_delete_days` — click data older
        than this many days is deleted, in batches, by the cron job's runs
        (0 keeps it all) — and the
        one-off deletion `POST /system/retention/delete-before` scheduled, if
        any (`scheduled_deletion`: the cron job deletes every click all of
        whose rows were recorded before `cutoff_time`; `before` is the day it
        falls on in the caller's zone, and `clicks_remaining` counts those
        still there). An install that scheduled one before this field existed
        shows `through_click_id` instead, with `cutoff_time` null: the clicks
        below that id are deleted, `before` is the day of the click it names,
        and `clicks_remaining` counts the clicks below it.

        Admin (or Super user) with `access_to_settings`, and `system:read`.
      operationId: systemRetention
      responses:
        "200":
          description: Retention settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemRetention"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [System]
      summary: Set automatic click-data deletion
      description: |
        What the page's "Delete click data older than … days" saves: a whole
        number of days from 0 (keep every click) to 36500, as a JSON integer
        or a string of digits; anything else is a `422`, never read as another
        number. Written to user 1's preferences, the row the cron job reads,
        whoever calls. The answer is the new state with
        `previous_auto_delete_days`.

        With N days, the cron job deletes every click recorded before
        midnight that began the day N days ago (server time): N whole days
        and today are kept. A click with a newer row (a rotator re-click) is
        kept whole until that row ages out.

        Admin (or Super user) with `access_to_settings`, and `system:write`.
        Not stageable (`?staged=1` is a `422`).
      operationId: systemSetRetention
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auto_delete_days]
              additionalProperties: false
              properties:
                auto_delete_days:
                  type: integer
                  minimum: 0
                  maximum: 36500
      responses:
        "200":
          description: The new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemRetention"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /system/retention/delete-before:
    post:
      tags: [System]
      summary: Schedule the deletion of click data from before a day
      description: |
        The page's Advanced › "Delete click data from before". It deletes
        nothing itself: it stores a time on user 1's preferences, and the
        cron job deletes every click all of whose rows were recorded before
        it — every account's — from every click table (the `rows` the
        preview counts), a batch of clicks from all of them in one
        transaction, over its next runs. A click visited again on or after
        the day (a rotator re-click gives an old click a new row) is kept
        whole. Conversions and setup data are kept. It cannot be undone.

        The time is midnight that begins `before` in the caller's time zone
        (`user_timezone`; a zone the server does not know is a `409`, never
        read as UTC), answered as `cutoff_time`. `before` is a calendar day
        written `YYYY-MM-DD`, not after today.

        **Preview** with `?dry_run=1`: nothing is written, and the answer
        counts what the cron job would delete now, by the selection it
        deletes by: `clicks`, and their rows per table (`rows`). **Schedule**
        by sending `before` with that `cutoff_time`: it is stored only if it
        is still the time the day begins in the caller's zone, otherwise
        nothing is written and the answer is a `409` whose `details` carry
        `current_cutoff_time`. A write without `cutoff_time` is a `422`.
        When no click is from before the day, nothing is written
        (`scheduled: false`). A schedule replaces the one before it.

        This used to store an id, the newest click at or before the day, and
        delete the clicks below it — which, since ids are not in time order,
        deleted a click re-clicked after the day and kept the newest one
        from before it. `through_click_id` is no longer a field of the
        request or of this answer; an id scheduled that way is still carried
        out, and `GET /system/retention` shows it.

        Admin (or Super user) with `access_to_settings`, and `system:write`,
        for the preview too. Not stageable (`?staged=1` is a `422`).
      operationId: systemScheduleDeletion
      parameters:
        - $ref: "#/components/parameters/writeDryRun"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [before]
              additionalProperties: false
              properties:
                before:
                  type: string
                  format: date
                  example: "2026-01-01"
                cutoff_time:
                  type: integer
                  description: The preview's `cutoff_time`; required to schedule
      responses:
        "200":
          description: "The preview (`dry_run: true`), or what was scheduled"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      dry_run:
                        type: boolean
                      scheduled:
                        type: boolean
                      before:
                        type: string
                        format: date
                      timezone:
                        type: string
                      cutoff_time:
                        type: integer
                        description: Midnight that begins `before` in `timezone`, unix seconds; the clicks all of whose rows are older are deleted
                      clicks:
                        type: integer
                        description: The clicks the cron job deletes (a click's rows in `202_clicks` are counted in `rows`)
                      rows:
                        type: object
                        additionalProperties:
                          type: integer
                        description: Rows the cron job deletes, per click table
                      current:
                        description: The deletion scheduled before this request (`scheduled_deletion` of `GET /system/retention`)
                        type: object
                        nullable: true
                        additionalProperties: true
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The day begins at another time than the preview's `cutoff_time` (the account's time zone changed), or the account's time zone is unknown; nothing was scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /system/isp-lookup:
    get:
      tags: [System]
      summary: MaxMind ISP and carrier lookup
      description: |
        Whether the redirects look up each visitor's ISP and carrier — the
        caller's own switch (`maxmind_isp`), which the redirects read for the
        trackers the caller owns — and whether the ISP database it needs
        (`GeoIP2-ISP.mmdb`, or legacy `GeoIPISP.dat`) is in `database_dir`
        (`P202_GEO_DIR`, or `202-config/geo`).

        Admin (or Super user) with `access_to_settings`, and `system:read`.
      operationId: systemIspLookup
      responses:
        "200":
          description: The switch and the database
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemIspLookup"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [System]
      summary: Turn ISP and carrier lookup on or off
      description: |
        As the page's switch: `enabled` is JSON `true` or `false`. Turning it
        on while no ISP database file is in place is a `422` that names the
        directory. Live traffic picks a change up within five minutes.

        Admin (or Super user) with `access_to_settings`, and `system:write`.
        Not stageable.
      operationId: systemSetIspLookup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
      responses:
        "200":
          description: The new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemIspLookup"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

  /system/integrations:
    get:
      tags: [System]
      summary: The notification URLs Account › API integrations hands out
      description: |
        The URL to paste into ClickBank (INS), JVZoo (IPN), Zaxaa (ZPN),
        Slack and PayKickstart (IPN), on this install's tracking base (user
        1's tracking domain or this server's name, and the install's path —
        the base tracker links use), and whether the caller has stored the
        secret each is checked with (`secret_stored`; null when it needs
        none). The secrets are never served.

        Admin (or Super user) with the role permission
        `access_to_api_integrations`, as the page asks, and `system:read`.
      operationId: systemIntegrations
      responses:
        "200":
          description: The integrations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      base_url:
                        type: string
                      integrations:
                        type: array
                        items:
                          type: object
                          properties:
                            integration:
                              type: string
                              enum: [clickbank, jvzoo, zaxaa, slack, paykickstart]
                            name:
                              type: string
                            label:
                              type: string
                              description: What the page calls the URL (INS URL, IPN URL, …)
                            url:
                              type: string
                            secret_stored:
                              type: boolean
                              nullable: true
                            verified:
                              type: boolean
                              description: ClickBank only
        "403":
          $ref: "#/components/responses/Forbidden"

  /system/dataengine:
    get:
      tags: [System]
      summary: Data engine status
      description: Recent data engine jobs and pending dirty hours. Admin only.
      operationId: systemDataengine
      responses:
        "200":
          description: Data engine status
          content:
            application/json:
              schema:
                type: object
