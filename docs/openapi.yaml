      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_type:
                  type: string
                  enum:
                  - renewal
                  - cancel
                  - refund
                amount:
                  type: number
                occurred_at:
                  type: integer
                idempotency_key:
                  type: string
              required:
              - event_type
              additionalProperties: true
      responses:
        '200':
          description: What changed; an idempotent replay changes nothing and queues no webhook
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
