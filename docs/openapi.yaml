  # ─── Clicks ──────────────────────────────────────────────────────────

  /clicks:
    get:
      tags: [Clicks]
      summary: List clicks
      description: Read-only access to click data with filtering.
      operationId: listClicks
      parameters:
        - $ref: "#/components/parameters/limit"
