        text_ad_display_url:
          type: string
          maxLength: 2048
        aff_campaign_id:
          type: integer
        landing_page_id:
          type: integer
        text_ad_type:
          type: integer

    TextAdUpdate:
      type: object
      properties:
        text_ad_name:
          type: string
          maxLength: 255
        text_ad_headline:
          type: string
          maxLength: 500
        text_ad_description:
          type: string
          maxLength: 2000
        text_ad_display_url:
          type: string
          maxLength: 2048
        aff_campaign_id:
          type: integer
        landing_page_id:
          type: integer
        text_ad_type:
          type: integer

    TextAdResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/TextAd"

    TextAdListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TextAd"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ── Clicks ─────────────────────────────────────────────────────────

    Click:
      type: object
      properties:
        click_id:
          type: integer
        aff_campaign_id:
          type: integer
        ppc_account_id:
          type: integer
        landing_page_id:
          type: integer
        click_cpc:
          type: number
        click_payout:
          type: number
        click_lead:
          type: integer
        click_filtered:
          type: integer
        click_bot:
          type: integer
        click_alp:
          type: integer
        click_time:
          type: integer
        rotator_id:
          type: integer
          nullable: true
          description: >-
            The rotator that routed the click (its 202_clicks_rotator row);
            null when no rotator did. A landing page's offer rotator records
            its clicks here too.
        rule_id:
          type: integer
          nullable: true
          description: The rotator rule that matched; null for the rotator's default or no rotator.
        rule_redirect_id:
          type: integer
          nullable: true
          description: The redirect of that rule the click was sent to.
        click_id_public:
          type: string
        click_cloaking:
          type: integer
        click_in:
          type: string
        click_out:
          type: string
        keyword_id:
          type: integer
        country_id:
          type: integer
        platform_id:
          type: integer
        browser_id:
          type: integer
        device_id:
          type: integer
        country_name:
          type: string
        country_code:
          type: string
        platform_name:
          type: string
        browser_name:
          type: string
        text_ad_id:
          type: integer
        ip_id:
          type: integer
        region_id:
          type: integer
        city_id:
          type: integer
        isp_id:
          type: integer
        aff_campaign_name:
          type: string
          nullable: true
          description: Named only when the campaign is the click's own account's; likewise the other names.
        ppc_account_name:
          type: string
          nullable: true
        ppc_network_name:
          type: string
          nullable: true
        landing_page_nickname:
          type: string
          nullable: true
        text_ad_name:
          type: string
          nullable: true
        ip_address:
          type: string
          nullable: true
        keyword:
          type: string
          nullable: true
          description: Visitor-authored, like the URLs and location and device names; cleaned of control and bidi characters and capped.
        region_name:
          type: string
          nullable: true
        city_name:
          type: string
          nullable: true
        isp_name:
          type: string
          nullable: true
        device_name:
          type: string
          nullable: true
        device_type:
          type: string
          nullable: true
        referer:
          type: string
          nullable: true
        landing:
          type: string
          nullable: true
        outbound:
          type: string
          nullable: true

    ClickDetail:
      allOf:
        - $ref: "#/components/schemas/Click"
        - type: object
          properties:
            user_id:
              type: integer
            click_reviewed:
              type: integer
            c1:
              type: string
              nullable: true
            c2:
              type: string
              nullable: true
            c3:
              type: string
              nullable: true
            c4:
              type: string
              nullable: true
            c1_id:
              type: integer
            c2_id:
              type: integer
            c3_id:
              type: integer
            c4_id:
              type: integer

    ClickResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ClickDetail"

    ClickListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Click"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ── Conversions ────────────────────────────────────────────────────

    Conversion:
      type: object
      properties:
        conv_id:
          type: integer
        click_id:
          type: integer
        transaction_id:
          type: string
        campaign_id:
          type: integer
        click_payout:
          type: number
        user_id:
          type: integer
        click_time:
          type: integer
        conv_time:
          type: integer
        deleted:
          type: integer
        aff_campaign_name:
          type: string
        source:
          $ref: "#/components/schemas/ConversionSource"
        source_ref:
          type: string
          nullable: true
          description: |
            What produced the row, as a reference: `goal:<goal id>:<version>`,
            `batch:<upload id>`, `conv:<the conversion a reversal reverses>`,
            or `apikey:<digest>` (a truncated SHA-256 of the key that wrote
            it through this API). `GET /clicks/{id}/conversions` resolves it.
        event_name:
          type: string
          nullable: true
          description: The event that reached the goal, or a postback's `event=`.
        payable:
          type: boolean
          description: False for a tracked outcome that is not paid.
        reverses_conv_id:
          type: integer
          nullable: true
        superseded_by:
          type: integer
          nullable: true
        superseded_reason:
          type: string
          nullable: true
          enum: [replace, batch, pre_ledger, replay, reevaluation, null]
        goal_id:
          type: integer
          nullable: true
          description: The goal of a goal row (from `source_ref`), else null.
        goal_version:
          type: integer
          nullable: true

    ConversionSource:
      type: string
      description: What produced a ledger row.
      enum: [pixel, postback, universal_pixel, api, subid_upload, revenue_upload, legacy_pixel, clickbank, app_install, goal, legacy_baseline]

    ClickConversion:
      type: object
      description: One conversion row of a click, and whether it counts toward the click's value.
      properties:
        conv_id:
          type: integer
        click_id:
          type: integer
        amount:
          type: number
          description: The row's amount, exact to five decimals (negative for a reversal).
          example: 5
        payable:
          type: boolean
        deleted:
          type: boolean
        counted:
          type: boolean
          description: Whether the amount is part of the click's value.
        not_counted_reason:
          type: string
          nullable: true
          enum: [deleted, unpaid, superseded, not_netted, null]
        superseded_reason:
          type: string
          nullable: true
          enum: [replace, batch, pre_ledger, replay, reevaluation, null]
        superseded_by:
          type: integer
          nullable: true
          description: The row that replaced this one, when there is one.
        explanation:
          type: string
          nullable: true
          description: The reason as a sentence; null when the row counts.
        source:
          $ref: "#/components/schemas/ConversionSource"
        source_label:
          type: string
        source_ref:
          type: string
          nullable: true
        linked_to:
          type: object
          nullable: true
          description: |
            `source_ref` resolved within the click's account. `type` is
            `goal` (`goal_id`, `goal_version`, `name`, `archived`),
            `upload_batch` (`batch_id`, `file_name`, `uploaded_at`),
            `conversion` (`conv_id`), `api_key` (`key_digest`,
            `key_created_at`, `revoked`) or `unknown`; `label` names it in
            words.
          properties:
            type:
              type: string
              enum: [goal, upload_batch, conversion, api_key, unknown]
            label:
              type: string
          additionalProperties: true
        event_name:
          type: string
          nullable: true
        transaction_id:
          type: string
          nullable: true
        reverses_conv_id:
          type: integer
          nullable: true
        conv_time:
          type: integer

    ClickConversionsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ClickConversion"
        click:
          type: object
          properties:
            click_id:
              type: integer
            campaign_id:
              type: integer
            campaign_name:
              type: string
              nullable: true
            payout_mode:
              type: string
              enum: [replace, accumulate]
            lead:
              type: boolean
              description: The lead flag the reports show.
            click_payout:
              type: number
              description: The value the reports show.
            ledger_state:
              type: string
              enum: [ledger, pre_ledger]
            ledger_value:
              type: number
              nullable: true
              description: What the counted rows add up to; null when none counts.
            matches_click:
              type: boolean
              description: Whether the reports' value is what the counted rows add up to.
            rows:
              type: integer
            counted_rows:
              type: integer

    # ── Update (the UI's Update section) ───────────────────────────────

    ClickCpcUpdate:
      type: object
      required: [from, to, cpc]
      properties:
        from:
          type: string
          description: The first day, YYYY-MM-DD, in the account's time zone (from 00:00:00).
          example: "2026-10-01"
        to:
          type: string
          description: The last day, YYYY-MM-DD, in the account's time zone (to 23:59:59).
          example: "2026-10-07"
        cpc:
          description: |
            What each click cost, in dollars: up to two whole digits and five
            decimals (at most 99.99999, what `click_cpc` holds). A string is
            read exactly; a JSON number only when it is exactly a value of
            five decimals or fewer (`0.125` is, `0.123456` is a 422).
          oneOf:
            - type: string
              example: "0.25"
            - type: number
        aff_network_id: {type: integer, description: "Only this category's campaigns (GET /aff-networks); 0 or absent: every one."}
        aff_campaign_id: {type: integer, description: "Only this campaign (GET /campaigns); 0 or absent: every one."}
        ppc_network_id: {type: integer, description: "Only this traffic source (GET /ppc-networks); 0 or absent: every one."}
        ppc_account_id: {type: integer, description: "Only this traffic source account (GET /ppc-accounts); 0 or absent: every one."}
        landing_page_id: {type: integer, description: "Only this landing page (GET /landing-pages); 0 or absent: every one."}
        text_ad_id: {type: integer, description: "Only this text ad (GET /text-ads); 0 or absent: every one."}
        method_of_promotion:
          type: string
          enum: ["", directlink, landingpage]
          description: Direct links only, landing pages only, or both ("", the default).
        expect_clicks:
          type: integer
          minimum: 0
          description: Required to write — the check's `matching`. Ignored in a dry run.
        through_click_id:
          type: integer
          minimum: 0
          description: Required to write — the check's `through_click_id`. Ignored in a dry run.

    ClickCpcUpdateResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            dry_run: {type: boolean}
            matching: {type: integer, description: "The clicks counted: by the check, or the count the update confirmed."}
            through_click_id: {type: integer, description: "The highest click id among them (0 when none)."}
            updated:
              type: integer
              description: |
                Only on an update: the clicks whose cost changed (a click that
                already cost this much is not counted).
            cpc: {type: string, description: "The CPC as stored, five decimals.", example: "0.25000"}
            from: {type: string}
            to: {type: string}
            from_time: {type: integer, description: "The window's first second, unix time."}
            to_time: {type: integer, description: "The window's last second, unix time."}
            timezone: {type: string, description: "The account's time zone the days were read in.", example: America/New_York}
            filters:
              type: object
              description: Each filter as applied, `{id, name}` (id 0 and "Every …" when not narrowed), and `method_of_promotion` as `{value, name}`.
              additionalProperties:
                type: object

    SubidList:
      type: object
      required: [subids]
      properties:
        subids:
          type: array
          maxItems: 5000
          description: |
            One subid (a click id) per item, as strings or integers; items are
            trimmed and blank ones skipped. Any other type is a 422.
          items:
            oneOf:
              - type: string
              - type: integer
          example: ["940001", "940002"]

    SubidLine:
      type: object
      properties:
        line: {type: integer, description: "The item's 1-based position in `subids`."}
        subid: {type: string}
        click_id: {type: integer, nullable: true}
        status:
          type: string
          enum: [marked, would_mark, cleared, would_clear, already_converted, not_found, not_a_subid, duplicate_in_list]
        first_line: {type: integer, description: "For duplicate_in_list: the earlier item with the same click."}
        conversions: {type: integer, description: "In a delete dry run: the click's live conversions."}

    SubidMarkResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            dry_run: {type: boolean}
            marked: {type: integer, description: "Absent in a dry run, which counts would_mark."}
            would_mark: {type: integer}
            already_converted: {type: integer}
            not_found: {type: integer}
            not_a_subid: {type: integer}
            duplicate_in_list: {type: integer}
            lines:
              type: array
              items:
                $ref: "#/components/schemas/SubidLine"

    SubidDeleteResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            dry_run: {type: boolean}
            cleared: {type: integer, description: "The account's clicks cleared. Absent in a dry run, which counts would_clear."}
            would_clear: {type: integer}
            conversions: {type: integer, description: "In a dry run: the live conversions the delete would clear."}
            not_found: {type: integer}
            not_a_subid: {type: integer}
            duplicate_in_list: {type: integer}
            lines:
              type: array
              items:
                $ref: "#/components/schemas/SubidLine"

    SubidReset:
      type: object
      required: [aff_network_id]
      properties:
        aff_network_id: {type: integer, description: "The category whose subids to reset (GET /aff-networks)."}
        aff_campaign_id: {type: integer, description: "Only this campaign of the category (GET /campaigns); 0 or absent: every campaign in it."}

    SubidResetResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            dry_run: {type: boolean}
            matching: {type: integer, description: "In a dry run: the converted clicks the reset would clear."}
            cleared: {type: integer, description: "On a reset: the clicks cleared."}
            aff_network: {type: object, properties: {id: {type: integer}, name: {type: string}}}
            aff_campaign: {type: object, nullable: true, properties: {id: {type: integer}, name: {type: string}}}

    RevenueUpload:
      type: object
      required: [csv]
      properties:
        csv:
          type: string
          description: The report's text, a CSV with a header line (comma-separated, double-quoted fields).
          example: "Sub ID,Order,Commission\n940001,A-1,$1.50\n"
        file_name:
          type: string
          description: The name the upload batch is listed under (at most 255 characters kept); default "api-upload.csv".
        subid_column:
          description: The subid column, a 0-based index or a header name. Guessed from the header when absent.
          oneOf:
            - type: integer
              minimum: 0
            - type: string
        amount_column:
          description: The commission column, a 0-based index or a header name. Guessed from the header when absent.
          oneOf:
            - type: integer
              minimum: 0
            - type: string

    RevenueUploadResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            dry_run: {type: boolean}
            batch_id: {type: integer, nullable: true, description: "The upload batch (null in a dry run)."}
            recorded: {type: integer, description: "Lines recorded. Absent in a dry run, which counts would_record."}
            would_record: {type: integer}
            skipped: {type: integer}
            columns:
              type: object
              properties:
                subid: {type: object, properties: {index: {type: integer}, header: {type: string}}}
                amount: {type: object, properties: {index: {type: integer}, header: {type: string}}}
                guessed: {type: array, items: {type: string}, description: "subid_column and/or amount_column when read from the header."}
            totals:
              type: array
              description: Each click's sum of this report's recorded lines.
              items:
                type: object
                properties:
                  click_id: {type: integer}
                  total: {type: string, example: "3.75000"}
            lines:
              type: array
              description: The lines not recorded (skipped, or the header); the recorded ones are in the counts and `totals`.
              items:
                type: object
                properties:
                  line: {type: integer, description: "The CSV record's number, the header being 1."}
                  subid: {type: string}
                  amount: {type: string}
                  status: {type: string, enum: [skipped, header]}
                  reason: {type: string, description: "Why a line was skipped (or read as the header)."}

    LtvCustomerCrm:
      type: object
      additionalProperties: false
      description: |
        CRM fields applied when the call creates the customer. Each is a
        string (a whole number is read as its digits) or null, at most as
        long as its column; any other key is a 422 naming it
        (`customer_crm.frist_name`).
      properties:
        first_name: {type: string, nullable: true, maxLength: 100}
        last_name: {type: string, nullable: true, maxLength: 100}
        email: {type: string, nullable: true, maxLength: 255, format: email}
        phone: {type: string, nullable: true, maxLength: 50}
        company: {type: string, nullable: true, maxLength: 255}
        address_line1: {type: string, nullable: true, maxLength: 255}
        address_line2: {type: string, nullable: true, maxLength: 255}
        city: {type: string, nullable: true, maxLength: 100}
        region: {type: string, nullable: true, maxLength: 100}
        postal_code: {type: string, nullable: true, maxLength: 20}
        country:
          type: string
          nullable: true
          maxLength: 2
          description: A two-letter country code, e.g. US

    LtvLineItem:
      type: object
      additionalProperties: false
      description: |
        A product line item on the customer's revenue event. Any other key is
        a 422 naming it with its place (`items.0.unit_pirce`). A number is a
        JSON number or a string holding one; anything else is refused, never
        stored as 0. The lines of a negative event are stored negative,
        amount and quantity, whichever sign is sent.
      properties:
        external_product_id:
          type: string
          maxLength: 191
          description: The product's key. This or `sku` is required.
        sku:
          type: string
          maxLength: 191
          description: >-
            With no `external_product_id` the sku is the product's key, stored
            as `sku:<sku>`, so it has at most 187 characters.
        name:
          type: string
          maxLength: 255
        quantity:
          type: number
          minimum: 0.001
          maximum: 999999999.999
          default: 1
        unit_price:
          type: number
          nullable: true
          minimum: -999999999.99999
          maximum: 999999999.99999
        amount:
          type: number
          nullable: true
          minimum: -99999999999.99999
          maximum: 99999999999.99999
          description: Default `unit_price × quantity`, which must fit too.
        price:
          type: number
          nullable: true
          minimum: 0
          maximum: 999999999.99999
          description: The product's list price in the catalog.

    LtvAlias:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        type:
          type: string
          default: custom
          enum: [email_md5, email_sha256, esp_id, merchant_id, subid, custom]
        value:
          type: string
          maxLength: 255
          description: The identifier; an email_md5 or email_sha256 value is its hex digest.

    SyncProfile:
      type: object
      additionalProperties: false
      description: An instance to sync from or to. Any other key is a 422 naming it (`source.nmae`).
      properties:
        url:
          type: string
        api_key:
          type: string
        name:
          type: string
          description: What the job and its audit record call it (default its URL)
      required:
      - url

    SyncEntityList:
      type: array
      description: >-
        Entity names. A value that is not a list, or a name that is not an
        entity (`prune_denylist.0`), is a 422.
      items:
        type: string
        enum: [aff-networks, ppc-networks, ppc-accounts, campaigns, landing-pages, text-ads, rotators, trackers]

    ConversionCreate:
      type: object
      required: [click_id]
      additionalProperties: false
      properties:
        click_id:
          type: integer
          description: Click ID to attribute the conversion to
        payout:
          type: number
          description: |
            Payout amount. Must be a number (a string that is not one is a
            422). When omitted: the click's current value in a `replace`
            campaign, the campaign payout in an `accumulate` campaign. For a
            reversal, the amount reversed (default: all of the sale).
        transaction_id:
          type: string
          description: |
            The network's or merchant's id for this conversion: kept on the
            row for reconciliation, and a repeat on the same click is the
            same conversion. For a reversal, the id of the sale it reverses.
        conv_time:
          type: integer
          description: Conversion timestamp (defaults to current time)
        status:
          type: string
          enum: [reversed]
          description: Record a reversal of the conversion named by `transaction_id`.
        reversal_id:
          type: string
          description: The network's id for the reversal. Without one, a sale can be reversed once.
        customer_id:
          type: integer
          minimum: 1
          description: The LTV customer the revenue belongs to; it wins over `customer_ref`.
        customer_ref:
          type: string
          description: Your id for the customer, resolved to one or created.
        customer_ref_type:
          type: string
          enum: [email_md5, email_sha256, esp_id, merchant_id, subid, custom]
          default: custom
        customer_crm:
          $ref: "#/components/schemas/LtvCustomerCrm"
        items:
          type: array
          description: |
            Line items on the customer's revenue event, so they need a
            customer: `customer_id` or `customer_ref` here, the customer
            already linked to the click, or the account's customer c-param.
            When none resolves the conversion is refused (`422` naming
            `items`, and `customer_crm` when sent, saying to send
            `customer_ref` or `customer_id`) and nothing is written; they
            used to be dropped and the conversion answered `201`.
          items:
            $ref: "#/components/schemas/LtvLineItem"

    ConversionResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Conversion"

    ConversionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Conversion"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ── Reports ────────────────────────────────────────────────────────

    ReportMetrics:
      type: object
      properties:
        total_clicks:
          type: integer
        total_click_throughs:
          type: integer
        total_leads:
          type: integer
        total_income:
          type: number
        total_cost:
          type: number
        total_net:
          type: number
        epc:
          type: number
          description: Earnings per click
        avg_cpc:
          type: number
          description: Average cost per click
        conv_rate:
          type: number
          description: Conversion rate (percentage)
        roi:
          type: number
          description: Return on investment (percentage)
        cpa:
          type: number
          description: Cost per acquisition

    # ── Rotators ───────────────────────────────────────────────────────

    Rotator:
      type: object
      properties:
        id:
          type: integer
        public_id:
          type: integer
        user_id:
          type: integer
        name:
          type: string
        default_url:
          type: string
          nullable: true
          description: "An http(s) URL. One destination: send at most one of default_url, default_campaign, default_lp."
        default_campaign:
          type: integer
          nullable: true
          description: One of your live campaigns.
        default_lp:
          type: integer
          nullable: true
          description: One of your live landing pages.
        auto_monetizer:
          type: string
          nullable: true
          description: '"true" when the default is the auto-monetizer.'

    RotatorCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        default_url:
          type: string
          nullable: true
          description: "An http(s) URL. One destination: send at most one of default_url, default_campaign, default_lp."
        default_campaign:
          type: integer
          nullable: true
          description: One of your live campaigns.
        default_lp:
          type: integer
          nullable: true
          description: One of your live landing pages.

    RotatorUpdate:
      type: object
      description: Naming any of default_url, default_campaign, default_lp replaces the whole default and clears the others (and the auto-monetizer).
      properties:
        name:
          type: string
        default_url:
          type: string
          nullable: true
          description: "An http(s) URL. One destination: send at most one of default_url, default_campaign, default_lp."
        default_campaign:
          type: integer
          nullable: true
          description: One of your live campaigns.
        default_lp:
          type: integer
          nullable: true
          description: One of your live landing pages.

    RotatorRule:
      type: object
      properties:
        id:
          type: integer
        rotator_id:
          type: integer
        rule_name:
          type: string
        splittest:
          type: integer
        status:
          type: integer
        criteria:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              rotator_id:
                type: integer
              rule_id:
                type: integer
              type:
                type: string
                enum: [country, region, city, isp, ip, platform, device, browser]
              statement:
                type: string
                enum: [is, is_not]
              value:
                type: string
        redirects:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              rule_id:
                type: integer
              redirect_url:
                type: string
              redirect_campaign:
                type: integer
              redirect_lp:
                type: integer
              weight:
                type: integer
              name:
                type: string

    RotatorRuleCreate:
      type: object
      required: [rule_name]
      properties:
        rule_name:
          type: string
        splittest:
          type: integer
          default: 0
        status:
          type: integer
          default: 1
        criteria:
          type: array
          items:
            type: object
            required: [type, value]
            properties:
              type:
                type: string
                enum: [country, region, city, isp, ip, platform, device, browser]
              statement:
                type: string
                enum: [is, is_not]
                default: is
              value:
                type: string
                description: >-
                  Comma-separated; countries as Name(CC), e.g. "United States(US)".
                  For type ip, single IPv4 or IPv6 addresses, stored in canonical
                  form; a value that is not an address (a range included) is a 422.
        redirects:
          type: array
          items:
            type: object
            description: Exactly one of redirect_url, redirect_campaign, redirect_lp.
            properties:
              redirect_url:
                type: string
                description: An http(s) URL.
              redirect_campaign:
                type: integer
                description: One of your live campaigns.
              redirect_lp:
                type: integer
                description: One of your live landing pages.
              weight:
                type: integer
                minimum: 0
                maximum: 100
                default: 100
              name:
                type: string

    RotatorResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Rotator"

    RotatorDetailResponse:
      type: object
      properties:
        data:
          allOf:
            - $ref: "#/components/schemas/Rotator"
            - type: object
              properties:
                rules:
                  type: array
                  items:
                    $ref: "#/components/schemas/RotatorRule"

    RotatorListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Rotator"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ── Attribution ────────────────────────────────────────────────────

    AttributionModelType:
      type: string
      description: The engine's model enum; nothing else is accepted anywhere.
      enum:
        - last_touch
        - first_touch
        - linear
        - time_decay
        - position_based

    AttributionDimension:
      type: string
      default: campaign
      enum:
        - campaign
        - traffic_source
        - landing_page
        - keyword
        - c1
        - c2
        - c3
        - c4
        - country
        - device
        - day

    AttributionWeightingConfig:
      type: object
      description: >-
        A JSON object (never a string). time_decay takes half_life_hours
        (0 < h <= 8760, default 48); position_based takes first_weight and
        last_weight (each 0–1, together at most 1, defaults 0.4/0.4; with two
        touches the ends renormalise); the other types take no keys. Unknown
        keys and non-numbers are refused.
      properties:
        half_life_hours:
          type: number
        first_weight:
          type: number
        last_weight:
          type: number
      additionalProperties: false

    AttributionModel:
      type: object
      properties:
        model_id:
          type: integer
        model_name:
          type: string
        model_slug:
          type: string
        model_type:
          $ref: "#/components/schemas/AttributionModelType"
        weighting_config:
          $ref: "#/components/schemas/AttributionWeightingConfig"
        lookback_days:
          type: integer
          description: Days before a conversion whose clicks can earn credit; the converting click always can.
        status:
          type: string
          enum: [active, inactive, invalid]
          description: invalid is set by the engine when a stored definition fails validation; status_reason says why.
        status_reason:
          type: string
          nullable: true
        is_default:
          type: boolean
        recompute_pending:
          type: boolean
          description: The worker has not yet recomputed this model's credits after its last change.
        created_at:
          type: integer
        updated_at:
          type: integer

    AttributionModelCreate:
      type: object
      required: [model_name, model_type]
      properties:
        model_name:
          type: string
        model_type:
          $ref: "#/components/schemas/AttributionModelType"
        weighting_config:
          $ref: "#/components/schemas/AttributionWeightingConfig"
        lookback_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
        status:
          type: string
          enum: [active, inactive]
          default: active
        is_default:
          type: boolean
          default: false

    AttributionModelUpdate:
      type: object
      additionalProperties: false
      properties:
        model_name:
          type: string
        model_type:
          $ref: "#/components/schemas/AttributionModelType"
        weighting_config:
          $ref: "#/components/schemas/AttributionWeightingConfig"
        lookback_days:
          type: integer
          minimum: 1
          maximum: 365
        status:
          type: string
          enum: [active, inactive]
        is_default:
          type: boolean
          description: Only true is accepted on a model that is already the default.

    AttributionModelResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AttributionModel"

    AttributionModelListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AttributionModel"

    AttributionBreakdownRow:
      type: object
      properties:
        key:
          type: string
          description: The dimension value (an id, or YYYY-MM-DD for day); "0" when the click has none.
        name:
          type: string
          nullable: true
        clicks:
          type: integer
        cost:
          type: string
          description: Sum of the dimension's own click costs in range.
        attributed_conversions:
          type: string
          description: Sum of credit (8 decimal places).
        attributed_revenue:
          type: string
          description: Sum of credited revenue (5 decimal places).
        roi:
          type: number
          nullable: true
        assisted_conversions:
          type: integer
        compare_attributed_conversions:
          type: string
        compare_attributed_revenue:
          type: string
        compare_roi:
          type: number
          nullable: true

    AttributionBreakdownResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AttributionBreakdownRow"
        totals:
          type: object
          properties:
            conversions:
              type: integer
            attributed_conversions:
              type: string
            attributed_revenue:
              type: string
            compare_attributed_conversions:
              type: string
            compare_attributed_revenue:
              type: string
        meta:
          type: object
          properties:
            group_by:
              type: string
            time_from:
              type: integer
            time_to:
              type: integer
            timezone:
              type: string
              description: >-
                The account's time zone (user_timezone; UTC when unset): the zone group_by=day's
                dates are in, and the one a date-valued time_from/time_to was read in.
              example: America/New_York
            cohort:
              type: string
              enum: [conversion, click]
              description: The cohort the credits and assists were read in.
            model:
              type: object
              description: The model read, or {mode:"effective", default_model_id} when none was named.
            compare_model:
              type: object
              nullable: true
            groups:
              type: integer
              description: >-
                How many groups the report has in total. data holds rows offset to
                offset + limit of them in attributed-revenue order; page while
                offset + rows returned < groups.
            limit:
              type: integer
            offset:
              type: integer
              description: The offset the rows start at (0 when none was sent).

    AttributionExportInput:
      type: object
      additionalProperties: false
      properties:
        group_by:
          $ref: "#/components/schemas/AttributionDimension"
        model_id:
          type: integer
          minimum: 1
          description: Default the account default model, stored as its id so the job reads a fixed model.
        compare_model_id:
          type: integer
          minimum: 1
        period:
          type: string
          enum: [today, yesterday, last7, last14, last30, last90, thismonth, lastmonth, thisyear, lastyear, alltime]
        time_from:
          type: integer
          description: Unix seconds; with time_to, instead of period. Default the last 30 days.
        time_to:
          type: integer
        run_at:
          type: integer
          description: Unix seconds, at most a year ahead; a past time means as soon as possible. Default now.
        webhook_url:
          type: string
          maxLength: 500
          description: https://host[:port][/path], spelled plainly (no user info, fragment or backslash); the host a DNS name or a canonical IP address that is public.
        webhook_secret:
          type: string
          minLength: 16
          maxLength: 255
          description: Printable ASCII, no spaces. Generated (64 hex characters) when a webhook is given without one.

    AttributionExport:
      type: object
      properties:
        export_id:
          type: integer
        model_id:
          type: integer
        compare_model_id:
          type: integer
          nullable: true
        group_by:
          type: string
        time_from:
          type: integer
        time_to:
          type: integer
        status:
          type: string
          enum: [pending, running, completed, failed]
        rows_exported:
          type: integer
          nullable: true
        file_ready:
          type: boolean
        download_path:
          type: string
          nullable: true
        webhook_url:
          type: string
          nullable: true
        webhook_signed:
          type: boolean
        webhook_secret:
          type: string
          description: Only in the create response.
        webhook_status_code:
          type: integer
          nullable: true
        attempts:
          type: integer
          description: Runs so far; a retryable webhook failure (no connection, timeout, 5xx, 408, 429) is retried after 1 and then 2 minutes, 3 runs in all.
        last_error:
          type: string
          nullable: true
        run_at:
          type: integer
        started_at:
          type: integer
          nullable: true
        completed_at:
          type: integer
          nullable: true
        created_at:
          type: integer

    AttributionJourneyMetrics:
      type: object
      properties:
        conversions:
          type: integer
        one_touch:
          type: integer
        one_touch_share:
          type: number
        truncated:
          type: integer
          description: Journeys the 25-touch cap cut.
        unidentified:
          type: integer
          description: Converting clicks with no visitor key (one touch by construction).
        average_touches:
          type: number
        length_distribution:
          type: array
          items:
            type: object
            properties:
              touches:
                type: integer
              conversions:
                type: integer
        time_to_convert:
          type: object
          additionalProperties:
            type: integer
        one_touch_by_browser:
          type: array
          items:
            type: object
            properties:
              browser:
                type: string
              conversions:
                type: integer
              one_touch:
                type: integer
              one_touch_share:
                type: number
        recent_conversions:
          type: array
          description: The newest 25 attributed conversions in range, the entry points of a journey drill-down.
          items:
            type: object
            properties:
              conv_id:
                type: integer
              conv_time:
                type: integer
              touches:
                type: integer
              identified:
                type: boolean
              truncated:
                type: boolean
              amount:
                type: string
                description: What the conversion counts for in attribution, the amount its credits sum to - its recorded amount net of the reversals naming it.
              recorded_amount:
                type: string
                description: The conversion's own recorded amount, before reversals.
              counted:
                type: boolean
              campaign_name:
                type: string
                nullable: true

    AttributionConversionJourney:
      type: object
      properties:
        conv_id:
          type: integer
        click_id:
          type: integer
        amount:
          type: string
          description: |
            What the conversion counts for in attribution, and so what each
            model's revenue column sums to: the recorded amount net of the
            reversals naming it (a $10 sale reversed by $4 is 6.00000), or
            0.00000 when it does not count.
        recorded_amount:
          type: string
          description: The conversion's own recorded amount, before reversals (negative for a reversal row).
        counted:
          type: boolean
          description: false when the conversion counts for nothing - not payable, superseded, deleted, itself a reversal, or reversed in full.
        conv_time:
          type: integer
        journey:
          type: object
          nullable: true
          description: null when the conversion does not count (not payable, superseded, deleted or fully reversed) or has not been processed yet.
          properties:
            touches:
              type: integer
            built_lookback_days:
              type: integer
            built_at:
              type: integer
            truncated:
              type: boolean
            identified:
              type: boolean
        touches:
          type: array
          items:
            type: object
            properties:
              position:
                type: integer
              click_id:
                type: integer
              click_time:
                type: integer
              campaign_id:
                type: integer
                nullable: true
              campaign_name:
                type: string
                nullable: true
              ppc_account_id:
                type: integer
                nullable: true
              ppc_account_name:
                type: string
                nullable: true
              signals:
                type: array
                items:
                  type: string
                  enum: [vid, lpid, cust]
        credits:
          type: array
          items:
            type: object
            properties:
              model_id:
                type: integer
              model_name:
                type: string
              model_type:
                $ref: "#/components/schemas/AttributionModelType"
              touches:
                type: array
                items:
                  type: object
                  properties:
                    position:
                      type: integer
                    click_id:
                      type: integer
                    credit:
                      type: string
                    revenue:
                      type: string
        pending:
          type: object
          nullable: true
          properties:
            reason:
              type: string
            enqueued_at:
              type: integer
            attempts:
              type: integer
            last_error:
              type: string
              nullable: true
            retry_at:
              type: integer

    AttributionQueue:
      type: object
      properties:
        pending:
          type: integer
        oldest_enqueued_at:
          type: integer
          nullable: true
        failing:
          type: integer
        merges_awaiting_requeue:
          type: integer
        models_awaiting_recompute:
          type: integer
        rows:
          type: array
          items:
            type: object
            properties:
              conv_id:
                type: integer
              reason:
                type: string
                enum: [recorded, counted_state, identity_merge, rebuild_journey, model_changed]
              enqueued_at:
                type: integer
              attempts:
                type: integer
              last_error:
                type: string
                nullable: true
              retry_at:
                type: integer

    # ── Users ──────────────────────────────────────────────────────────

    User:
      type: object
      properties:
        user_id:
          type: integer
        user_fname:
          type: string
        user_lname:
          type: string
        user_name:
          type: string
        user_email:
          type: string
        user_timezone:
          type: string
        user_active:
          type: integer
        user_deleted:
          type: integer
        user_time_register:
          type: integer

    UserCreate:
      type: object
      required: [user_name, user_email, user_pass]
