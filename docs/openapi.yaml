      description: Needs the `ltv:read` scope.
      operationId: ltvListCustomers
      parameters:
      - $ref: '#/components/parameters/period'
      - $ref: '#/components/parameters/timeFrom'
      - $ref: '#/components/parameters/timeTo'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: sort
        in: query
        schema:
          type: string
          default: total_revenue
        description: Column to sort by
      - name: dir
        in: query
        schema:
          type: string
          default: DESC
          enum:
          - ASC
          - DESC
      - name: q
        in: query
        schema:
          type: string
        description: Search email, name or external id
      - name: segment
        in: query
        schema:
          type: string
        description: Only this segment
      responses:
        '200':
          description: Customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
      - LTV
      summary: Create or update a customer
      description: Needs the `ltv:write` scope. LTV writes do not honor `Idempotency-Key` (`POST /ltv/revenue` takes
        an `idempotency_key` field instead) and have no `dry_run` preview. The customer is resolved from `customer_id`,
        or from `customer_ref` with `customer_ref_type`, and created when none matches; the whole write is one transaction.
        Queues a `customer.updated` webhook.
      operationId: ltvUpsertCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  type: integer
                customer_ref:
                  type: string
                customer_ref_type:
                  type: string
                  description: What customer_ref is (email, external id, …)
                email:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                phone:
                  type: string
                company:
                  type: string
                address_line1:
                  type: string
                address_line2:
                  type: string
                city:
                  type: string
                region:
                  type: string
                postal_code:
                  type: string
                country:
                  type: string
                aliases:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        default: custom
                      value:
                        type: string
                    required:
                    - value
                custom_fields:
                  type: object
                  additionalProperties: true
                  description: Custom field values by field key
              additionalProperties: true
      responses:
        '201':
          description: The customer, as `GET /ltv/customers/{id}` shows it
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

