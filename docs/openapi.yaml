    # ── SKAN (SKAdNetwork) ─────────────────────────────────────────────

    AttributionApp:
      type: object
      properties:
        platform:
          type: string
          enum: [ios]
          default: ios
          description: |
            The store the app is on, stored lower-case. Derived from an App
            Store link when one is pasted, so a caller rarely sets it.

            Only a platform this install can receive postbacks for is
            accepted; `ios` is the one today. `android` is recognised and
            refused with a sentence saying there is no Android receiver to
            point an app at, rather than "you typed it wrong". Any other
            value is refused with the list of accepted ones. Compared
            case-insensitively, so `iOS` is accepted and stored as `ios`.
        attribution_app_id:
          type: integer
          description: Internal registration id — the `{id}` in `/attribution/apps/{id}`
        app_id:
          type: integer
          description: Numeric App Store id of the advertised app (unique across the install)
        app_name:
          type: string
        notes:
          type: string
          nullable: true
        accept_development_postbacks:
          type: integer
          enum: [0, 1]
          description: >-
            1 = postbacks signed with Apple's development keys (AdAttributionKit)
            store as trusted (`signature_valid = 1`) for this app and count in the
            report — for integration-testing your own build; 0 (default) = they
            store flagged `development` and count nowhere. SKAdNetwork has no
            development key, so this never affects SKAdNetwork rows.
        schema_token:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: Bearer capability the iOS build sends as `X-P202-Schema-Token`; owner-only, redacted from staged previews and apply results
        user_id:
          type: integer
        version:
          type: string
          description: Content hash of the record; also its ETag
        etag:
          type: string

    AttributionAppCreate:
      type: object
      required: [app_id, app_name]
      properties:
        platform:
          type: string
          enum: [ios]
          default: ios
          description: |
            The store the app is on, stored lower-case. Derived from an App
            Store link when one is pasted, so a caller rarely sets it.

            Only a platform this install can receive postbacks for is
            accepted; `ios` is the one today. `android` is recognised and
            refused with a sentence saying there is no Android receiver to
            point an app at, rather than "you typed it wrong". Any other
            value is refused with the list of accepted ones. Compared
            case-insensitively, so `iOS` is accepted and stored as `ios`.
        app_id:
          type: integer
          description: Numeric App Store id (the number in the app's App Store URL)
        app_name:
          type: string
          maxLength: 255
        notes:
          type: string
          maxLength: 500
        accept_development_postbacks:
          type: integer
          enum: [0, 1]
          default: 0
          description: Trust development-signed postbacks for this app (see `AttributionApp`)

    AttributionAppUpdate:
      type: object
      properties:
        platform:
          type: string
          enum: [ios]
          default: ios
          description: |
            The store the app is on, stored lower-case. Derived from an App
            Store link when one is pasted, so a caller rarely sets it.

            Only a platform this install can receive postbacks for is
            accepted; `ios` is the one today. `android` is recognised and
            refused with a sentence saying there is no Android receiver to
            point an app at, rather than "you typed it wrong". Any other
            value is refused with the list of accepted ones. Compared
            case-insensitively, so `iOS` is accepted and stored as `ios`.
        app_id:
          type: integer
        app_name:
          type: string
          maxLength: 255
        notes:
          type: string
          maxLength: 500
        accept_development_postbacks:
          type: integer
          enum: [0, 1]
          description: Trust development-signed postbacks for this app (see `AttributionApp`)

    AttributionAppResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AttributionApp"

    AttributionAppListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AttributionApp"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AttributionConversionValue:
      type: object
      description: Exactly one of `fine_value` / `coarse_value` is non-null.
      properties:
        rule_id:
          type: integer
        app_id:
          type: integer
          description: App Store id this rule applies to; `0` = account-wide default
        fine_value:
          type: integer
          nullable: true
          minimum: 0
          maximum: 63
        coarse_value:
          type: string
          nullable: true
          enum: [low, medium, high, null]
        event_name:
          type: string
        revenue:
          type: string
          description: Decimal string (5 places), e.g. `"49.99000"`
        user_id:
          type: integer
        version:
          type: string
        etag:
          type: string

    AttributionConversionValueCreate:
      type: object
      required: [event_name]
      description: Set `fine_value` (0–63) or `coarse_value` — one of them, not both and not neither (`422` otherwise).
      properties:
        app_id:
          type: integer
          default: 0
          description: App Store id, or `0` for the account-wide default rules
        fine_value:
          type: integer
          minimum: 0
          maximum: 63
        coarse_value:
          type: string
          enum: [low, medium, high]
        event_name:
          type: string
          maxLength: 255
        revenue:
          type: number
          minimum: 0
          default: 0
          description: Revenue attributed per decoded postback

    AttributionConversionValueUpdate:
      type: object
      description: |
        An absent field is kept. An explicit `null` on `fine_value` or
        `coarse_value` clears it, and must arrive together with the
        replacement value of the other kind so the rule still maps exactly
        one value.
      properties:
        app_id:
          type: integer
        fine_value:
          type: integer
          nullable: true
          minimum: 0
          maximum: 63
        coarse_value:
          type: string
          nullable: true
          enum: [low, medium, high, null]
        event_name:
          type: string
          maxLength: 255
        revenue:
          type: number
          minimum: 0

    AttributionConversionValueResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AttributionConversionValue"

    AttributionConversionValueListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AttributionConversionValue"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AttributionPostback:
      type: object
      description: |
        One stored postback. Every protocol's rows share this shape: the
        generic columns (`protocol`, identity, window, `did_win`,
        `conversion_type`, `ad_interaction_type`, signature verdict) are
        filled for all of them; the protocol-specific columns mirror that
        protocol's parameters with hyphens as underscores and are `null`
        for the others. Fields Apple withheld for privacy are `null`.
      properties:
        postback_id:
          type: integer
        user_id:
          type: integer
          description: Owning user (`0` rows are unclaimed and not visible through the API)
        received_at:
          type: integer
          description: Unix timestamp the receiver stored it
        protocol:
          type: string
          enum: [skadnetwork, adattributionkit]
          description: Which framework signed and delivered the postback
        version:
          type: string
          nullable: true
          description: SKAdNetwork postback version, e.g. `4.0`; `null` for AdAttributionKit (unversioned)
        ad_network_id:
          type: string
        transaction_id:
          type: string
        app_id:
          type: integer
        source_identifier:
          type: string
          nullable: true
          description: SKAN 4 hierarchical source identifier (1–4 digits)
        campaign_id:
          type: integer
          nullable: true
          description: SKAN ≤ 3 campaign id
        conversion_value:
          type: integer
          nullable: true
          minimum: 0
          maximum: 63
        coarse_conversion_value:
          type: string
          nullable: true
          enum: [low, medium, high, null]
        postback_sequence_index:
          type: integer
          nullable: true
          description: Conversion window, 0–2 (SKAdNetwork 4 and AdAttributionKit)
        conversion_type:
          type: string
          nullable: true
          enum: [download, redownload, re-engagement, null]
          description: >-
            Protocol-neutral conversion kind: SKAdNetwork's `redownload` flag
            read as `download`/`redownload`; AdAttributionKit's `conversion-type`
            as sent (`re-engagement` exists only there)
        redownload:
          type: integer
          nullable: true
          description: SKAdNetwork's raw flag — 1 = redownload, 0 = first install; `null` for AdAttributionKit
        did_win:
          type: integer
          nullable: true
          description: 1 = winning postback, 0 = losing; `null` for SKAN ≤ 2.2 (counted as wins)
        ad_interaction_type:
          type: string
          nullable: true
          enum: [view, click, null]
          description: >-
            Protocol-neutral interaction kind: SKAdNetwork's `fidelity-type`
            (1 = click, 0 = view); AdAttributionKit's `ad-interaction-type` as
            sent. `null` when the postback carried neither (SKAdNetwork 2.1)
        source_app_id:
          type: integer
          nullable: true
          description: Publisher app (SKAdNetwork `source-app-id`, AdAttributionKit `publisher-item-identifier`)
        source_domain:
          type: string
          nullable: true
          description: SKAN 4 web-ad source domain
        marketplace_id:
          type: string
          nullable: true
          description: AdAttributionKit `marketplace-identifier` (e.g. `com.apple.AppStore`); `null` for SKAdNetwork
        fidelity_type:
          type: integer
          nullable: true
          description: SKAdNetwork's raw value — 1 = StoreKit-rendered or web ad, 0 = view-through
        country_code:
          type: string
          nullable: true
        signature_state:
          type: string
          enum: [valid, invalid, unverifiable, development]
          description: >-
            What the verifier established: `valid` against Apple's production key,
            `invalid` (wrong or forged), `unverifiable` (unknown version or key,
            or no OpenSSL), `development` (verified against one of Apple's
            AdAttributionKit development keys)
        signature_valid:
          type: integer
          nullable: true
          description: >-
            The trust bit reports key on: 1 = verified against Apple's production
            key (or development-signed for an app that opted in), 0 = wrong or
            forged, `null` = nobody vouched for it (unverifiable, or development-
            signed without the opt-in)
        key_id:
          type: string
          nullable: true
          description: The signing key the postback named (AdAttributionKit JWS `kid`); `null` for SKAdNetwork
        remote_ip:
          type: string
          description: Display value (proxy-header aware); not the rate-limit identity

    AttributionPostbackDetail:
      allOf:
        - $ref: "#/components/schemas/AttributionPostback"
        - type: object
          properties:
            attribution_signature:
              type: string
              description: Apple's base64 ECDSA signature as received (sanitized; up to 4096 chars), for forensics

    AttributionPostbackResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/AttributionPostbackDetail"

    AttributionPostbackListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AttributionPostback"
        pagination:
          $ref: "#/components/schemas/Pagination"

    AttributionReportGroup:
      type: object
      description: |
        One report group. Which dimension fields are present depends on
        `group_by`: `date` (day), `app_id` + `app_name` (app),
        `ad_network_id` (ad-network), `source_identifier` + `campaign_id`
        (source), `country_code` (country), `version` (version),
        `protocol` (protocol), `conversion_type` (conversion-type).
      properties:
        date:
          type: string
          format: date
          description: UTC day (day mode)
        app_id:
          type: integer
        app_name:
          type: string
          nullable: true
          description: From the app registry (app mode); `null` when unregistered
        ad_network_id:
          type: string
        source_identifier:
          type: string
          nullable: true
        campaign_id:
          type: integer
          nullable: true
        country_code:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        protocol:
          type: string
          enum: [skadnetwork, adattributionkit]
        conversion_type:
          type: string
          nullable: true
          enum: [download, redownload, re-engagement, null]
        postbacks:
          type: integer
          description: Unique postbacks in the group, regardless of signature state
        losses:
          type: integer
          description: Unique losing postbacks (`did_win = 0`, trusted rows only)
        installs:
          type: integer
          description: Unique winning first-window `download` postbacks (trusted rows only)
        redownloads:
          type: integer
          description: Unique winning first-window `redownload` postbacks (trusted rows only)
        reengagements:
          type: integer
          description: Unique winning first-window `re-engagement` postbacks — AdAttributionKit only (trusted rows only)
        signature_valid_count:
          type: integer
          description: Unique postbacks with `signature_valid = 1`
        signature_invalid_count:
          type: integer
          description: Unique postbacks with `signature_valid = 0`
        signature_unverified_count:
          type: integer
          description: Unique postbacks with `signature_valid = null`, including development-signed ones of apps that did not opt in
        signature_development_count:
          type: integer
          description: Unique postbacks verified against an AdAttributionKit development key, whatever their trust bit — they also count in the valid or unverified column
        measurable:
          type: integer
          description: Unique winning postbacks carrying a conversion value, across all three conversion windows (so it can exceed installs, which counts first-window postbacks only); a replayed postback decodes once, through its first-received copy
        decoded:
          type: integer
        undecoded:
          type: integer
          description: Value present but no matching rule
        null_conversion_values:
          type: integer
          description: Value withheld by Apple's privacy tier
        decoded_revenue:
          type: number
        events:
          type: object
          description: Per-event counts and revenue, keyed by event name (always an object, `{}` when empty)
          additionalProperties:
            type: object
            properties:
              count:
                type: integer
              revenue:
                type: number

    AttributionReportTotals:
      type: object
      description: |
        The same metrics as a group, over the whole window and ungrouped.

        Read the headline numbers from here rather than summing `groups`.
        A sum gives a different answer for two reasons: every metric counts
        *unique* postbacks per group, so one postback stored twice (a replay
        whose unsigned fields differ) counts once in each day it landed in;
        and a truncated report is missing whole groups besides. These come
        from one ungrouped query over the same filters, so neither applies.

        The conversion-value decode (`measurable`, `decoded`, `events`,
        `decoded_revenue`) is per-group only and is not repeated here.
      properties:
        postbacks:
          type: integer
        losses:
          type: integer
        installs:
          type: integer
        redownloads:
          type: integer
        reengagements:
          type: integer
        signature_valid_count:
          type: integer
        signature_invalid_count:
          type: integer
        signature_unverified_count:
          type: integer
        signature_development_count:
          type: integer

    AttributionReportResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            group_by:
              type: string
              enum: [day, app, ad-network, source, country, version, protocol, conversion-type]
            groups:
              type: array
              items:
                $ref: "#/components/schemas/AttributionReportGroup"
            totals:
              $ref: "#/components/schemas/AttributionReportTotals"
        meta:
          type: object
          properties:
            timezone:
              type: string
              example: UTC
            trusted:
              type: string
              enum: [verified-only, as-filtered]
              description: Which rows the headline metrics counted
            groups_truncated:
              type: boolean
              description: More groups matched than `limit` allowed
            notes:
              type: string

    SkadnetworkPostback:
      type: object
      description: |
        A SKAdNetwork postback as Apple's devices send it (hyphenated
        keys). Versions 2.1–4.0 verify; which fields are present depends on
        the version and Apple's privacy tier. The conversion values are not
        covered by Apple's signature in any version.
      required: [version, ad-network-id, transaction-id, app-id, attribution-signature]
      properties:
        version:
          type: string
          example: "4.0"
        ad-network-id:
          type: string
          maxLength: 100
        transaction-id:
          type: string
          maxLength: 64
        app-id:
          type: integer
        source-identifier:
          type: string
          description: SKAN 4; 1–4 digits
        campaign-id:
          type: integer
          description: SKAN ≤ 3
        conversion-value:
          type: integer
          minimum: 0
          maximum: 63
        coarse-conversion-value:
          type: string
          enum: [low, medium, high]
        postback-sequence-index:
          type: integer
          enum: [0, 1, 2]
        redownload:
          type: boolean
        did-win:
          type: boolean
        source-app-id:
          type: integer
        source-domain:
          type: string
        fidelity-type:
          type: integer
          enum: [0, 1]
        country-code:
          type: string
        attribution-signature:
          type: string
          description: Base64 ECDSA (P-256/SHA-256) signature over the version-specific field composition

    AttributionVerifyResponse:
      type: object
      description: |
        The protocol is detected from the body: a `jws-string` key means
        AdAttributionKit (the JWS alone is enough), anything else is
        verified as SKAdNetwork. The SKAdNetwork fields
        (`signed_message_base64`, `verifiable_versions`) and the
        AdAttributionKit fields (`key_id`, `header`, `payload`,
        `known_key_ids`, `development_key_ids`) are present for their own
        protocol only.
      properties:
        data:
          type: object
          properties:
            protocol:
              type: string
              enum: [skadnetwork, adattributionkit]
            signature:
              type: string
              enum: [valid, invalid, unverifiable, development]
            signed_message_base64:
              type: string
              nullable: true
              description: SKAdNetwork — base64 of the exact byte string Apple signs for this version (fields joined with U+2063); `null` when the version is unverifiable
            verifiable_versions:
              type: array
              items:
                type: string
              example: ["2.1", "2.2", "3.0", "4.0"]
            key_id:
              type: string
              description: AdAttributionKit — the JWS header's `kid`
              example: apple-development-identifier/1
            header:
              type: object
              description: AdAttributionKit — the decoded JWS header
            payload:
              type: object
              description: AdAttributionKit — the decoded JWS payload (the signed attribution fields)
            known_key_ids:
              type: array
              items:
                type: string
              example: ["apple-cas-identifier/0", "apple-development-identifier/0", "apple-development-identifier/1"]
            development_key_ids:
              type: array
              items:
                type: string
              example: ["apple-development-identifier/0", "apple-development-identifier/1"]

    AttributionSchemaResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            app_id:
              type: integer
            schema_version:
              type: string
              description: Content hash of the mapping; also the ETag (unquoted)
            events:
              type: object
              description: Event name → values to set when the app reports that event; always an object
              additionalProperties:
                type: object
                properties:
                  fine_value:
                    type: integer
                    nullable: true
                    minimum: 0
                    maximum: 63
                  coarse_value:
                    type: string
                    nullable: true
                    enum: [low, medium, high, null]
            generated_at:
              type: integer

    AttributionPostbackReceiptResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accepted:
              type: boolean
            duplicate:
              type: boolean
              description: A byte-identical retry of a postback already stored; nothing new was written
            signature:
              type: string
              enum: [valid, invalid, unverifiable, development]

    AdAttributionKitPostback:
      type: object
      description: |
        The JSON envelope an Apple device POSTs to the `AttributionCopyEndpoint`
        (Apple's "Identifying the parameters in a postback", AdAttributionKit).
        `jws-string` is signed by Apple; the other four fields are not, exactly
        as SKAdNetwork never signed conversion values. The JWS payload carries
        `postback-identifier`, `ad-network-identifier`, `advertised-item-identifier`,
        `impression-type`, `did-win`, `postback-sequence-index`, `conversion-type`
        (`download`, `redownload`, `re-engagement`) and `source-identifier`, plus
        the optional `publisher-item-identifier` and `marketplace-identifier`;
        its header carries `alg` (`ES256`) and `kid`.
      required: [jws-string, ad-interaction-type]
      properties:
        jws-string:
          type: string
          description: Compact JWS — header, payload and signature as unpadded base64url segments
          example: eyJraWQiOiJhcHBsZS1kZXZlbG9wbWVudC1pZGVudGlmaWVyXC8xIiwiYWxnIjoiRVMyNTYifQ..bAdNwKd6OfHK9tofvjjua4X_JPcFTxXPQSspD9gZkinw97pY7R1aI-LSjl-oxZZF3_K2H5JK5TSEBee4_1U4oQ
        conversion-value:
          type: integer
          minimum: 0
          maximum: 63
          description: Unsigned; withheld by Apple's postback data tier when absent
        coarse-conversion-value:
          type: string
          enum: [low, medium, high]
          description: Unsigned; withheld by the data tier when absent
        ad-interaction-type:
          type: string
          enum: [view, click]
          description: Unsigned
        country-code:
          type: string
          description: Unsigned ISO 3166 identifier; withheld by the data tier when absent
          example: US

    SkadnetworkVerifyRequest:
      type: object
      minProperties: 1
      additionalProperties: true
      description: |
        A SKAdNetwork postback submitted to `POST /attribution/verify`. The
        fields and their meanings are `SkadnetworkPostback`'s; what differs
        is that none of them is required here, so this schema deliberately
        does not repeat the list (repeating it is how the two drift apart).

        Verification reports what the body supports rather than refusing to
        look at it, so a partial or mistyped postback gets a verdict, not a
        validation error. Executed against the endpoint:
        `{"version": "4.0", "attribution-signature": "AA=="}` answers
        `invalid`, `{"attribution-signature": "AA=="}` answers
        `unverifiable`, and a full 4.0 body answers `invalid` — all 200.
        Only an empty object is a 422, which is what `minProperties` says.

        `SkadnetworkPostback` keeps its five required fields because the
        RECEIVER really does require them. Pointing this request body at
        that schema made the spec reject bodies the endpoint answers, and
        contradict this operation's own description.
    AdAttributionKitVerifyRequest:
      type: object
      description: |
        An AdAttributionKit postback submitted to `POST /attribution/verify`.
        Only `jws-string` is required here: the signature covers the JWS and
        nothing else, so the unsigned envelope fields of
        `AdAttributionKitPostback` (`conversion-value`,
        `coarse-conversion-value`, `ad-interaction-type`, `country-code`) may
        be left on a copied receiver body but do not affect the verdict. The
        receiver itself requires `ad-interaction-type`; this endpoint does not.
      required: [jws-string]
      properties:
        jws-string:
          type: string
          description: Compact JWS — header, payload and signature as unpadded base64url segments (see `AdAttributionKitPostback` for an example)

    SkadnetworkReceiverProbeResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              example: ready
            protocol:
              type: string
              example: skadnetwork
            endpoint:
              type: string
              example: skadnetwork-report-attribution
            accepts:
              type: string
    AdAttributionKitReceiverProbeResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              example: ready
            protocol:
              type: string
              example: adattributionkit
            endpoint:
              type: string
              example: appattribution-report-attribution
            accepts:
              type: string

