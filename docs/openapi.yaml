  # ─── Attribution ─────────────────────────────────────────────────────
  # Multi-touch attribution. Reads need the view_attribution_reports role
  # permission and model writes manage_attribution_models, on top of the
  # attribution:read / attribution:write key scope.

  /attribution/models:
    get:
      tags: [Attribution]
      summary: List attribution models
      description: Every account has exactly one default model (a last-touch model is created with the account). Credits are computed for every active model.
      operationId: listAttributionModels
      parameters:
        - name: type
          in: query
          description: Filter by model type
          schema:
            $ref: "#/components/schemas/AttributionModelType"
      responses:
        "200":
          description: The account's models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionModelListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Attribution]
      summary: Create an attribution model
      description: >-
        The attribution worker computes the new model's credits for existing
        conversions from their stored journeys (`recompute_pending` is true
        until it has). A lookback wider than a stored journey rebuilds that
        journey from the identity graph first. Honors `Idempotency-Key`.
      operationId: createAttributionModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributionModelCreate"
      responses:
        "201":
          description: Model created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionModelResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A model with the same name (slug) exists; the details name it.
        "422":
          $ref: "#/components/responses/ValidationError"

  /attribution/models/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Attribution]
      summary: Get an attribution model
      operationId: getAttributionModel
      responses:
        "200":
          description: Model details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionModelResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Attribution]
      summary: Update an attribution model
      description: >-
        Partial update. Changing model_type without sending weighting_config
        resets the config to the new type's defaults. A model cannot stop
        being the default (make another one the default instead), and the
        default cannot be deactivated. A change to what the model computes
        queues its recompute; deactivating it removes its credits.
      operationId: updateAttributionModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributionModelUpdate"
      responses:
        "200":
          description: Model updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionModelResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The new name collides with another model's.
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Attribution]
      summary: Delete an attribution model
      description: >-
        Hard delete of the model, its credits and its export jobs; campaigns
        that named it fall back to the account default. The default model
        cannot be deleted (409).
      operationId: deleteAttributionModel
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Model deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The model is the account default.

  /attribution/reports/breakdown:
    get:
      tags: [Attribution]
      summary: Attributed conversions, revenue, cost and ROI by a click dimension
      description: >-
        Credits for conversions whose conv_time is in range, grouped by a
        dimension of the credited clicks; clicks and cost from the
        dimension's own clicks whose click_time is in range; assisted
        conversions (journeys where the dimension had a touch before the
        converting click). Money values are exact decimal strings. Without
        model_id the report is "effective": each conversion under its
        campaign's model override when that model is active, otherwise the
        account default. Unknown parameters are refused.
      operationId: attributionBreakdown
      parameters:
        - name: group_by
          in: query
          schema:
            $ref: "#/components/schemas/AttributionDimension"
        - name: model_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: compare_model_id
          in: query
          description: A second model, returned side by side as compare_* columns.
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/attributionPeriod"
        - $ref: "#/components/parameters/attributionTimeFrom"
        - $ref: "#/components/parameters/attributionTimeTo"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: One row per dimension value, sorted by attributed revenue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionBreakdownResponse"
        "409":
          description: The model named is inactive or invalid and has no credits; the message gives the reason.
        "422":
          $ref: "#/components/responses/ValidationError"

  /attribution/reports/journeys:
    get:
      tags: [Attribution]
      summary: Journey metrics
      description: Length distribution, time to convert, truncated and unidentified journeys, and the one-touch share by the converting click's browser, for conversions in range.
      operationId: attributionJourneyMetrics
      parameters:
        - $ref: "#/components/parameters/attributionPeriod"
        - $ref: "#/components/parameters/attributionTimeFrom"
        - $ref: "#/components/parameters/attributionTimeTo"
      responses:
        "200":
          description: Journey metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttributionJourneyMetrics"
                  meta:
                    type: object

  /attribution/conversions/{id}/journey:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Attribution]
      summary: One conversion's journey explained
      description: The touches (oldest first, converting click last), the identity signals each click carried, every model's credit per touch, and the conversion's place in the worker's queue if it is waiting.
      operationId: attributionConversionJourney
      responses:
        "200":
          description: The journey
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttributionConversionJourney"
        "404":
          $ref: "#/components/responses/NotFound"

  /attribution/queue:
    get:
      tags: [Attribution]
      summary: The attribution worker's backlog
      description: Conversions waiting to be attributed, failing ones with their last error and retry time, and identity merges and model changes not yet fanned out.
      operationId: attributionQueue
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: The backlog
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttributionQueue"

  /attribution/exports:
    get:
      tags: [Attribution]
      summary: List attribution exports
      description: The account's export jobs, newest first. Needs view_attribution_reports.
      operationId: listAttributionExports
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Export jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AttributionExport"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Attribution]
      summary: Queue an attribution export
      description: >-
        Queues a breakdown to be written as CSV by the export runner (the
        minutely cron), now or at run_at, with every group (no row limit; more
        than 50,000 groups fails the job with the reason). With webhook_url,
        the runner also POSTs the file there, signed: X-P202-Signature is
        sha256=<hex HMAC-SHA256 of "<X-P202-Timestamp>.<body>"> under the
        export's secret, which this response carries once. Webhook URLs must
        be https and every address the host resolves to must be public
        (private, loopback, link-local, metadata, documentation, multicast and
        reserved ranges are refused, IPv4 carried in IPv6 included); the
        check runs here and again at send time, the connection is pinned to
        the checked address, and redirects are not followed. Ids and times
        are JSON numbers; a string is refused, not cast. Needs
        view_attribution_reports. Honors `Idempotency-Key`.
      operationId: createAttributionExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributionExportInput"
      responses:
        "201":
          description: Queued. data.webhook_secret is present only here, only when the export has a webhook.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttributionExport"
        "409":
          description: The model named is inactive or invalid, or the account has no default model.
        "422":
          $ref: "#/components/responses/ValidationError"

  /attribution/exports/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Attribution]
      summary: Get an attribution export
      operationId: getAttributionExport
      responses:
        "200":
          description: The export job
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttributionExport"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Attribution]
      summary: Delete an attribution export and its file
      description: Refused (409) while the export is running.
      operationId: deleteAttributionExport
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Export and file deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The export is running.

  /attribution/exports/{id}/download:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Attribution]
      summary: Download an export's CSV
      description: >-
        The file the runner wrote: key, name, clicks, cost,
        attributed_conversions, attributed_revenue, roi, assisted_conversions,
        and compare_attributed_conversions, compare_attributed_revenue,
        compare_roi with a comparison model. Money and credit are exact
        decimals; a text cell starting with =, +, - or @ is prefixed with an
        apostrophe so a spreadsheet does not run it.
      operationId: downloadAttributionExport
      responses:
        "200":
          description: The CSV
          content:
            text/csv:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No file yet (the export has not run), or the file is no longer on disk.

  /attribution/exports/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    post:
      tags: [Attribution]
      summary: Queue a failed export again
      description: Resets its attempts; only a failed export can be retried (409 otherwise).
      operationId: retryAttributionExport
      responses:
        "200":
          description: Queued again
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttributionExport"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The export is not failed.

  # ─── Users ───────────────────────────────────────────────────────────

  /users:
    get:
      tags: [Users]
      summary: List users
      description: Admin only.
      operationId: listUsers
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Users]
      summary: Create a user
      description: Admin only. Password is hashed with bcrypt.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /users/roles:
    get:
      tags: [Users]
      summary: List available roles
      operationId: listRoles
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Users]
      summary: Get a user
      description: Returns user details with roles. Accessible by self or admin.
      operationId: getUser
      responses:
        "200":
          description: User details with roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetailResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Users]
      summary: Update a user
      description: Accessible by self or admin. Password re-hashed if provided.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Users]
      summary: Delete a user
      description: Admin only. Soft delete (sets user_deleted = 1).
      operationId: deleteUser
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: User deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/roles:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    post:
      tags: [Users]
      summary: Assign a role to a user
      description: Admin only. Idempotent (INSERT IGNORE).
      operationId: assignRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id:
                  type: integer
                  description: Role ID to assign
      responses:
        "201":
          description: Role assigned
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}/roles/{roleId}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
      - name: roleId
        in: path
        required: true
        schema:
          type: integer
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Users]
      summary: Remove a role from a user
      description: Admin only.
      operationId: removeRole
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Role removed
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}/api-keys:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Users]
      summary: List API keys for a user
      description: Self or admin. Keys are masked (first 8 chars visible).
      operationId: listApiKeys
      responses:
        "200":
          description: API key list (masked)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: integer
                        api_key:
                          type: string
                          description: Masked key (first 8 chars + asterisks)
                        scope:
                          type: string
                          description: The key's scope; `*` for full-access keys
                        created_at:
                          type: integer
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Users]
      summary: Create an API key
      description: |
        Self or admin. Returns the full 64-character hex key. This is the only
        time the full key is visible -- store it securely.

        An optional `scope` attenuates the key (see "API Key Scopes" above).
        Unknown tokens are rejected with 422; a scoped caller must name an
        explicit scope no broader than its own (422/403); on a pre-1.9.75
        schema without the scope column, requesting a scope returns 409.
      operationId: createApiKey
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  description: |
                    Comma-separated string or array of scope tokens: `*`,
                    `read`, `write`, or `<area>:read` / `<area>:write`.
                    Omit for a full-access key.
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                      api_key:
                        type: string
                        description: Full 64-character hex API key (shown once)
                      scope:
                        type: string
                        description: The stored scope; `*` for full access
                      created_at:
                        type: integer
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}/api-keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
      - name: keyId
        in: path
        required: true
        description: The full API key string
        schema:
          type: string
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Users]
      summary: Delete an API key
      description: Self or admin.
      operationId: deleteApiKey
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: API key deleted
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}/identity-key:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Users]
      summary: Get the identity linking key
      description: >-
        Self or admin, with a key that can write users (`*`, `write` or
        `users:write`): holding the key is the power to link identities, so
        a read-only or propose-only key is refused with 403. The key the
        account's own server signs customer ids
        with, so a `cust` on a public pixel, postback or tracking link joins
        a person's journeys only when it carries `cust_sig`:
        `cust_sig = hex(HMAC-SHA256(linking_key, "<cust_type>:<cust>"))`.
        `cust_type` is the LTV alias vocabulary and defaults to `custom`;
        `email_md5` and `email_sha256` digests are signed in lower case. An
        unsigned or wrongly signed `cust` keeps its LTV role and links
        nothing. Minted on first read.
      operationId: getIdentityKey
      responses:
        "200":
          description: The linking key
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/IdentityKey"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{id}/identity-key/rotate:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    post:
      tags: [Users]
      summary: Rotate the identity linking key
      description: >-
        Self or admin. Replaces the linking key and returns the new one.
        Every `cust_sig` computed with the old key stops linking at once;
        clicks already linked stay linked. Can be staged (`?staged=1`).
      operationId: rotateIdentityKey
      responses:
        "200":
          description: The new linking key
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/IdentityKey"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{id}/preferences:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Users]
      summary: Get user preferences
      description: Self or admin.
      operationId: getPreferences
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserPreferences"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Users]
      summary: Update user preferences
      description: Self or admin. Any subset of fields may be sent.
      operationId: updatePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesUpdate"
      responses:
        "200":
          description: Preferences updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserPreferences"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

# ═══════════════════════════════════════════════════════════════════════
# Components
# ═══════════════════════════════════════════════════════════════════════

  /staged-changes:
    get:
      tags: [StagedChanges]
      summary: List staged changes
      description: |
        Your staged writes, newest first. `status` filters; `all=1` returns
        every user's changes (admin only). Requires `staged-changes:read`.
      operationId: listStagedChanges
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [staged, applying, applied, discarded]
        - name: all
          in: query
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Staged changes
        "403":
          $ref: "#/components/responses/Forbidden"

  /staged-changes/{changeId}:
    parameters:
      - $ref: "#/components/parameters/changeId"
    get:
      tags: [StagedChanges]
      summary: Get one staged change
      description: Payload and (for deletes) the embedded dry-run preview. Own changes, or any as admin.
      operationId: getStagedChange
      responses:
        "200":
          description: The staged change
        "404":
          description: Not found

  /staged-changes/{changeId}/apply:
    parameters:
      - $ref: "#/components/parameters/changeId"
    post:
      tags: [StagedChanges]
      summary: Apply a staged change
      description: |
        Performs the recorded write by re-dispatching it through the real
        route: validation, route authorization, and scope checks re-run
        against current state under the applier's credentials. Requires
        the write scope of the change's area (for example `campaigns:write`).
        The staged→applied transition is atomic; a concurrent second apply
        gets 409. A failed apply returns the change to staged with the
        error recorded.
      operationId: applyStagedChange
      responses:
        "200":
          description: The applied change and the write's result
        "409":
          description: Not staged, expired, or applied concurrently

  /staged-changes/{changeId}/discard:
    parameters:
      - $ref: "#/components/parameters/changeId"
    post:
      tags: [StagedChanges]
      summary: Discard a staged change
      description: Ends the proposal without performing it. Requires `staged-changes:stage`.
      operationId: discardStagedChange
      responses:
        "200":
          description: The discarded change
        "409":
          description: Not in the staged state

  # ─── SKAN (SKAdNetwork) ──────────────────────────────────────────────

  /attribution/apps:
    get:
      tags: [Attribution postbacks]
      summary: List registered advertised apps
      description: |
        The App Store apps whose SKAdNetwork postbacks belong to the caller.
        Each row carries the app's `schema_token` — the bearer capability an
        iOS build presents to `GET /attribution/schema`. It is served only to the
        owner; staged-change previews and apply results redact it.
      operationId: listAttributionApps
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated app registrations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionAppListResponse"
    post:
      tags: [Attribution postbacks]
      summary: Register an advertised app
      description: |
        Registering claims the app's postbacks: rows that arrived before
        registration (stored unclaimed) are adopted, and the receiver stamps
        future ones with the caller's user id. An App Store id can be
        registered by exactly one user across the install; a second
        registration is `409`. The response mints and returns the app's
        `schema_token`.

        `Idempotency-Key` is deliberately not honored on this create — the
        token must never persist as a replayable record. Retries are safe
        anyway: the unique `app_id` answers `409`.
      operationId: createAttributionApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributionAppCreate"
      responses:
        "201":
          description: App registered; the response carries its schema token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionAppResponse"
        "409":
          description: This App Store id is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /attribution/apps/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Attribution postbacks]
      summary: Get an app registration
      description: Addressed by the internal `attribution_app_id`, not the App Store id.
      operationId: getAttributionApp
      responses:
        "200":
          description: The registration, including its schema token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionAppResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Attribution postbacks]
      summary: Update an app registration
      description: Re-runs the postback claim, so any unclaimed history for the app is adopted on update.
      operationId: updateAttributionApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributionAppUpdate"
      responses:
        "200":
          description: Registration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionAppResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The new App Store id is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Attribution postbacks]
      summary: Delete an app registration
      description: |
        Hard delete of the registration only: postbacks already claimed keep
        their owner (history is never reassigned). The dry-run preview omits
        the schema token.
      operationId: deleteAttributionApp
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Registration deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /attribution/apps/{id}/schema-token/rotate:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    post:
      tags: [Attribution postbacks]
      summary: Rotate the app's schema token
      description: |
        Mints a replacement token and invalidates the old one immediately —
        the remedy for a token leaked out of a shipped binary. Builds
        configured with the old token can no longer fetch the schema until
        updated. Stageable; an applied rotation's result is served with the
        token redacted (the owner reads it via `GET /attribution/apps/{id}`).
      operationId: rotateAttributionSchemaToken
      responses:
        "200":
          description: The registration with its new schema token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionAppResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /attribution/conversion-values:
    get:
      tags: [Attribution postbacks]
      summary: List conversion-value decoding rules
      operationId: listAttributionConversionValues
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated rules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionConversionValueListResponse"
    post:
      tags: [Attribution postbacks]
      summary: Create a decoding rule
      description: |
        A rule maps exactly one fine value (0–63) **or** one coarse value
        (`low`/`medium`/`high`) to an event name and revenue; `app_id = 0`
        rules are the account-wide defaults that app-specific rules
        override. The same rows drive the report's decode and the schema
        served to devices. Honors `Idempotency-Key`.
      operationId: createAttributionConversionValue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributionConversionValueCreate"
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionConversionValueResponse"
        "409":
          description: A rule for this conversion value already exists for this app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /attribution/conversion-values/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Attribution postbacks]
      summary: Get a decoding rule
      operationId: getAttributionConversionValue
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionConversionValueResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Attribution postbacks]
      summary: Update a decoding rule
      description: |
        The row is validated as it will exist after the update. To switch a
        rule between kinds, send the clear and the replacement together — an
        explicit `null` empties the old kind while the new value arrives
        (`{"fine_value": null, "coarse_value": "high"}`). An absent field
        means keep; clearing without a replacement is `422`.
      operationId: updateAttributionConversionValue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributionConversionValueUpdate"
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionConversionValueResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A rule for this conversion value already exists for this app
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Attribution postbacks]
      summary: Delete a decoding rule
      operationId: deleteAttributionConversionValue
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Rule deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /attribution/postbacks:
    get:
      tags: [Attribution postbacks]
      summary: List received postbacks
      description: |
        Postbacks stored by the public receiver and claimed by the caller's
        app registrations, newest first. Every string column is authored by
        whoever POSTed to the open receiver, so values are sanitized at
        serialization. Rows never carry the attribution signature (see
        `GET /attribution/postbacks/{id}`) or the raw body. Malformed filter values
        are rejected with `422` rather than ignored.
      operationId: listAttributionPostbacks
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/timeFrom"
        - $ref: "#/components/parameters/timeTo"
        - $ref: "#/components/parameters/attributionAppId"
        - $ref: "#/components/parameters/attributionAppIds"
        - $ref: "#/components/parameters/attributionAdNetworkId"
        - $ref: "#/components/parameters/attributionVersion"
        - $ref: "#/components/parameters/attributionTransactionId"
        - $ref: "#/components/parameters/attributionCountryCode"
        - $ref: "#/components/parameters/attributionSourceIdentifier"
        - $ref: "#/components/parameters/attributionCampaignId"
        - $ref: "#/components/parameters/attributionFidelityType"
        - $ref: "#/components/parameters/attributionPostbackSequenceIndex"
        - $ref: "#/components/parameters/attributionDidWin"
        - $ref: "#/components/parameters/attributionRedownload"
        - $ref: "#/components/parameters/attributionCoarseConversionValue"
        - $ref: "#/components/parameters/attributionSignature"
        - $ref: "#/components/parameters/attributionProtocol"
        - $ref: "#/components/parameters/attributionConversionType"
        - $ref: "#/components/parameters/attributionAdInteractionType"
      responses:
        "200":
          description: Paginated postbacks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionPostbackListResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /attribution/postbacks/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Attribution postbacks]
      summary: Get one postback, including its attribution signature
      description: |
        The signature is served for forensics — copy it into
        `POST /attribution/verify` or diff it against another implementation. The
        raw request body is retained server-side but never served.
      operationId: getAttributionPostback
      responses:
        "200":
          description: The postback with its attribution signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionPostbackResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /attribution/report:
    get:
      tags: [Attribution postbacks]
      summary: Aggregate attribution report with conversion-value decoding
      description: |
        Groups postbacks by `group_by` and decodes winning postbacks'
        conversion values through the caller's rules (app-specific over
        `app_id = 0` defaults; a fine value with no rule stays undecoded and
        never falls back to a coarse rule). Days are UTC, oldest first.

        **Trust default:** the receiver is public, so without an explicit
        `signature` filter every headline metric — installs, losses,
        redownloads, the whole decode — counts only signature-verified
        postbacks (`meta.trusted: verified-only`). Forged and unverifiable
        rows stay visible through the `signature_*_count` columns, which
        count every unique postback in the group whatever its signature
        state (a postback that belongs to two classes — an opted-in
        development-signed one is both `valid` and `development` — counts in
        each). Passing `signature=` recomputes the metrics over exactly that
        class (`meta.trusted: as-filtered`). `meta.groups_truncated` is true
        when more groups matched than `limit` allowed. Accepts the same
        filters as the postback list.

        Every metric counts **unique postbacks** (protocol, ad network,
        postback id, conversion window) — `postbacks` and the four
        `signature_*_count` columns included: the receiver stores a replay of
        a signed postback whose unsigned fields differ as its own row, and
        the report is where it collapses to one. `installs` are winning
        first-window `download`s; `redownloads` and AdAttributionKit
        `reengagements` are reported beside them.

        **Which groups come back:** `group_by=day` returns the newest
        `limit` populated days — a day no matching postback landed on is not
        a group at all — and every other mode returns the `limit` busiest
        groups. Neither `time_from` nor `time_to` has a default, so an
        unfiltered day report picks those days out of the account's whole
        retained history; to reach days older than the newest `limit`, raise
        `limit` or move the window with `time_to`.
      operationId: getAttributionReport
      parameters:
        - name: group_by
          in: query
          schema:
            type: string
            enum: [day, app, ad-network, source, country, version, protocol, conversion-type]
            default: day
        - name: limit
          in: query
          description: Maximum groups to return (default 100, max 500). Day mode keeps the newest days; other modes keep the busiest groups.
          schema:
            type: integer
            default: 100
            maximum: 500
        - $ref: "#/components/parameters/timeFrom"
        - $ref: "#/components/parameters/timeTo"
        - $ref: "#/components/parameters/attributionAppId"
        - $ref: "#/components/parameters/attributionAppIds"
        - $ref: "#/components/parameters/attributionAdNetworkId"
        - $ref: "#/components/parameters/attributionVersion"
        - $ref: "#/components/parameters/attributionTransactionId"
        - $ref: "#/components/parameters/attributionCountryCode"
        - $ref: "#/components/parameters/attributionSourceIdentifier"
        - $ref: "#/components/parameters/attributionCampaignId"
        - $ref: "#/components/parameters/attributionFidelityType"
        - $ref: "#/components/parameters/attributionPostbackSequenceIndex"
        - $ref: "#/components/parameters/attributionDidWin"
        - $ref: "#/components/parameters/attributionRedownload"
        - $ref: "#/components/parameters/attributionCoarseConversionValue"
        - $ref: "#/components/parameters/attributionSignature"
        - $ref: "#/components/parameters/attributionProtocol"
        - $ref: "#/components/parameters/attributionConversionType"
        - $ref: "#/components/parameters/attributionAdInteractionType"
      responses:
        "200":
          description: Report groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionReportResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /attribution/verify:
    post:
      tags: [Attribution postbacks]
      summary: Verify a postback payload's Apple signature
      description: |
        The protocol is detected from the body, exactly as the receivers do
        it: a `jws-string` key is verified as AdAttributionKit — the compact
        JWS alone is enough, so the unsigned envelope fields may be sent
        with a copied postback but are not read — and the response carries
        the decoded header and payload beside the verdict. Anything else is
        verified as SKAdNetwork: the `attribution-signature` is checked
        against Apple's published P-256 key using the exact per-version
        signed-message composition, and the byte string that was (or should
        have been) signed is returned for diffing. Nothing is stored. A read
        that arrives as POST only because the postback is its input: it
        requires `attribution:read`, and `staged=1` is rejected.

        `422` covers an empty body and a `jws-string` that cannot be decoded.
        A body with no `jws-string` always gets a SKAdNetwork verdict rather
        than a validation error — `unverifiable` when its `version` is not
        one this server can check (see `verifiable_versions`), `invalid` when
        it claims a version whose signed fields it does not carry.
      operationId: verifyAttributionPostback
      requestBody:
        required: true
        description: >-
          A SKAdNetwork postback, or an AdAttributionKit one — told apart by
          the presence of `jws-string`. The two shapes overlap rather than
          exclude each other: `jws-string` decides on its own, so a body that
          also carries the SKAdNetwork fields (a postback copied from one
          receiver into the other's envelope) is still verified as
          AdAttributionKit.
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "#/components/schemas/SkadnetworkVerifyRequest"
                - $ref: "#/components/schemas/AdAttributionKitVerifyRequest"
      responses:
        "200":
          description: Verification verdict and the reconstructed signed message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionVerifyResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /attribution/schema:
    get:
      tags: [Attribution postbacks]
      summary: Conversion-value schema for an iOS build (public, token-gated)
      description: |
        The ENCODE view of the app's decoding rules, fetched by the shipped
        app at runtime so a mapping change needs no App Store resubmission.
        No API key: access is gated by the app's `schema_token`, sent only
        in the `X-P202-Schema-Token` header (never a query string, which
        access logs would capture). Serves event names and values only —
        never revenue. `ETag` equals `schema_version` and changes exactly
        when encoding behaviour changes; `If-None-Match` answers `304`.
        Rate-limited per source IP. The `events` value is always a JSON
        object, even when empty.
      operationId: getAttributionSchema
      security: []
      parameters:
        - name: X-P202-Schema-Token
          in: header
          required: true
          description: The app's schema token, minted at registration (`POST /attribution/apps`) and rotatable
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of a previously fetched document; an unchanged schema answers `304`
          schema:
            type: string
      responses:
        "200":
          description: The schema document
          headers:
            ETag:
              description: Quoted `schema_version`; send back as `If-None-Match`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionSchemaResponse"
        "304":
          description: Not modified — the cached document is current
        "400":
          description: Missing schema token header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown schema token (never minted, or rotated away)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/AttributionRateLimited"

  /.well-known/skadnetwork/report-attribution/:
    servers:
      - url: /
        description: Site root — Apple devices POST here directly; this path is outside the /api/v3 base
    get:
      tags: [Attribution postbacks]
      summary: Receiver readiness probe
      description: Lets an operator confirm the endpoint is reachable at the exact URL Apple will use, before pointing an app at it.
      operationId: probeSkadnetworkReceiver
      security: []
      responses:
        "200":
          description: The receiver is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkadnetworkReceiverProbeResponse"
    post:
      tags: [Attribution postbacks]
      summary: Receive a SKAdNetwork install-validation postback
      description: |
        The developer-side `NSAdvertisingAttributionReportEndpoint`. Devices
        POST signed postbacks here; the server verifies Apple's signature
        (2.1, 2.2, 3.0, 4.0 — retired 1.0/2.0 and unknown versions store as
        `unverifiable`), stores the row flagged with its signature state,
        and answers `200` including for a byte-identical retry
        (`duplicate: true`). Structurally broken bodies (which no genuine
        device sends) are `400` with per-field errors; any non-`200`
        makes the device retry later, so a storage outage loses nothing.
        Bodies over 32 KB are rejected. Rate-limited per source IP.
      operationId: receiveSkadnetworkPostback
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkadnetworkPostback"
      responses:
        "200":
          description: Stored (or recognized as a retry of a stored postback)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionPostbackReceiptResponse"
        "400":
          description: Structurally invalid postback (Apple's hyphenated field names in `field_errors`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "405":
          description: Only GET (probe) and POST are served
        "413":
          description: >-
            Body over 32 KB. Terminal: no genuine Apple postback approaches
            this size, and the same body would fail every retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/AttributionRateLimited"
        "503":
          description: Database unavailable — the device retries later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /.well-known/appattribution/report-attribution/:
    servers:
      - url: /
        description: Site root — Apple devices POST here directly; this path is outside the /api/v3 base
    get:
      tags: [Attribution postbacks]
      summary: AdAttributionKit receiver readiness probe
      description: Lets an operator confirm the endpoint is reachable at the exact URL Apple will use, before pointing an app at it.
      operationId: probeAdAttributionKitReceiver
      security: []
      responses:
        "200":
          description: The receiver is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdAttributionKitReceiverProbeResponse"
    post:
      tags: [Attribution postbacks]
      summary: Receive an AdAttributionKit postback copy
      description: |
        The developer-side `AttributionCopyEndpoint` (iOS 17.4+). Devices
        POST copies of winning AdAttributionKit postbacks here: a JSON
        envelope whose `jws-string` is a compact JWS (ES256) carrying the
        signed attribution fields, beside four unsigned fields. The server
        decodes the JWS, verifies its signature against the key its `kid`
        names — Apple's production key (`valid`), one of Apple's development
        keys (`development`; trusted only for an app registration that opted
        in), an unknown key (`unverifiable`) — validates the payload under
        Apple's field names, stores the row flagged with its signature state,
        and answers `200` including for a byte-identical retry
        (`duplicate: true`). Structurally broken bodies — a `jws-string`
        that is not a JWS, a payload missing required fields — are `400`
        with per-field errors; any non-`200` makes the device retry later.
        Bodies over 32 KB are rejected. Rate-limited per source IP, in one
        bucket with the SKAdNetwork receiver.
      operationId: receiveAdAttributionKitPostback
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdAttributionKitPostback"
      responses:
        "200":
          description: Stored (or recognized as a retry of a stored postback)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionPostbackReceiptResponse"
        "400":
          description: Structurally invalid postback (Apple's hyphenated field names in `field_errors`; JWS payload fields under their own names)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "405":
          description: Only GET (probe) and POST are served
        "413":
          description: >-
            Body over 32 KB. Terminal: no genuine Apple postback approaches
            this size, and the same body would fail every retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/AttributionRateLimited"
        "503":
          description: Database unavailable — the device retries later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key from /users/{id}/api-keys

  # ─── Shared parameters ──────────────────────────────────────────────

  parameters:
    changeId:
      name: changeId
      in: path
      required: true
      description: A staged-change id (chg_ + 24 hex chars), issued by staging a write
      schema:
        type: string
        pattern: "^chg_[0-9a-f]{24}$"
    dryRun:
      name: dry_run
      in: query
      required: false
      description: |
        Preview the delete without performing it. With `dry_run=1` the
        response is `200` with `{data: {dry_run, action, resource, mode,
        record, cascade}}` instead of `204`. Fail-closed: endpoints without
        preview support (the LTV deletes) reject the parameter with `422`,
        and an unrecognized value is a `422` — never a delete. Supported
        when the capabilities report `features.delete_dry_run`.
      schema:
        type: string
        enum: ["1", "true", "yes", "0", "false", "no"]
    resourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    attributionPeriod:
      name: period
      in: query
      description: A named range; exclusive with time_from/time_to. Without either, the last 30 days.
      schema:
        type: string
        enum: [today, yesterday, last7, last30, last90]
    attributionTimeFrom:
      name: time_from
      in: query
      description: Range start, unix seconds.
      schema:
        type: integer
    attributionTimeTo:
      name: time_to
      in: query
      description: Range end, unix seconds.
      schema:
        type: integer
    limit:
      name: limit
      in: query
      description: Maximum results (default 50, max 500)
      schema:
        type: integer
        default: 50
        maximum: 500
    offset:
      name: offset
      in: query
      description: Pagination offset
      schema:
        type: integer
        default: 0
    period:
      name: period
      in: query
      description: Predefined time period
      schema:
        type: string
        enum: [today, yesterday, last7, last30, last90]
    timeFrom:
      name: time_from
      in: query
      description: Start timestamp (unix)
      schema:
        type: integer
    timeTo:
      name: time_to
      in: query
      description: End timestamp (unix)
      schema:
        type: integer
    filterCampaign:
      name: aff_campaign_id
      in: query
      schema:
        type: integer
    filterAffNetwork:
      name: aff_network_id
      in: query
      schema:
        type: integer
    filterPpcAccount:
      name: ppc_account_id
      in: query
      schema:
        type: integer
    filterPpcNetwork:
      name: ppc_network_id
      in: query
      schema:
        type: integer
    filterLandingPage:
      name: landing_page_id
      in: query
      schema:
        type: integer
    filterCountry:
      name: country_id
      in: query
      schema:
        type: integer

    # SKAN postback filters (list + report)
    attributionAppId:
      name: app_id
      in: query
      description: Advertised App Store id
      schema:
        type: integer
    attributionAppIds:
      name: app_ids
      in: query
      description: >
        Several advertised App Store ids at once, as a comma-separated list
        (`app_ids=990077001,525463029`). Narrows to that SET of apps, which
        `app_id` cannot do; combine them and both apply. At most 500 ids, each
        a whole number — a value an integer cast would change is rejected
        rather than silently selecting a different app. Duplicates collapse;
        a blank element is an error, not a skip.
      schema:
        type: string
      example: "990077001,525463029"
    attributionAdNetworkId:
      name: ad_network_id
      in: query
      schema:
        type: string
    attributionVersion:
      name: version
      in: query
      description: SKAN postback version (e.g. `4.0`)
      schema:
        type: string
    attributionTransactionId:
      name: transaction_id
      in: query
      schema:
        type: string
    attributionCountryCode:
      name: country_code
      in: query
      schema:
        type: string
    attributionSourceIdentifier:
      name: source_identifier
      in: query
      description: SKAN 4 source identifier (1–4 digits)
      schema:
        type: string
    attributionCampaignId:
      name: campaign_id
      in: query
      description: SKAN 2/3 campaign id
      schema:
        type: integer
    attributionFidelityType:
      name: fidelity_type
      in: query
      description: >-
        SKAdNetwork's spelling of `ad_interaction_type`: 1 = StoreKit-rendered
        or web ad (click), 0 = view-through. Matched on the protocol-neutral
        `ad_interaction_type` column, so it selects AdAttributionKit rows too
        (they leave the raw `fidelity_type` column `NULL`); prefer
        `ad_interaction_type=click|view`, which says the same thing.
      schema:
        type: integer
        enum: [0, 1]
    attributionPostbackSequenceIndex:
      name: postback_sequence_index
      in: query
      description: SKAN 4 conversion window (0, 1, or 2)
      schema:
        type: integer
        enum: [0, 1, 2]
    attributionDidWin:
      name: did_win
      in: query
      description: Winning (1/true) or losing (0/false) postbacks; anything else is a 422
      schema:
        type: string
        enum: ["1", "0", "true", "false"]
    attributionRedownload:
      name: redownload
      in: query
      description: >-
        SKAdNetwork's spelling of `conversion_type`: redownloads (1/true) or
        first installs (0/false). Matched on the protocol-neutral
        `conversion_type` column (`redownload` / `download`), so it selects
        AdAttributionKit rows too (they leave the raw `redownload` column
        `NULL`); prefer `conversion_type=redownload|download`, which says the
        same thing and can also select `re-engagement` — a kind this flag
        cannot name, and which `redownload=0` therefore excludes.
      schema:
        type: string
        enum: ["1", "0", "true", "false"]
    attributionCoarseConversionValue:
      name: coarse_conversion_value
      in: query
      schema:
        type: string
        enum: [low, medium, high]
    attributionSignature:
      name: signature
      in: query
      description: >-
        Signature class. `valid`, `invalid` and `unverifiable` select on the
        trust bit the report keys on (`signature_valid` 1 / 0 / null);
        `development` selects rows verified against one of Apple's
        AdAttributionKit development keys whatever their trust bit. On the
        report, an explicit value switches `meta.trusted` to `as-filtered`.
      schema:
        type: string
        enum: [valid, invalid, unverifiable, development]
    attributionProtocol:
      name: protocol
      in: query
      description: Which framework delivered the postback; the shorthands `skan` and `aak` are accepted
      schema:
        type: string
        enum: [skadnetwork, adattributionkit, skan, aak]
    attributionConversionType:
      name: conversion_type
      in: query
      description: Protocol-neutral conversion kind (`re-engagement` exists only in AdAttributionKit)
      schema:
        type: string
        enum: [download, redownload, re-engagement]
    attributionAdInteractionType:
      name: ad_interaction_type
      in: query
      description: View-through or click-through
      schema:
        type: string
        enum: [view, click]

  # ─── Shared responses ───────────────────────────────────────────────

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"

    AttributionRateLimited:
      description: Per-source rate limit exceeded; retry after the indicated seconds
      headers:
        Retry-After:
          description: Seconds until the window resets
          schema:
            type: integer
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  retry_after_seconds:
                    type: integer

  # ─── Schemas ─────────────────────────────────────────────────────────

  schemas:
    # ── Common ─────────────────────────────────────────────────────────

    Error:
      type: object
      properties:
        error:
          type: string
        status:
          type: integer

    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: Validation failed
        status:
          type: integer
          example: 422
        field_errors:
          type: object
          additionalProperties:
            type: string
          example:
            aff_campaign_name: required

    Pagination:
      type: object
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    # ── Campaigns ──────────────────────────────────────────────────────

    Campaign:
      type: object
      properties:
        aff_campaign_id:
          type: integer
          readOnly: true
        aff_campaign_name:
          type: string
          maxLength: 255
        aff_campaign_url:
          type: string
          maxLength: 2048
        aff_campaign_url_2:
          type: string
          maxLength: 2048
        aff_campaign_url_3:
          type: string
          maxLength: 2048
        aff_campaign_url_4:
          type: string
          maxLength: 2048
        aff_campaign_url_5:
          type: string
          maxLength: 2048
        aff_campaign_payout:
          type: number
        aff_campaign_currency:
          type: string
          maxLength: 5
        aff_campaign_foreign_payout:
          type: number
        aff_network_id:
          type: integer
        aff_campaign_cloaking:
          type: integer
        aff_campaign_rotate:
          type: integer
        payout_mode:
          type: string
          enum: [replace, accumulate]
          description: >-
            How a click's conversions set its value. `replace` (default): the
            latest conversion's payout. `accumulate`: the sum of every
            conversion's payout (repeat purchases, subscriptions).
        identity_signals:
          type: string
          enum: ["0", "1"]
          description: >-
            "1" (default): this campaign's clicks carry first-party identity
            signals — the tracking domain's p202vid cookie, the landing page's
            p202lpid, and customer ids signed with the account's linking key —
            so multi-touch attribution can join them into one journey. "0":
            none are read or set, and every click is its own journey.
        aff_campaign_time:
          type: integer
          readOnly: true
          description: Unix timestamp, auto-set on create
        aff_campaign_id_public:
          type: integer
          readOnly: true
          description: Random public ID, auto-generated on create
        aff_campaign_deleted:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true

    IdentityKey:
      type: object
      properties:
        linking_key:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 32 bytes, hex. A signing secret; keep it on your server.
        algorithm:
          type: string
          example: HMAC-SHA256
        signs:
          type: string
          description: What the signature covers.
        parameter:
          type: string
          description: Where the signature goes.

    CampaignCreate:
      type: object
      required: [aff_campaign_name, aff_campaign_url]
      properties:
        aff_campaign_name:
          type: string
          maxLength: 255
        aff_campaign_url:
          type: string
          maxLength: 2048
        aff_campaign_url_2:
          type: string
          maxLength: 2048
        aff_campaign_url_3:
          type: string
          maxLength: 2048
        aff_campaign_url_4:
          type: string
          maxLength: 2048
        aff_campaign_url_5:
          type: string
          maxLength: 2048
        aff_campaign_payout:
          type: number
        aff_campaign_currency:
          type: string
          maxLength: 5
        aff_campaign_foreign_payout:
          type: number
        aff_network_id:
          type: integer
        aff_campaign_cloaking:
          type: integer
        aff_campaign_rotate:
          type: integer
        payout_mode:
          type: string
          enum: [replace, accumulate]
          description: >-
            How a click's conversions set its value. `replace` (default): the
            latest conversion's payout. `accumulate`: the sum of every
            conversion's payout (repeat purchases, subscriptions).
        identity_signals:
          type: string
          enum: ["0", "1"]
          description: >-
            "1" (default): this campaign's clicks carry first-party identity
            signals — the tracking domain's p202vid cookie, the landing page's
            p202lpid, and customer ids signed with the account's linking key —
            so multi-touch attribution can join them into one journey. "0":
            none are read or set, and every click is its own journey.

