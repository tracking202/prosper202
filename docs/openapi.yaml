                  type: string
                  nullable: true
                  maxLength: 255
                address_line1:
                  type: string
                  nullable: true
                  maxLength: 255
                address_line2:
                  type: string
                  nullable: true
                  maxLength: 255
                city:
                  type: string
                  nullable: true
                  maxLength: 100
                region:
                  type: string
                  nullable: true
                  maxLength: 100
                postal_code:
                  type: string
                  nullable: true
                  maxLength: 20
                country:
                  type: string
                  nullable: true
                  maxLength: 2
                  description: A two-letter country code, e.g. US
                aliases:
                  type: array
