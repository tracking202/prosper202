        an `idempotency_key` field instead) and have no `dry_run` preview. Supply `name`, `domain` or both.
      operationId: ltvPatchCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                domain:
                  type: string
                  nullable: true
      responses:
        '200':
          description: The company
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
      - LTV
      summary: Delete a company
      description: Needs the `ltv:write` scope. LTV writes do not honor `Idempotency-Key` (`POST /ltv/revenue` takes
        an `idempotency_key` field instead). Refused with `422` while customers are attached (merge the company
        instead) or customers wait for the entity-linking sweep. `dry_run=1` returns the company and, in `refused`,
        the reason the delete would be turned down (`null` when it would go ahead).
      operationId: ltvDeleteCompany
