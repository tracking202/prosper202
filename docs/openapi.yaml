  # ─── Attribution ─────────────────────────────────────────────────────
  # Multi-touch attribution. Reads need the view_attribution_reports role
  # permission and model writes manage_attribution_models, on top of the
  # attribution:read / attribution:write key scope.

  /attribution/models:
    get:
      tags: [Attribution]
      summary: List attribution models
      description: Every account has exactly one default model (a last-touch model is created with the account). Credits are computed for every active model.
      operationId: listAttributionModels
      parameters:
        - name: type
          in: query
          description: Filter by model type
          schema:
            $ref: "#/components/schemas/AttributionModelType"
      responses:
        "200":
          description: The account's models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionModelListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Attribution]
      summary: Create an attribution model
      description: >-
        The attribution worker computes the new model's credits for existing
        conversions from their stored journeys (`recompute_pending` is true
        until it has). A lookback wider than a stored journey rebuilds that
        journey from the identity graph first. Honors `Idempotency-Key`.
      operationId: createAttributionModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributionModelCreate"
      responses:
        "201":
          description: Model created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionModelResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A model with the same name (slug) exists; the details name it.
        "422":
          $ref: "#/components/responses/ValidationError"

  /attribution/models/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Attribution]
      summary: Get an attribution model
      operationId: getAttributionModel
      responses:
        "200":
          description: Model details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionModelResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Attribution]
      summary: Update an attribution model
      description: >-
        Partial update. Changing model_type without sending weighting_config
        resets the config to the new type's defaults. A model cannot stop
        being the default (make another one the default instead), and the
        default cannot be deactivated. A change to what the model computes
        queues its recompute; deactivating it removes its credits.
      operationId: updateAttributionModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributionModelUpdate"
      responses:
        "200":
          description: Model updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionModelResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The new name collides with another model's.
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Attribution]
      summary: Delete an attribution model
      description: >-
        Hard delete of the model, its credits and its export jobs; campaigns
        that named it fall back to the account default. The default model
        cannot be deleted (409), nor a model one of whose export jobs is
        running (409, naming the jobs in `details.running_exports`; retry once they
        finish).
      operationId: deleteAttributionModel
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Model deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The model is the account default.

  /attribution/reports/breakdown:
    get:
      tags: [Attribution]
      summary: Attributed conversions, revenue, cost and ROI by a click dimension
      description: >-
        Credits for conversions whose conv_time is in range, grouped by a
        dimension of the credited clicks; clicks and cost from the
        dimension's own clicks whose click_time is in range; assisted
        conversions (journeys where the dimension had a touch before the
        converting click). Money values are exact decimal strings. Without
        model_id the report is "effective": each conversion under its
        campaign's model override when that model is active, otherwise the
        account default. Unknown parameters are refused.
      operationId: attributionBreakdown
      parameters:
        - name: group_by
          in: query
          schema:
            $ref: "#/components/schemas/AttributionDimension"
        - name: model_id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: compare_model_id
          in: query
          description: A second model, returned side by side as compare_* columns.
          schema:
            type: integer
            minimum: 1
        - $ref: "#/components/parameters/attributionPeriod"
        - $ref: "#/components/parameters/attributionTimeFrom"
        - $ref: "#/components/parameters/attributionTimeTo"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: One row per dimension value, sorted by attributed revenue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributionBreakdownResponse"
        "409":
          description: The model named is inactive or invalid and has no credits; the message gives the reason.
        "422":
          $ref: "#/components/responses/ValidationError"

  /attribution/reports/journeys:
    get:
      tags: [Attribution]
      summary: Journey metrics
      description: Length distribution, time to convert, truncated and unidentified journeys, and the one-touch share by the converting click's browser, for conversions in range.
      operationId: attributionJourneyMetrics
      parameters:
        - $ref: "#/components/parameters/attributionPeriod"
        - $ref: "#/components/parameters/attributionTimeFrom"
        - $ref: "#/components/parameters/attributionTimeTo"
      responses:
        "200":
          description: Journey metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttributionJourneyMetrics"
                  meta:
                    type: object

  /attribution/conversions/{id}/journey:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Attribution]
      summary: One conversion's journey explained
      description: The touches (oldest first, converting click last), the identity signals each click carried, every model's credit per touch, and the conversion's place in the worker's queue if it is waiting.
      operationId: attributionConversionJourney
      responses:
        "200":
          description: The journey
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttributionConversionJourney"
        "404":
          $ref: "#/components/responses/NotFound"

  /attribution/queue:
    get:
      tags: [Attribution]
      summary: The attribution worker's backlog
      description: Conversions waiting to be attributed, failing ones with their last error and retry time, and identity merges and model changes not yet fanned out.
      operationId: attributionQueue
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
      responses:
        "200":
          description: The backlog
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttributionQueue"

  /attribution/exports:
    get:
      tags: [Attribution]
      summary: List attribution exports
      description: The account's export jobs, newest first. Needs view_attribution_reports.
      operationId: listAttributionExports
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, running, completed, failed]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Export jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AttributionExport"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Attribution]
      summary: Queue an attribution export
      description: >-
        Queues a breakdown to be written as CSV by the export runner (the
        minutely cron), now or at run_at, with every group (no row limit; more
        than 50,000 groups fails the job with the reason). With webhook_url,
        the runner also POSTs the file there, signed: X-P202-Signature is
        sha256=<hex HMAC-SHA256 of "<X-P202-Timestamp>.<body>"> under the
        export's secret, which this response carries once. Webhook URLs must
        be https and every address the host resolves to must be public
        (private, loopback, link-local, metadata, documentation, multicast and
        reserved ranges are refused, IPv4 carried in IPv6 included); the
        check runs here and again at send time, the connection is pinned to
        the checked address, and redirects are not followed. Ids and times
        are JSON numbers; a string is refused, not cast. Needs
        view_attribution_reports. Honors `Idempotency-Key`.
      operationId: createAttributionExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributionExportInput"
      responses:
        "201":
          description: Queued. data.webhook_secret is present only here, only when the export has a webhook.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttributionExport"
        "409":
          description: The model named is inactive or invalid, or the account has no default model.
        "422":
          $ref: "#/components/responses/ValidationError"

  /attribution/exports/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Attribution]
      summary: Get an attribution export
      operationId: getAttributionExport
      responses:
        "200":
          description: The export job
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttributionExport"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Attribution]
      summary: Delete an attribution export and its file
      description: Refused (409) while the export is running.
      operationId: deleteAttributionExport
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Export and file deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The export is running.

  /attribution/exports/{id}/download:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Attribution]
      summary: Download an export's CSV
      description: >-
        The file the runner wrote: key, name, clicks, cost,
        attributed_conversions, attributed_revenue, roi, assisted_conversions,
        and compare_attributed_conversions, compare_attributed_revenue,
        compare_roi with a comparison model. Money and credit are exact
        decimals; a text cell starting with =, +, - or @ is prefixed with an
        apostrophe so a spreadsheet does not run it.
      operationId: downloadAttributionExport
      responses:
        "200":
          description: The CSV
          content:
            text/csv:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No file yet (the export has not run), or the file is no longer on disk.

  /attribution/exports/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    post:
      tags: [Attribution]
      summary: Queue a failed export again
      description: Resets its attempts; only a failed export can be retried (409 otherwise).
      operationId: retryAttributionExport
      responses:
        "200":
          description: Queued again
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AttributionExport"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The export is not failed.

  # ─── Goals ───────────────────────────────────────────────────────────

  /goals:
    get:
      tags: [Goals]
      summary: List goals
      description: Live goals by default. Filter by owner with `campaign_id`, `registration_id` or `scope=account`.
      operationId: listGoals
      parameters:
        - {name: campaign_id, in: query, schema: {type: integer}, description: "Only this campaign's own goals"}
        - {name: registration_id, in: query, schema: {type: integer}, description: "Only this app registration's goals"}
        - {name: scope, in: query, schema: {type: string, enum: [campaign, registration, account]}}
        - {name: scope_id, in: query, schema: {type: integer}}
        - {name: include_archived, in: query, schema: {type: string, enum: ["0", "1"]}}
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated goals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalListResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Goals]
      summary: Create a goal (version 1)
      description: |
        The body is strict: an unknown field is a `422` naming it, and ids
        and amounts are read raw (`"1e3"` or `1.5` for an id is refused, not
        cast). The definition's format is in
        `documentation/api/22-goals.md`; every error names its path
        (`definition.threshold.count`). A campaign goal is payable on its
        campaign by default when its value is not `none` (`payable: false`
        tracks it only; `payout` overrides the value there). Goal names are
        unique per owner (`409`). `after` names live goals of the same owner
        only. Honors `Idempotency-Key`.
      operationId: createGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalCreate"
      responses:
        "201":
          description: Goal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalResponse"
        "409":
          description: A goal of this name already exists for this owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /goals/validate:
    post:
      tags: [Goals]
      summary: Validate a definition without saving it
      description: A read (`goals:read` suffices; never staged). Answers the canonical form, or `422` with every error by path.
      operationId: validateGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              properties:
                definition:
                  $ref: "#/components/schemas/GoalDefinition"
                goal_id:
                  type: integer
                  description: The goal's own id, so `after` may not name it
      responses:
        "200":
          description: The definition is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      valid: {type: boolean}
                      definition: {$ref: "#/components/schemas/GoalDefinition"}
                      plain_event: {type: boolean, description: "One event, no conditions, count 1, no after, no window, repeat once: the goal Setup › Mobile Apps makes from an event name"}
        "422":
          $ref: "#/components/responses/ValidationError"

  /goals/evaluate:
    post:
      tags: [Goals]
      summary: Evaluate definitions against events, writing nothing
      description: |
        The evaluator vectors' format (`tests/fixtures/app-sdk-contract/goals/README.md`):
        `{goals, subject, events}` in, `{outcomes, disabled, progress}` out. A
        goal may be `{goal_id, definition}` (one version effective from 0) or
        `{goal_id, versions, starts_at?, ends_at?}`. At most 50 goals and
        1000 events, and an answer of at most 10,000 outcomes: an evaluation
        that reaches more is refused (`422`, field `events`) as soon as it
        passes the budget. An event's `revenue` is at most ±999999.99999
        (`422` naming `events[i].revenue`). A read (`goals:read` suffices;
        never staged).
      operationId: evaluateGoals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goals, subject, events]
              properties:
                goals: {type: array, items: {type: object}}
                subject: {type: object}
                events: {type: array, items: {type: object}}
      responses:
        "200":
          description: The evaluation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      outcomes: {type: array, items: {$ref: "#/components/schemas/GoalEvaluatedOutcome"}}
                      disabled: {type: array, items: {type: object}}
                      progress: {type: array, items: {type: object}}
        "422":
          $ref: "#/components/responses/ValidationError"

  /goals/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Goals]
      summary: Get a goal
      description: The current definition, the campaigns paying for it and its live outcome count.
      operationId: getGoal
      responses:
        "200":
          description: The goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Goals]
      summary: Edit a goal (a new version)
      description: |
        `{"definition": …}` — the whole new definition. A definition whose
        canonical form differs from the current one is a new version
        (`version_created: true`), effective from now: events received from
        now on are evaluated under it, and conversions already recorded keep
        the version that produced them until a re-evaluation. An archived
        goal is a `409`. A goal an SKAN encoding names, or one an encoded
        goal waits for in `after`, cannot be made to count `within` from the
        click (`422`): the iOS SDK evaluates encoded goals on the device,
        which has no click.
      operationId: updateGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              properties:
                definition:
                  $ref: "#/components/schemas/GoalDefinition"
      responses:
        "200":
          description: The goal, with `version_created`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The goal is archived, or its name is taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Goals]
      summary: Archive a goal
      description: |
        Archives: the goal evaluates nothing received from now on and keeps
        its versions, outcomes and conversions. `409` (with
        `details.skan_encodings` / `details.dependents`) while an SKAN
        encoding or another live goal's `after` names it. Archiving an
        archived goal is a no-op.
      operationId: deleteGoal
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`)
        "204":
          description: Archived
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Something still names the goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /goals/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Goals]
      summary: List a goal's versions
      operationId: listGoalVersions
      responses:
        "200":
          description: Every version, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/GoalVersion"}}
        "404":
          $ref: "#/components/responses/NotFound"

  /goals/{id}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
      - {name: version, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Goals]
      summary: Get one version of a goal
      operationId: getGoalVersion
      responses:
        "200":
          description: The version
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/GoalVersion"}
        "404":
          $ref: "#/components/responses/NotFound"

  /goals/{id}/outcomes:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Goals]
      summary: List a goal's live outcomes
      description: Every time a click (or install) reached the goal. Outcomes retired by a replay or a re-evaluation are never listed.
      operationId: listGoalOutcomes
      parameters:
        - {name: subject_type, in: query, schema: {type: string, enum: [click, install]}}
        - {name: subject_id, in: query, schema: {type: integer}}
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated outcomes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/GoalOutcome"}}
                  pagination: {$ref: "#/components/schemas/Pagination"}
        "404":
          $ref: "#/components/responses/NotFound"

  /goals/{id}/campaigns:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Goals]
      summary: List the campaigns paying for a goal
      operationId: listGoalCampaigns
      responses:
        "200":
          description: The campaign terms
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/GoalCampaignTerm"}}
        "404":
          $ref: "#/components/responses/NotFound"

  /goals/{id}/campaigns/{campaignId}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
      - {name: campaignId, in: path, required: true, schema: {type: integer}}
    put:
      tags: [Goals]
      summary: Make a campaign pay for a goal, or change its terms
      description: |
        `payout` (null = the goal's own value) and `notify_traffic_source`
        (default true). A campaign's own goal attaches only to that campaign;
        registration and account goals attach to any of the caller's
        campaigns, and are evaluated for its clicks from the moment they are
        attached. Stageable.
      operationId: setGoalCampaign
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payout: {type: string, nullable: true, description: "Decimal amount, at most 5 places"}
                notify_traffic_source: {type: boolean}
      responses:
        "200":
          description: The campaign term
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: "#/components/schemas/GoalCampaignTerm"}
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The goal is archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Goals]
      summary: Stop a campaign paying for a goal
      description: Its outcomes on that campaign are tracked, not paid, from now on; conversions already recorded are kept.
      operationId: removeGoalCampaign
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`)
        "204":
          description: Removed
        "404":
          $ref: "#/components/responses/NotFound"

  /goals/{id}/reevaluation:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Goals]
      summary: Preview a re-evaluation
      description: |
        Per subject of one `subject_type` — a click that has events on the
        campaigns the goal applies to, or (`install`) an Android install of
        the goal's registration, of the account, or on those campaigns —
        the outcome rows that would be retired and written under `version`
        (default the current one), and what happens to each retired row's
        conversion (`supersede` by the new row, or `delete` where the new
        version no longer reaches the goal). The goal is re-decided with its
        dependents — every goal of the subject's set whose `after` names it,
        directly or through another dependent — because their outcomes were
        evaluated against the goal's: `goals` lists them, and their retired
        and written rows are in the same lists and totals, each naming its
        `goal_id`. Dependents never add subjects: the selection and its cap
        are the goal's own. A dependent's version that cannot be evaluated
        (invalid definition, missing prerequisite) is left as it is.
        Changes nothing. At most `limit` (default 100, max 1000) subjects
        after `after`; `next_after` continues. `subject_type` defaults to
        `click` for a campaign goal and `install` for a registration or
        account goal. The built-in install goal is never re-evaluated
        (`422`).
      operationId: previewGoalReevaluation
      parameters:
        - {name: version, in: query, schema: {type: integer}}
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 1000}}
        - {name: after, in: query, schema: {type: integer}}
        - {name: subject_type, in: query, schema: {type: string, enum: [click, install]}}
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalReevaluationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [Goals]
      summary: Apply a re-evaluation
      description: |
        The same selection as the preview, applied one click per
        transaction: each click is rebased onto the version (later events
        and replays keep evaluating the goal under it), outcomes of older
        versions — and dependents' outcomes the new evaluation no longer
        reaches — are retired (`superseded_reason: reevaluation`), their
        conversions superseded or deleted (recomputing the click's value),
        newly reached ones written, and the stored progress of exactly those
        goals replaced. An outcome — the goal's or a dependent's — that the
        old version never reached is announced to the campaign's traffic
        source like any newly reached one; one written in place of a retired
        outcome is announced only if the retired one never went out
        (`notifications` per subject). Stageable.
      operationId: applyGoalReevaluation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                version: {type: integer}
                limit: {type: integer, maximum: 1000}
                after: {type: integer}
                subject_type: {type: string, enum: [click, install]}
      responses:
        "200":
          description: What was done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalReevaluationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /events:
    post:
      tags: [Events]
      summary: Report a click's events (evaluated by its campaign's goals)
      description: |
        Stores the events on the click and evaluates the click's campaign
        goals in one transaction (plan §2.2). A goal an event reaches writes
        an outcome and, through the conversion ledger, a conversion
        (`source: goal`); for a payable goal the campaign notifies for, the
        click's traffic source's server-to-server postback, with
        `[[p202_goal]]`, `[[p202_goal_id]]` and `[[p202_goal_value]]` filled,
        is queued in the notification outbox in the same transaction and
        sent by the worker with retries (`notifications`). An event on its own records nothing: on a
        campaign with no live goals the events are stored (`goals_evaluated:
        false`, with a `note`), and a goal added later applies to them
        through `POST /goals/{id}/reevaluation`.

        Every event names its own `event_id`: an id already stored with the
        same content is a duplicate (listed in `duplicates`, nothing
        written), and with different content the whole request is a `409`.
        An event without `occurred_at` is timed by the server, so a retry
        later is still a duplicate. An event that sorts before a stored one
        replays the click (`replayed: true`); an outcome that moves to it is
        written as a replacement and is never announced to the traffic
        source again (`notify: suppressed`).

        `revenue` is trusted here (an API key is the operator's own
        statement), so a goal valued from the event's amount pays it.
        `received_at` and `revenue_trusted` are the server's and are refused
        in the body. The body is strict (an unknown field is a `422` naming
        it) and `click_id` is read raw (`"1e3"` or `1.5` is refused, never
        cast). `201` when an event was stored, `200` when every event was a
        duplicate. Honors `Idempotency-Key`; stageable (`staged=1`). Scope
        area `events`.
      operationId: sendEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventsRequest"
      responses:
        "200":
          description: Every event was a duplicate; nothing was written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
        "201":
          description: Events stored and evaluated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An event id already names a different event on this click
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ─── Users ───────────────────────────────────────────────────────────

  /users:
    get:
      tags: [Users]
      summary: List users
      description: Admin only.
      operationId: listUsers
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Users]
      summary: Create a user
      description: Admin only. Password is hashed with bcrypt.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Username already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /users/roles:
    get:
      tags: [Users]
      summary: List available roles
      operationId: listRoles
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Users]
      summary: Get a user
      description: Returns user details with roles. Accessible by self or admin.
      operationId: getUser
      responses:
        "200":
          description: User details with roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetailResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Users]
      summary: Update a user
      description: Accessible by self or admin. Password re-hashed if provided.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Users]
      summary: Delete a user
      description: >-
        Admin only. Soft-deletes the user (sets user_deleted = 1) and, in the
        same transaction, revokes their API keys, deletes their app
        registrations, SKAN encodings, identity-graph rows and MTA state, and
        releases their app postbacks to unclaimed. Clicks and conversions are
        kept. A failure part-way changes nothing and answers 500.
      operationId: deleteUser
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: User deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/roles:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    post:
      tags: [Users]
      summary: Assign a role to a user
      description: Admin only. Idempotent (INSERT IGNORE).
      operationId: assignRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id:
                  type: integer
                  description: Role ID to assign
      responses:
        "201":
          description: Role assigned
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}/roles/{roleId}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
      - name: roleId
        in: path
        required: true
        schema:
          type: integer
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Users]
      summary: Remove a role from a user
      description: Admin only.
      operationId: removeRole
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Role removed
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}/api-keys:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Users]
      summary: List API keys for a user
      description: Self or admin. Keys are masked (first 8 chars visible).
      operationId: listApiKeys
      responses:
        "200":
          description: API key list (masked)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: integer
                        api_key:
                          type: string
                          description: Masked key (first 8 chars + asterisks)
                        scope:
                          type: string
                          description: The key's scope; `*` for full-access keys
                        created_at:
                          type: integer
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Users]
      summary: Create an API key
      description: |
        Self or admin. Returns the full 64-character hex key. This is the only
        time the full key is visible -- store it securely.

        An optional `scope` attenuates the key (see "API Key Scopes" above).
        Unknown tokens are rejected with 422; a scoped caller must name an
        explicit scope no broader than its own (422/403); on a pre-1.9.75
        schema without the scope column, requesting a scope returns 409.
      operationId: createApiKey
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  description: |
                    Comma-separated string or array of scope tokens: `*`,
                    `read`, `write`, or `<area>:read` / `<area>:write`.
                    Omit for a full-access key.
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user_id:
                        type: integer
                      api_key:
                        type: string
                        description: Full 64-character hex API key (shown once)
                      scope:
                        type: string
                        description: The stored scope; `*` for full access
                      created_at:
                        type: integer
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}/api-keys/{keyId}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
      - name: keyId
        in: path
        required: true
        description: The full API key string
        schema:
          type: string
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Users]
      summary: Delete an API key
      description: Self or admin.
      operationId: deleteApiKey
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: API key deleted
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}/identity-key:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Users]
      summary: Get the identity linking key
      description: >-
        Self or admin, with a key that can write users (`*`, `write` or
        `users:write`): holding the key is the power to link identities, so
        a read-only or propose-only key is refused with 403. The key the
        account's own server signs customer ids
        with, so a `cust` on a public pixel, postback or tracking link joins
        a person's journeys only when it carries `cust_sig`:
        `cust_sig = hex(HMAC-SHA256(linking_key, "<cust_type>:<cust>"))`.
        `cust_type` is the LTV alias vocabulary and defaults to `custom`;
        `email_md5` and `email_sha256` digests are signed in lower case. An
        unsigned or wrongly signed `cust` keeps its LTV role and links
        nothing. Minted on first read.
      operationId: getIdentityKey
      responses:
        "200":
          description: The linking key
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/IdentityKey"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{id}/identity-key/rotate:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    post:
      tags: [Users]
      summary: Rotate the identity linking key
      description: >-
        Self or admin. Replaces the linking key and returns the new one.
        Every `cust_sig` computed with the old key stops linking at once;
        clicks already linked stay linked. Can be staged (`?staged=1`).
      operationId: rotateIdentityKey
      responses:
        "200":
          description: The new linking key
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/IdentityKey"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{id}/preferences:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Users]
      summary: Get user preferences
      description: Self or admin.
      operationId: getPreferences
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserPreferences"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Users]
      summary: Update user preferences
      description: Self or admin. Any subset of fields may be sent.
      operationId: updatePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesUpdate"
      responses:
        "200":
          description: Preferences updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserPreferences"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"

# ═══════════════════════════════════════════════════════════════════════
# Components
# ═══════════════════════════════════════════════════════════════════════

  /staged-changes:
    get:
      tags: [StagedChanges]
      summary: List staged changes
      description: |
        Your staged writes, newest first. `status` filters; `all=1` returns
        every user's changes (admin only). Requires `staged-changes:read`.
      operationId: listStagedChanges
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [staged, applying, applied, discarded]
        - name: all
          in: query
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Staged changes
        "403":
          $ref: "#/components/responses/Forbidden"

  /staged-changes/{changeId}:
    parameters:
      - $ref: "#/components/parameters/changeId"
    get:
      tags: [StagedChanges]
      summary: Get one staged change
      description: Payload and (for deletes) the embedded dry-run preview. Own changes, or any as admin.
      operationId: getStagedChange
      responses:
        "200":
          description: The staged change
        "404":
          description: Not found

  /staged-changes/{changeId}/apply:
    parameters:
      - $ref: "#/components/parameters/changeId"
    post:
      tags: [StagedChanges]
      summary: Apply a staged change
      description: |
        Performs the recorded write by re-dispatching it through the real
        route: validation, route authorization, and scope checks re-run
        against current state under the applier's credentials. Requires
        the write scope of the change's area (for example `campaigns:write`).
        The staged→applied transition is atomic; a concurrent second apply
        gets 409. A failed apply returns the change to staged with the
        error recorded.
      operationId: applyStagedChange
      responses:
        "200":
          description: The applied change and the write's result
        "409":
          description: Not staged, expired, or applied concurrently

  /staged-changes/{changeId}/discard:
    parameters:
      - $ref: "#/components/parameters/changeId"
    post:
      tags: [StagedChanges]
      summary: Discard a staged change
      description: Ends the proposal without performing it. Requires `staged-changes:stage`.
      operationId: discardStagedChange
      responses:
        "200":
          description: The discarded change
        "409":
          description: Not in the staged state

  # ─── App measurement ─────────────────────────────────────────────────

  /apps:
    get:
      tags: [Apps]
      summary: List registered apps
      description: |
        The caller's registrations, both platforms. Each row carries the app's
        `app_token` — the value an app build presents in `X-P202-App-Token` to
        `GET /apps/schema`. The token is an identifier, not a secret (it ships
        inside every copy of the app), but it is still served only to the
        owner, and staged-change previews and apply results redact it.
        `filter[platform]=ios|android` narrows the list.
      operationId: listApps
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated registrations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppRegistrationListResponse"
    post:
      tags: [Apps]
      summary: Register an app
      description: |
        Name the app with `store_link` (an App Store or Google Play link, a
        `market://details?id=…` link, a numeric App Store id or a package
        name) or with `app_key` (the App Store id for iOS, the package name
        for Android; `platform` is read from the key's shape when omitted) —
        one of them, not both. The server reads the link, so every client
        resolves it the same way; `store_link` is not stored.

        `(platform, app_key)` is unique across the install: a second
        registration of the same app is `409`. Registering an iOS app claims
        its postbacks — rows that arrived before registration (stored
        unclaimed) are adopted. The response mints and returns the app's
        `app_token`.

        `Idempotency-Key` is deliberately not honored on this create — the
        token must not persist as a replayable record. Retries are safe
        anyway: the unique `(platform, app_key)` answers `409`.
      operationId: createApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppRegistrationCreate"
      responses:
        "201":
          description: App registered; the response carries its app token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppRegistrationResponse"
        "409":
          description: This app is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /apps/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Apps]
      summary: Get an app registration
      description: Addressed by `registration_id`, not the App Store id or package name.
      operationId: getApp
      responses:
        "200":
          description: The registration, including its app token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppRegistrationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Apps]
      summary: Update an app registration
      description: |
        Changes the name, the notes or the test-signal policy, and re-runs
        the postback claim, so unclaimed history for the app is adopted on
        update. The app a registration names is fixed: sending `platform`,
        `app_key` or `store_link` naming the same app is accepted and changes
        nothing; naming a different app is `422` — register it separately.
        Toggling `accept_test_signals` re-judges the stored test signals
        too: the policy is live, not a receipt-time snapshot. For an Android
        app that includes the stored test installs: one that becomes trusted
        gains its conversions (written, or restored when an earlier change
        retired them) and notifies its traffic source; one that stops being
        trusted has its conversions retired (an unsent notification
        cancelled, a sent one retracted) and stays in the funnel.
      operationId: updateApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppRegistrationUpdate"
      responses:
        "200":
          description: Registration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppRegistrationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Apps]
      summary: Delete an app registration
      description: |
        Deletes the registration and its SKAN encodings, in one transaction
        with the rest: postbacks it had claimed keep their owner but are
        unlinked (`registration_id` becomes `null`), and the test-signal
        trust it granted is withdrawn. Registering the app again re-links
        the owner's unlinked rows. Android installs are kept, and those still
        waiting for a Play Integrity verdict are settled in the same
        transaction — `integrity_state` `error`, and a held
        `pending_integrity` install `integrity_unverified` (never paid) —
        since the credential is deleted with the registration. The dry-run
        preview lists the cascade and omits the app token.
      operationId: deleteApp
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Registration deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /apps/{id}/app-token/rotate:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    post:
      tags: [Apps]
      summary: Rotate the app token
      description: |
        Mints a replacement token and invalidates the old one immediately.
        Builds configured with the old token can no longer fetch the schema
        until updated. Stageable; an applied rotation's result is served with
        the token redacted (the owner reads it via `GET /apps/{id}`).
      operationId: rotateAppToken
      responses:
        "200":
          description: The registration with its new app token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppRegistrationResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /apps/{id}/installs:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Apps]
      summary: List an Android registration's installs
      description: |
        Installs the SDK reported for this registration, newest first, each
        with its `match_state`, the `match_reason` sentence and its trust
        (`1` trusted, `0` refuted, `null` unvouched). Written only by the
        public intake (`POST /apps/installs`). Referrer fields and versions
        come from an open endpoint, so strings are sanitized at
        serialization; the raw body is never served. Unknown filters and
        malformed values are `422`.
      operationId: listAppInstalls
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/installMatchState"
        - {name: integrity_state, in: query, description: "Only installs whose Play Integrity verdict stands here", schema: {type: string, enum: [not_requested, received, missing, pending, valid, invalid, error, skipped]}}
        - {name: trusted, in: query, schema: {type: string, enum: [trusted, refuted, unvouched, "1", "0"]}}
        - {name: test, in: query, schema: {type: string, enum: ["0", "1"]}}
        - {name: click_id, in: query, schema: {type: integer}}
        - $ref: "#/components/parameters/timeFrom"
        - $ref: "#/components/parameters/timeTo"
      responses:
        "200":
          description: Paginated installs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstallListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /apps/{id}/installs/{install_uuid}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
      - {name: install_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Apps]
      summary: Get one install
      operationId: getAppInstall
      responses:
        "200":
          description: The install
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstallResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /apps/{id}/install-token:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Apps]
      summary: The install token and store link for one click
      description: |
        `[[p202_install_token]]` for one of the caller's clicks — exactly
        what the redirect writes into a store link — and the Google Play link
        that carries it (`…&referrer=p202%3D<token>`). A read: nothing is
        stored. The click must be the caller's, and its campaign must not be
        linked to another registration (`422`). `503` when the installation
        has no install-token key (run the upgrade, which mints it).
      operationId: getAppInstallToken
      parameters:
        - {name: click_id, in: query, required: true, schema: {type: integer}}
      responses:
        "200":
          description: The token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstallTokenResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: No install-token key

  /apps/{id}/store-link:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Apps]
      summary: The store link a campaign should send this app's clicks to (the link builder)
      description: |
        Android: the Play link with `[[p202_install_token]]` in its
        `referrer` (the redirect fills it per click; the SDK reads it back
        from the Install Referrer). iOS: the App Store link, the Info.plist
        keys and the receiver paths Apple appends to the origin — a campaign
        is not linked to an iOS app, since Apple's postback names the app,
        not the click. With `campaign_id`, whether that campaign is ready:
        its offer URL names this app (and, for Android, carries the token
        in the referrer) and, for Android, it is linked to this
        registration; `apply` is the PUT /campaigns/{id} body that makes it
        so. With URL rotation on (`aff_campaign_rotate`), every offer URL in
        rotation (`aff_campaign_url_2` … `_5`, the non-empty ones) must be
        this app's link too, since a click can land on any of them; when one
        is not, `apply` turns rotation off (`aff_campaign_rotate: 0`) and
        leaves the alternates stored. Nothing is written.
      operationId: getAppStoreLink
      parameters:
        - {name: campaign_id, in: query, schema: {type: integer}}
      responses:
        "200":
          description: The store link
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/AppStoreLink"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /apps/{id}/integrity:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Apps]
      summary: Play Integrity status for an Android registration
      description: |
        The registration's `integrity_mode` and cloud project number, its
        service-account credential (the account's email, key id and project
        only — never the key), where its installs' verdicts stand
        (`by_integrity_state`, and the installs held or refused by `require`
        in `by_match_state`), the tokens Google decoded since UTC midnight
        against its default quota of 10,000 a day, and the verdict policy's
        constants. An iOS registration is `422`.
      operationId: getAppIntegrity
      responses:
        "200":
          description: The status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppIntegrityStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /apps/{id}/integrity-credential:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    put:
      tags: [Apps]
      summary: Set or rotate the Play Integrity service account
      description: |
        `{"credential": <the service-account key file's JSON object>}` —
        the JSON Google Cloud downloads for a key of a service account that
        can call the Play Integrity API for this app (the Cloud project
        linked to the app in Play Console). Validated strictly: `type`
        `service_account`, `client_email`, `private_key_id`, an RSA
        `private_key` of at least 2048 bits, and a `token_uri`, when present,
        of exactly `https://oauth2.googleapis.com/token` (the only endpoint
        the server sends its signed assertion to). Only the email, key id,
        project and the AES-256-GCM-encrypted key are stored; nothing in any
        response carries the key. A second PUT replaces the first (rotation):
        the next decode signs with the new key. Not stageable (`?staged=1`
        is refused): a staged change would store the key and show it to
        reviewers. Answers the `GET /apps/{id}/integrity` document.
      operationId: setAppIntegrityCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              additionalProperties: false
              properties:
                credential:
                  type: object
                  description: The service-account key file, as a JSON object (not a string)
      responses:
        "200":
          description: Stored; the status document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppIntegrityStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Apps]
      summary: Clear the Play Integrity service account
      description: |
        Deletes the credential. Refused (`409`) while `integrity_mode` is
        `observe` or `require` (switch the mode to `off` first), and while
        any install of the registration is still waiting for a verdict
        (`installs.by_integrity_state.pending` in `GET /apps/{id}/integrity`):
        each install keeps the mode it arrived under, so installs held under
        `require` would otherwise end `integrity_unverified`. The message
        says how many are waiting; each is settled within 24 hours of
        arriving. PUT a new credential to rotate at any time. Answers a body
        saying whether there was one to delete. Not stageable.
      operationId: clearAppIntegrityCredential
      responses:
        "200":
          description: Cleared (or there was none)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      registration_id: {type: integer}
                      credential: {type: object, nullable: true, enum: [null]}
                      cleared: {type: boolean}
                      message: {type: string}
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The mode is observe or require (switch it to off first), or installs are still waiting for a verdict (wait for the worker to settle them)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /apps/skan-encodings:
    get:
      tags: [Apps]
      summary: List SKAN encodings
      description: "`filter[registration_id]=N` narrows to one registration's encodings (`0` = the account-wide ones)."
      operationId: listAppSkanEncodings
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Paginated encodings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSkanEncodingListResponse"
    post:
      tags: [Apps]
      summary: Create a SKAN encoding
      description: |
        An encoding maps exactly one fine value (0–63) **or** one coarse
        value (`low`/`medium`/`high`) to a goal (`goal_id`), with an
        optional `revenue_override` for tiered decoding; without one a
        decoded postback is worth the goal's fixed value. `registration_id`
        names one of the caller's own iOS registrations, or is `0` for the
        account-wide set that a registration's own encodings override. Any
        other value is `422`: an encoding for an app nobody registered would
        decode nothing. The goal must be live, the caller's, owned by that
        registration or by the account (an account-wide encoding names an
        account goal), and one a device can reach: the iOS SDK evaluates
        the goal on the device, which never learns its click, so a goal that
        counts `within` from the click — or waits in `after` for one that
        does — is `422`. The old fields `event_name` and `revenue` are
        refused by name. The same rows drive the report's decode (by the
        goal's name) and the schema served to devices (the goal and the
        values). Every update and delete keeps the meaning it replaces: a
        device may apply the schema it fetched before the edit for as long
        as a postback takes to arrive, so for 48 days (35 of conversion
        windows, up to 6 of Apple's delivery delay, and the SDK's 7-day
        limit on the age of the document it encodes with) the report counts
        a value whose meanings disagree as `ambiguous_encoding`.
        `effective_at` says since when the current meaning applies. Honors
        `Idempotency-Key`.
      operationId: createAppSkanEncoding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSkanEncodingCreate"
      responses:
        "201":
          description: Encoding created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSkanEncodingResponse"
        "409":
          description: An encoding for this conversion value already exists for this registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"

  /apps/skan-encodings/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Apps]
      summary: Get a SKAN encoding
      operationId: getAppSkanEncoding
      responses:
        "200":
          description: The encoding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSkanEncodingResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Apps]
      summary: Update a SKAN encoding
      description: |
        The row is validated as it will exist after the update. To switch an
        encoding between kinds, send the clear and the replacement together
        — an explicit `null` empties the old kind while the new value arrives
        (`{"fine_value": null, "coarse_value": "high"}`). An absent field
        means keep; clearing without a replacement is `422`.
      operationId: updateAppSkanEncoding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppSkanEncodingUpdate"
      responses:
        "200":
          description: Encoding updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSkanEncodingResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An encoding for this conversion value already exists for this registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Apps]
      summary: Delete a SKAN encoding
      operationId: deleteAppSkanEncoding
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Encoding deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /apps/notifications:
    get:
      tags: [Apps]
      summary: Traffic-source postbacks app installs' goals queued, and where each stands
      description: |
        The notification outbox for app installs, newest first: every
        server-to-server postback an install's goal outcome queued, with
        its kind and status — `pending` (waiting, or backing off after a
        failed attempt), `sent`, `failed` (attempts ran out; `last_error`
        says why), `cancelled` (replaced before it went out) or
        `suppressed` (a correction or retraction for a pixel with no
        correction URL). `meta.summary` counts every status under the same
        filters except `status`. Web clicks' postbacks go through the same
        outbox and are not listed here.
      operationId: listAppNotifications
      parameters:
        - {name: registration_id, in: query, schema: {type: integer}}
        - {name: status, in: query, schema: {type: string, enum: [pending, sent, failed, cancelled, suppressed]}}
        - {name: kind, in: query, schema: {type: string, enum: [reached, correction, retraction]}}
        - $ref: "#/components/parameters/timeFrom"
        - $ref: "#/components/parameters/timeTo"
        - {name: limit, in: query, schema: {type: integer, default: 50, maximum: 500}}
        - {name: offset, in: query, schema: {type: integer, default: 0}}
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AppNotification"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
                  meta:
                    type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          pending: {type: integer}
                          sent: {type: integer}
                          failed: {type: integer}
                          cancelled: {type: integer}
                          suppressed: {type: integer}
        "422":
          $ref: "#/components/responses/ValidationError"

  /apps/postbacks:
    get:
      tags: [Apps]
      summary: List received postbacks
      description: |
        Postbacks stored by the public receivers and claimed by the caller's
        registrations, newest first. Every string column is authored by
        whoever POSTed to the open receiver, so values are sanitized at
        serialization. Rows never carry the attribution signature (see
        `GET /apps/postbacks/{id}`) or the raw body. Malformed filter values
        are rejected with `422` rather than ignored.
      operationId: listAppPostbacks
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/timeFrom"
        - $ref: "#/components/parameters/timeTo"
        - $ref: "#/components/parameters/postbackRegistrationId"
        - $ref: "#/components/parameters/postbackRegistrationIds"
        - $ref: "#/components/parameters/postbackAppId"
        - $ref: "#/components/parameters/postbackAdNetworkId"
        - $ref: "#/components/parameters/postbackVersion"
        - $ref: "#/components/parameters/postbackTransactionId"
        - $ref: "#/components/parameters/postbackCountryCode"
        - $ref: "#/components/parameters/postbackSourceIdentifier"
        - $ref: "#/components/parameters/postbackCampaignId"
        - $ref: "#/components/parameters/postbackFidelityType"
        - $ref: "#/components/parameters/postbackPostbackSequenceIndex"
        - $ref: "#/components/parameters/postbackDidWin"
        - $ref: "#/components/parameters/postbackRedownload"
        - $ref: "#/components/parameters/postbackCoarseConversionValue"
        - $ref: "#/components/parameters/postbackSignature"
        - $ref: "#/components/parameters/postbackProtocol"
        - $ref: "#/components/parameters/postbackConversionType"
        - $ref: "#/components/parameters/postbackAdInteractionType"
      responses:
        "200":
          description: Paginated postbacks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPostbackListResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /apps/postbacks/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Apps]
      summary: Get one postback, including its attribution signature
      description: |
        The signature is served for forensics — copy it into
        `POST /apps/verify` or diff it against another implementation. The
        raw request body is retained server-side but never served.
      operationId: getAppPostback
      responses:
        "200":
          description: The postback with its attribution signature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPostbackResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /apps/report:
    get:
      tags: [Apps]
      summary: Cross-platform app report (iOS postbacks, Android installs, the goals they reached)
      description: |
        **Platforms.** `platform=ios` reports Apple's SKAdNetwork and
        AdAttributionKit postbacks, `platform=android` the installs the
        Android SDK reported, and `platform=all` both. Left out, `platform`
        is `ios`: the report was Apple's alone before Android installs
        existed, and a request without it reads what it always read — the
        answer's `data.platform` and `meta.platform` name the scope. `day`,
        `registration` and `platform` group any; `ad-network`, `source`,
        `country`, `version`, `protocol` and `conversion-type` are Apple's
        dimensions and need `ios`; `campaign`, `match-state`,
        `integrity-state` and `goal` are Android's and need
        `platform=android`. A one-platform grouping or filter asked of
        another platform is a `422` naming the platform to ask for. `limit`
        applies per platform.

        Every group carries `platform` and the metrics both platforms share
        — `installs`, the four trust-class counts, `goals_reached`,
        `revenue`, `events` — beside its platform's own. `data.totals` is
        the platform's totals for one platform, and `{ios, android,
        combined}` for both, where `combined` adds only the shared
        metrics. `group_by=platform` returns one row per platform asked
        for, zeros included.

        **Android** figures are by install (a cohort): a goal an install
        reached counts in its install's group, however much later it was
        reached. `installs` are distinct trusted (attributed) installs;
        `organic`, `refuted_count`, `unvouched_count`, `test_count`,
        `pending` and the `match_states` / `integrity_states` breakdowns
        count every install beside them. `events`, `goals_reached` and
        `revenue` are the goals trusted installs reached (`trusted=`
        recomputes `installs` and these over that class, `meta.trusted:
        as-filtered`); `revenue` is the value of payable outcomes.
        `installs` has one meaning in every grouping: the install groupings'
        rows sum to the totals, and `group_by=goal` — the funnel, one row per
        goal with its `after` and owner — counts the installs of that class
        that reached the goal, each once (and each trust class beside it).

        **iOS** — the rest of this description. Groups postbacks by `group_by` and decodes winning postbacks'
        conversion values through the caller's SKAN encodings (those of the
        postback's app, by App Store id — a deleted registration's included,
        so re-registering an app keeps what it encoded — over the
        account-wide ones, `registration_id = 0`; a fine value with no
        encoding stays undecoded and never falls back to a coarse one). A
        postback decodes under every meaning its value had in the 48 days
        before it arrived: one meaning decodes
        it, two that disagree make it `ambiguous_encoding` (credited to no
        goal), and none leaves it to the first meaning given afterwards, or
        undecoded. Days are UTC, oldest first.

        **Trust default:** the receiver is public, so without an explicit
        `signature` filter every headline metric — installs, losses,
        redownloads, the whole decode — counts only trusted postbacks
        (`trusted = 1`; `meta.trusted: trusted-only`). The other trust
        classes stay visible through `refuted_count` and `unvouched_count`
        beside `trusted_count`, and `test_count` counts development-signed
        postbacks whatever their trust (a postback that belongs to two
        classes — an accepted development-signed one is both trusted and a
        test signal — counts in each). Passing `signature=` recomputes the
        metrics over exactly that class (`meta.trusted: as-filtered`).
        `meta.groups_truncated` is true when more groups matched than `limit`
        allowed. Accepts the same filters as the postback list.

        Every metric counts **unique postbacks** (protocol, ad network,
        postback id, conversion window) — `postbacks` and the four
        `_count` columns included: the receiver stores a replay of
        a signed postback whose unsigned fields differ as its own row, and
        the report is where it collapses to one. `installs` are winning
        first-window `download`s; `redownloads` and AdAttributionKit
        `reengagements` are reported beside them.

        **Which groups come back:** `group_by=day` returns the newest
        `limit` populated days — a day no matching postback landed on is not
        a group at all — and every other mode returns the `limit` busiest
        groups. Neither `time_from` nor `time_to` has a default, so an
        unfiltered day report picks those days out of the account's whole
        retained history; to reach days older than the newest `limit`, raise
        `limit` or move the window with `time_to`.
      operationId: getAppReport
      parameters:
        - name: platform
          in: query
          description: ios (the default, as before Android), android, or all for both
          schema:
            type: string
            enum: [ios, android, all]
        - name: group_by
          in: query
          description: day, registration and platform for either platform; the iOS and Android dimensions need their `platform`
          schema:
            type: string
            enum: [day, registration, platform, ad-network, source, country, version, protocol, conversion-type, campaign, match-state, integrity-state, goal]
            default: day
        - name: limit
          in: query
          description: Maximum groups to return per platform (default 100, max 500). Day mode keeps the newest days; other modes keep the busiest groups.
          schema:
            type: integer
            default: 100
            maximum: 500
        - $ref: "#/components/parameters/timeFrom"
        - $ref: "#/components/parameters/timeTo"
        - $ref: "#/components/parameters/postbackRegistrationId"
        - $ref: "#/components/parameters/postbackRegistrationIds"
        - $ref: "#/components/parameters/postbackAppId"
        - $ref: "#/components/parameters/postbackAdNetworkId"
        - $ref: "#/components/parameters/postbackVersion"
        - $ref: "#/components/parameters/postbackTransactionId"
        - $ref: "#/components/parameters/postbackCountryCode"
        - $ref: "#/components/parameters/postbackSourceIdentifier"
        - $ref: "#/components/parameters/postbackCampaignId"
        - $ref: "#/components/parameters/postbackFidelityType"
        - $ref: "#/components/parameters/postbackPostbackSequenceIndex"
        - $ref: "#/components/parameters/postbackDidWin"
        - $ref: "#/components/parameters/postbackRedownload"
        - $ref: "#/components/parameters/postbackCoarseConversionValue"
        - $ref: "#/components/parameters/postbackSignature"
        - $ref: "#/components/parameters/postbackProtocol"
        - $ref: "#/components/parameters/postbackConversionType"
        - $ref: "#/components/parameters/postbackAdInteractionType"
        - name: match_state
          in: query
          description: Android (needs platform=android) — only installs in this match state
          schema:
            type: string
            enum: [attributed, organic, third_party, unavailable, pending_click, bad_token, foreign_click, implausible, outside_window, duplicate_click, pending_integrity, integrity_failed, integrity_unverified]
        - name: integrity_state
          in: query
          description: Android — only installs whose Play Integrity verdict is in this state
          schema:
            type: string
            enum: [not_requested, received, missing, pending, valid, invalid, error, skipped]
        - name: trusted
          in: query
          description: Android — only this trust class; the goal figures are then counted over it (`meta.trusted` as-filtered)
          schema:
            type: string
            enum: [trusted, refuted, unvouched]
        - name: test
          in: query
          description: Android — 1 only test installs, 0 only real ones
          schema:
            type: integer
            enum: [0, 1]
        - name: aff_campaign_id
          in: query
          description: Android — only installs on this campaign's clicks
          schema:
            type: integer
      responses:
        "200":
          description: Report groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppReportResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /apps/verify:
    post:
      tags: [Apps]
      summary: Verify a postback payload's Apple signature
      description: |
        The protocol is detected from the body, exactly as the receivers do
        it: a `jws-string` key is verified as AdAttributionKit — the compact
        JWS alone is enough, so the unsigned envelope fields may be sent
        with a copied postback but are not read — and the response carries
        the decoded header and payload beside the verdict. Anything else is
        verified as SKAdNetwork: the `attribution-signature` is checked
        against Apple's published P-256 key using the exact per-version
        signed-message composition, and the byte string that was (or should
        have been) signed is returned for diffing. Nothing is stored. A read
        that arrives as POST only because the postback is its input: it
        requires `apps:read`, and `staged=1` is rejected.

        `422` covers an empty body and a `jws-string` that cannot be decoded.
        A body with no `jws-string` always gets a SKAdNetwork verdict rather
        than a validation error — `unverifiable` when its `version` is not
        one this server can check (see `verifiable_versions`), `invalid` when
        it claims a version whose signed fields it does not carry.
      operationId: verifyAppPostback
      requestBody:
        required: true
        description: >-
          A SKAdNetwork postback, or an AdAttributionKit one — told apart by
          the presence of `jws-string`. The two shapes overlap rather than
          exclude each other: `jws-string` decides on its own, so a body that
          also carries the SKAdNetwork fields (a postback copied from one
          receiver into the other's envelope) is still verified as
          AdAttributionKit.
        content:
          application/json:
            schema:
              anyOf:
                - $ref: "#/components/schemas/SkadnetworkVerifyRequest"
                - $ref: "#/components/schemas/AdAttributionKitVerifyRequest"
      responses:
        "200":
          description: Verification verdict and the reconstructed signed message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppVerifyResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /apps/schema:
    get:
      tags: [Apps]
      summary: The schema document an app build fetches (public, selected by the app token)
      description: |
        Fetched by the shipped app at runtime so a change on the server needs
        no store resubmission. No API key: the registration is selected by its
        `app_token`, sent only in the `X-P202-App-Token` header (never a query
        string, which access logs would capture). The token is an identifier,
        not a secret — it ships inside every copy of the app.

        Platform-shaped: an iOS registration gets an evaluation-only view of
        the goals its SKAN encodings name (with every prerequisite, every
        version, and no `value`) and the encodings themselves, per goal —
        the SDK evaluates the goals on the device and sets the value of the
        goals an event reaches. Both are always JSON lists. An Android
        registration gets its identity, `integrity_mode` and the SDK
        settings (`sdk`): its goals are evaluated on the server, so the SDK
        reports every event. Revenue is never served. `ETag` equals
        `schema_version` and changes exactly when the document's behaviour
        changes; `If-None-Match` answers `304`. Methods other than GET are
        `405`. Rate-limited per peer address.
      operationId: getAppSchema
      security: []
      parameters:
        - name: X-P202-App-Token
          in: header
          required: true
          description: The app's token, minted at registration (`POST /apps`) and rotatable
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` of a previously fetched document; an unchanged schema answers `304`
          schema:
            type: string
      responses:
        "200":
          description: The schema document
          headers:
            ETag:
              description: Quoted `schema_version`; send back as `If-None-Match`
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSchemaResponse"
        "304":
          description: Not modified — the cached document is current
        "400":
          description: Missing or malformed app token header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown app token (never minted, or rotated away)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/AppRateLimited"
        "405":
          description: Only GET is served

  /apps/installs:
    get:
      tags: [Apps]
      summary: Android intake reachability probe
      description: Answers `ready`, so the SDK and the operator can check the URL. Rate-limited per peer address.
      operationId: probeAppInstalls
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: {type: string, enum: [ready]}
        "429":
          $ref: "#/components/responses/AppRateLimited"
    post:
      tags: [Apps]
      summary: Report an Android install (the SDK)
      description: |
        What the Android SDK sends once, on first launch, with the Google Play
        install referrer. No API key: the registration is selected by the
        `X-P202-App-Token` header. The body is validated strictly (a number
        sent as a string, an unknown field or a non-canonical
        `install_uuid` is `400` naming the field) and capped at 16 KB (`413`);
        `app_key` must be the token's app (`422` naming both).

        The install is classified into a `match` state (plan §5.3):
        `attributed` (the referrer's `p202` token verifies under this
        installation's key, the click is the owner's, the campaign is not
        linked to another app, Google's server timestamps sit after the click
        and inside `attribution_window_days`), `organic`, `third_party`,
        `unavailable`, `pending_click` (settled by
        `202-cronjobs/app-installs.php`), `bad_token`, `foreign_click`,
        `implausible`, `outside_window`, `duplicate_click`, or — when the
        registration's `integrity_mode` is `require` and the install would be
        attributed — `pending_integrity` until the verdict worker decodes its
        Play Integrity token, then `attributed`, `integrity_failed` (refuted)
        or `integrity_unverified` (no token, or no verdict within 24 hours;
        unvouched, never paid). `integrity` says where the verdict stands
        (`not_requested`/`received` under `off`; `missing`/`pending` under
        `observe` and `require`). Under `observe` the verdict is recorded and
        changes nothing.

        Everything durable commits in one transaction: the install row, its
        classification, the built-in install goal's outcome and — for an
        attributed, trusted install — its conversion on the click (key
        `install`, `pixel_type` 4, at Google's install time; one per click),
        the MTA outbox row and the traffic-source notification. A failure
        answers `5xx` with nothing stored, so the retry is safe. A replay of
        the same body answers `200` with `duplicate: true` and the stored
        state; the same `install_uuid` with other content is `409`. The
        answer never carries the click, the conversion or any money.
        A `customer` (a signed customer id) is linked to the install's click
        after the commit, and the answer's `customer` says whether it was.
        Rate-limited per peer address.
      operationId: reportAppInstall
      security: []
      parameters:
        - name: X-P202-App-Token
          in: header
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppInstallRequest"
      responses:
        "200":
          description: Recorded, or a replay of a recorded install
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstallReceiptResponse"
        "400":
          description: Missing or malformed token, or an invalid body (field_errors)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Unknown app token
        "405":
          description: Only GET and POST are served
        "409":
          description: The install_uuid was reported with different content
        "413":
          description: Body over 16 KB
        "422":
          description: The body's app_key is not the token's app, or the token is an iOS app's
        "429":
          $ref: "#/components/responses/AppRateLimited"
        "503":
          description: The database, or the key that verifies install tokens, is unavailable; retry later

  /apps/installs/{install_uuid}/events:
    parameters:
      - {name: install_uuid, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Apps]
      summary: Report an installed app's events (the SDK)
      description: |
        Events an installed app reports (`logEvent`), 1-100 per request, for
        the goal engine: stored idempotently on (install, `event_id`) and
        evaluated in event-time order against the install's goals — its
        registration's, the account's and, when it is attributed, its
        click's campaign's. What an event pays is the goals' and campaign's
        decision; a revenue the app reports is paid only under the
        registration's `trust_client_revenue`. The server stamps
        `received_at` and revenue trust; a device that sends either is `400`.
        Events for a pending install answer `503` with `Retry-After` (they
        are evaluated once it settles); for a refuted one (`bad_token`,
        `foreign_click`, `implausible`) `409`; for an unknown one `404`. A
        reused `event_id` with other content is `409`; the 10,001st event of
        an install is `422`. A body may carry a `customer` (a signed customer
        id) beside its events, or alone; it is linked to the install's click
        after the events commit. Rate-limited per peer address.
      operationId: reportAppInstallEvents
      security: []
      parameters:
        - name: X-P202-App-Token
          in: header
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppInstallEventsRequest"
      responses:
        "200":
          description: Stored (accepted) or already stored (duplicates)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstallEventsReceiptResponse"
        "400":
          description: Missing or malformed token, or an invalid body (field_errors)
        "404":
          description: Unknown app token, or an install this app never reported
        "409":
          description: The install was refuted, or an event_id was reused with other content
        "413":
          description: Body over 64 KB
        "422":
          description: The install holds 10,000 events, or the token is an iOS app's
        "429":
          $ref: "#/components/responses/AppRateLimited"
        "503":
          description: The install is still pending; retry after Retry-After

  /.well-known/skadnetwork/report-attribution/:
    servers:
      - url: /
        description: Site root — Apple devices POST here directly; this path is outside the /api/v3 base
    get:
      tags: [Apps]
      summary: Receiver readiness probe
      description: Lets an operator confirm the endpoint is reachable at the exact URL Apple will use, before pointing an app at it.
      operationId: probeSkadnetworkReceiver
      security: []
      responses:
        "200":
          description: The receiver is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkadnetworkReceiverProbeResponse"
    post:
      tags: [Apps]
      summary: Receive a SKAdNetwork install-validation postback
      description: |
        The developer-side `NSAdvertisingAttributionReportEndpoint`. Devices
        POST signed postbacks here; the server verifies Apple's signature
        (2.1, 2.2, 3.0, 4.0 — retired 1.0/2.0 and unknown versions store as
        `unverifiable`), stores the row flagged with its signature state,
        and answers `200` including for a byte-identical retry
        (`duplicate: true`). Structurally broken bodies (which no genuine
        device sends) are `400` with per-field errors; any non-`200`
        makes the device retry later, so a storage outage loses nothing.
        Bodies over 32 KB are rejected. Rate-limited per source IP.
      operationId: receiveSkadnetworkPostback
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkadnetworkPostback"
      responses:
        "200":
          description: Stored (or recognized as a retry of a stored postback)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPostbackReceiptResponse"
        "400":
          description: Structurally invalid postback (Apple's hyphenated field names in `field_errors`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "405":
          description: Only GET (probe) and POST are served
        "413":
          description: >-
            Body over 32 KB. Terminal: no genuine Apple postback approaches
            this size, and the same body would fail every retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/AppRateLimited"
        "503":
          description: Database unavailable — the device retries later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /.well-known/appattribution/report-attribution/:
    servers:
      - url: /
        description: Site root — Apple devices POST here directly; this path is outside the /api/v3 base
    get:
      tags: [Apps]
      summary: AdAttributionKit receiver readiness probe
      description: Lets an operator confirm the endpoint is reachable at the exact URL Apple will use, before pointing an app at it.
      operationId: probeAdAttributionKitReceiver
      security: []
      responses:
        "200":
          description: The receiver is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdAttributionKitReceiverProbeResponse"
    post:
      tags: [Apps]
      summary: Receive an AdAttributionKit postback copy
      description: |
        The developer-side `AttributionCopyEndpoint` (iOS 17.4+). Devices
        POST copies of winning AdAttributionKit postbacks here: a JSON
        envelope whose `jws-string` is a compact JWS (ES256) carrying the
        signed attribution fields, beside four unsigned fields. The server
        decodes the JWS, verifies its signature against the key its `kid`
        names — Apple's production key (`valid`), one of Apple's development
        keys (`development`; trusted only for an app registration that opted
        in), an unknown key (`unverifiable`) — validates the payload under
        Apple's field names, stores the row flagged with its signature state,
        and answers `200` including for a byte-identical retry
        (`duplicate: true`). Structurally broken bodies — a `jws-string`
        that is not a JWS, a payload missing required fields — are `400`
        with per-field errors; any non-`200` makes the device retry later.
        Bodies over 32 KB are rejected. Rate-limited per source IP, in one
        bucket with the SKAdNetwork receiver.
      operationId: receiveAdAttributionKitPostback
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdAttributionKitPostback"
      responses:
        "200":
          description: Stored (or recognized as a retry of a stored postback)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppPostbackReceiptResponse"
        "400":
          description: Structurally invalid postback (Apple's hyphenated field names in `field_errors`; JWS payload fields under their own names)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "405":
          description: Only GET (probe) and POST are served
        "413":
          description: >-
            Body over 32 KB. Terminal: no genuine Apple postback approaches
            this size, and the same body would fail every retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/AppRateLimited"
        "503":
          description: Database unavailable — the device retries later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"


