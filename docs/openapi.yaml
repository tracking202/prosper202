        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags:
      - LTV
      summary: Erase a customer
      description: 'Needs the `ltv:write` scope. LTV writes do not honor `Idempotency-Key` (`POST /ltv/revenue` takes
        an `idempotency_key` field instead). Erases the customer''s personal data — CRM fields, aliases (and their
        identity-graph signals), custom field values and personalization tokens — and anonymizes the record
        (`primary_ref` becomes `erased:<id>`, `status` `anonymized`); its revenue events and subscriptions are kept,
        so LTV totals do not change. Queues a `customer.updated` webhook (`erased: true`). `dry_run=1` answers what
        would be removed and what kept (`action: erase`, `mode: anonymize`, per-table counts in `cascade`).'
      operationId: ltvDeleteCustomer
      parameters:
      - $ref: '#/components/parameters/dryRun'
      responses:
        '200':
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        '204':
          description: Erased
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

