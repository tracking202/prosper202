      description: Needs the `ltv:write` scope. LTV writes do not honor `Idempotency-Key` (`POST /ltv/revenue` takes
        an `idempotency_key` field instead) and have no `dry_run` preview. A server-side ABM event ("demo_requested",
        "pricing_viewed", …). The customer is resolved from the payload in the same transaction.
      operationId: ltvRecordEngagementEvent
      requestBody:
