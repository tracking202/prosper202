          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandingPageListResponse"
    post:
      tags: [Landing Pages]
      summary: Create a landing page
      operationId: createLandingPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LandingPageCreate"
      responses:
        "201":
          description: Landing page created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandingPageResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /landing-pages/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Landing Pages]
      summary: Get a landing page
      operationId: getLandingPage
      responses:
        "200":
          description: Landing page details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandingPageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Landing Pages]
      summary: Update a landing page
      operationId: updateLandingPage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LandingPageUpdate"
      responses:
        "200":
          description: Landing page updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandingPageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Landing Pages]
      summary: Delete a landing page
      description: Soft delete.
      operationId: deleteLandingPage
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
