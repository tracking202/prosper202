        '422':
          $ref: '#/components/responses/ValidationError'

  /ltv/customers:
    get:
      tags:
      - LTV
      summary: List customers with their lifetime value
      description: Needs the `ltv:read` scope.
      operationId: ltvListCustomers
      parameters:
      - $ref: '#/components/parameters/period'
      - $ref: '#/components/parameters/windowFrom'
      - $ref: '#/components/parameters/windowTo'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: sort
        in: query
        schema:
          type: string
          default: total_revenue
          enum:
          - total_revenue
          - order_count
          - last_activity_time
          - first_seen_time
          - mrr
        description: Column to sort by. Any other value is a 422 naming `sort` and these values (it used to be read as total_revenue).
      - name: dir
        in: query
        schema:
          type: string
          default: DESC
          enum:
          - ASC
          - DESC
        description: Either case. Any other value is a 422 (it used to be read as DESC).
      - name: q
        in: query
        schema:
          type: string
        description: Search email, name or external id
      - name: segment
        in: query
        schema:
          type: string
          enum:
          - repeat
          - subscribers
          - at_risk
        description: Only this segment; any other value is a 422 naming `segment`
      responses:
        '200':
          description: Customers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
      - LTV
      summary: Create or update a customer
      description: Needs the `ltv:write` scope. LTV writes do not honor `Idempotency-Key` (`POST /ltv/revenue` takes
        an `idempotency_key` field instead) and have no `dry_run` preview. The customer is resolved from `customer_id`,
        or from `customer_ref` with `customer_ref_type`, and created when none matches; the whole write is one transaction.
        Queues a `customer.updated` webhook.
      operationId: ltvUpsertCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer_id:
                  type: integer
                customer_ref:
                  type: string
                customer_ref_type:
                  type: string
                  description: What customer_ref is (email, external id, …)
                email:
                  type: string
                  nullable: true
                  maxLength: 255
                first_name:
                  type: string
                  nullable: true
                  maxLength: 100
                last_name:
                  type: string
                  nullable: true
                  maxLength: 100
                phone:
                  type: string
                  nullable: true
                  maxLength: 50
                company:
                  type: string
                  nullable: true
                  maxLength: 255
                address_line1:
                  type: string
                  nullable: true
                  maxLength: 255
                address_line2:
                  type: string
                  nullable: true
                  maxLength: 255
                city:
                  type: string
                  nullable: true
                  maxLength: 100
                region:
                  type: string
                  nullable: true
                  maxLength: 100
                postal_code:
                  type: string
                  nullable: true
                  maxLength: 20
                country:
                  type: string
                  nullable: true
                  maxLength: 2
                  description: A two-letter country code, e.g. US
                aliases:
                  type: array
                  description: Each alias as `POST /ltv/customers/{id}/aliases` takes one; any other key is a 422
                    naming it (`aliases.0.tpye`).
                  items:
                    $ref: '#/components/schemas/LtvAlias'
                custom_fields:
                  type: object
                  additionalProperties: true
                  description: >-
                    Custom field values by field key: free-form by design, keyed by the account's own fields
                    (`GET /ltv/fields`), so a key that names no field is a 422. Each value is one value of its
                    field's type, null or "" to clear it; an object or a list is a 422 (one was stored as the
                    text "Array").
              description: >-
                The CRM fields are read as `customer_crm`'s are (`LtvCustomerCrm`): a string or null (null or ""
                clears it), at most as long as its column, and an email must be one.
              additionalProperties: false
      responses:
        '201':
          description: The customer, as `GET /ltv/customers/{id}` shows it
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

