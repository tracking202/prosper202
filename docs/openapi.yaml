        landing_page_id:
          type: integer
        rotator_id:
          type: integer
        click_cpc:
          type: number
          minimum: 0
          maximum: 99.99999
          description: Cost per click. Send click_cpc or click_cpa, not both.
        click_cpa:
          type: number
          minimum: 0
          maximum: 99.99999
          description: Cost per action; the redirects charge any tracker with a click_cpa per action.
        click_cloaking:
          type: integer
          enum: [-1, 0, 1]
          default: -1
          description: -1 the campaign's setting, 0 off for this link, 1 on for this link.

