    ConversionCreate:
      type: object
      required: [click_id]
      properties:
        click_id:
          type: integer
          description: Click ID to attribute the conversion to
        payout:
          type: number
          description: |
            Payout amount. Must be a number (a string that is not one is a
            422). When omitted: the click's current value in a `replace`
            campaign, the campaign payout in an `accumulate` campaign. For a
            reversal, the amount reversed (default: all of the sale).
        transaction_id:
          type: string
          description: |
            The network's or merchant's id for this conversion: kept on the
            row for reconciliation, and a repeat on the same click is the
            same conversion. For a reversal, the id of the sale it reverses.
        conv_time:
          type: integer
          description: Conversion timestamp (defaults to current time)
        status:
          type: string
          enum: [reversed]
          description: Record a reversal of the conversion named by `transaction_id`.
        reversal_id:
          type: string
          description: The network's id for the reversal. Without one, a sale can be reversed once.

