  /campaigns/bulk-upsert:
    post:
      tags:
      - Campaigns
      summary: Bulk create or update campaigns
      description: Rows without the primary key (or `id`) are created and need every required field; rows naming an
        existing id are updated with the fields they send. At most `P202_MAX_BULK_ROWS` rows per request.
      operationId: bulkUpsertCampaigns
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 'Required. Identifies one batch: a retry with the same rows replays the recorded response (`idempotent_replay:
          true`); reusing it for different rows or another endpoint is a 422.'
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: array
                items:
                  type: object
                  additionalProperties: true
              - type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                required:
                - rows
      responses:
        '200':
          description: Per-row results and a summary; a failed row does not stop the others
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          created:
                            type: integer
                          updated:
                            type: integer
                          skipped:
                            type: integer
                          error:
                            type: integer
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            index:
                              type: integer
                            status:
                              type: string
                              enum:
                              - created
                              - updated
                              - skipped
                              - error
                            message:
                              type: string
                            data:
                              type: object
                              additionalProperties: true
                  idempotent_replay:
                    type: boolean
        '422':
          $ref: '#/components/responses/ValidationError'

