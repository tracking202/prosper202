    # ── Campaigns ──────────────────────────────────────────────────────

    Campaign:
      type: object
      properties:
        aff_campaign_id:
          type: integer
          readOnly: true
        aff_campaign_name:
          type: string
          maxLength: 50
        aff_campaign_url:
          type: string
          maxLength: 2048
        aff_campaign_url_2:
          type: string
          maxLength: 2048
        aff_campaign_url_3:
          type: string
          maxLength: 2048
        aff_campaign_url_4:
          type: string
          maxLength: 2048
        aff_campaign_url_5:
          type: string
          maxLength: 2048
        aff_campaign_payout:
          type: number
        aff_campaign_currency:
          type: string
          maxLength: 3
        aff_campaign_foreign_payout:
          type: number
        aff_network_id:
          type: integer
        aff_campaign_cloaking:
          type: integer
        aff_campaign_rotate:
          type: integer
        payout_mode:
          type: string
          enum: [replace, accumulate]
          description: >-
            How a click's conversions set its value. `replace` (default): the
            latest conversion's payout. `accumulate`: the sum of every
            conversion's payout (repeat purchases, subscriptions).
        identity_signals:
          type: string
          enum: ["0", "1"]
          description: >-
            "1" (default): this campaign's clicks carry first-party identity
            signals — the tracking domain's p202vid cookie, the landing page's
            p202lpid, and customer ids signed with the account's linking key —
            so multi-touch attribution can join them into one journey. "0":
            none are read or set, and every click is its own journey.
        app_registration_id:
          type: integer
          nullable: true
          description: >-
            The Android app registration this campaign's store links install
            (`GET /apps`; null or 0 unlinks). An install of another app on one
            of its clicks is `foreign_click`. Read raw: `"1e0"` or `1.5` is
            `422`, never cast, and an iOS registration is refused.
        attribution_model_id:
          type: integer
          nullable: true
          description: >-
            The attribution model this campaign's conversions are credited
            with, overriding the account's default (`GET /attribution/models`;
            null or 0 returns it to the default). One of the caller's own
            models; read raw, so `"1e0"` or `1.5` is `422`, never cast.
        aff_campaign_time:
          type: integer
          readOnly: true
          description: Unix timestamp, auto-set on create
        aff_campaign_id_public:
          type: integer
          readOnly: true
          description: >-
            The id go.php?acip= carries: a random digit, the campaign id, a
            random digit (the setup page's form), set on create.
        aff_campaign_deleted:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true

    IdentityKey:
      type: object
      properties:
        linking_key:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 32 bytes, hex. A signing secret; keep it on your server.
        algorithm:
          type: string
          example: HMAC-SHA256
        signs:
          type: string
          description: What the signature covers.
        parameter:
          type: string
          description: Where the signature goes.

    CampaignCreate:
