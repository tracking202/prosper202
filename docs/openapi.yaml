  /ltv/subscriptions:
    get:
      tags:
      - LTV
      summary: List subscriptions
      description: Needs the `ltv:read` scope.
      operationId: ltvListSubscriptions
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - trialing
          - active
          - past_due
          - paused
          - canceled
        description: Only this status; any other value is a 422 naming `status`
      responses:
        '200':
          description: Subscriptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - LTV
      summary: Create or update a subscription
      description: Needs the `ltv:write` scope. LTV writes do not honor `Idempotency-Key` (`POST /ltv/revenue` takes
        an `idempotency_key` field instead) and have no `dry_run` preview. Keyed by the provider's subscription id;
        queues a `subscription.changed` webhook.
      operationId: ltvUpsertSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - external_sub_id
              - amount
              properties:
                external_sub_id:
                  type: string
                  maxLength: 191
                customer_id:
                  type: integer
                customer_ref:
                  type: string
                customer_ref_type:
                  type: string
                  description: What customer_ref is (email, external id, …)
                plan_name:
                  type: string
                  maxLength: 255
                status:
                  type: string
                amount:
                  type: number
                  minimum: 0
                  maximum: 999999999.99999
                  description: What one billing period charges (0 for a free plan). Required: the upsert replaces the
                    subscription, and without an amount it stored 0 and took the MRR with it. A JSON number or a
                    string holding one.
                currency:
                  type: string
                billing_interval:
                  type: string
                billing_interval_count:
                  type: integer
                  minimum: 1
                  maximum: 4294967295
                  description: Intervals per billing period (3 with `month` for a quarter). The period one interval
                    makes must end by 2106-02-07 (unix time 4294967295), or the upsert is a 422 naming this field.
                started_at:
                  type: integer
                  minimum: 0
                  maximum: 4294967295
                  description: A unix time in seconds; "2026-10-07" or "12abc" is a 422 (it was cast to 2026 and 12).
                current_period_start:
                  type: integer
                  minimum: 0
                  maximum: 4294967295
                current_period_end:
                  type: integer
                  minimum: 0
                  maximum: 4294967295
                grace_days:
                  type: integer
                  minimum: 0
                  maximum: 4294967295
                customer_crm:
                  $ref: '#/components/schemas/LtvCustomerCrm'
              additionalProperties: false
      responses:
        '201':
          description: '`subscriptionId` and `customerId`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /ltv/subscriptions/{ref}/events:
    post:
      tags:
      - LTV
      summary: Record a subscription event
      description: Needs the `ltv:write` scope. LTV writes do not honor `Idempotency-Key` (`POST /ltv/revenue` takes
        an `idempotency_key` field instead) and have no `dry_run` preview.
      operationId: ltvSubscriptionEvent
      parameters:
      - name: ref
        in: path
        required: true
        schema:
          type: string
        description: The provider's subscription id, percent-encoded as one path segment (`plan/7 annual` is
          `plan%2F7%20annual`); the server decodes it. Apache refuses an encoded `/` unless `AllowEncodedSlashes`
          is on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_type:
                  type: string
                  enum:
                  - renewal
                  - cancel
                  - refund
                amount:
                  type: number
                  minimum: 0
                  maximum: 99999999999.99999
                  description: Left out, the subscription's own amount. Sent as 0 or more; a refund is stored negated.
                currency:
                  type: string
                  description: Must be the account currency; left out, it is.
                occurred_at:
                  type: integer
                  minimum: 0
                  maximum: 4294967295
                  description: A unix time in seconds; left out, now. "2026-10-07" is a 422 (it was cast to 2026).
                current_period_end:
                  type: integer
                  minimum: 0
                  maximum: 4294967295
                  description: A renewal's new paid-through time; left out, one billing period past the later of the
                    old period end and occurred_at.
                idempotency_key:
                  type: string
                transaction_id:
                  type: string
                  maxLength: 255
                  description: The billing system's charge id; without an idempotency_key it makes a retry a replay.
              required:
              - event_type
              additionalProperties: false
      responses:
        '200':
          description: What changed; an idempotent replay changes nothing and queues no webhook
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /ltv/revenue:
    post:
      tags:
      - LTV
      summary: Record a revenue event
      description: Needs the `ltv:write` scope. LTV writes do not honor `Idempotency-Key` (`POST /ltv/revenue` takes
        an `idempotency_key` field instead) and have no `dry_run` preview. A clickless revenue event (an ESP order,
        a membership charge). Refunds and chargebacks are stored negative; renewals go through `/ltv/subscriptions`.
      operationId: ltvRecordRevenue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_type:
                  type: string
                  enum:
                  - purchase
                  - one_time
                  - refund
                  - chargeback
                  - adjustment
                  default: purchase
                amount:
                  type: number
                currency:
                  type: string
                  description: Defaults to the account currency
                occurred_at:
                  type: integer
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/LtvLineItem'
                idempotency_key:
                  type: string
                external_ref:
                  type: string
                transaction_id:
                  type: string
                customer_id:
                  type: integer
                customer_ref:
                  type: string
                customer_ref_type:
                  type: string
                  description: What customer_ref is (email, external id, …)
                customer_crm:
                  $ref: '#/components/schemas/LtvCustomerCrm'
              required:
              - amount
              additionalProperties: false
      responses:
        '201':
          description: 'Recorded (`duplicate: false`)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '200':
          description: 'A replay of the same `idempotency_key` (`duplicate: true`)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /ltv/events:
    post:
      tags:
      - LTV
