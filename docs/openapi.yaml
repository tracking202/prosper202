        user_name:
          type: string
        user_email:
          type: string
          format: email
        user_pass:
          type: string
          minLength: 8
          maxLength: 72
        user_fname:
          type: string
        user_lname:
          type: string
        user_timezone:
          type: string
          default: UTC
        user_active:
          type: integer
          default: 1

    UserUpdate:
      type: object
      properties:
        user_name:
          type: string
          maxLength: 50
          description: >-
            Renames the account (the sign-in name), as the Users page does: it
            needs a user you may manage, even when that is you. Another
            account's name, in any case, is a 409.
        user_fname:
          type: string
          maxLength: 50
        user_lname:
          type: string
          maxLength: 50
        user_email:
          type: string
          format: email
          maxLength: 100
          description: Another account's email is a 422.
        user_pass:
          type: string
          minLength: 8
          maxLength: 72
        current_password:
          type: string
          description: >-
            Required with `user_pass` when you change your own password;
            not sent when resetting another user's.
        user_timezone:
          type: string
          description: A PHP time zone name such as America/New_York; anything else is a 422.
        user_active:
          type: integer
          enum: [0, 1]

    Role:
      type: object
      properties:
        role_id:
          type: integer
        role_name:
          type: string

    UserPreferences:
      type: object
