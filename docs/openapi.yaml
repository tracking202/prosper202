  # ─── Conversions ─────────────────────────────────────────────────────

  /conversions:
    get:
      tags: [Conversions]
      summary: List conversions
      operationId: listConversions
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: campaign_id
          in: query
          schema:
            type: integer
        - name: time_from
          in: query
          schema:
            type: integer
        - name: time_to
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Paginated conversion list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionListResponse"
    post:
      tags: [Conversions]
      summary: Create a conversion
      description: |
        Records a conversion for an existing click. The click must exist and
        belong to the authenticated user. The conversion is a row in the
        click's conversion ledger; the click's lead flag and value are then
        derived from all of its rows under the campaign's payout mode
        (`replace`: the latest conversion is the value; `accumulate`: the
        conversions add up).

        A repeated `transaction_id` on the same click is the same conversion
        (the existing one is returned). With no `transaction_id`, an
        `accumulate` campaign records one plain conversion per click, and a
        `replace` campaign records a row each time.

        `status: "reversed"` with the `transaction_id` of an earlier
        conversion records a reversal that nets against it (a $3 sale
        reversed is $0). A sale can be reversed once: a second reversal with a
        different `reversal_id` is a 422 naming the first, and a reversal of a
        transaction id the click does not have is a 404.
      operationId: createConversion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversionCreate"
      responses:
        "201":
          description: Conversion created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /conversions/{id}:
    parameters:
      - $ref: "#/components/parameters/resourceId"
    get:
      tags: [Conversions]
      summary: Get a conversion
      operationId: getConversion
      responses:
        "200":
          description: Conversion details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      parameters:
        - $ref: "#/components/parameters/dryRun"
      tags: [Conversions]
      summary: Delete a conversion
      description: Soft delete (sets deleted = 1).
      operationId: deleteConversion
      responses:
        "200":
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        "204":
          description: Conversion deleted
        "404":
          $ref: "#/components/responses/NotFound"

