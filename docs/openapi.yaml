        rotator_id:
          type: integer
        click_cpc:
          type: number
          minimum: 0
          maximum: 99.99999
          description: Cost per click. Setting it clears click_cpa (the tracker becomes CPC); send click_cpc or click_cpa, not both.
        click_cpa:
          type: number
          minimum: 0
          maximum: 99.99999
          description: Cost per action. Setting it clears click_cpc (the tracker becomes CPA).
        click_cloaking:
