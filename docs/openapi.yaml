      description: Needs the `ltv:write` scope. LTV writes do not honor `Idempotency-Key` (`POST /ltv/revenue` takes
        an `idempotency_key` field instead). Deletes the endpoint and its delivery queue; pending deliveries are
        dropped, not sent. `dry_run=1` returns the webhook (never its secret) and its deliveries by status.
      operationId: ltvDeleteWebhook
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Webhook id
      - $ref: '#/components/parameters/dryRun'
      responses:
        '200':
          description: Dry-run preview (`dry_run=1`) — the delete was not performed.
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /ltv/webhooks/{id}/deliveries:
    get:
      tags:
      - LTV
      summary: A webhook's delivery log
      description: |
        Needs the `ltv:read` scope. Newest first, as the LTV Settings tab's Log shows it, with the last
        attempt's response body or error (`last_response_body`, e.g. "curl: …" or "blocked: …", stored cut to 1,000
        bytes). `next_attempt_at` is set while a delivery is pending. A delivery is retried with backoff and fails
        after `meta.max_attempts`, which marks the webhook dead. Never the webhook's secret, and not the payload. An
        unknown webhook is a `404`; unknown parameters are refused.
      operationId: ltvWebhookDeliveries
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Webhook id
      - name: limit
        in: query
        schema:
          type: integer
          default: 25
          minimum: 1
          maximum: 100
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - delivered
          - failed
      responses:
        '200':
          description: Deliveries, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        delivery_id:
                          type: integer
                        event_name:
                          type: string
                        status:
                          type: string
                          enum:
                          - pending
                          - delivered
                          - failed
                        attempts:
                          type: integer
                        next_attempt_at:
                          type: integer
                          nullable: true
                        last_status_code:
                          type: integer
                          nullable: true
                        last_response_body:
                          type: string
                          nullable: true
                        created_at:
                          type: integer
                        updated_at:
                          type: integer
                  meta:
                    type: object
                    properties:
                      webhook_id:
                        type: integer
                      webhook_url:
                        type: string
                      webhook_status:
                        type: string
                      limit:
                        type: integer
                      status:
                        type: string
                        nullable: true
                      max_attempts:
                        type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

