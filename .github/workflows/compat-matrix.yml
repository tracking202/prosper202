name: Compatibility Matrix

# The versions README "Supported versions" promises, beyond the baseline
# (PHP 8.3 + MySQL 8.0) that php-unit.yml and php-integration.yml run.
# Separate jobs, so the baseline's required check names stay as they are.

on:
  push:
    branches:
      - master
      - '[0-9]+.[0-9]+.[0-9]+'
    paths:
      - '**.php'
      - 'composer.lock'
      - 'tests/run-integration-suites.sh'
      - '.github/workflows/compat-matrix.yml'
  pull_request:
    paths:
      - '**.php'
      - 'composer.lock'
      - 'tests/run-integration-suites.sh'
      - '.github/workflows/compat-matrix.yml'

jobs:
  unit:
    name: unit PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          # See php-unit.yml for why the procedural `memcache` extension is disabled.
          extensions: mysqli, pdo, pdo_mysql, memcached, :memcache, mbstring, curl, zip, dom, xml, gd, zlib

      - name: Install dependencies
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
        run: composer install --prefer-dist --no-interaction --no-progress

      # Same run and false-green guard as php-unit.yml: a run that aborts
      # during collection can exit 0, so a real test count is required.
      - name: Run unit tests
        run: |
          set -o pipefail
          vendor/bin/phpunit --configuration phpunit.ci.xml --exclude-group integration --no-coverage 2>&1 | tee phpunit_output.txt
          n=$(grep -oE 'OK \(([0-9]+) test' phpunit_output.txt | tail -1 | grep -oE '[0-9]+' || true)
          [ -n "$n" ] || n=$(grep -oE 'Tests: [0-9]+' phpunit_output.txt | tail -1 | grep -oE '[0-9]+' || true)
          if [ -z "$n" ] || [ "$n" -lt 600 ]; then
            echo "::error::PHPUnit ran only '${n:-0}' tests (expected >= 600): the suite aborted during collection." >&2
            exit 1
          fi

  integration-shard:
    name: integration ${{ matrix.db.name }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db:
          - name: mysql-8.4
            image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot
          - name: mariadb-11.4
            image: mariadb:11.4
            health: mariadb-admin ping -h 127.0.0.1 -uroot -proot
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    services:
      mysql:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
          MYSQL_DATABASE: prosper202
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mysqli, pdo, pdo_mysql, memcached, :memcache, mbstring, curl, zip, dom, xml, gd, zlib

      - name: Install dependencies
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Wait for the database
        run: |
          for _ in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              mysql -h 127.0.0.1 -P 3306 -uroot -proot -e 'SELECT VERSION()'; exit 0
            fi
            sleep 2
          done
          echo "The database did not become ready in time" >&2
          exit 1

      # A hang fails the step (not the job), so the logs below are still kept;
      # --debug names each test as it starts, so they show which one hung.
      - name: Run every integration suite
        timeout-minutes: 20
        env:
          P202_PHPUNIT: vendor/bin/phpunit --debug
          P202_TEST_DB_HOST: 127.0.0.1
          P202_TEST_DB_PORT: 3306
          P202_TEST_DB_USER: root
          P202_TEST_DB_PASS: root
          P202_TEST_DB_NAME: p202_integration_test
          P202_IT_LOG_DIR: ${{ runner.temp }}/integration-logs
          P202_IT_SHARD_COUNT: 8
          P202_IT_SHARD_INDEX: ${{ matrix.shard }}
        run: bash tests/run-integration-suites.sh

      # A hung query keeps running on the server after the step times out:
      # show it and its plan, so the log says which statement and why.
      - name: Show queries still running
        if: failure()
        run: |
          q() { mysql -h 127.0.0.1 -P 3306 -uroot -proot "$@" || true; }
          q -e "SELECT ID, COMMAND, TIME, STATE, DB, LEFT(INFO, 3000) FROM information_schema.PROCESSLIST WHERE COMMAND <> 'Sleep' AND ID <> CONNECTION_ID()\G"
          for id in $(q -N -e "SELECT ID FROM information_schema.PROCESSLIST WHERE COMMAND IN ('Query', 'Execute') AND ID <> CONNECTION_ID()"); do
            echo "== plan of $id"
            q -e "SHOW EXPLAIN FOR $id"
          done
          q p202_integration_test -e "SHOW INDEX FROM 202_conversion_logs; SELECT COUNT(*) FROM 202_conversion_logs; SELECT COUNT(*) FROM 202_clicks"

      - name: Upload the suites' output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs-${{ matrix.db.name }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/integration-logs/
          if-no-files-found: ignore

  # One stable check name for the whole matrix.
  compat:
    if: always()
    needs: [unit, integration-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Require every compatibility job to pass
        env:
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration-shard.result }}
        run: test "$UNIT" = success && test "$INTEGRATION" = success
