name: Pull Request Checks

on:
  pull_request:
    branches: ["*"]

# A new push to a pull request cancels that PR's older run, which no longer
# describes its head and would hold runners the newer run is queued for.
# Other events get a unique group, so no push run is ever dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job for every check here. Each was its own job, and each did seconds
  # of work after a runner setup of about half a minute, so a push took four
  # runner slots for what one does in under two minutes.
  checks:
    # PHP 8.3 and Composer come with the pinned runner image, so this job runs
    # no third-party action. A newer image (ubuntu-latest moving on) could
    # bring a different PHP, which is why the image is named, not "latest".
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog guard diffs against the base branch.
          fetch-depth: 0
      - name: Runner PHP is 8.3, with Composer
        run: |
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 3 ? 0 : 1);' || { php -v; echo "::error::expected PHP 8.3 on ubuntu-24.04"; exit 1; }
          composer --version
      - name: PHP Syntax Check
        id: php_lint
        run: |
          set +e
          find . \
            -path './vendor' -prune -o \
            -path './.git' -prune -o \
            -type f -name '*.php' -print0 \
            | xargs -0 -r -n1 php -l
          status=$?
          set -e

          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" -ne 0 ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "::error::PHP syntax check detected errors. Review logs above." >&2
          else
            echo "status=passed" >> "$GITHUB_OUTPUT"
          fi

          exit 0
      - name: Shell Script Syntax Check
        id: shell_lint
        run: |
          set +e
          find . \
            -path './vendor' -prune -o \
            -path './.git' -prune -o \
            -type f -name '*.sh' -print0 \
            | xargs -0 -r -n1 bash -n
          status=$?
          set -e

          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" -ne 0 ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "::error::Shell script syntax check detected errors. Review logs above." >&2
          else
            echo "status=passed" >> "$GITHUB_OUTPUT"
          fi

          exit 0
      - name: Summarize lint results
        if: always()
        run: |
          php_status="${{ steps.php_lint.outputs.status }}"
          shell_status="${{ steps.shell_lint.outputs.status }}"

          describe_result() {
            case "$1" in
              failed)
                echo "❌ Failed"
                ;;
              passed)
                echo "✅ Passed"
                ;;
              *)
                echo "⚠️ Unknown"
                ;;
            esac
          }

          {
            echo "### Pull Request Checks"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| PHP Syntax | $(describe_result "${php_status}") |"
            echo "| Shell Syntax | $(describe_result "${shell_status}") |"
            echo ""
            if [ "${php_status}" = "failed" ] || [ "${shell_status}" = "failed" ]; then
              echo "> One or more checks reported issues. Review the job logs for details."
            else
              echo "> All checks completed without detected errors."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # The release zip is extracted into the web root of hosts with no
      # terminal. build/release-manifest.php decides what it carries and is
      # fail-closed, so a new top-level path must be classified in the PR that
      # adds it; without this check that only surfaced when the tag build
      # refused to package.
      - name: Every tracked path is classified for the release zip
        run: php build/scripts/release-tree.php check-manifest
      # The zip's vendor/ is installed from composer.lock; a lock that has
      # drifted from composer.json would ship the old set with only a warning.
      - name: composer.lock matches composer.json
        run: composer validate --no-check-publish --no-check-all

      # Each pull request adds its changelog entries as a fragment under
      # changelogs.d/, folded into changelogs.txt and changelogs.json at
      # release. When every pull request appended to the same lines of those
      # two files, each merge made every other open pull request conflict.
      - name: Every changelog fragment can be folded in
        run: python3 -I scripts/changelog.py check
      - name: Entries come as fragments, not edits of the two files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 -I scripts/changelog.py guard "origin/$BASE_REF"

      # CLAUDE.md, "Branches": work goes into the version branch version.php
      # names, a tagged version is frozen, and master takes a finished
      # version, a Dependabot bump, or workflows and documentation.
      - name: The pull request is into the branch its version names
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
        run: ./scripts/check-pr-branch.sh

      # Every session loads CLAUDE.md whole: it stays under a size, and the
      # tests, rules and files it names are in the tree.
      - name: CLAUDE.md names what exists and stays within its size
        run: python3 -I scripts/check-claude-md.py

      # Flags are written in kebab-case everywhere; snake_case is an accepted alias.
      - name: No tracked text spells a flag in snake_case
        run: python3 -I scripts/check-flag-spelling.py

      # Last, so a syntax error does not hide what the checks above found.
      - name: Fail when lint errors detected
        if: ${{ steps.php_lint.outputs.exit_code != '0' || steps.shell_lint.outputs.exit_code != '0' }}
        run: exit 1
