name: Pull Request Checks

on:
  pull_request:
    branches: ["*"]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP Syntax Check
        id: php_lint
        run: |
          set +e
          find . \
            -path './vendor' -prune -o \
            -path './.git' -prune -o \
            -type f -name '*.php' -print0 \
            | xargs -0 -r -n1 php -l
          status=$?
          set -e

          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" -ne 0 ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "::error::PHP syntax check detected errors. Review logs above." >&2
          else
            echo "status=passed" >> "$GITHUB_OUTPUT"
          fi

          exit 0
      - name: Shell Script Syntax Check
        id: shell_lint
        run: |
          set +e
          find . \
            -path './vendor' -prune -o \
            -path './.git' -prune -o \
            -type f -name '*.sh' -print0 \
            | xargs -0 -r -n1 bash -n
          status=$?
          set -e

          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" -ne 0 ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
            echo "::error::Shell script syntax check detected errors. Review logs above." >&2
          else
            echo "status=passed" >> "$GITHUB_OUTPUT"
          fi

          exit 0
      - name: Summarize lint results
        if: always()
        run: |
          php_status="${{ steps.php_lint.outputs.status }}"
          shell_status="${{ steps.shell_lint.outputs.status }}"

          describe_result() {
            case "$1" in
              failed)
                echo "❌ Failed"
                ;;
              passed)
                echo "✅ Passed"
                ;;
              *)
                echo "⚠️ Unknown"
                ;;
            esac
          }

          {
            echo "### Pull Request Checks"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| PHP Syntax | $(describe_result "${php_status}") |"
            echo "| Shell Syntax | $(describe_result "${shell_status}") |"
            echo ""
            if [ "${php_status}" = "failed" ] || [ "${shell_status}" = "failed" ]; then
              echo "> One or more checks reported issues. Review the job logs for details."
            else
              echo "> All checks completed without detected errors."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when lint errors detected
        if: ${{ steps.php_lint.outputs.exit_code != '0' || steps.shell_lint.outputs.exit_code != '0' }}
        run: exit 1

  # The release zip is extracted into the web root of hosts with no terminal.
  # build/release-manifest.php decides what it carries and is fail-closed, so
  # a new top-level path must be classified in the PR that adds it; without
  # this job that only surfaced when the tag build refused to package.
  release-manifest:
    # PHP 8.3 and Composer come with the named runner image, so this job runs
    # no third-party action for them.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Runner PHP is 8.3, with Composer
        run: |
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 3 ? 0 : 1);' || { php -v; echo "::error::expected PHP 8.3 on ubuntu-24.04"; exit 1; }
          composer --version
      - name: Every tracked path is classified for the release zip
        run: php build/scripts/release-tree.php check-manifest
      # The zip's vendor/ is installed from composer.lock; a lock that has
      # drifted from composer.json would ship the old set with only a warning.
      - name: composer.lock matches composer.json
        run: composer validate --no-check-publish --no-check-all
