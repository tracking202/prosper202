name: Swift SDK

# The P202SKAN package's comments lean on "this repository's CI" running its
# tests on Linux (where StoreKit does not exist and the SKAdNetwork call
# compiles to a no-op). This job is that CI: build + unit tests on every
# change to the package. The env-gated live-server integration tests skip
# themselves here, exactly as they do on a dev machine without P202_TEST_URL.

on:
  push:
    paths:
      - 'sdk/ios-skan/**'
      - '.github/workflows/swift-sdk.yml'
  pull_request:
    paths:
      - 'sdk/ios-skan/**'
      - '.github/workflows/swift-sdk.yml'

jobs:
  test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0.3   # matches the toolchain the package is developed against
    defaults:
      run:
        working-directory: sdk/ios-skan
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Test
        run: swift test
