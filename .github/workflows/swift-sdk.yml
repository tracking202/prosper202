name: Swift SDK

# The P202Attribution package's comments lean on "this repository's CI" running its
# tests on Linux (where StoreKit does not exist and the SKAdNetwork call
# compiles to a no-op). This job is that CI: build + unit tests on every
# change to the package. The env-gated live-server integration tests skip
# themselves here, exactly as they do on a dev machine that sets neither
# P202ATTRIBUTION_LIVE_ENDPOINT nor P202ATTRIBUTION_LIVE_TOKEN (the two
# variables LiveServerIntegrationTests reads; see the package README).

on:
  push:
    # Feature branches are covered by pull_request; a push run there repeats
    # the same jobs and competes with it for runners.
    branches:
      - master
      - '[0-9]+.[0-9]+.[0-9]+'
    paths:
      - 'sdk/ios-attribution/**'
      - '.github/workflows/swift-sdk.yml'
  pull_request:
    paths:
      - 'sdk/ios-attribution/**'
      - '.github/workflows/swift-sdk.yml'

# A new push to a pull request cancels that PR's older run, which no longer
# describes its head and would hold runners the newer run is queued for.
# Other events get a unique group, so no push run is ever dropped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0.3   # matches the toolchain the package is developed against
    defaults:
      run:
        working-directory: sdk/ios-attribution
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: swift build

      - name: Test
        run: swift test
