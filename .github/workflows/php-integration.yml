name: Run Integration Tests

on:
  push:
    paths:
      - '**.php'
      - 'tests/run-integration-suites.sh'
      - '.github/workflows/php-integration.yml'
  pull_request:
    paths:
      - '**.php'
      - 'tests/run-integration-suites.sh'
      - '.github/workflows/php-integration.yml'

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prosper202
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # See php-unit.yml for why the procedural `memcache` extension is disabled.
          extensions: mysqli, pdo, pdo_mysql, memcached, :memcache, mbstring, curl, zip, dom, xml, gd, zlib

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Configure Composer authentication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${GITHUB_TOKEN}" ]; then
            composer config -g github-oauth.github.com "${GITHUB_TOKEN}"
          fi

      - name: Install dependencies
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Wait for MySQL
        run: |
          for _ in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              echo "MySQL is up"; exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          exit 1

      # Every `@group integration` suite, one file per PHPUnit run, each on a
      # freshly created database: tests/run-integration-suites.sh takes the
      # list from tests/integration-suites.php, so a new suite runs here the
      # day it is written. This job used to name nine files by hand and the other 30 —
      # the Goals suites among them — ran nowhere. A suite that skips, or
      # that exits before PHPUnit reports, fails: skipped is not run.
      # (`@group instance` suites need a running instance and run in the
      # Agent Evals job; IntegrationSuiteSelectionTest holds both lists.)
      - name: Run every integration suite
        env:
          P202_TEST_DB_HOST: 127.0.0.1
          P202_TEST_DB_PORT: 3306
          P202_TEST_DB_USER: root
          P202_TEST_DB_PASS: root
          P202_TEST_DB_NAME: p202_integration_test
          P202_IT_LOG_DIR: ${{ runner.temp }}/integration-logs
        run: bash tests/run-integration-suites.sh

      - name: Upload the suites' output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: ${{ runner.temp }}/integration-logs/
          if-no-files-found: ignore
