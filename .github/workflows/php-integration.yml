name: Run Integration Tests

on:
  push:
    paths:
      - '**.php'
  pull_request:
    paths:
      - '**.php'

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: prosper202
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # See php-unit.yml for why the procedural `memcache` extension is disabled.
          extensions: mysqli, pdo, pdo_mysql, memcached, :memcache, mbstring, curl, zip, dom, xml, gd, zlib

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Configure Composer authentication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${GITHUB_TOKEN}" ]; then
            composer config -g github-oauth.github.com "${GITHUB_TOKEN}"
          fi

      - name: Install dependencies
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Wait for MySQL
        run: |
          for _ in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent; then
              echo "MySQL is up"; exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          exit 1

      # DB-backed integration tests self-install the schema (SchemaInstaller) and
      # skip cleanly when P202_TEST_DB_HOST is unset, so this job is the only place
      # they actually exercise a database.
      - name: Run conversion integrity integration tests
        env:
          P202_TEST_DB_HOST: 127.0.0.1
          P202_TEST_DB_PORT: 3306
          P202_TEST_DB_USER: root
          P202_TEST_DB_PASS: root
          P202_TEST_DB_NAME: prosper202
        run: |
          vendor/bin/phpunit --configuration phpunit.ci.xml \
            --group integration \
            tests/Conversion/ConversionIdempotencyIntegrationTest.php \
            --verbose --no-coverage
          # record_mysql_error() in both of its definitions, called with the
          # connection alone, the connection and the statement, and the
          # statement alone, against a real failed query.
          vendor/bin/phpunit --configuration phpunit.ci.xml \
            --group integration \
            tests/Config/RecordMysqlErrorIntegrationTest.php \
            --verbose --no-coverage
          # Two processes linking one brand-new signal at once, at READ
          # COMMITTED and REPEATABLE READ: both clicks must end on one visitor.
          vendor/bin/phpunit --configuration phpunit.ci.xml \
            --group integration \
            tests/Identity/IdentityRaceIntegrationTest.php \
            --verbose --no-coverage
          # The postback receiver's dedupe is a UNIQUE index over a hash of the
          # whole body: only a real server shows it collapsing a byte-identical
          # retry while a forgery and the genuine postback both land.
          vendor/bin/phpunit --configuration phpunit.ci.xml \
            --group integration \
            tests/Apps/Apple/PostbackReceiverIntegrationTest.php \
            --verbose --no-coverage
          # The report's unique-postback counting (COUNT DISTINCT over the
          # postback identity), the protocol dimension and the live
          # development opt-in are SQL semantics only a real server shows.
          vendor/bin/phpunit --configuration phpunit.ci.xml \
            --group integration \
            tests/Apps/Apple/AppReportIntegrationTest.php \
            --verbose --no-coverage
          # The app registry: the claim on registration, uniqueness under a
          # case-sensitive collation, the delete cascade, encoding ownership,
          # the user-deletion purge in one transaction (and its rollback), and
          # retention — each a statement only a real server runs.
          vendor/bin/phpunit --configuration phpunit.ci.xml \
            --group integration \
            tests/Apps/AppRegistryIntegrationTest.php \
            --verbose --no-coverage
          # The Android intake: the install, its classification, the install
          # conversion, the MTA and notification outbox rows commit together
          # (failures planted by triggers roll all of it back), replays and
          # forgeries, the pending-click settler, and events through the goal
          # engine with the traffic-source notification once per outcome.
          vendor/bin/phpunit --configuration phpunit.ci.xml \
            --group integration \
            tests/Apps/Android/InstallIntakeIntegrationTest.php \
            --verbose --no-coverage
          vendor/bin/phpunit --configuration phpunit.ci.xml \
            --group integration \
            tests/Apps/Android/AppInstallAtomicityTest.php \
            --verbose --no-coverage
          # Play Integrity: the three modes through the intake, the verdict
          # worker (a Google double) and the pending-click settler — nothing
          # paid or announced before a passing verdict, each failing verdict
          # refuted, retries ending unverified, a settle failure rolled back —
          # and the operator's settings, the credential encrypted and never
          # shown. (The real client's TLS tests run in the unit job, against
          # tests/fixtures/play-integrity/fake_google.py.)
          vendor/bin/phpunit --configuration phpunit.ci.xml \
            --group integration \
            tests/Apps/Android/Integrity/IntegrityIntegrationTest.php \
            --verbose --no-coverage
          vendor/bin/phpunit --configuration phpunit.ci.xml \
            --group integration \
            tests/Apps/Android/Integrity/IntegritySettingsIntegrationTest.php \
            --verbose --no-coverage
          # Checks the SQL the v3 API ships against the schema it ships, by
          # preparing every statically-known statement on a real server. It
          # needs its own database because it installs a fresh schema.
          mysql -h 127.0.0.1 -uroot -proot -e 'DROP DATABASE IF EXISTS p202_sqlcheck; CREATE DATABASE p202_sqlcheck;'
          P202_TEST_DB_NAME=p202_sqlcheck vendor/bin/phpunit --configuration phpunit.ci.xml \
            --group integration \
            tests/Schema/StaticSqlSchemaTest.php \
            --verbose --no-coverage
