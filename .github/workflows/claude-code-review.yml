name: Claude Code Review

on:
  pull_request:
    # Once per PR, not per push. The code-review plugin stops on a PR it has
    # already commented on, so a run on a later push would be a green check
    # that reviewed nothing. Later pushes to the risky paths are covered by
    # adversarial-review, which rewrites its verdict on every push.
    types: [opened, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The review posts its findings to the PR (--comment below).
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Note when the review started
        run: echo "REVIEW_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          allowed_bots: 'claude'
          # Without --comment the plugin prints its review to this job's log
          # and posts nothing, which is what it did on every PR until this
          # flag: a green check with no review anyone could see. It posts
          # inline comments for findings, or one summary comment when there
          # are none, and skips a PR it has already commented on.
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
          # The tools the plugin's command declares. The action installs the
          # inline-comment server only when it is named here.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action reports success when it skips without running Claude (it
      # does on a PR that changes this workflow file: the Claude app refuses
      # its token to a workflow that differs from master's copy). Its
      # conclusion output is set only when Claude ran, so empty means this PR
      # was not reviewed, and the check says so instead of passing.
      - name: Fail when the review did not run
        if: steps.claude-review.outputs.conclusion == ''
        run: |
          echo "::error::the code review did not run, so this PR was not reviewed (see the 'Run Claude Code Review' step log)"
          exit 1

      # The plugin also stops, posting nothing, on a closed, draft or trivial
      # PR. That is its design, but a bare green check would read as "reviewed,
      # nothing found", so the check carries a notice saying nothing was posted.
      - name: Say when the review posted nothing
        if: steps.claude-review.outputs.conclusion == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bots='["claude[bot]","github-actions[bot]"]'
          posted=0
          for kind in "issues/${PR}/comments" "pulls/${PR}/comments"; do
            n=$(gh api "repos/${REPO}/${kind}" --paginate \
              --jq "[.[] | select((.user.login as \$u | ${bots} | index(\$u)) and .created_at >= \"${REVIEW_STARTED}\")] | length" \
              | awk '{s += $1} END {print s + 0}')
            posted=$((posted + n))
          done
          if [ "$posted" -eq 0 ]; then
            echo "::notice::the code review posted nothing for this PR: the plugin stops on a closed, draft or trivial PR, and on one it has already commented on"
          fi
