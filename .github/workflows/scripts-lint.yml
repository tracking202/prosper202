name: Scripts and Workflows

# The repo drives real work from shell (the installer, the eval fixture
# seeder, release packaging) and from workflow YAML, and neither was checked
# by anything. Both linters found real defects on their first run: a case
# pattern that could never match, and `${{ runner.temp }}` read from a
# job-level env block where the runner context does not exist, which silently
# expanded to an empty string.

on:
  push:
    paths:
      - '**.sh'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**.sh'
      - '.github/workflows/**'

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # install.sh carries 22 pre-existing warnings and is excluded until they
      # are worked through; every other script is held at warning level. Drop
      # the exclusion, don't widen it.
      - name: Run ShellCheck
        run: |
          set -o pipefail
          mapfile -t scripts < <(
            find . -path ./vendor -prune -o -path ./node_modules -prune -o \
                 -name '*.sh' -print | grep -v '^\./install\.sh$' | sort
          )
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "no shell scripts found" >&2
            exit 1
          fi
          printf 'checking %d script(s)\n' "${#scripts[@]}"
          shellcheck --severity=warning --format=gcc "${scripts[@]}"

  hook-tests:
    name: check-code-patterns regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The harness drives the real verify.sh tiers through the repository's
      # own vendor/bin/phpunit, vendor/bin/phpcs and golangci-lint. On a bare
      # runner those cases skip with a note, and the first version of this
      # job ran 29 of 47 cases while the PR described the harness as wired
      # into CI. The setup below mirrors php-unit.yml and go-cli.yml so every
      # case runs here.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, pdo, pdo_mysql, memcached, :memcache, mbstring, curl, zip, dom, xml, gd, zlib

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            ~/.cache/composer
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Configure Composer authentication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${GITHUB_TOKEN}" ]; then
            composer config -g github-oauth.github.com "${GITHUB_TOKEN}"
          fi

      - name: Install PHP dependencies
        env:
          COMPOSER_ALLOW_SUPERUSER: 1
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go-cli/go.sum

      # The binary only. golangci-lint-action@v7 always runs the linter and
      # has no install-only input (v6 did; I wrote it from memory and
      # actionlint caught it), so use golangci's own install script, which
      # fetches a prebuilt binary and has no Go-version constraint.
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.5.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/golangci-lint" --version

      # For the ladder's actionlint tier and its harness cases. Pinned to
      # the version the actionlint job above resolves at the time of writing.
      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/actionlint" -version

      # The hook selects the files it inspects. When that selection was wrong
      # it examined nothing and still reported clean, so the selection itself
      # needs a test. Runs the real script against a throwaway repository.
      - name: Run check-code-patterns tests
        run: ./scripts/tests/check-code-patterns.test.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Checks workflow syntax, action versions, context availability, and
      # runs shellcheck over every `run:` block.
      - name: Run actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true
