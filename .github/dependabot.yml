version: 2

updates:
  # Workflows pin every action to a full commit SHA with the version in a
  # trailing comment (a tag like @v2 can be moved to other code). Dependabot
  # rewrites both the SHA and the comment, so pins stay current without going
  # back to mutable tags. Review each bump: the diff is the action's new code.
  # Dependabot only rewrites pins that exist; a new `@v4` is refused by
  # scripts/check-action-pins.sh in the actionlint job of scripts-lint.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # The Dockerfile pins its PHP base to a patch release, so a PHP security
  # release reaches the image only through a bump: daily, because one can
  # follow a disclosure within hours. A move to another minor (8.4) is a
  # runtime upgrade to make deliberately, not a bump.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    ignore:
      - dependency-name: php
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
