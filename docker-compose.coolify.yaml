# Production stack for deploying Prosper202 with Coolify (https://coolify.io).
#
#   Coolify: + New Resource -> Docker Compose -> point it at this repository
#   and set "Docker Compose Location" to /docker-compose.coolify.yaml.
#   Full walkthrough: documentation/deploying-on-coolify.md
#
# How this differs from the dev docker-compose.yaml:
#   - The app and its composer dependencies are baked into the image (default
#     Dockerfile stage) instead of bind-mounting the checkout, so every deploy
#     is an immutable rebuild from git.
#   - No host port mappings. Coolify's proxy routes the domain you assign to
#     the web service (SERVICE_FQDN_WEB_80) and terminates TLS; the Dockerfile
#     maps X-Forwarded-Proto back to HTTPS=on for PHP.
#   - The database password is generated by Coolify on first deploy
#     (SERVICE_PASSWORD_MYSQL) and shared by the web and db services — there is
#     nothing to set by hand. As in the dev stack, it is baked into the db
#     volume on first start, so don't rotate the variable without also
#     resetting the volume or changing the password inside MySQL.
#
# The file is also valid plain docker compose: set SERVICE_PASSWORD_MYSQL in
# the environment (Coolify normally injects it) to run it outside Coolify.

services:
  web:
    build:
      context: .
    environment:
      # Magic Coolify variable: tells Coolify to route this stack's domain to
      # this service on container port 80. Coolify fills in the value.
      - SERVICE_FQDN_WEB_80
      - APP_ENV=production
      # Disables the in-app 1-click/auto upgrade: this deployment is immutable
      # (rebuilt from git), so files written by the in-app upgrader would be
      # silently reverted on the next redeploy. Upgrade by redeploying instead.
      - P202_DISABLE_AUTO_UPGRADE=1
      # Consumed by the entrypoint to self-write 202-config.php, so the setup
      # wizard opens with the database step already done.
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQL:?}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-prosper202}
      - DB_HOST=db
      - MC_HOST=memcached
    volumes:
      # Shared with attribution-cron: exports are generated there but
      # downloaded through this container (202-account/attribution-export.php
      # serves the absolute path recorded in the database), and both must
      # survive redeploys of the (otherwise immutable) app containers.
      - attribution_exports:/var/www/html/202-config/temp/attribution-exports
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started
    healthcheck:
      # Uses the php CLI (guaranteed present in the image) rather than curl, so
      # the check can't silently break if the base image's tool set changes.
      # /health/ is served before the install wizard completes, so a fresh
      # deploy still reports healthy.
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health/') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQL:?}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-prosper202}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 24

  memcached:
    image: memcached:1.6-alpine
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 11211"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Polls the scheduled-jobs endpoint once a minute so no host crontab is
  # needed. 202-cronjobs/index.php has its own file lock and frequency tiers,
  # so this is safe. The trivial healthcheck keeps Coolify's stack health
  # rollup green — busybox wget exiting non-zero while web is still booting is
  # expected and ignored.
  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    command: >
      sh -c 'while true; do
               wget -q -O /dev/null http://web/202-cronjobs/index.php || true;
               sleep 60;
             done'
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3

  # The attribution workers are standalone CLI scripts that
  # 202-cronjobs/index.php does NOT run (the repo docs schedule them from a
  # host crontab, which this stack promises you don't need): the export queue
  # processor runs every minute, the snapshot rebuild hourly. Built from the
  # same image as web so the code and composer dependencies match; the shared
  # entrypoint writes this container's own 202-config.php from the env below.
  attribution-cron:
    build:
      context: .
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQL:?}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-prosper202}
      - DB_HOST=db
      - MC_HOST=memcached
      - P202_DISABLE_AUTO_UPGRADE=1
    volumes:
      - attribution_exports:/var/www/html/202-config/temp/attribution-exports
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started
    command:
      - bash
      - -c
      - |
        last_rebuild=0
        while true; do
          php 202-cronjobs/attribution-export.php || true
          now=$$(date +%s)
          if [ $$((now - last_rebuild)) -ge 3600 ]; then
            php 202-cronjobs/attribution-rebuild.php || true
            last_rebuild=$$now
          fi
          sleep 60
        done
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db_data:
  attribution_exports:
