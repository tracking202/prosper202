# Production stack for deploying Prosper202 with Coolify (https://coolify.io).
#
#   Coolify: + New Resource -> Docker Compose -> point it at this repository
#   and set "Docker Compose Location" to /docker-compose.coolify.yaml.
#   Full walkthrough: documentation/deploying-on-coolify.md
#
# How this differs from the dev docker-compose.yaml:
#   - The app and its composer dependencies are baked into the image (default
#     Dockerfile stage) instead of bind-mounting the checkout, so every deploy
#     is an immutable rebuild from git.
#   - No host port mappings. Coolify's proxy routes the domain you assign to
#     the web service (SERVICE_FQDN_WEB_80) and terminates TLS; the Dockerfile
#     maps X-Forwarded-Proto back to HTTPS=on for PHP.
#   - The database password is generated by Coolify on first deploy
#     (SERVICE_PASSWORD_MYSQL) and shared by the web and db services — there is
#     nothing to set by hand. As in the dev stack, it is baked into the db
#     volume on first start, so don't rotate the variable without also
#     resetting the volume or changing the password inside MySQL.
#
# The file is also valid plain docker compose: set SERVICE_PASSWORD_MYSQL in
# the environment (Coolify normally injects it) to run it outside Coolify.

# Settings shared by both app-image containers (web and attribution-cron).
# The duplication this replaces was load-bearing: each container self-writes
# its own 202-config.php from its environment, so a variable added to only one
# list would give the two containers diverging configs.
x-app-environment: &app-environment
  APP_ENV: production
  # Disables the in-app 1-click/auto upgrade: this deployment is immutable
  # (rebuilt from git), so files written by the in-app upgrader would be
  # silently reverted on the next redeploy. Upgrade by redeploying instead.
  P202_DISABLE_AUTO_UPGRADE: "1"
  # Consumed by the entrypoint to self-write 202-config.php, so the setup
  # wizard opens with the database step already done.
  MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQL:?}
  MYSQL_DATABASE: ${MYSQL_DATABASE:-prosper202}
  DB_HOST: db
  MC_HOST: memcached
  # REST API v3 queues sync jobs and idempotency records on disk
  # (Api\V3\Support\ServerStateStore); the default is under /tmp, which a
  # redeploy wipes. Point it at the persistent api_state volume, outside the
  # docroot so state files are never servable.
  P202_SERVER_STATE_DIR: /var/lib/prosper202/api-v3-state
  # The uploaded MaxMind ISP database (admin UI: MaxMind ISP/Carrier Lookup)
  # must survive redeploys; the geo_isp volume backs this dir. The repo-shipped
  # GeoLite2 city database stays in the image so it updates with deploys.
  P202_GEO_DIR: /var/lib/prosper202/geo

x-app-volumes: &app-volumes
  # Shared between web and attribution-cron: exports are generated by the
  # worker but downloaded through web (202-account/attribution-export.php
  # serves the absolute path recorded in the database), and both must survive
  # redeploys of the (otherwise immutable) app containers.
  - attribution_exports:/var/www/html/202-config/temp/attribution-exports
  # Shared: the API (web) enqueues sync jobs, the sync worker processes them.
  - api_state:/var/lib/prosper202/api-v3-state
  # Uploaded MaxMind ISP database (see P202_GEO_DIR above).
  - geo_isp:/var/lib/prosper202/geo

x-app-depends: &app-depends
  db:
    condition: service_healthy
  memcached:
    condition: service_started

services:
  web:
    # One image, built once, run by both app services (attribution-cron below
    # reuses this tag instead of declaring its own build of the same context).
    image: prosper202-web-coolify
    build:
      context: .
    environment:
      <<: *app-environment
      # Magic Coolify variables: FQDN tells Coolify to route this stack's
      # domain to this service on container port 80; URL is the same domain
      # with the scheme, declared here so Coolify generates it — the
      # attribution-cron worker consumes it as P202_PUBLIC_ORIGIN. Coolify
      # fills in both values.
      SERVICE_FQDN_WEB_80:
      SERVICE_URL_WEB:
    volumes: *app-volumes
    depends_on: *app-depends
    healthcheck:
      # Uses the php CLI (guaranteed present in the image) rather than curl, so
      # the check can't silently break if the base image's tool set changes.
      # /health/ is served before the install wizard completes, so a fresh
      # deploy still reports healthy.
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/health/') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQL:?}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-prosper202}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 24

  memcached:
    image: memcached:1.6-alpine
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 11211"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Polls the scheduled-jobs endpoint once a minute so no host crontab is
  # needed. 202-cronjobs/index.php has its own file lock and frequency tiers,
  # so this is safe. The trivial healthcheck keeps Coolify's stack health
  # rollup green — busybox wget exiting non-zero while web is still booting is
  # expected and ignored.
  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
    command: >
      sh -c 'while true; do
               wget -q -O /dev/null http://web/202-cronjobs/index.php || true;
               sleep 60;
             done'
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Runs the standalone CLI cron workers that 202-cronjobs/index.php does NOT
  # cover (the repo docs schedule them from a host crontab, which this stack
  # promises you don't need): the attribution export queue and the API v3 sync
  # worker every minute, the attribution snapshot rebuild hourly. Runs the
  # image built by the web service so the code and composer dependencies always
  # match; the shared entrypoint writes this container's own 202-config.php
  # from the env below.
  attribution-cron:
    image: prosper202-web-coolify
    restart: unless-stopped
    # Same UID as Apache in the web container: the state/export volumes are
    # shared, and ServerStateStore creates subdirectories with mode 0700 on
    # first use — created by root they'd be unwritable for the web process.
    user: www-data
    environment:
      <<: *app-environment
      # The export worker has no request context to infer the public URL from
      # when it builds webhook download links; Coolify substitutes the URL it
      # assigned to the web service (declared as SERVICE_URL_WEB there). Empty
      # outside Coolify — the worker then falls back to the configured
      # tracking domain from the database. Include any install sub-path in the
      # value; a set-but-invalid value is reported on the worker's stderr.
      P202_PUBLIC_ORIGIN: ${SERVICE_URL_WEB:-}
    volumes: *app-volumes
    depends_on: *app-depends
    command:
      - bash
      - -c
      - |
        last_rebuild=0
        while true; do
          php 202-cronjobs/attribution-export.php || true
          php 202-cronjobs/sync-worker.php || true
          now=$$(date +%s)
          if [ $$((now - last_rebuild)) -ge 3600 ]; then
            php 202-cronjobs/attribution-rebuild.php || true
            last_rebuild=$$now
          fi
          sleep 60
        done
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db_data:
  attribution_exports:
  api_state:
  geo_isp:
